  const S = V.olcek.senaryolar;
  const ser = [["zorunlu","Her ölçekte zorunlu","--ink"],["olcekle_zorunlu","Ölçekle zorunlu hale gelen","--accent"],["kosula_bagli","Koşula bağlı","--warn"],["opsiyonel","Opsiyonel","--faint"]]
    .map(([k,l,c])=>({name:l,type:"bar",stack:"s",barWidth:34,data:S.map(s=>s.sayilar[k]),itemStyle:{color:css(c)},label:{show:k!=="opsiyonel",color:css("--bg"),fontSize:11}}));
  return Object.assign(base(),{grid:{left:8,right:12,top:50,bottom:8,containLabel:true},legend:{top:0,textStyle:{color:css("--muted"),fontSize:11.5},itemWidth:10,itemHeight:10},
    tooltip:Object.assign(base().tooltip,{trigger:"axis",axisPointer:{type:"shadow"}}),
    xAxis:{type:"category",data:S.map(s=>`${s.ad}\n${s.ekip.split(" (")[0]}`),axisLabel:axisTxt(),axisLine:{lineStyle:{color:css("--line")}},axisTick:{show:false}},
    yAxis:{type:"value",axisLabel:axisTxt(),splitLine:{lineStyle:{color:css("--line")}}},series:ser});
}

/* ---- Kararlar ve sorular ---- */
BUILD.karar = () => {
  const Q = V.soru.sorular, ord = {projelendirmeyi_engeller:0,tasarimi_engeller:1,sonra_cevaplanabilir:2};
  const rol = id => (V.org.rol_siniflari.find(r=>r.id===id)||{}).ad || id;
  $("#karar").innerHTML = `
    <div class="pane-head"><div><h2>Projelendirmeye hazır mıyız?</h2><p>Projelendirme yapılmadı. Aşağıdakiler, projelendirmenin boşluksuz başlayabilmesi için kapanması gereken kapılar, verilmesi gereken kararlar ve cevaplanması gereken sorulardır.</p></div></div>
    <div class="grid3">${V.kapi.map(h=>`<div class="card"><div class="item-head"><span class="mono muted">${h.id}</span><b style="font-weight:600">${esc(h.kapi)}</b></div><p class="muted" style="font-size:13.5px;margin-top:4px">${esc(h.tamamlanma_olcutu)}</p><div class="chips" style="margin-top:8px">${h.bagli_soru_ve_kararlar.map(refChip).join("")}${h.bagli_ihtiyaclar.map(needChip).join("")}</div></div>`).join("")}</div>
    <div class="pane-head" style="margin-top:28px"><div><h3>Bekleyen kararlar (${V.karar.length})</h3><p>Seçenekler araç değil, mimari veya süreç sınıflarıdır.</p></div></div>
    <div class="grid2">${V.karar.map(d=>`<div class="card"><div class="item-head"><span class="mono muted">${d.id}</span><b style="font-weight:600">${esc(d.karar)}</b></div><p style="font-size:13.5px;margin-top:4px">${esc(d.soru)}</p>
      <div class="chips" style="margin-top:8px">${d.secenek_siniflari.map(s=>`<span class="pill p-acc">${esc(s)}</span>`).join("")}</div>
      <p class="muted" style="font-size:13px;margin-top:8px"><b style="font-weight:600">Ölçütler:</b> ${d.karar_olcutleri.map(esc).join("; ")}</p>
      <p class="muted" style="font-size:13px;margin-top:4px"><b style="font-weight:600">Karar sahibi:</b> ${d.karar_sahibi_rol_sinifi.map(rol).map(esc).join(", ")} · <b style="font-weight:600">Kaynakta:</b> ${esc(d.kaynaktaki_durum)}</p>
      <div class="chips" style="margin-top:8px">${d.bagli_ihtiyaclar.map(needChip).join("")}</div></div>`).join("")}</div>
    <div class="pane-head" style="margin-top:28px"><div><h3>Açık sorular (${Q.length})</h3></div></div>
    <div class="scroll-x"><table class="t"><thead><tr><th style="width:70px">Kimlik</th><th>Soru</th><th style="width:170px">Engelleyicilik</th><th>Cevaplayabilecek</th><th>Etkilediği</th></tr></thead><tbody>
      ${[...Q].sort((a,b)=>ord[a.engelleyicilik]-ord[b.engelleyicilik]).map(q=>`<tr style="cursor:default"><td class="mono">${q.id}</td><td><div class="t-title">${esc(q.soru)}</div><div class="t-sub">${esc(q.neden_onemli)}</div></td><td><span class="pill ${ENG[q.engelleyicilik][1]}">${ENG[q.engelleyicilik][0]}</span><div class="muted" style="font-size:12px;margin-top:4px">${esc(q.tur)}</div></td><td style="font-size:13px">${q.cevaplayabilecek_rol_sinifi.map(rol).map(esc).join(", ")}</td><td><div class="chips">${q.etkiledigi_ihtiyaclar.map(needChip).join("")}</div></td></tr>`).join("")}
    </tbody></table></div>
    <div class="pane-head" style="margin-top:28px"><div><h3>Çelişkiler (${V.celiski.length})</h3><p>Kaynaklar arasında birbiriyle çelişen ifadeler ve kapatmak için gereken karar.</p></div></div>
    <div class="grid2">${V.celiski.map(c=>`<div class="card"><div class="item-head"><span class="mono muted">${c.id}</span><b style="font-weight:600">${esc(c.konu)}</b>${c.bekleyen_karar?`<span class="chip">${c.bekleyen_karar}</span>`:""}</div>
      <div class="vs"><div><div class="eyebrow">A · ${c.taraf_a.kaynaklar.join(", ")}</div>${esc(c.taraf_a.ifade)}</div><div><div class="eyebrow">B · ${c.taraf_b.kaynaklar.join(", ")}</div>${esc(c.taraf_b.ifade)}</div></div>
      <p class="muted" style="font-size:13px;margin-top:8px">${esc(c.etkisi)} <b style="font-weight:600;color:var(--ink)">Gereken:</b> ${esc(c.kapatmak_icin_gereken)}</p>
      <div class="chips" style="margin-top:6px">${c.ilgili_ihtiyaclar.map(needChip).join("")}</div></div>`).join("")}</div>
    <div class="pane-head" style="margin-top:28px"><div><h3>Varsayımlar (${V.varsayim.length})</h3></div></div>
    <div class="scroll-x"><table class="t"><thead><tr><th style="width:70px">Kimlik</th><th>Varsayım</th><th>Yanlışsa</th><th>Doğrulama</th><th>İlgili</th></tr></thead><tbody>${V.varsayim.map(a=>`<tr style="cursor:default"><td class="mono">${a.id}</td><td>${esc(a.varsayim)}</td><td class="muted">${esc(a.yanlissa_etki)}</td><td>${esc(a.dogrulama_yolu)}</td><td><div class="chips">${a.ilgili_ihtiyaclar.map(needChip).join("")}</div></td></tr>`).join("")}</tbody></table></div>`;
};

/* ---- Kaynaklar ---- */
BUILD.kaynak = () => {
  const L = V.kaynak, byG = {};
  L.forEach(s=>(byG[s.grup] ||= []).push(s));
  const use = id => N.filter(n=>n.kanit.kaynaklar.includes(id)).length;
  $("#kaynak").innerHTML = `
    <div class="pane-head"><div><h2>Kaynaklar</h2><p>Yerel belgeler (${L.length}) ve markasız dış araştırmanın kanıtları (${V.dis.length}). Dosya yolları ve bağlantılar yalnız izlenebilirlik içindir. Sağdaki sayı, kaynağa dayanan ihtiyaç sayısıdır.</p></div></div>
    <div class="grid2" style="align-items:start">${Object.entries(byG).map(([g,xs])=>`<div class="card"><div class="eyebrow">${esc(g)}</div><div class="stack" style="margin-top:8px">${xs.map(s=>`<div class="item"><div class="item-head"><span class="mono muted">${s.id}</span><b style="font-weight:600">${esc(s.baslik)}</b>${s.kopyasi?`<span class="pill p-neu">${s.kopyasi} kopyası</span>`:""}<span class="muted mono" style="margin-left:auto">${use(s.id)}</span></div><p class="muted" style="font-size:13px;margin-top:2px">${esc(s.ozet)}</p><p class="mono muted" style="font-size:11px;margin-top:2px">${esc(s.yol)}${s.katki_sahibi?` · ${esc(s.katki_sahibi)}`:""}</p></div>`).join("")}</div></div>`).join("")}</div>
    <div class="pane-head" style="margin-top:26px"><div><h3>Dış araştırma kanıtları</h3><p>Tedarikçi, analist ve ön baskı kaynakları yön gösterici kabul edilmelidir.</p></div></div>
    <div class="scroll-x"><table class="t"><thead><tr><th style="width:70px">Kimlik</th><th>Açıklama</th><th style="width:150px">Tür</th><th style="width:70px">İhtiyaç</th></tr></thead><tbody>${V.dis.map(s=>`<tr style="cursor:default"><td class="mono">${s.id}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.aciklama)}</a></td><td><span class="pill p-neu">${esc(s.tur)}</span></td><td class="mono">${use(s.id)}</td></tr>`).join("")}</tbody></table></div>`;
};

/* ---------- başlat ---------- */
let start = location.hash.slice(1);
if(!start){ try{ start = localStorage.getItem("ih-tab") || ""; }catch(e){} }
show(start || "genel");
try{ history.scrollRestoration = "manual"; }catch(e){}
window.addEventListener("load", ()=>window.scrollTo(0,0), {once:true});
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)));
if(typeof echarts==="undefined"){ document.querySelectorAll(".chart").forEach(c=>c.innerHTML='<p class="muted" style="padding:16px">Grafik kütüphanesi yüklenemedi; listeler ve tablolar kullanılabilir.</p>'); }
})();
</script>
