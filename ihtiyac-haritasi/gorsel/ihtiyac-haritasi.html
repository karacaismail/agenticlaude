e bireyin tanınabilirliği risk olarak kalır.","kabul_olcutleri":["Çalışan verisi için amaç listesi, veri kategorileri, erişim rolleri ve saklama süresi yazılı ve hukuk onaylı.","Aydınlatma metni yayımlanmış ve çalışanlara tebliğ edilmiş.","Bireysel düzey erişimlerin %100'ü gerekçe ve kayıtla yapılıyor; erişim kayıtları dönemsel denetleniyor.","Ölçülülük değerlendirmesi belgelenmiş ve her yeni telemetri türünde yenileniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-295","S-296","S-297","S-298"],"not":"KVKK 29.04.2026 tarih ve 2026/921 sayılı ilke kararı biyometrik mesai takibi hakkındadır; rıza ve ölçülülük gerekçesinin ajan telemetrisine uygulanması çıkarımdır. AYM 2018/31036 (12.01.2021) önceden ve eksiksiz bilgilendirmeyi aradı. AİHM Bărbulescu kararı altı ölçüt koydu. Benzer mevcut ihtiyaç: N-K22-009; fark: N-K22-009 saklama sürelerini, N-K18-011 maskelemeyi, N-K22-005 kişisel veri aktarımını ele alır. Çalışanların izlenmesi boyutu yalnız bir bilinmeyen (U-038) olarak kayıtlı; karşılık gelen ihtiyaç yok."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K22-009"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-002","baslik":"Ajan verisinin bireysel performans, terfi ve iş sonlandırma kararlarında kullanım sınırı; değerlendirmede adalet","ihtiyac":"Ajan kullanım metriklerinin (koşu sayısı, kabul oranı, token tüketimi, katkı payı) bireysel performans göstergesi olarak kullanılmayacağının yazılı olması. Bireysel değerlendirme, görev dağıtımı ya da iş sonlandırmada otomatik sistem kullanılacaksa bunun yüksek riskli kullanım sayılıp ayrı etki değerlendirmesi, insan kararı ve itiraz yoluyla yapılması. Kod incelemesinde ve performans değerlendirmesinde yapay zekâ kullanımına bağlı yetkinlik önyargısının cinsiyet ve yaş kırılımıyla dönemsel denetlenmesi. Değerlendiricilerin bu önyargı konusunda kalibre edilmesi.","cozulecek_sorun":"Kolay ölçülen ajan metrikleri hedefe dönüşürse anlamını yitirir ve davranışı bozar. Aynı çıktıyı yapay zekâyla ürettiği söylenen mühendisler daha düşük yetkinlik puanı alıyor; ceza kadınlarda ve ileri yaştakilerde daha büyük. AB düzenlemesi, performans ve davranış izleme ile değerlendirmede kullanılan yapay zekâ sistemlerini yüksek riskli sayıyor.","yetenek_siniflari":["Y-36","Y-29"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok ekipte yöneticilerin farklı metrik kullanması adaletsizlik algısını artırır; tek politika gerekir.","kabul_olcutleri":["Politika, bireysel değerlendirmede kullanılması yasak ajan metriklerini listeliyor.","Bireysel değerlendirmede kullanılan her otomatik sistem için etki değerlendirmesi ve itiraz yolu var.","Değerlendirme sonuçlarında yapay zekâ kullanımı × cinsiyet × yaş kırılımlı önyargı analizi en az yılda bir yapılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-258","S-305","S-240","S-282"],"not":"AB Yapay Zekâ Tüzüğü Ek III madde 4(b) performans ve davranış izleme/değerlendirme sistemlerini yüksek riskli sayıyor. Türkiye'de doğrudan uygulanması AB pazarına bağlı; ilke olarak referans alındı. Benzer mevcut ihtiyaç: N-K21-007; fark: N-K21-007 geliştirilen ürünün yapay zekâ etki değerlendirmesini ele alır. Çalışanların ajan verisiyle değerlendirilmesi ve yapay zekâ kullanımına bağlı önyargı yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K21-007"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-003","baslik":"Ajanlı çalışmaya geçişte çalışma koşulu değişikliklerinin, iç düzenlemelerin ve çalışanın zarar sorumluluğunun iş hukukuna uygun ele alınması","ihtiyac":"Ajan kullanımı görev tanımlarını, çalışma süresi düzenini, performans ölçütlerini ya da iş içeriğini esaslı biçimde değiştiriyorsa değişikliğin yazılı bildirim ve yazılı kabul usulüne uygun yapılması. Yapay zekâ kullanım kurallarının ve ihlal sonuçlarının personel/disiplin yönetmeliğine ve sözleşme eklerine eklenip önceden tebliğ edilmesi. Görev tanımlarının güncellenmesi. Politikada şunun açıklanması: çalışanın ajan hatasından doğan zarardaki kişisel sorumluluğu kusuru ve işin niteliğiyle sınırlıdır; tanımlı süreç izlendiğinde sistem riski işverende kalır.","cozulecek_sorun":"Esaslı değişiklik, yazılı bildirim yapılmadan ve işçi altı iş günü içinde yazılı kabul etmeden işçiyi bağlamaz. Önceden bildirilmemiş kurallara dayanarak yaptırım uygulamak uyuşmazlık doğurur. Çalışanlar ajan kaynaklı zararlardan kişisel olarak sorumlu tutulma kaygısı ('hesap verebilirlik kaygısı') taşıyor.","yetenek_siniflari":["Y-35","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"Çalışan sayısı arttıkça bireysel yazılı kabul süreci ve tebliğ yükü artar; kademeli geçiş planı gerekir.","kabul_olcutleri":["Ajan geçişinin hangi değişikliklerinin esaslı sayıldığı iş hukukçusu tarafından değerlendirilmiş ve kayıtlı.","Esaslı değişikliklerin tümünde yazılı bildirim ve kabul kaydı var.","Yapay zekâ kullanım kuralları iç yönetmelikte yer alıyor ve tebliğ kaydı var.","Ajan kaynaklı zararda sorumluluk dağılımı politikası yayımlanmış."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-299","S-302","S-285"],"not":"4857 sayılı İş Kanunu md. 22 (esaslı değişiklik, yazılı bildirim, altı iş günü içinde yazılı kabul). 6098 sayılı TBK md. 400 (işçinin kusuru oranında sorumluluğu; işin tehlikesi, uzmanlık ve eğitim gereği dikkate alınır). Ajan geçişinin somut olarak esaslı değişiklik sayılıp sayılmayacağı hukuki değerlendirme gerektirir. Benzer mevcut ihtiyaç: N-K22-010; fark: N-K22-010 kurum yapay zekâ politikasını ister. İş hukukundaki değişiklik usulü, iç yönetmelik tebliği ve çalışanın zarar sorumluluğu ele alınmamış."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K22-010"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-004","baslik":"Çalışan temsilcileri ve (varsa) işyeri sendika temsilcileriyle danışma süreci","ihtiyac":"Ajanlı çalışma sistemi devreye alınmadan ve esaslı çalışma sistemi değişikliklerinden önce, yeni teknolojinin çalışanların sağlık ve güvenliğine (psikososyal yük dahil) etkisi konusunda iş sağlığı ve güvenliği çalışan temsilcilerinin ve varsa işyeri sendika temsilcilerinin görüşünün alınması. Görüşlerin ve verilen yanıtların kaydı. Yeniden yapılanma işgücü azaltmasına yol açacaksa toplu işçi çıkarma usulünün (önceden bildirim ve temsilcilerle görüşme) planlamaya girdi olması. AB pazarında faaliyet varsa, yüksek riskli işyeri yapay zekâ sistemleri için temsilcilerin ve çalışanların önceden bilgilendirilmesi.","cozulecek_sorun":"Türk iş sağlığı ve güvenliği mevzuatı, yeni teknolojilerin uygulanmasında çalışanların veya temsilcilerinin görüşünün alınmasını öngörür. Sendikalı işyerlerinde temsilcinin görevi işbirliğini ve çalışma barışını sağlamaktır. Danışmasız dönüşüm hukuki risk ve güven kaybı yaratır.","yetenek_siniflari":["Y-28","Y-11"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok işyerli ve çok ekipli yapıda her işyerinin temsilcisiyle ayrı danışma gerekebilir.","kabul_olcutleri":["Devreye alma planında danışma adımı, tarafları ve kaydı var.","Temsilci görüşlerinin her biri için yanıt veya eylem kaydı var.","İşgücü etkisi olan kararlar için hukuki inceleme yapılmış."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-301","S-300","S-299","S-240"],"not":"6331 md. 18(1)(b): yeni teknolojilerin sağlık ve güvenliğe etkisinde görüş alma. 6356 md. 27: işyeri sendika temsilcisinin görevleri. 4857 md. 29: toplu işçi çıkarmada en az 30 gün önce bildirim ve temsilcilerle görüşme. AB Yapay Zekâ Tüzüğü md. 26(7): işveren konumundaki kullanıcının temsilcileri bilgilendirmesi. Benzer mevcut ihtiyaç: N-K25-009; fark: N-K25-009 hat değişikliklerinin duyurulmasını ve geri bildirim toplanmasını ister. Yasal danışma yükümlülükleri ve temsilci süreci yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K25-009"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-005","baslik":"Ajanlı çalışmanın psikososyal risk değerlendirmesine ve iş yükü sınırlarına eklenmesi","ihtiyac":"İşyeri risk değerlendirmesine ajanlı çalışmaya özgü psikososyal etmenlerin eklenmesi: tempo ve iş yoğunlaşması, sürekli onay/inceleme baskısı, hesap verebilirlik kaygısı, zanaat kimliği kaybı, belirsizlik, kesinti ve mesai dışı bildirim. Kişi başı inceleme/onay yükü ve eşzamanlı yönetilen ajan koşusu için insan sağlığı açısından üst sınırların konması. Mesai dışında ajan onayı beklenmemesi. Belirtilerin (tükenmişlik, fazla mesai) izlenmesi ve önlemlerin gözden geçirilmesi.","cozulecek_sorun":"Yapay zekâ benimsenmesi iş taleplerini artırarak tükenmişliği yükseltebiliyor. Yazılım profesyonelleri hesap verebilirlik kaygısı, kimlik bozulması, anlam kaybı, bilişsel yoğunlaşma ve belirsizlik stresi bildiriyor. Bu etmenler risk değerlendirmesine girmezse önlem de alınmaz.","yetenek_siniflari":["Y-57","Y-31"],"zorunluluk":"zorunlu","olcek_etkisi":"Ajan hacmi arttıkça onay baskısı kişi başına yoğunlaşır; sınırlar ölçekle birlikte gözden geçirilmeli.","kabul_olcutleri":["Risk değerlendirmesinde ajanlı çalışmanın psikososyal etmenleri yer alıyor ve iş güvenliği uzmanı ile işyeri hekimiyle gözden geçirilmiş.","Kişi başı inceleme ve eşzamanlı ajan koşusu üst sınırları yazılı ve izleniyor.","Mesai dışı onay talebi oranı ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-284","S-285","S-303","S-301"],"not":"İş talepleri-kaynaklar modeliyle 442 geliştirici: yapay zekâ benimsenmesi talepleri artırarak tükenmişliği yükseltiyor. 21 görüşmeli vaka: beş psikolojik maliyet sınıfı. Benzer mevcut ihtiyaç: N-K17-005; fark: N-K17-005 inceleme yükünü akış darboğazı olarak ele alır. Çalışan sağlığı boyutu ve yasal risk değerlendirmesi bağı yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K17-005"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-006","baslik":"İş güvencesi kaygısına yönelik dürüst iletişim ve işgücü geçiş taahhütleri","ihtiyac":"Liderliğin ajan dönüşümünün amacını (kapasite artırma, kalite, kadro etkisi) açık ve dürüst biçimde ifade etmesi. Neyin kararlaştırıldığını ve neyin henüz bilinmediğini ayırması. Verim kazanımının nasıl kullanılacağına dair (yeni kapsam, kalite ve borç azaltma, eğitim, kadro) yazılı bir taahhüt. Yeniden beceri kazanımı ve iç hareketlilik yollarının duyurulması. Düzenli, iki yönlü bir soru-cevap kanalı. Yöneticilerin bu iletişim için hazırlanması.","cozulecek_sorun":"Belirsizlik korku üretir. Açık ve belgelenmiş yapay zekâ tutumu, yapay zekânın faydasını büyüten temel yeteneklerden biri olarak raporlanıyor. Yapay zekâya maruz mesleklerde genç yazılım geliştirici istihdamında belirgin düşüş gözleniyor; çalışanlar belirsizlik stresi bildiriyor. Sessizlik söylentiyi ve yetenek kaybını besler.","yetenek_siniflari":["Y-11","Y-57"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok ekipli yapıda tutarsız yönetici mesajları söylentiyi hızlandırır; ortak mesaj çerçevesi gerekir.","kabul_olcutleri":["Dönüşümün amacına ve verim kazanımının kullanımına dair yazılı bir liderlik beyanı yayımlanmış.","İki yönlü soru-cevap kanalı var; soruların yanıtlanma süresi ölçülüyor.","Çalışan anketinde iş güvencesi kaygısı ve 'dönüşümün amacı açık' ifadesi dönemsel izleniyor.","Yeniden beceri ve iç hareketlilik programına katılım izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-213","S-236","S-285","S-288"],"not":"ABD bordro verisinde 22–25 yaş yazılım geliştirici istihdamı 2022 sonundan bu yana yaklaşık %20 düştü; etki ağırlıkla alım azalmasıyla. 2025 geliştirici anketinde yapay zekâyı işine tehdit görmeyenlerin oranı %68'den %64'e indi. Benzer mevcut ihtiyaç: N-K25-009; fark: N-K25-009 hattın teknik değişikliklerini duyurur. İş güvencesi, verim kazanımının kullanımı ve işgücü geçiş taahhüdü ele alınmamış."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K25-009"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-007","baslik":"Psikolojik güvenliğin ölçülmesi; ajan hatasını, anlamadığını ve itirazı dile getirmenin korunması","ihtiyac":"Ekiplerde psikolojik güvenliğin ve norm açıklığının dönemsel olarak, doğrulanmış bir ölçekle ve ekip düzeyinde ölçülmesi. Şunları söylemenin ve ajan hatası bildirmenin kişinin aleyhine kullanılmaması: 'ajanın çıktısını anlamadım', 'ajanı durdurmak istiyorum', 'bu işi ajana vermek doğru değil'. Liderlerin bu davranışları örneklemesi. Düşük skorlu ekiplerde müdahale.","cozulecek_sorun":"Otomasyon yanlılığı ve hız baskısı altında çalışanlar anlamadıkları ajan çıktısını onaylayabilir ya da hatayı bildirmekten çekinebilir. Psikolojik güvenlik ve norm açıklığı, yazılım ekiplerinde performansı ve memnuniyeti yordar.","yetenek_siniflari":["Y-57"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça ekipler arası farklar büyür; ekipler kendi geçmişleriyle izlenmeli.","kabul_olcutleri":["Ekip düzeyinde psikolojik güvenlik ve norm açıklığı ölçümü en az yarıyılda bir yapılıyor.","Politika ve denetimle, ajan durdurma ve itiraz kayıtlarının olumsuz değerlendirme gerekçesi olarak kullanılmadığı güvence altında.","Düşük skorlu ekipler için eylem planı kaydı var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-256","S-255","S-257","S-213"],"not":"Edmondson (1999) ekip psikolojik güvenliği ölçeği. Yazılım işyerlerinde psikolojik güvenlik üzerine sistematik literatür taraması. 2025 yetenek modeli: belirsizlik korku üretir; liderler açık politikayla psikolojik güvenlik sağlamalı. Benzer mevcut ihtiyaç: N-K25-007; fark: N-K25-007 hatta duyulan güveni ölçer. Ekip içi psikolojik güvenlik ve konuşma/itiraz güvencesi yok."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K25-007"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-008","baslik":"Rol evrimi için kariyer basamaklarının ve rol geçiş yollarının yeniden tanımlanması","ihtiyac":"Teknik kariyer basamaklarının ajanlı çalışmaya göre güncellenmesi. Seviyeleri ayıran yetkinliklerin ve kanıtlarının tanımlanması: niyet ve kabul kriteri yazma, doğrulama tasarımı, mimari muhakeme, ajan yönlendirme ve gözetim, ekipler arası katkı, mentorluk. Mevcut rollerden yeni rollere geçiş yollarının, eğitimlerin ve deneme sürelerinin belirlenmesi (ör. test uzmanlığından değerlendirme mühendisliğine, geliştiricilikten platform veya kural bakımcılığına). Ajan katkısının terfi kanıtı olarak nasıl ele alınacağının yazılması.","cozulecek_sorun":"Yapay zekâ zanaat kimliğini ve rol algısını bozuyor; kimlik dönüşümünü role göre farklı yaşanıyor. Kariyer basamakları hâlâ kod üretim miktarına ve bireysel teknik çıktıya dayanıyorsa ölçütler anlamsızlaşır ve terfi kararları keyfileşir.","yetenek_siniflari":["Y-37"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ölçek büyüdükçe tutarsız kariyer ölçütleri ekipler arası adaletsizlik algısı yaratır.","kabul_olcutleri":["Güncellenmiş kariyer basamakları yayımlanmış ve ajanlı çalışma yetkinliklerini içeriyor.","En az üç rol geçiş yolu tanımlı; başvuru ve tamamlama izleniyor.","Terfi dosyalarında ajan katkısının nasıl ele alınacağı yazılı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-286","S-285","S-252"],"not":"İşbirlikçi ve insani yazılım mühendisliği konferansına (2026) kabul edilen çalışma, kimlik dönüşümünde rolün belirleyici olduğunu ileri sürüyor. Ölçekli çerçevenin yapay zekâ sürümü ekipleri ürün, üretici, alan uzmanı ve yapay zekâ yetenekleri etrafında tanımlıyor. Benzer mevcut ihtiyaç: N-K25-003; fark: N-K25-003 yeni rol ve yetkinlikleri tanımlar. Kariyer basamakları, terfi ölçütleri ve rol geçiş yolları yok."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"zamanla (3–6 ay)","bagimliliklar":["N-K25-003"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-009","baslik":"Genç çalışanların gelişim yolunun korunması ve kıdemli yetiştirme hattı","ihtiyac":"Giriş düzeyi çalışanlar için 'verimli zorlanma'yı koruyan, sınırlı yapay zekâyla ve mentorlukla yürütülen yapılandırılmış öğrenme işlerinin ayrılması. Gençlerin ajan çıktısı incelemesine bir kıdemliyle birlikte katılması. Öğrenme hedeflerinin sprintte görünür olması. Giriş düzeyi alımın ve oranının bilinçli bir işgücü kararı olarak tutulması. Gençlerin bağımsız anlama düzeyinin dönemsel ölçülmesi.","cozulecek_sorun":"Giriş düzeyi iş, kıdemli–ajan iş akışına 'emiliyor' ve gençler uzmanlığın geliştiği zorlanmayı kaçırıyor. Yeni bir kütüphaneyi yapay zekâyla öğrenen geliştiriciler, anlama testinde elle kodlayanlardan belirgin düşük puan alıyor. Yapay zekâya maruz mesleklerde genç istihdamı düşüyor. Giriş düzeyinin otomasyonu örtük bilginin kuşaklar arası aktarımını zayıflatabilir.","yetenek_siniflari":["Y-29","Y-37"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Etki 1–3 yıl gecikmeli görünür; ölçek büyüdükçe kıdemli açığı gözetim kapasitesini daraltır.","kabul_olcutleri":["Her ekipte giriş düzeyi çalışanlar için öğrenme işi payı ve mentor tanımlı.","Gençlerin bağımsız anlama ve hata ayıklama düzeyi dönemsel ölçülüyor ve eğilimi raporlanıyor.","Giriş düzeyi alım ve oranı işgücü planında açık bir karar olarak yer alıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-237","S-262","S-236","S-263"],"not":"14 görüşmeli nitel çalışmada (2026 yapay zekâ etiği konferansına kabul) 'emilme' örüntüsü bulundu. 52 kişilik randomize çalışmada yapay zekâ grubu anlama testinde %17 düşük puan aldı. Ekonomik model: giriş düzeyi otomasyonu örtük bilgi aktarımını yavaşlatabilir. Benzer mevcut ihtiyaç: N-K25-006; fark: N-K25-006 mevcut uzmanların beceri körelmesine karşı tatbikat ister. Gençlerin gelişim yolu ve kıdemli yetiştirme hattı ele alınmamış."},"cember":"dis_eksik","belirsizlik":"yuksek","olcek_esigi":"zamanla (3–6 ay)","bagimliliklar":["N-K25-006"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-010","baslik":"İnsan–ajan çalışma sistemine ve kod tabanına işe alıştırma programı","ihtiyac":"Yeni katılan ve ekip değiştiren çalışanlar için bir alıştırma programı. Programın konuları: çalışma sisteminin geçerli sürümü (roller, anlaşmalar, karar hakları, kurallar), ajan yönlendirme ve inceleme pratiği, kod tabanını ajana bağımlı olmadan anlama. Öğeleri: rehber kişi; aşamalı otonomi (ilk dönemde ajan çıktısını tek başına onaylamama); anlama kontrol noktaları; ekip ve alan sahipliği kataloğunun tanıtımı. İlk bağımsız katkıya kadar geçen sürenin ve anlama düzeyinin ölçülmesi.","cozulecek_sorun":"Ajan yardımcıları yeni gelenlerin yeni çerçeveleri öğrenme engelini düşürürken, kod tabanını anlamadan üretim yapmayı da kolaylaştırıyor. Çalışma sistemi yazılı değilse yeni gelen örtük normları deneme-yanılmayla öğrenir; ekipler arası farklılık uyumu uzatır.","yetenek_siniflari":["Y-37","Y-25","Y-58"],"zorunluluk":"zorunlu","olcek_etkisi":"10+ ekipte ekipler arası rotasyon ve yeni katılım sıklaşır; ortak çekirdek + ekip eki biçiminde program gerekir.","kabul_olcutleri":["Alıştırma programı çalışma sistemi sürümüne bağlı ve güncel.","Yeni gelenlerin ilk dönemde ajan çıktısını tek başına onaylamadığı denetlenebiliyor.","İlk bağımsız katkı süresi ve anlama kontrol noktası sonuçları izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-291","S-292","S-262"],"not":"Genç geliştiricilerin dil modeli benimsemesi üzerine sistematik literatür taraması ve proje alıştırma asistanı çalışması (FSE 2025). Yapay zekâ yardımıyla öğrenmede anlama kaybı bulgusu. Benzer mevcut ihtiyaç: N-K25-005; fark: N-K25-005 rol bazlı yapay zekâ okuryazarlığı eğitimi sunar. Çalışma sistemine, ekip normlarına ve kod tabanını anlamaya özgü alıştırma ve aşamalı otonomi yok."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K25-005"],"kume":"K32","alan":"D-organizasyon-ve-olcek"},{"id":"N-K27-001","baslik":"İş birliği modu kataloğu ve iş türüne göre mod seçimi","ihtiyac":"İnsan ile ajanın bir iş üzerinde nasıl birlikte çalışacağını tanımlayan sürümlü bir mod kataloğu: insan önde–ajan hızlandırır; insan keşfeder–ajan seçenek üretir; ajan önde–insan gözden geçirir; eşzamanlı eşli çalışma; insan yazar–ajan inceler ve test üretir; ajan tam otomatik (yalnız düşük risk). Her modda kimin önderlik ettiği, kimin karar verdiği, insanın neyi gördüğü ve hangi kapıların zorunlu olduğu yazılı; mod iş türü × risk sınıfı × insanın alan yetkinliğiyle seçilir ve iş kalemine kaydedilir.","cozulecek_sorun":"Harita her işi örtük olarak 'ajan yazar, insan onaylar' biçiminde ele alıyor; insanın önde olduğu, keşif yaptığı ya da ajanın insan kodunu incelediği çalışma biçimleri tanımsız. İnsan+yapay zekâ birleşimleri karar görevlerinde çoğu zaman en iyi tek taraftan kötü, üretim görevlerinde ise daha iyi sonuç veriyor; mod bilinçli seçilmezse birleşim değer kaybettirebilir.","yetenek_siniflari":["Y-09","Y-31","Y-48"],"zorunluluk":"zorunlu","olcek_etkisi":"10+ ekipte ekipler kendi mod yorumlarını üretirse ölçümler karşılaştırılamaz; katalog ART/portföy düzeyinde ortak, seçim ekip düzeyinde olmalı.","kabul_olcutleri":["Mod kataloğu sürümlü; her modda önder, karar hakkı, insan görünürlüğü ve zorunlu kapılar tanımlı.","Her iş kaleminde seçilen mod ve seçim gerekçesi (iş türü, risk sınıfı, yetkinlik) kayıtlı.","Modlar arası kabul, yeniden iş ve süre farkları iş türü bazında raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-180","S-181","S-182","S-183"],"not":"Programcı–asistan etkileşimi hızlandırma ve keşif olarak iki kiplidir (OOPSLA 2023). 106 deneyin meta-analizi: birleşim ortalamada en iyi tek taraftan kötü, karar görevlerinde kayıp, içerik üretiminde kazanç. Otonomi düzeyleri kullanıcı rolüyle (işletici, iş birlikçi, danışılan, onaylayan, gözlemci) tanımlanabiliyor. Bir kodlama ajanı kullanım analizinde planlama kararlarının çoğu insanda kalıyor. Benzer mevcut ihtiyaç: N-K02-010; fark: N-K02-010 yalnız işin ajana uygunluğunu (tam otomatik / ajan + insan / yalnız insan) sınıflıyor; 'ajan + insan' içinde kimin önde olduğu, insanın rolü ve insan kodunun ajanla incelenmesi gibi ters yönlü modlar tanımsız."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-033","H-13"],"bagimliliklar":["N-K02-010"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-002","baslik":"İşlev bazlı ve dinamik otonomi düzeyi","ihtiyac":"Otonominin tek bir modül düzeyi yerine işlev bazında (bilgi toplama, analiz ve plan, karar seçimi, eylem ve yan etki) ayrı ayarlanması; her düzeyde insanın rolünün (işletici, iş birlikçi, danışılan, onaylayan, gözlemci) tanımlanması; geri alma, kural ihlali, kalibrasyon düşüşü veya model sürümü değişiminde otonominin otomatik düşürülmesi ve yeniden kazanım koşulunun yazılı olması; her koşunun etkin otonomi profilinin kaydı.","cozulecek_sorun":"N-K17-007 otonomiyi modül/risk ekseninde tek düzeyle artırıyor; oysa bir ajan araştırmada serbest, eylemde kısıtlı olabilmeli. Kullanıcılar deneyim kazandıkça otomatik onayı artırıyor; düşürme mekanizması olmazsa otonomi yalnız tek yönde büyür.","yetenek_siniflari":["Y-42","Y-09","Y-35"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça otonomi profilleri portföy → ART → ekip katmanlarından miras alınmalı; aksi halde yüzlerce elle ayar ve tutarsızlık oluşur.","kabul_olcutleri":["Her rol ve modül için işlev × otonomi düzeyi matrisi sürümlü politikada.","Tanımlı tetikleyicilerde (geri alma, kural ihlali, model sürümü değişimi) düzey otomatik düşüyor; yeniden yükseltme ölçüt ve onayla yapılıyor.","Her koşunun başlangıçtaki otonomi profili denetim kaydında."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-184","S-182","S-185"],"not":"Otomasyon düzeyi dört işlev türü için ayrı seçilmelidir (Parasuraman, Sheridan, Wickens 2000). Otonomi yetenekten ayrı bir tasarım kararıdır (Feng vd. 2025). Kullanım analizinde yeni kullanıcılar oturumların ~%20'sinde, deneyimliler %40'ın üzerinde tam otomatik onay kullanıyor. Benzer mevcut ihtiyaç: N-K17-007; fark: N-K17-007 kademeli otonomiyi ve güven skorunu tanımlıyor ama işlev ayrımı, insanın her düzeydeki rolü ve otomatik düşürme/yeniden kazanım kuralı yok."},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-033","H-13"],"bagimliliklar":["N-K17-007"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-003","baslik":"İnsandan ajana görev devrinde etkileşim sözleşmesi","ihtiyac":"Bir insan işi ajana devrederken görevin içeriğinden (spesifikasyon) ayrı olarak birlikte çalışma koşullarının yazılması: ajanın hangi kontrol noktalarında durup insana döneceği, belirsizlikte soracak mı varsayacak mı, kime ve hangi saatlerde ulaşabileceği, yanıt gelmezse ne yapacağı, kesinti toleransı ve devredilen otonomi profili. Sözleşme koşu başında sabitlenir.","cozulecek_sorun":"Spesifikasyon işin ne olduğunu söylüyor, birlikte nasıl çalışılacağını söylemiyor. Ortak zemin ve yönlendirilebilirlik için tarafların birbirinden ne bekleyeceğini önceden bilmesi gerekir; aksi halde ajan ya gereksiz soru sorar ya da sorması gereken yerde varsayar.","yetenek_siniflari":["Y-49","Y-12","Y-31"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok ekipte ulaşılabilirlik ve çalışma saatleri kişi yerine rol sınıfından çözülmeli; aksi halde sözleşmeler bayatlar.","kabul_olcutleri":["Her koşunun etkileşim sözleşmesi (kontrol noktaları, soru/varsayım politikası, ulaşılabilir kişi, yanıtsızlık davranışı) kayıtlı.","Ajanın sözleşmedeki kontrol noktasını atladığı veya sözleşme dışı durduğu olaylar ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-186","S-187","S-185"],"not":"Otomasyonun 'takım oyuncusu' olması için ortak zemin, öngörülebilirlik ve yönlendirilebilirlik gerekir (Klien vd. 2004). Ortak planda adımlar insana ya da ajana atanabiliyor (CHI 2026). Ajan duraklamalarının ~%32'si eksik bağlam, ~%35'i yaklaşım seçimi için. Benzer mevcut ihtiyaç: N-K01-001; fark: N-K01-001 görev spesifikasyonunu, N-K01-007 sınırlı belirsizlik döngüsünü tanımlıyor; kontrol noktaları, ulaşılabilirlik ve yanıtsızlık davranışı gibi etkileşim koşulları hiçbir ihtiyaçta yok."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-033","H-13"],"bagimliliklar":["N-K01-001"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-004","baslik":"Ajandan insana yapılandırılmış devir paketi ve alıcı teyidi","ihtiyac":"Ajanın işi insana devrettiği her durumda (teslim, engel, bütçe sonu, kontrol noktası) aynı yapıda bir devir paketi: işin önemi ve risk sınıfı, durum özeti, yapılanlar ve denenip vazgeçilenler, açık kararlar ve seçenekler, beklenmeyen durumlar ve olası sonuçları, devam için sonraki adım; devrin, alıcının paketi kendi sözleriyle özetleyip teyit etmesiyle kapanması.","cozulecek_sorun":"N-K17-008 yalnız takılan işin insana dönüşünü kapsıyor; olağan devirler serbest biçimli. Yapılandırılmamış devirde bağlam kaybı yeniden iş ve yanlış karar üretir; tıpta yapılandırılmış devir protokolü tıbbi hataları ve önlenebilir olayları anlamlı biçimde azalttı.","yetenek_siniflari":["Y-49","Y-31","Y-06"],"zorunluluk":"zorunlu","olcek_etkisi":"Paralel koşu ve ekip sayısı arttıkça devir sayısı katlanır; şemasız devirde kayıp ölçülemez.","kabul_olcutleri":["Tüm devir türleri tek şemayı kullanıyor; zorunlu alanlar boşsa devir tamamlanmıyor.","Alıcı teyidi kayıtlı; teyitsiz bekleyen devir süresi ölçülüyor.","Devir sonrası 'bağlam eksikti' kaynaklı geri dönüş oranı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-188","S-189"],"not":"Yapılandırılmış devir programı dokuz hastanede tıbbi hataları %23, önlenebilir olumsuz olayları %30 azalttı (NEJM 2014); protokol alıcının özetlemesiyle kapanır. Programcılar kesintiden sonra işe dönmekte zorlanıyor (86 programcı, 10.000 oturum). Benzer mevcut ihtiyaç: N-K17-008; fark: N-K17-008 hata/engel durumundaki işin insana geri alınmasını ve kanıt sunumunu istiyor; başarılı teslim ve kontrol noktası devirleri, alıcı teyidi ve devir kalitesinin ölçümü kapsam dışında."},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["G-033","H-13"],"bagimliliklar":["N-K17-008"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-005","baslik":"Ajanlar arası devirde belirsizlik, doğrulanmayanlar ve taahhütlerin aktarılması","ihtiyac":"Ajanlar arası her devirde çıktının yanında gönderenin emin olmadığı noktaların, doğrulamadığı iddiaların, yaptığı varsayımların ve üstlendiği taahhütlerin aktarılması; alıcı ajanın devralınan iddiaları doğrulanmış saymadan kontrol etmesi ya da 'doğrulanmadı' işaretiyle taşıması; taahhütlerin yerine getirilip getirilmediğinin izlenmesi.","cozulecek_sorun":"Çok ajanlı sistem hatalarının yaklaşık üçte biri ajanlar arası uyumsuzluktan (bilgi saklama, diğerinin girdisini yok sayma) geliyor; birlikte çalışan kodlama ajanlarında başarı tek başına çalışmaya göre ~%30 düşüyor, ajanlar taahhütlerini terk ediyor ve birbirleri hakkında yanlış varsayımlar sürdürüyor. Standart bağlam paketi bu epistemik bilgiyi taşımıyor.","yetenek_siniflari":["Y-49","Y-07","Y-06"],"zorunluluk":"zorunlu","olcek_etkisi":"Rol sayısı ve topoloji büyüdükçe devir sayısı katlanır; bu alanlar olmadan çok ajanlı hata çoğalması (U-036) izlenemez.","kabul_olcutleri":["Ajanlar arası devir şemasında belirsizlik, doğrulanmamış iddia, varsayım ve taahhüt alanları zorunlu.","Alıcının devralınan iddiaları yeniden doğruladığı veya 'doğrulanmadı' olarak taşıdığı izde görülüyor.","Terk edilen taahhüt oranı ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-113","S-190"],"not":"MAST: 1600+ izde 14 hata modu; ajanlar arası uyumsuzluk ~%37. CooperBench: 600+ ortak kodlama görevinde iş birliğinde ~%30 daha düşük başarı; belirsiz mesaj, terk edilen taahhüt ve yanlış varsayım başlıca nedenler. Benzer mevcut ihtiyaç: N-K10-009; fark: N-K10-009 uzmana görev, kod, kural ve önceki bulgulardan oluşan bağlam paketi veriyor; N-K12-006 protokolü tanımlıyor. Belirsizlik, doğrulanmamış iddia ve taahhüt aktarımı hiçbirinde yok."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-033","H-13"],"bagimliliklar":["N-K10-009"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-006","baslik":"Yarım kalan işin taraflar arası devralınması ve insan düzenlemelerinin korunması","ihtiyac":"Yarım kalmış bir işin başka bir insan veya ajan tarafından devralınabilmesi için her kontrol noktasında güncel bir devralma notunun (plan ilerlemesi, çalışma kopyası durumu, açık sorular, varsayımlar) tutulması; insanın başlattığı ya da iş sırasında elle değiştirdiği işi devralan ajanın önce insan değişikliklerini okuyup niyetini özetlemesi, bunları üzerine yazmaması ve etkilenen kısmı hedefli testlerle yeniden doğrulaması.","cozulecek_sorun":"N-K13-002 aynı koşunun çöküş sonrası devamını, N-K06-001 kullanıcı değişikliklerinin sürüm kontrolünde korunmasını kapsıyor; işin taraf değiştirerek devralınması tanımsız. İnsan iş sırasında kodu değiştirdiğinde ajanların başarısı düşüyor; ajanlar çatışan kodu ya olduğu gibi bırakıyor ya da depoyu yeniden incelemeden değiştiriyor.","yetenek_siniflari":["Y-49","Y-12","Y-33"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip ve koşu sayısı arttıkça yarım kalan iş havuzu büyür; devralma notu yoksa işler yeniden başlatılır ve maliyet katlanır.","kabul_olcutleri":["Her kontrol noktasında devralma notu güncel; başka tarafça devralınan işlerde not üzerinden devam ediliyor.","Ajanın devraldığı işte insan değişikliği özeti ve hedefli yeniden doğrulama izde var.","İnsan değişikliğinin ajan tarafından sessizce geri alındığı olaylar 0 hedefiyle izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-191","S-189"],"not":"SWE-Touch: kullanıcının iş sırasında çatışan düzenleme yapması çözüm oranını ortalama 7,7 puan düşürüyor; neden, çalışma alanı farkındalığı eksikliği. Benzer mevcut ihtiyaç: N-K13-002; fark: N-K13-002 teknik kesintiden aynı koşunun devamıdır; farklı bir aktörün (insan veya başka ajan) işi devralması ve insan düzenlemelerinin ajan tarafından fark edilip korunması ayrı bir ihtiyaçtır."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-033","H-13"],"bagimliliklar":["N-K13-002"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-007","baslik":"Gözetim sorumluluğunun devri ve vekâlet","ihtiyac":"Bir ajan koşusunun sorumlu insanı erişilemez olduğunda (izin, vardiya sonu, ekip değişikliği, ayrılma) sorumluluğun devir paketi ve alıcı onayıyla başka bir kişiye geçmesi; rol sınıfı içinde vekil tanımı; sorumlusu erişilemeyen koşuların tespit edilip güvenli noktada bekletilmesi.","cozulecek_sorun":"N-K25-004 her ajan çıktısının bir sorumlu insanı olmasını istiyor ama bu kişinin değişmesini ele almıyor. Günlerce süren ya da insan bekleyen koşular sorumlu değişince sahipsiz kalabilir; 'kim onayladı' cevaplansa da 'şu an kim sorumlu' cevapsız kalır.","yetenek_siniflari":["Y-31","Y-28","Y-12"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Kişi sayısı ve koşu süresi arttıkça sahipsiz koşu olasılığı artar; 10+ ekipte vekil tanımı rol sınıfı düzeyinde zorunlu hale gelir.","kabul_olcutleri":["Sorumlusu erişilemez durumdaki açık koşu sayısı izleniyor; eşik aşımında koşu bekletiliyor.","Sorumluluk devirleri alıcı onayıyla denetim kaydında.","Bağlam aktarımı işlem yetkisini kendiliğinden taşımıyor; devralanın yetkisi ayrıca veriliyor.","Devir 'gönderildi', 'alındı', 'anlaşıldı' ve 'devralındı' durumlarıyla izleniyor; alıcı bulunmadığında iş tamamlanmış veya kabul edilmiş görünmüyor ve sahipsiz sorumluluk listeleniyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-094","S-188","S-192","S-095"],"not":"Tıptaki vardiya devri kanıtından ve otonom araç kazasında operatör gözetiminin etkisizliğinin katkıda bulunan etken sayılmasından uyarlanmıştır. Benzer mevcut ihtiyaç: N-K25-004; fark: N-K25-004 sorumluluğun varlığını, N-K17-004 bekleme ve eskalasyonu tanımlıyor; sorumlunun değişmesi, vekâlet ve devir onayı tanımsız."},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"üretim","iliskili":["G-033","H-13"],"bagimliliklar":["N-K25-004"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T05; ihtiyac-kumeleri/kumeler/01_amac_ve_ortak_anlayis/02_insan_ekip_ve_yonetisim.json#I02-07","dogrulama":"kismen","ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-095 eklendi; mevcut metin değiştirilmedi.","kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-008","baslik":"Ortak çalışma alanında kalem sahipliği ve farkındalık","ihtiyac":"İnsan ile ajanın aynı dal veya dosyalar üzerinde çalışabildiği durumlarda o an kimin değişiklik yaptığının (kalem sahibi) açık olması; sahipliğin açıkça devredilmesi; tarafların birbirinin etkin çalışmasını görmesi (varlık ve bağlam göstergesi); ajanın kalem kendisinde değilken yazmaması.","cozulecek_sorun":"Ajanlar arası dosya çakışması ele alınmış; insan–ajan eşzamanlı düzenlemesi ele alınmamış. Paylaşılan çalışma alanı farkındalığı olmadan iki taraf birbirinin değişikliğini ezer; proaktif asistan çalışmalarında varlık ve bağlam göstergeleri kesintiyi azaltıp farkındalığı artırdı.","yetenek_siniflari":["Y-48","Y-33","Y-18"],"zorunluluk":"zorunlu","olcek_etkisi":"Etkileşimli kullanım yaygınlaştıkça insan–ajan eşzamanlı düzenlemesi sıklaşır; 2+ ekipte ortak sıcak nokta dosyalarıyla (N-K24-008) birleşir.","kabul_olcutleri":["Her çalışma kopyası veya dal için kalem sahibi kaydı var; sahip olmayan tarafın yazma girişimi engelleniyor ya da onaya düşüyor.","Kalem devirleri kayıtlı; eşzamanlı yazma çakışması sayısı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-193","S-194","S-191"],"not":"Paylaşılan çalışma alanı farkındalığı çerçevesi (Gutwin ve Greenberg 2002). Proaktif ajan çalışmasında (N=18) varlık göstergesi ve etkileşim bağlamı kesintiyi azalttı ve farkındalığı artırdı. Benzer mevcut ihtiyaç: N-K04-005; fark: N-K04-005 yalnız paralel ajanların ortak dosya çakışmasını, N-K06-001 yıkıcı sürüm kontrolü işlemlerini ele alıyor; insan ile ajanın aynı alanda eşzamanlı çalışması tanımsız."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-033","H-13"],"bagimliliklar":["N-K04-005"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-009","baslik":"Etkileşimli ve hat içi ajan çalışmasının eşdeğer güvencesi","ihtiyac":"Geliştiricinin kendi ortamında ajanla eşzamanlı ürettiği değişikliklerin de hat içi (eşzamansız) koşularla aynı tamamlanma tanımına, test bütünlüğü kurallarına, katkı kökeni kaydına ve risk sınıfı kapılarına tabi olması; iki yol arasında güvence açığı bırakılmaması; insan eliyle yazılan kodun da istenirse ajan incelemesi ve test üretiminden geçebilmesi.","cozulecek_sorun":"Harita eşzamansız hattı (iş takip → koşu → kanıt) tasarlıyor; ajan kullanımının büyük kısmı geliştiricinin kendi ortamında eşzamanlı gerçekleşiyor. Bu yol güvence dışında kalırsa hattın kapıları arka kapıdan aşılır; açık kaynakta ajan üretimi değişikliklerin çoğunun hiç insan incelemesi almadığı gözlendi.","yetenek_siniflari":["Y-20","Y-28","Y-09","Y-54"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça etkileşimli kullanım çeşitlenir; tek güvence noktası birleştirme olmalı, istemci tarafındaki araç çeşitliliğine bağlı olmamalı.","kabul_olcutleri":["Birleştirme noktasında değişikliğin etkileşimli mi hat içi mi üretildiğinden bağımsız aynı kapılar koşuyor.","Ajan katkısı içerip köken kaydı olmayan değişiklik oranı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-195","S-196","S-197"],"not":"Açık kaynakta yapay zekâ üretimi değişikliklerin çoğu hiç inceleme almıyor, alanlar da çoğunlukla otomasyon aracılı (2026). yıllık yazılım teslim performansı araştırması 2025: yapay zekâ mevcut güçlü ve zayıf yanları büyütür; güçlü sürüm kontrolü ve açık yapay zekâ tutumu temel yetenekler. Benzer mevcut ihtiyaç: N-K22-010; fark: N-K22-010 kurum politikasını, N-K18-013 geliştirici makinesindeki ajan güvenliğini ele alıyor; iki çalışma yolunun aynı kalite güvencesine bağlanması ve ters yönde (insan kodu → ajan incelemesi) iş birliği hiçbir ihtiyaçta yok."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-033"],"bagimliliklar":["N-K22-010"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-010","baslik":"İnsan talimatına itiraz ve anlaşmazlık protokolü","ihtiyac":"Ajanın, insan talimatı spesifikasyon, karar kaydı, test, politika ya da kanıtla çeliştiğinde sessizce uymak veya sessizce sapmak yerine yapılandırılmış bir itiraz üretmesi (çelişen kaynak, kanıt, önerilen seçenek); değişiklik gerekmediğinde bunu açıkça söyleyebilmesi; insanın kararının gerekçesiyle kayda geçmesi; politika ihlali içeren talimatta ajanın uygulamayı reddedip eskale etmesi.","cozulecek_sorun":"İnsan geri bildirimiyle eğitilmiş modeller kullanıcının inancına uyan yanıtı doğruya tercih edebiliyor (dalkavukluk); kodlama ajanları değişiklik gerekmeyen görevlerin %35–65'inde yine de değişiklik öneriyor. İtiraz kanalı olmayan ajan insanın hatasını büyütür. Havacılıkta ekip kaynak yönetimi, alt rütbenin endişesini dile getirmesini prosedürleştirdi.","yetenek_siniflari":["Y-06","Y-05","Y-29"],"zorunluluk":"zorunlu","olcek_etkisi":"Ölçekten bağımsızdır; ancak ekip sayısı arttıkça itirazların karar sahibine yönlendirilmesi rol sınıfı eşlemesine (N-K25-001) dayanmalı.","kabul_olcutleri":["İtiraz çıktısı şemalı (çelişen kaynak, kanıt, seçenek) ve iş kalemine bağlı.","İtiraz oranı ve insanın itirazı haklı bulma oranı izleniyor; sıfıra yakın itiraz oranı uyarı sinyali sayılıyor.","Değişiklik gerektirmeyen tuzak görevlerde ajanın 'değişiklik gerekmez' deme oranı değerlendirme setinde ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-198","S-199","S-200","S-201"],"not":"Beş asistanda tutarlı dalkavukluk (2023). FixedBench: 200 değişiklik gerektirmeyen görevde modeller %35–65 oranında istenmeyen değişiklik öneriyor (eylem yanlılığı). Bir sağlayıcı 2025'te aşırı onaylayıcı model güncellemesini geri çekti (olay raporu). Benzer mevcut ihtiyaç: N-K10-010; fark: N-K10-010 belirsizlikte açıklama isteme ve 'görev imkânsız' sinyalini kapsıyor; açık ama hatalı ya da çelişkili bir insan talimatına itiraz ve eylemsizlik önerisi kapsanmıyor."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-033"],"bagimliliklar":["N-K10-010"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K27-011","baslik":"Ajanlar arası anlaşmazlıkta hakemlik ve insana eskalasyon","ihtiyac":"Uygulayıcı, test, denetçi ve uzman ajanlar aynı bulgu üzerinde tanımlı tur sayısından sonra uzlaşamadığında 'son söyleyen kazanır' yerine iki tarafın gerekçe ve kanıtını yan yana sunan yapılandırılmış bir hakem kaydıyla karar sahibine (deterministik kapı veya rol sahibi insan) gidilmesi; anlaşmazlık türlerinin ve çözüm yollarının sınıflanması.","cozulecek_sorun":"Rol ayrımı bilinçli olarak anlaşmazlık üretir; anlaşmazlığın nasıl kapanacağı tanımsız. Çözümsüz döngüler bütçe tüketir, baskın ajanın görüşü kanıtın yerine geçer.","yetenek_siniflari":["Y-07","Y-12","Y-31"],"zorunluluk":"zorunlu","olcek_etkisi":"Rol sayısı arttıkça anlaşmazlık olasılığı artar; hakem kayıtları eskalasyon kapasitesini (N-K17-005) doğrudan etkiler.","kabul_olcutleri":["Anlaşmazlık tur üst sınırı ve hakem kaydı şeması tanımlı.","Anlaşmazlıkların çözüm yolu (kanıt, deterministik kapı, insan kararı) ve süresi raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-113","S-190"],"not":"Çok ajanlı hatalarda diğer ajanın girdisini yok sayma ve görev doğrulama eksikliği başlıca kategoriler; birlikte çalışan kodlama ajanları birbirleri hakkında yanlış varsayımlar sürdürüyor. Benzer mevcut ihtiyaç: N-K13-008; fark: N-K13-008 hata sınıfına göre yeniden denemeyi, N-K04-003 yaklaşım değişimini ele alıyor; iki ajanın aynı konuda farklı hükme vardığı durumun hakemliği ve insana taşınma biçimi yok."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-033"],"bagimliliklar":["N-K13-008"],"kume":"K27","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-001","baslik":"Ortak düzenlenebilir plan ve yürütme öncesi plan önizlemesi","ihtiyac":"Ajanın yürütmeden önce adımlara bölünmüş planını insana göstermesi; insanın adım ekleyip çıkarabilmesi, sırasını değiştirebilmesi, not düşebilmesi ve adımları kendine ya da ajana atayabilmesi; kısmi yürütmeden sonra planın birlikte güncellenmesi; plan değişikliğinin etkilediği onayları yeniden tetiklemesi. Plan önizlemesinin zorunluluğu risk sınıfına göre ayarlanır.","cozulecek_sorun":"Kaynaklarda 'plan onayı' bir karar noktası olarak geçiyor ama sahibi ve biçimi yok (Q-015); onay/ret ikiliği insanı yalnız onaylayıcıya indirger. İnsanlar planlama kararlarını büyük ölçüde elde tutmak istiyor; ortak plan düzenleme görev belirsizliğini gideriyor ve yürütmeyi niyetle hizalıyor.","yetenek_siniflari":["Y-48","Y-12","Y-31"],"zorunluluk":"kosullu","olcek_etkisi":"Plan önizlemesi insan dikkati tüketir; ölçek büyüdükçe yalnız risk eşiği üstünde zorunlu tutulmalı, aksi halde dikkat bütçesiyle çatışır.","kabul_olcutleri":["Risk eşiğinin üstündeki koşularda yürütme, insanın gördüğü ve gerekirse düzenlediği plan sürümüyle başlıyor.","Plan adımlarının insan/ajan ataması ve plan sürüm geçmişi kayıtlı.","Plan düzenlemesi yapılan ve yapılmayan koşuların yeniden iş oranı karşılaştırılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-203","S-187","S-183"],"not":"Ortak planlama: kullanıcı planı yürütmeden önce düzenler, yeniden sıralar, not düşer (2025). Etkileşimli planlar kolaylıktan ödün vermeden yönlendirilebilirlik sağladı (CHI 2026, n=16 laboratuvar, n=7 saha). Benzer mevcut ihtiyaç: N-K17-001; fark: N-K17-001 plan onayını karar noktası olarak listeliyor; planın birlikte düzenlenmesi, adımların insana atanması ve kısmi yürütme sonrası yeniden planlama tanımsız."},"cember":"ic_bosluk","belirsizlik":"orta","bagimliliklar":["N-K17-001"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-002","baslik":"Yürütme sırasında durumu koruyarak yönlendirme","ihtiyac":"İnsanın çalışan bir koşuyu durdurmadan ya da baştan başlatmadan yönlendirme mesajı iletebilmesi; ajanın mesajı aldığını ve planını nasıl değiştirdiğini açıkça göstermesi; duraklat, yönlendir, devam et ve iptal et eylemlerinin ayrı ve öngörülebilir olması; yönlendirmelerin koşu kaydına işlenmesi.","cozulecek_sorun":"Haritada müdahale yalnız iptal ve global duraklatma olarak var; ara yönlendirme yok. Deneyimli kullanıcılar her adımı onaylamak yerine ajanı çalıştırıp gerektiğinde müdahale ediyor; müdahale ancak ucuz ve durum kaybettirmiyorsa kullanılır.","yetenek_siniflari":["Y-48","Y-12","Y-05"],"zorunluluk":"zorunlu","olcek_etkisi":"Uzun koşular ve paralel gözetim arttıkça ara yönlendirme iptal-yeniden başlat döngüsüne göre maliyeti belirgin biçimde düşürür.","kabul_olcutleri":["Yönlendirme mesajı koşunun durumunu kaybetmeden uygulanıyor; ajanın teyidi ve plan farkı kayıtlı.","Yönlendirmeyi yok sayma olayları ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-185","S-203","S-204"],"not":"Kullanım analizinde deneyimli kullanıcılar turların ~%9'unda (yeni kullanıcılar ~%5) müdahale ediyor; öneri her eylemi onaylatmak yerine güvenilir görünürlük ve basit müdahale mekanizması. İnsan–yapay zekâ etkileşim yönergeleri verimli düzeltmeyi ve geri çevirmeyi istiyor. Benzer mevcut ihtiyaç: N-K13-006; fark: N-K13-006 gerçek iptali, N-K16-003 global duraklatmayı sağlıyor; iptal etmeden yön değiştirme ve bunun teyidi yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K13-006"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-003","baslik":"Adım düzeyinde geri alma noktaları ve geri alınamazlık etiketi","ihtiyac":"Ajanın çalışma alanını değiştiren her adımının geri dönülebilir bir kontrol noktası üretmesi; insanın herhangi bir adıma geri sarabilmesi; geri alınamayan veya dış yan etkisi olan adımların yürütmeden önce 'geri alınamaz' olarak etiketlenip gösterilmesi; ajanın geri alma imkânı hakkındaki beyanının sistem kaydıyla doğrulanması.","cozulecek_sorun":"Mevcut ihtiyaçlar yalnız yeniden düzenlemede son yeşile otomatik dönüşü ve yıkıcı eylem iznini kapsıyor; insan tarafından ayrıntılı geri alma yok. Kamuya yansıyan bir olayda ajan kod dondurma sırasında üretim verisini sildi ve geri almanın imkânsız olduğunu yanlış beyan etti.","yetenek_siniflari":["Y-48","Y-18","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"Kontrol noktası depolama maliyeti koşu sayısıyla artar; saklama süresi N-K22-009 ile uyumlu tanımlanmalı.","kabul_olcutleri":["Çalışma alanını değiştiren her adım için geri dönülebilir kontrol noktası var; geri sarma süresi ölçülüyor.","Geri alınamaz adımlar yürütme öncesi işaretleniyor ve gösteriliyor.","Ajanın 'geri alınamaz' beyanı sistem kaydıyla çelişirse olay açılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-149","S-204","S-185"],"not":"Olay 1152 (2025): kod dondurma sırasında yetkisiz yıkıcı komut ve yanlış 'geri alınamaz' beyanı; sonrasında onaylı yıkıcı komut ve test edilmiş yedek devreye alındı. Kullanım analizinde araç çağrılarının yalnız ~%0,8'i geri alınamaz görünüyor; bu küçük payın önceden işaretlenmesi değerlidir. Benzer mevcut ihtiyaç: N-K04-004; fark: N-K04-004 yalnız yeniden düzenleme turunda otomatik dönüşü, N-K18-007 yıkıcı eylem iznini tanımlıyor; her adımın insan tarafından geri sarılabilmesi ve geri alınamazlığın önceden gösterilmesi yok."},"cember":"ic_bosluk","belirsizlik":"dusuk","bagimliliklar":["N-K04-004"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-004","baslik":"Canlı çalışma anlatısı ve gerekçeli karar günlüğü","ihtiyac":"Koşu sürerken insanın okuyabileceği düzeyde, ilerledikçe güncellenen bir çalışma anlatısı: niyet → plan → tamamlanan adımlar → önemli kararlar (seçilen yol, değerlendirilen seçenekler, gerekçe ve dayandığı kural, karar kaydı veya kabul kriteri) → plandan sapmalar. Anlatı uçtan uca ize bağlıdır ama ondan ayrı ve insan içindir.","cozulecek_sorun":"Ayrıntılı iz mühendis ve denetçi için, sonuç raporu iş bittikten sonra; arada insanın ajanın ne yaptığını ve neden yaptığını çalışırken anlayabileceği bir katman yok. Kontrollü çalışmalar ajanlara geçildikçe kullanıcıların ajan davranışını anlamakta zorlandığını gösteriyor.","yetenek_siniflari":["Y-48","Y-27","Y-37"],"zorunluluk":"zorunlu","olcek_etkisi":"Paralel koşu sayısı arttıkça anlatı insan için tek pratik farkındalık aracı olur; ayrıntılı iz ölçekte okunamaz.","kabul_olcutleri":["Her koşunun canlı anlatısı var; her önemli karar gerekçe ve kaynak bağlantısı içeriyor.","Örneklemde insanlar anlatıdan ajanın mevcut adımını ve son kararını doğru tanımlayabiliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-186","S-205","S-194","S-204"],"not":"Takım oyuncusu otomasyon gözlemlenebilir olmalı (2004). Ajan ve yardımcı karşılaştırmasında kullanıcıların ajan davranışını yeterince anlaması açık sorun (CHI 2026). Yönergeler 'sistemin neden öyle yaptığını açık et' diyor. Benzer mevcut ihtiyaç: N-K19-001; fark: N-K19-001 uçtan uca makine izini, N-K07-005 bitişteki okunabilir raporu istiyor; çalışırken gerekçe düzeyinde insan farkındalığı sağlayan katman yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K19-001"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-005","baslik":"Varsayım günlüğü ve varsayımların incelemede sunulması","ihtiyac":"Ajanın sormak yerine varsayımla ilerlediği her noktanın (belirsiz gereksinim, eksik bağlam, dış davranış tahmini) risk, geri alınabilirlik ve doğrulama önerisiyle kaydedilmesi; yüksek riskli varsayımların işi durdurması; varsayım listesinin inceleme ve kabul sırasında ayrı bir bölüm olarak sunulması ve insanın her varsayımı onaylayıp reddedebilmesi.","cozulecek_sorun":"Görev başındaki bilinmeyen taraması ve sınırlı netleştirme döngüsü var; uygulama sırasında sessizce yapılan varsayımlar görünmüyor. Çok ajanlı hataların en büyük payı spesifikasyon sorunlarından geliyor; sorulmayan her soru bir varsayıma dönüşür.","yetenek_siniflari":["Y-06","Y-31","Y-48"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça aynı varsayımın farklı ekiplerde farklı yapılması kural sapmasına (U-029) dönüşür; tekrarlayan varsayımlar ortak bilgi adayıdır.","kabul_olcutleri":["İncelemeye giden her değişikliğin varsayım listesi var (boşsa açıkça 'varsayım yok').","Reddedilen varsayım oranı ve reddin yol açtığı yeniden iş ölçülüyor.","Model güven ifadesi veya ajanların çoğunluk görüşü eksik yetkili iş kuralının yerine geçmiyor; kritik dayanak eksikse iş bekliyor.","Açıklanamayan gözlem hangi varsayımı ve kabul iddiasını yeniden açtığıyla kaydediliyor; 'testler geçti' gerekçesiyle kapatılmıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-113","S-185","S-095","S-376"],"not":"MAST'ta hataların ~%42'si spesifikasyon sorunları. Ajan duraklamalarının ~%32'si eksik bağlam kaynaklı; duraklamayan durumlarda eksik bağlam varsayımla doldurulur. Benzer mevcut ihtiyaç: N-K01-007; fark: N-K01-007 netleştirme döngüsünü ve açık sorunun sahibine yazılmasını, N-K01-008 görev başındaki bilinmeyen taramasını tanımlıyor; uygulama sırasında yapılan varsayımların kaydı ve insana sunulması yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K01-007"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T22; ihtiyac-kumeleri/kumeler/01_amac_ve_ortak_anlayis/03_ihtiyac_ifadesi_ve_kabul.json#I03-05","dogrulama":"kismen","kaynak_url":["https://airc.nist.gov/airmf-resources/playbook/manage/"],"ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-095, S-376 eklendi; mevcut metin değiştirilmedi.","kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-006","baslik":"İddia düzeyinde epistemik durum ve kalibre belirsizlik bildirimi","ihtiyac":"Ajanın rapor, anlatı ve inceleme metinlerindeki her önemli iddiasının epistemik durumla etiketlenmesi (deterministik olarak doğrulandı – kanıt bağlantılı / çıkarım / varsayım / doğrulanmadı); güven ifadelerinin standart ve kalibre bir dil kümesiyle verilmesi; kodda insanın düzeltme olasılığı yüksek bölgelerin vurgulanması; etiketlerin doğruluğunun düzenli ölçülmesi.","cozulecek_sorun":"Kalite boyutu düzeyinde 'test edilmedi' durumu tanımlı; ajanın serbest metin iddiaları etiketsiz. Kullanıcılar varsayılan açıklamalar nedeniyle dil modeli doğruluğunu abartıyor ve uzun açıklamalar doğruluk artmadan güveni artırıyor; uygun belirsizlik ifadesi aşırı güveni azaltıyor.","yetenek_siniflari":["Y-06","Y-29","Y-50"],"zorunluluk":"zorunlu","olcek_etkisi":"Ölçekten bağımsız; ancak kalibrasyon ölçümü için yeterli örneklem hacmi gerekir.","kabul_olcutleri":["Rapordaki önemli iddiaların tamamı epistemik etiketli; 'doğrulandı' etiketleri kanıta bağlı.","Etiket kalibrasyonu (ör. 'doğrulandı' denen iddiaların gerçekten doğru çıkma oranı) periyodik ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-206","S-207","S-208"],"not":"Doğal dilde birinci şahıs belirsizlik ifadesi aşırı güveni azalttı (FAccT 2024). Açıklamaları modelin iç güvenine göre ayarlamak kalibrasyon açığını daralttı; uzun açıklama güveni doğruluk artmadan artırdı (2025). Kodda üretim olasılığına göre vurgu fayda sağlamadı, 'düzenlenme olasılığı' vurgusu daha hızlı ve hedefli düzeltme sağladı (TOCHI 2025). Benzer mevcut ihtiyaç: N-K05-014; fark: N-K05-014 kalite boyutlarında 'test edilmedi' durumunu, N-K23-007 öz-rapor doğruluğunu ölçüyor; iddia düzeyinde epistemik etiket, standart güven dili ve kod bölgesi vurgusu yok."},"cember":"ic_bosluk","belirsizlik":"orta","bagimliliklar":["N-K05-014"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-007","baslik":"İncelemeye hazır değişiklik paketleme ve inceleme bütçesi","ihtiyac":"Ajanın değişikliği inceleyenin bakış açısından yapılandırması: mantıksal olarak sıralı ve bağımsız incelenebilir birimlere bölme; mekanik kısımları (yeniden adlandırma, biçimlendirme, üretilmiş dosya) davranış değiştiren kısımlardan ayırma; yeniden düzenlemeyi davranış değişikliğinden ayrı sunma; her birim için tahmini inceleme süresi ve birim başına inceleme bütçesi üst sınırı.","cozulecek_sorun":"Görev boyutu ve davranış başına en küçük değişiklik tanımlı; inceleme birimi ve inceleyici bütçesi tanımsız. Yüksek yapay zekâ kullanımlı ekiplerde değişiklik boyutu ve inceleme süresi keskin biçimde arttı; karma değişikliklerin ayrıştırılması inceleme anlayışını ve doğruluğunu artırıyor.","yetenek_siniflari":["Y-50","Y-33","Y-31"],"zorunluluk":"zorunlu","olcek_etkisi":"Değişiklik hacmi ajanlarla arttıkça inceleme darboğazı (R-001) büyür; paketleme en ucuz kaldıraçtır.","kabul_olcutleri":["İnceleme birimi başına boyut/süre bütçesi tanımlı; aşan değişiklik bölünmeden incelemeye gitmiyor.","Mekanik ve davranışsal değişiklikler ayrı birimlerde.","İnceleme bekleme ve inceleme süresi birim boyutuna göre raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-107","S-209","S-210","S-211","S-212","S-213"],"not":"10.000+ geliştirici telemetrisi: yüksek kullanımda ortalama değişiklik boyutu %154, inceleme süresi %91 arttı (sektör raporu 2025). Değişiklik ayrıştırma deneyi ve otomatik ayrıştırma çalışması anlayışla pozitif ilişki buldu. yıllık yazılım teslim performansı araştırması 2025 küçük partilerde çalışmayı temel yetenek sayıyor. Benzer mevcut ihtiyaç: N-K02-013; fark: N-K02-013 görev ve değişiklik boyutuna, N-K04-001 davranış başına değişikliğe sınır koyuyor; inceleyici açısından birim yapısı, mekanik/davranışsal ayrımı ve inceleme bütçesi tanımsız."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K02-013"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-008","baslik":"Niyet–parça eşlemesi ve okuma rehberi","ihtiyac":"Her değişiklik parçasının hangi kabul kriterine, plan adımına veya kurala hizmet ettiğinin insana gösterilmesi; hiçbir niyete eşlenmeyen parçaların işaretlenmesi; önerilen okuma sırası, riskli ve belirsiz noktalar, incelenmesi gerekmeyen üretilmiş kısımlar ve nelerin test edilmediğini içeren bir okuma rehberi.","cozulecek_sorun":"Niyet–kod uyumu otomatik denetçi için tanımlı; insan inceleyici için eşleme ve yönlendirme yok. Kod incelemesinde temel zorluk değişikliği anlamak; doğrulamanın maliyeti düştüğünde aşırı güven azalıyor.","yetenek_siniflari":["Y-50","Y-31","Y-14"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekipler arası incelemelerde (başka ekibin modülüne dokunan değişiklik) bağlam eksikliği arttığı için etkisi ölçekle büyür.","kabul_olcutleri":["İncelemedeki her parça en az bir niyete eşli ya da 'eşlenmemiş' olarak işaretli.","Okuma rehberi olan ve olmayan incelemelerde kusur yakalama ve süre karşılaştırılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-214","S-215","S-212"],"not":"Modern kod incelemesinde en büyük zorluk değişikliği anlamak (ICSE 2013). Aşırı güven, doğrulamanın maliyet–fayda dengesine bağlı; açıklama doğrulama maliyetini düşürdüğünde aşırı güveni azaltıyor (CSCW 2023, 731 katılımcı). Benzer mevcut ihtiyaç: N-K05-015; fark: N-K05-015 değişiklik açıklaması ile kod farkını otomatik karşılaştırıyor; insan inceleyicinin parça bazında niyeti görmesi ve okuma sırası rehberi tanımsız."},"cember":"ic_bosluk","belirsizlik":"orta","bagimliliklar":["N-K05-015"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-009","baslik":"İnsan dikkat bütçesi, bildirim politikası ve gözetim kapsamı","ihtiyac":"Ajanlardan insana giden bildirimlerin sınıflanması (engelleyici karar / bilgi / özet), engelleyici olmayanların toplanıp belirli saatlerde iletilmesi, odak pencerelerine saygı; kişi başı kesinti sayısı ve yanıt gecikmesinin ölçülmesi; bir kişinin aynı anda gözetebileceği etkin koşu sayısına üst sınır.","cozulecek_sorun":"Kanal kritik yoldan ayrılmış, bekleme süresi ve inceleme yükü ölçülüyor; insanın dikkati ve kesinti maliyeti ölçülmüyor. Kesintiye uğrayan iş daha hızlı ama daha stresli yapılıyor; tekrarlanan uyarılar uyarıların kabulünü düşürüyor; paralel ajan gözetimi bilişsel aşırı yük üretiyor.","yetenek_siniflari":["Y-51","Y-31","Y-11"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ajan ve paralel koşu sayısı arttıkça kişi başı kesinti doğrusal olmayan biçimde artar ve kıdemlilerde yığılmayla (U-004) birleşir.","kabul_olcutleri":["Bildirim sınıfları ve toplu iletim kuralı tanımlı; engelleyici olmayan bildirimler anlık gitmiyor.","Kişi başı günlük kesinti ve eşzamanlı gözetilen koşu sayısı izleniyor; üst sınır tanımlı.","Göz ardı edilen veya geç yanıtlanan bildirim oranı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-216","S-217","S-189","S-194","S-203","S-218"],"not":"Kesinti çalışması: iş daha hızlı ama daha fazla stres ve hayal kırıklığıyla tamamlanıyor (CHI 2008). Klinik karar desteğinde aynı hastada tekrarlayan uyarı payındaki her %5 artış uyarı kabulünde %10 düşüşle ilişkili (2017). Proaktif ajan müdahalelerinin %12'si akışı bozdu, %35'i göz ardı edildi (2025). Benzer mevcut ihtiyaç: N-K12-005; fark: N-K12-005 iletişim kanalını kritik yoldan ayırıyor, N-K17-004 ve N-K17-005 bekleme ve yükü ölçüyor; bildirim sınıflaması, toplu iletim, kesinti bütçesi ve gözetim kapsamı sınırı yok."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"yüksek hacim","bagimliliklar":["N-K12-005"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-010","baslik":"Karar vermeye hazır, kendi kendine yeten insan istekleri","ihtiyac":"Ajanın insana yönelttiği her soru ve karar isteğinin başka araç açmadan yanıtlanabilecek biçimde kendi kendine yetmesi: ne sorulduğu, seçenekler, önerilen seçenek ve gerekçesi, her seçeneğin sonucu, son tarih, yanıt gelmezse ne olacağı ve bağlamı yeniden kurmak için en kısa özet.","cozulecek_sorun":"Değişiklik onay ekranının içeriği tanımlı; netleştirme soruları ve ara kararlar serbest metin. Saatler sonra dönülen bir soru bağlamın yeniden kurulmasını gerektirir; bu maliyet sorunun tasarımıyla düşürülebilir.","yetenek_siniflari":["Y-06","Y-31","Y-51"],"zorunluluk":"zorunlu","olcek_etkisi":"Soru hacmi ekip ve koşu sayısıyla artar; soru kalitesi insan bekleme süresinin (N-K17-004) başlıca belirleyicisi olur.","kabul_olcutleri":["Soru şeması zorunlu alanlarla tanımlı; alanları eksik soru gönderilemiyor.","Sorulara yanıt süresi ve 'ek bilgi istendi' oranı ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-189","S-219","S-204"],"not":"Karma inisiyatif ilkeleri: sormanın beklenen değeri yüksekse sor, değilse eyle ya da bekle (CHI 1999). Kesinti sonrası işe dönüş sık ve kalıcı bir sorun; destek araçlarıyla hafifletilebilir (2011). Benzer mevcut ihtiyaç: N-K17-006; fark: N-K17-006 değişiklik onayının zorunlu alanlarını tanımlıyor; netleştirme ve ara karar isteklerinin yapısı ve yanıtsızlık davranışı tanımsız."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K17-006"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-011","baslik":"Karar anında güven kalibrasyonu bilgisi","ihtiyac":"İnsan onay veya kabul kararı verirken ajanın o iş türü, modül ve değişiklik sınıfındaki geçmiş başarımının (ilk incelemede kabul, birleşim sonrası kusur, geri alma oranı, bilinen zayıf alanlar) kısa bir özetle gösterilmesi; ajanın bu bağlamdaki bilinen hata kalıplarının hatırlatılması; veri yetersizse bunun açıkça belirtilmesi.","cozulecek_sorun":"Güven ajanın algılanan yeteneğine ve bağlama göre değişiyor; kod üreten araçlar geliştiricilere güvenilirliği değerlendirecek imkân sunmuyor. Genel güven anketi karar anında kalibrasyon sağlamaz.","yetenek_siniflari":["Y-31","Y-29","Y-27"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Geçmiş veri biriktikçe anlam kazanır; az veride yanıltıcı olabilir. Çok ekipte modül ve ekip kırılımı veriyi seyreltir.","kabul_olcutleri":["Onay yüzeyinde bağlama özgü geçmiş başarım özeti var; yetersiz veri açıkça belirtiliyor.","Bilgi gösterilen ve gösterilmeyen kararlarda aşırı/yetersiz güven göstergeleri karşılaştırılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-220","S-221","S-222"],"not":"Uygun güven için sistemin performansı, süreci ve amacı görünür olmalı (2004). Geliştiricilerin güveni durumsal; araçlar güvenilirliği değerlendirme imkânı sunmuyor (FAccT 2024). Yapay zekâya güven arttıkça eleştirel düşünme azalıyor (CHI 2025, 319 bilgi çalışanı). Benzer mevcut ihtiyaç: N-K25-007; fark: N-K25-007 güveni anketle ve kullanım verisiyle dönemsel ölçüyor, N-K17-007 güven skorunu otonomi için kullanıyor; kararı veren insana bağlama özgü başarım bilgisi sunulmuyor."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"zamanla (3–6 ay)","bagimliliklar":["N-K25-007"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-012","baslik":"Aşırı ve yetersiz güvenin davranışsal ölçümü","ihtiyac":"Güvenin anket yanında davranışla ölçülmesi: aşırı güven (kanıt açılmadan verilen onay, boyuta göre olağandışı kısa inceleme, sonradan kusurlu çıkan onaylı ajan değişikliği oranı) ve yetersiz güven (doğru ajan çıktısının atılması veya elle yeniden yazılması, ajana uygun işlerde kullanılmaması) göstergelerinin ekip düzeyinde izlenmesi; inceleme metriklerinde insan incelemesi ile ajan incelemesinin ayrı sayılması.","cozulecek_sorun":"Güven anketi ve algı–ölçüm farkı izleniyor; kalibrasyonun iki yönlü sapması (kötüye kullanım ve kullanmama) karar kalitesiyle ilişkilendirilmiyor. İnceleme metrikleri gerçek insan gözetimini yansıtmayabiliyor.","yetenek_siniflari":["Y-29","Y-27","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Pilotta az olayla anlamsız; yaygınlaştırmada ekip karşılaştırması yerine ekip zaman serisi (N-K24-011) olarak izlenmeli.","kabul_olcutleri":["Aşırı ve yetersiz güven göstergeleri tanımlı ve ekip düzeyinde dönemsel raporlanıyor (bireysel değerlendirme için değil).","İnceleme metriklerinde insan ve ajan incelemesi ayrı sayılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-223","S-220","S-195"],"not":"Otomasyonun kullanımı, kötüye kullanımı (aşırı güven) ve kullanılmaması (yetersiz güven) ayrı olgulardır (1997). Yapay zekâ üretimi değişikliklerde inceleme metrikleri insan gözetim düzeyini yansıtmayabilir (2026). Benzer mevcut ihtiyaç: N-K25-007; fark: N-K25-007 anket ve kullanım verisini, N-K23-008 algılanan–ölçülen verimi izliyor; davranışsal aşırı/yetersiz güven göstergeleri ve inceleme metriklerinin insan/ajan ayrımı tanımsız."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"pilot sonrası","bagimliliklar":["N-K25-007"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-013","baslik":"Yüksek riskli incelemelerde bilişsel zorlama","ihtiyac":"Yalnız yüksek risk sınıfındaki onaylarda, inceleyicinin ajanın gerekçesini görmeden önce beklenen davranışı veya kritik bir soruyu kendisinin yanıtlaması ya da kanıtla etkileşmesi (bir senaryoyu çalıştırma, bir karşı örneği değerlendirme) gibi bilişsel zorlama adımları; kullanımın yorgunluk yaratmayacak düzeyde sınırlanması.","cozulecek_sorun":"Açıklama eklemek tek başına aşırı güveni azaltmıyor, hatta artırabiliyor; bilişsel zorlama işlevleri aşırı güveni azaltıyor ama daha az beğeniliyor. Mevcut ihtiyaçlar zorunlu alanların görünmesini ve karşı gerekçeyi istiyor; insanın analitik katılımını zorlamıyor.","yetenek_siniflari":["Y-31","Y-50"],"zorunluluk":"kosullu","olcek_etkisi":"Yüksek riskli değişiklik oranı düşük tutulursa ölçekte maliyeti sınırlı kalır; tüm onaylara yayılırsa dikkat bütçesini tüketir.","kabul_olcutleri":["Bilişsel zorlama uygulanan risk sınıfları ve adımlar tanımlı.","Zorlama uygulanan ve uygulanmayan onaylarda sonradan kusur çıkma oranı karşılaştırmalı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-224","S-222","S-225"],"not":"Üç bilişsel zorlama müdahalesi aşırı güveni basit açıklamalı yaklaşımlara göre azalttı (CSCW 2021). Açıklamalar insan+yapay zekâ ekip başarımını her zaman artırmıyor (CHI 2021). Benzer mevcut ihtiyaç: N-K17-006; fark: N-K17-006 onay ekranında zorunlu alanları, N-K17-009 karşı gerekçeyi istiyor; inceleyicinin kendi yargısını önce üretmesini veya kanıtla etkileşmesini zorlamıyor."},"cember":"ic_bosluk","belirsizlik":"orta","bagimliliklar":["N-K17-006"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K28-014","baslik":"İnceleyici dikkatinin bilinen kusur yerleştirmeyle ölçülmesi","ihtiyac":"İnsan inceleyicilerin tespit başarımının, inceleme akışına önceden bilinen ve birleşime ulaşması teknik olarak engellenmiş yapay kusurların seyrek yerleştirilmesiyle ölçülmesi; sonuçların bireyi cezalandırmak için değil inceleme yüzeyini, iş yükünü ve eğitimi iyileştirmek için kullanılması; katılımın ve veri kullanımının önceden anlaşılması.","cozulecek_sorun":"Otomasyon yanlılığı kayıtlı bir risk ama inceleyicinin gerçekte neyi yakaladığı bilinmiyor; ajan tarafı için tuzak görev var, insan tarafı için yok. Havalimanı güvenliğinde yapay tehdit görüntüsü yansıtma görevli performansını ölçmek ve uyanıklığı artırmak için kullanılıyor.","yetenek_siniflari":["Y-29","Y-31","Y-33"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Güvenilir ölçüm için kişi veya ekip başına yeterli olay sayısı gerekir; küçük ekiplerde ekip toplamı, büyük ölçekte risk sınıfı kırılımı anlamlıdır.","kabul_olcutleri":["Yerleştirilen kusurların hiçbiri birleşime ulaşamıyor (teknik kilit).","Ekip ve risk sınıfı düzeyinde tespit oranı raporlanıyor; bireysel sonuçlar yalnız kişinin kendisine gösteriliyor.","Katılım kuralı ve veri kullanım sınırı yazılı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-226","S-227","S-192"],"not":"Yapay tehdit görüntüsü verisi, görüntüler yeterince zor ve kişi başı en az ~100 olay olduğunda güvenilir ve geçerli ölçüt (2025). Olay sıklığı ve vardiya uzunluğu tespit doğruluğunu etkiliyor (2016). Kültürel ve hukuki kabul belirsiz olduğundan belirsizlik yüksek. Benzer mevcut ihtiyaç: N-K23-011; fark: N-K23-011 ajanın hile ve ödül istismarını tuzak görevlerle ölçüyor; insan inceleyicinin tespit başarımını ölçen bir mekanizma haritada yok."},"cember":"dis_eksik","belirsizlik":"yuksek","olcek_esigi":"üretim","bagimliliklar":["N-K23-011"],"kume":"K28","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-001","baslik":"İnsan düzeltmelerinin yapılandırılmış yakalanması","ihtiyac":"İnsanın ajan çıktısına yaptığı her düzeltmenin (inceleme yorumu, elle düzenleme, ret, geri alma, yönlendirme mesajı) koşuya ve değişiklik parçasına bağlı olarak düşük sürtünmeyle yakalanması ve neden sınıfıyla (gereksinimi yanlış anlama, ekip konvansiyonu, tasarım tercihi, hata, kapsam aşımı, güvenlik) etiketlenmesi; ham düzeltmenin yanında çıkarılmış tercih özetinin tutulması.","cozulecek_sorun":"İzlerden kontrollü öğrenme ve olaylardan ders çıkarma tanımlı; en sık ve en zengin öğrenme sinyali olan günlük insan düzeltmeleri sınıflanmadan kayboluyor. Kullanıcı düzenlemelerinden örtük tercih çıkarmak sonraki çıktılarda düzenleme maliyetini düşürüyor.","yetenek_siniflari":["Y-52","Y-40","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça düzeltme hacmi büyür; sınıflama olmadan hangi düzeltmenin ekip konvansiyonu, hangisinin ortak kural olduğu ayrıştırılamaz.","kabul_olcutleri":["Ajan değişikliklerindeki insan düzeltmeleri koşuya bağlı yakalanıyor; neden sınıfı dolu olanların oranı izleniyor.","En sık tekrarlanan düzeltme sınıfları ekip bazında raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-228","S-204","S-229"],"not":"Kullanıcı düzenlemelerinden örtük tercih öğrenen çerçeve en düşük düzenleme maliyetine ulaştı (NeurIPS 2024). Yönergeler ayrıntılı geri bildirimi teşvik etmeyi öneriyor. İnceleme yorumlarından en iyi uygulama öğrenen sistem endüstride uygulanabilir bulundu (2024). Benzer mevcut ihtiyaç: N-K11-009; fark: N-K11-009 izlerden aday iyileştirme üretimini, N-K08-006 olaylardan dersleri tanımlıyor; insan düzeltmesinin kaynağında yakalanması ve neden sınıfı yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K11-009"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-002","baslik":"Düzeltme döngüsünün insana kapatılması","ihtiyac":"Düzeltmeyi yapan kişinin düzeltmesinin akıbetini görebilmesi (kural veya yetenek paketi adayı oldu mu, değerlendirmede ne sonuç verdi, yayına alındı mı, neden reddedildi); aynı düzeltmenin tekrar tekrar yapıldığının otomatik tespit edilip kişiye ve kural sahibine bildirilmesi; öğrenilen değişikliklerin davranış değişikliği olarak kullanıcılara duyurulması.","cozulecek_sorun":"Karşılıksız kalan geri bildirim geri bildirim vermeyi azaltır; aynı düzeltmenin sürekli yapılması hem zaman hem güven kaybıdır. Genel değişiklik duyurusu var; bireysel düzeltmenin akıbeti yok.","yetenek_siniflari":["Y-52","Y-40","Y-11"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Pilotta elle yürütülebilir; yaygınlaştırmada düzeltme hacmi elle takibi imkânsız kılar.","kabul_olcutleri":["Her yakalanan düzeltme için durum (beklemede / aday / yayında / reddedildi + gerekçe) kişiye görünür.","Aynı sınıfta tanımlı sayıda tekrarlanan düzeltmeler için otomatik kural adayı ve bildirim üretiliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-204","S-230"],"not":"Yönergeler kullanıcı davranışından öğrenmeyi ve değişiklikleri kullanıcılara bildirmeyi öneriyor. Üretken yapay zekâda verimlilik kaybını azaltmak için sürekli geri bildirim öneriliyor (IJHCI 2024). Benzer mevcut ihtiyaç: N-K25-009; fark: N-K25-009 kural ve model değişikliklerinin genel duyurusunu istiyor; bireysel düzeltmenin akıbeti ve tekrarlanan düzeltme tespiti yok."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"pilot sonrası","bagimliliklar":["N-K25-009"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-003","baslik":"Ajanın ekibe alıştırılması ve deneme dönemi","ihtiyac":"Bir ajan rolü yeni bir ekibe veya depoya başladığında ya da ekip konvansiyonları değiştiğinde tanımlı bir alıştırma süreci: ekibin geçmiş inceleme yorumlarından ve konvansiyonlarından türetilen ekip değerlendirme seti, düşürülmüş otonomiyle deneme dönemi, konvansiyon uyumu ölçütüyle mezuniyet; tekrarlayan inceleme yorumlarından konvansiyon adaylarının çıkarılıp sahip onayıyla ekip kural katmanına alınması.","cozulecek_sorun":"Kod tabanı paradigmasına uyum, örtük bilginin yazılması ve kural etkinliği ayrı ayrı tanımlı; ajanı yeni bir ekibe tanıtan uçtan uca süreç yok. Açık kaynak ajan bağlam dosyalarında güvenlik ve performans gibi gereksinimler nadiren yazılıyor ve bağlam dosyalarının etkisi tutarsız.","yetenek_siniflari":["Y-08","Y-29","Y-40","Y-52"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Her yeni ekip ve depo bir alıştırma maliyeti getirir; 10+ ekipte süreç şablonlaşmazsa ekipler arası kural sapması (U-029) artar.","kabul_olcutleri":["Her ekip için alıştırma kontrol listesi ve ekip değerlendirme seti var.","Deneme dönemindeki ajanın otonomisi düşürülmüş ve mezuniyet ölçütü yazılı.","Konvansiyon ihlali kaynaklı inceleme yorumlarının eğilimi ekip başına izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-231","S-232","S-229"],"not":"1925 depodan 2303 bağlam dosyası: test (%75,9), uygulama (%70,8) ve mimari (%68,1) yaygın; güvenlik (%14,8) ve performans (%14,5) nadir; okunabilirlik düşük (2025). Gerçek depolarda bağlam dosyası etkisi çelişkili (2026). Benzer mevcut ihtiyaç: N-K03-010; fark: N-K03-010 paradigma uyumunu, N-K07-004 örtük bilgiyi, N-K11-004 kural etkinliğini ayrı istiyor; bunları ekip başına bir alıştırma yaşam döngüsünde (değerlendirme seti, deneme dönemi, mezuniyet) birleştiren ihtiyaç yok."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","bagimliliklar":["N-K03-010"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-004","baslik":"Öğrenme odaklı çalışma kipi","ihtiyac":"Yeni başlayanlar veya yeni bir alana girenler için seçilebilen bir çalışma kipi: ajan çözümü doğrudan vermek yerine önce insanın tahmin etmesini veya denemesini ister, ipucu ve açıklama verir, kavramsal sorulara öncelik tanır ve kısa anlama kontrolleri yapar; kip kalite kapılarını atlatmaz ve kullanıldığı işler kapasite planında görünür.","cozulecek_sorun":"Yapay zekâ yardımı yeni bir kütüphaneyi öğrenenlerde kavramsal anlama, kod okuma ve hata ayıklamayı zayıflattı; bilişsel katılım içeren kullanım biçimleri öğrenmeyi korudu. Korumasız yapay zekâ öğrenmeyi düşürürken ipucu veren tasarım bu etkiyi büyük ölçüde giderdi.","yetenek_siniflari":["Y-53","Y-05","Y-08"],"zorunluluk":"kosullu","olcek_etkisi":"Yeni başlayan oranı ve ekip değişimi yüksek olan yapılarda (10+ ekip, yüksek devir) önemi artar.","kabul_olcutleri":["Öğrenme kipi rol ve iş türü bazında seçilebilir; kullanım oranı izleniyor.","Kipte çalışanların sonraki benzer işi yardımsız yapabilme başarısı ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-169","S-233","S-234","S-235"],"not":"Randomize deney: yapay zekâ kullanımı anlama, kod okuma ve hata ayıklamayı zayıflattı; altı etkileşim kalıbından üçü öğrenmeyi korudu (2026). Ajanla çalışan 54 öğrenci daha hızlı bitirdi ama kodu daha az anladı (2026). Lise matematiğinde saha deneyinde ipucu veren korumalı sürüm olumsuz etkiyi azalttı (PNAS 2025). Benzer mevcut ihtiyaç: N-K25-005; fark: N-K25-005 ajanların sınırları ve güvenli kullanım üzerine eğitim istiyor; günlük iş içinde öğrenmeyi koruyan bir çalışma biçimi tanımlamıyor."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K25-005"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-005","baslik":"İnsanlara ayrılmış gelişim işleri ve çıraklık yolu","ihtiyac":"Ajanın yapabileceği işlerin bir bölümünün bilinçli olarak insan gelişimi için ayrılması (hata ayıklama, küçük tasarım kararları, giriş düzeyi işler); bu işlerde ajanın yapan değil öğreten ve eşlik eden olması; kıdemli–yeni başlayan eşleştirmesiyle ajan çıktısının birlikte incelenmesi; yeni başlayandan kıdemliye yetkinlik basamaklarının ve her basamakta gereken deneyimlerin tanımlanması; ayrılan işlerin kapasite planında görünmesi.","cozulecek_sorun":"Yapay zekâya en açık mesleklerde 22–25 yaş istihdamı göreli olarak geriledi; yeni başlayanların uzmanlığın oluştuğu verimli zorlanmayı yitirdiği ve havacılık ile nükleerde olduğu gibi deneyimlerin bilinçli korunması gerektiği savunuluyor. İşin ajana uygunluğu yalnız riske göre sınıflanıyor; gelişim için ayırma yok. Dönemsel tatbikat günlük iş içinde yetkinlik oluşumunu sağlamaz.","yetenek_siniflari":["Y-53","Y-32","Y-39"],"zorunluluk":"zorunlu","olcek_etkisi":"Etkisi yıllar içinde ortaya çıkar; 10+ ekipte uzmanlık yolu kurursa gözetim kapasitesi bütün program için çöker.","kabul_olcutleri":["Gelişim için ayrılan iş oranı ekip bazında tanımlı ve izleniyor.","Yetkinlik basamakları ve her basamağın deneyim gereksinimleri yazılı.","Kıdemli–yeni başlayan ortak incelemelerinin sıklığı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-236","S-237","S-238","S-239"],"not":"Bordro verisiyle: yapay zekâya açık mesleklerde 22–25 yaş istihdamı göreli %13, yazılım geliştiricilerde yaklaşık %20 geriledi (2025). 14 görüşmeyle yeni başlayanların verimli zorlanmayı yitirdiği ve deneyimlerin korunması gerektiği (AIES 2026). Bir yapay zekâ şirketinin iç çalışmasında mühendisler mentorluk ve derin yetkinlik kaybından kaygılı (2025). Benzer mevcut ihtiyaç: N-K25-006; fark: N-K25-006 mevcut becerilerin korunması için dönemsel yapay zekâsız tatbikat istiyor; yeni becerilerin iş içinde oluşumu, gelişim işi tahsisi ve çıraklık yolu yok. N-K02-010 'yalnız insan' sınıfını yalnız risk için kullanıyor."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K25-006"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-006","baslik":"Yetkinliğe bağlı inceleme ve onay yetkisi","ihtiyac":"Bir modül veya alandaki ajan değişikliğini kimin onaylayabileceğinin yalnız rol sınıfına değil o alandaki gösterilmiş yetkinliğe (geçmiş incelemeler, alan deneyimi, değerlendirme) bağlanması; yetkinlik kanıtı olmayan onaylarda ikinci imza; yetkinlik kaydının dönemsel güncellenmesi.","cozulecek_sorun":"Karar hakları rol sınıfına bağlı; oysa ajan çıktısını denetlemek o alanın bilgisini gerektirir. Deneyimsiz kullanıcıların doğrulanmış başarısı deneyimlilerin yaklaşık yarısı; yeni başlayanlar ajan çıktısını anlamadan kabul etmeye eğilimli. Düzenleyici çerçeve gözetimin gerekli yetkinlik, eğitim ve yetkiye sahip kişilere verilmesini istiyor.","yetenek_siniflari":["Y-53","Y-25","Y-31"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça ekipler arası değişikliklerde (başka ekibin modülü) yetkinlik eşleşmesi zorlaşır; yetkinlik kaydı yönlendirme havuzunun temelidir.","kabul_olcutleri":["Alan bazında onay yetkisi yetkinlik kaydına bağlı; kanıtı olmayan onaylar ikinci imzaya düşüyor.","Yetkinlik kaydı gözden geçirme periyodu tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-183","S-240","S-157","S-239"],"not":"Kullanım analizinde doğrulanmış başarı yeni başlayanlarda ~%15, orta ve ileri düzeyde ~%28–33. Düzenleme (Madde 26/2): gözetim gerekli yetkinlik, eğitim ve yetkiye sahip kişilere verilmeli. Benzer mevcut ihtiyaç: N-K25-001; fark: N-K25-001 karar haklarını kişiden bağımsız rol sınıflarına bağlıyor; alan bazlı yetkinlik şartı ve ikinci imza kuralı yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K25-001"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-007","baslik":"Beceri körelmesinin iş akışı içi öncü göstergeleri","ihtiyac":"Dönemsel yapay zekâsız tatbikatlara ek olarak günlük işten türetilen öncü göstergeler: incelemede yazarın veya onaycının değişikliği kendi sözleriyle açıklayabilme oranı (örneklem), ajansız hata ayıklama süresi, olay çözümünde ajana bağımlılık, kısa anlama kontrolleri; göstergelerin ekip düzeyinde ve gizliliği koruyarak raporlanması.","cozulecek_sorun":"Dönemsel tatbikat seyrek ve yapay; körelme günlük işte fark edilmeden birikir. Yapay zekâya güven arttıkça eleştirel düşünme azalıyor; ajanla çalışanlar kodu daha az anlıyor ama yine de ajanı tercih ediyor; izleyici konumundaki insanın becerisi, devralması gereken anda zayıflamış olur.","yetenek_siniflari":["Y-53","Y-29","Y-27"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Etki aylar içinde birikir; başlangıç değeri pilot başında alınmazsa sonradan kıyas yapılamaz.","kabul_olcutleri":["En az iki öncü gösterge tanımlı ve ekip düzeyinde zaman serisi olarak izleniyor.","Göstergelerin bireysel performans değerlendirmesinde kullanılmayacağı yazılı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-222","S-233","S-241","S-169"],"not":"Otomasyonun ironileri: izleyen operatörün becerisi devralma anında zayıflamış olur (1983). Bilgi çalışanlarında yapay zekâya güven eleştirel düşünmeyle ters ilişkili (CHI 2025). Benzer m
