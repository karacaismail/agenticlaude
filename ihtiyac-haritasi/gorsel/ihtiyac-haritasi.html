nlu","kabul_olcutleri":["Altı tipin her biri için içerikli kural seti var.","Her görevde tip ve etkin kural setleri kayıtlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-042","S-018","S-028"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["C-017","D-007","G-030"],"kume":"K03","alan":"A-deger-akisi"},{"id":"N-K03-006","baslik":"Ön yüz–arka uç sözleşmesinin önceden yazılması ve iki tarafta doğrulanması","ihtiyac":"Ekranın sunucudan ne isteyeceğinin ve sunucunun ne döneceğinin kodlamadan önce yazılması; paralel çalışan iki tarafın aynı sözleşmeyle doğrulanması; birleşimden sonra gerçek entegrasyon testi.","cozulecek_sorun":"İki taraf paralel çalışınca arayüz uyuşmazlığı son aşamada ortaya çıkıyor.","yetenek_siniflari":["Y-20"],"zorunluluk":"zorunlu","kabul_olcutleri":["Tam yığın işlerde sözleşme dosyası kodlamadan önce var.","Sözleşme testi iki tarafta da geçiyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-042","S-018"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K03","alan":"A-deger-akisi"},{"id":"N-K03-007","baslik":"Olgunluk seviyesinin belirlenmesi ve kapsamın ona göre sınırlanması","ihtiyac":"Çözümün hedef olgunluk seviyesinin belirlenmesi, seviye dışı kapsamın engellenmesi ve bir sonraki seviyeye geçişi engelleyecek teknik borcun işaretlenmesi; seviye kriterlerinin ve seviyeyi kimin belirlediğinin tanımlanması.","cozulecek_sorun":"Deneme aşamasında kurumsal karmaşıklık kuruluyor ya da tersine kurumsal üründe geçici çözüm bırakılıyor. Seviye listesi kaynaklar arasında farklı (3 ve 4 seviye); seviyeyi kimin belirlediği yazılmamış.","yetenek_siniflari":["Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her görevde seviye etiketi ve teknik borç kaydı var.","Seviye tanımları ve geçiş kriterleri tek ve yazılı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-039","S-018","S-028"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["C-016","D-008","G-030","Q-022"],"kume":"K03","alan":"A-deger-akisi"},{"id":"N-K03-008","baslik":"Teknoloji sınırı kapısı","ihtiyac":"Yeni teknoloji, çerçeve, paket veya kalıp eklemeden önce mevcut çözümün, kod tabanı uyumunun, yeterliliğin ve gerekçenin kontrol edilmesi; çözülmüş problem için ikinci teknoloji eklenmemesi; onaylayan rolün tanımlanması.","cozulecek_sorun":"Teknoloji yığını şişiyor; aynı problem için iki çözüm oluşuyor. Kaynakta gerekçe belgesini kimin onaylayacağı yazmıyor.","yetenek_siniflari":["Y-09","Y-21"],"zorunluluk":"zorunlu","kabul_olcutleri":["Gerekçe belgesi ve onayı olmayan bağımlılık eklenemez.","Aynı işlevi gören yinelenen bağımlılık sayısı 0."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-040","S-022"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["Q-023"],"kume":"K03","alan":"A-deger-akisi"},{"id":"N-K03-009","baslik":"Mimari kararlara ajan erişimi","ihtiyac":"Geçerli mimari karar kayıtlarının, arayüz sözleşmelerinin ve tasarım sisteminin ajanların görev bağlamında bulunabilmesi.","cozulecek_sorun":"Ajan kurum standardını ve geçmiş kararları bilmeden, onlarla çelişen çözüm üretiyor.","yetenek_siniflari":["Y-37","Y-15"],"zorunluluk":"zorunlu","kabul_olcutleri":["Görev bağlamında ilgili karar kayıtları listeleniyor.","Karar kaydıyla çelişen değişiklik işaretleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-053","S-038","S-103"]},"cember":"ic_bosluk","belirsizlik":"orta","kume":"K03","alan":"A-deger-akisi"},{"id":"N-K03-010","baslik":"Kod tabanının mevcut paradigmasına uyum","ihtiyac":"Kod tabanının paradigmasının ve konvansiyonlarının tespit edilip uyulması; paradigma dışı kalıpların zorlanmaması.","cozulecek_sorun":"Ajan, kod tabanına yabancı kalıplar getiriyor ve tutarsız bir yapı oluşuyor.","yetenek_siniflari":["Y-14","Y-08"],"zorunluluk":"zorunlu","kabul_olcutleri":["Paradigma tespiti görev kaydında yer alıyor.","Konvansiyon ihlali bulguları raporlanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-047"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K03","alan":"A-deger-akisi"},{"id":"N-K03-011","baslik":"Arayüz sürümleme, geriye uyumluluk ve veri şeması evrimi","ihtiyac":"Arayüzlerin sürümlenmesi, geriye uyumluluk kuralı ve veri şeması değişikliklerinin göç (migration) planıyla tasarlanması.","cozulecek_sorun":"Kaynaklar göçü yalnız doküman ve boşluk alanı olarak anıyor; şema evrimi ve geriye uyumluluk sahipsiz.","yetenek_siniflari":["Y-20","Y-34"],"zorunluluk":"kosullu","kabul_olcutleri":["Arayüz değişikliğinde uyumluluk etkisi kayıtlı.","Şema değişikliği göç ve geri alma planıyla birlikte geliyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-032","S-038"]},"cember":"dis_eksik","belirsizlik":"orta","kume":"K03","alan":"A-deger-akisi"},{"id":"N-K03-012","baslik":"Ekipler arası tüketici odaklı sözleşmeler ve kullanımdan kaldırma politikası","ihtiyac":"Ekiplerin sunduğu arayüz ve olay şemaları için tüketicilerin beklentilerini ifade eden sözleşme testlerinin sağlayıcının hattında engelleyici olarak koşması; olay şemaları için ileri ve geri uyumluluk kuralı ve merkezi şema kaydı; kullanımdan kaldırma politikası (duyuru, geçiş süresi, kullanım ölçümü, kapanış); belgelenmemiş ama gözlenebilir davranış değişikliklerinin (sıralama, hata metni, zamanlama) tüketiciler için risk olarak işaretlenmesi.","cozulecek_sorun":"Anlamsal sürümlemeye rağmen küçük sürüm yükseltmelerinin önemli bir kısmı kırıcıdır ve tüketiciler belgelenmemiş davranışa da bağımlıdır. Ajanlar 'iyileştirme' yaparken gözlenebilir davranışı değiştirip başka ekibi kırabilir. K03-006 tek işteki ön yüz–arka uç sözleşmesini, K03-011 genel sürümlemeyi kapsar.","yetenek_siniflari":["Y-20","Y-34","Y-37"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Tüketici sayısı arttıkça kırıcı değişikliğin etki alanı büyür; 10+ ekipte merkezi şema kaydı olmadan uyumluluk izlenemez.","kabul_olcutleri":["Ekipler arası her arayüzde tüketici sözleşme testi sağlayıcı hattında engelleyici.","Olay şeması değişiklikleri uyumluluk kontrolünden geçmeden yayımlanamıyor.","Kullanımdan kaldırılan her arayüz için kalan tüketici sayısı ölçülüyor ve kapanış tarihi var.","Ortak sözleşme, terim veya varsayım değiştiğinde etkilenebilecek tüketiciler ve geçersizleşebilecek kabul kanıtları listeleniyor; bir ekibin yerel 'bitti' durumu birleşik ürün kabulü sayılmıyor.","Karşı ekibin yanıt vermemesi yeni sözleşmenin kabulü sayılmıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-366","S-368","S-369","S-361","S-095","S-388"],"not":"Büyük sürüm dışı yükseltmelerin %20,1'i kırıcı değişiklik içeriyor. 2024 küresel olayında şablonun tanımladığı 21 alan ile tüketici kodun sağladığı 20 alan arasındaki uyuşmazlık, sözleşme uyumsuzluğunun etkisini gösteriyor. Benzer mevcut ihtiyaç: N-K03-011; fark: K03-011 sürümleme ve geriye uyumluluk kuralını genel olarak ister; ekipler arası tüketici sözleşmesi, olay şeması uyumluluğu ve kullanımdan kaldırma yaşam döngüsü tanımlı değil."},"cember":"ic_bosluk","belirsizlik":"dusuk","olcek_esigi":"2+ ekip","bagimliliklar":["N-K03-011"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T09; ihtiyac-kumeleri/kumeler/01_amac_ve_ortak_anlayis/02_insan_ekip_ve_yonetisim.json#I02-02","dogrulama":"kismen","kaynak_url":["https://scrumguides.org/scrum-guide.html"],"ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-095, S-388 eklendi; mevcut metin değiştirilmedi.","kume":"K03","alan":"A-deger-akisi"},{"id":"N-K04-001","baslik":"Davranış başına en küçük değişiklik","ihtiyac":"Tek bir davranışın tek, doğrulanabilir adımda uygulanması; testleri geçirecek en küçük kodun yazılması.","cozulecek_sorun":"Büyük ve doğrulanamayan değişiklikler inceleme kapasitesini ve geri almayı zorlaştırıyor.","yetenek_siniflari":["Y-05"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her değişiklik bir kabul kriteri/davranış kimliğine bağlı.","Davranış başına değişiklik boyutu izleniyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007","S-052"]},"cember":"ic_tanimli","belirsizlik":"dusuk","bagimliliklar":["N-K05-001"],"kume":"K04"," kisi"},{"id":"N-K05-016","baslik":"Yapay zekâ denetçisinin sınırları ve kalibrasyonu","ihtiyac":"Yapay zekâ denetçisinin yazardan farklı model ailesinden ve ayrı oturumda çalışması; çoklu deneme; cevabı bilinen kalibrasyon setiyle düzenli ölçülmesi; sıra/uzunluk/kendi ailesini kayırma yanlılıklarının kontrolü; kalibrasyon düşerse onay yetkisinin askıya alınması; yanlış alarm maliyetinin ölçülmesi.","cozulecek_sorun":"Yapay zekâ hakemi yanlı; model güncellemesiyle sessizce geriliyor; farklı model eklemek bağımsız şartname sağlamıyor.","yetenek_siniflari":["Y-29","Y-07"],"zorunluluk":"kosullu","kabul_olcutleri":["Denetçinin kalibrasyon sonucu eşik altındaysa onay yetkisi otomatik askıda.","Duyarlılık ve yanlış alarm oranı birlikte raporlanıyor.","Birden fazla ajan veya denetçinin aynı beklentiyi tekrarlaması bağımsız kanıt sayılmıyor; ortak varsayıma dayanan uzlaşı ayrıca işaretleniyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-003","S-028","S-140","S-095"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["A-009","C-021","C-029","D-011","U-025"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T04; ihtiyac-kumeleri/kumeler/04_dogruluk_ve_urun_nitelikleri/01_oracle_test_ve_kanit.json#I11-09","dogrulama":"kismen","kaynak_url":["https://arxiv.org/abs/2306.05685"],"ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-095 eklendi; mevcut metin değiştirilmedi.","kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-017","baslik":"Arayüz doğrulama: görsel referans yönetimi","ihtiyac":"Görsel karşılaştırmanın 'değişim alarmı' olarak ele alınması; referansın bağlamıyla (görüntü alanı, yazı tipi, veri, tema, etkileşim) saklanması; ortam parmak izi değişince referansın geçersiz sayılması; referansların periyodik ve hedef değişince yeniden onaylanması; kritik bölge ve oran aralığı doğrulamaları; eşik/maskenin ölçülmüş yanlış alarm/kaçırma oranıyla seçilmesi.","cozulecek_sorun":"Kusurlu ilk referans sonsuza dek korunuyor; tam sayfa eşiği ince kusurları gizliyor; maske içerik kaybını örtüyor.","yetenek_siniflari":["Y-23"],"zorunluluk":"kosullu","kabul_olcutleri":["Onaysız referans oracle sayılmıyor.","Her eşik için yanlış alarm/kaçırma ölçüm belgesi var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-002","S-003"],"not":"Onayın geçerlilik süresi ve kimin yenileyeceği kaynaklarda netleşmemiş."},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["A-006","C-027","C-028","R-003"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-018","baslik":"Gerçek cihaz kabul kapısı ve cihaz/tarayıcı matrisi","ihtiyac":"Yayından önce kritik kullanıcı yolculuklarının gerçek cihazda doğrulanması; yazılı cihaz/işletim sistemi/tarayıcı matrisi; dinamik durumlar (ekran yönü, klavye açılması, güvenli alan, dinamik görüntü alanı, yazı tipi yükleme), fiziksel dokunma ve hesaplanmış etkileşim hedefi ölçümü.","cozulecek_sorun":"Headless ortam dokunma gecikmesini, yazı tipi yüklemesini, çentiği ve adres çubuğunu yansıtmıyor.","yetenek_siniflari":["Y-23"],"zorunluluk":"kosullu","kabul_olcutleri":["Kritik yolculukta cihaz kanıtı yoksa yayın yok.","Cihaz matrisi yazılı ve sahibi var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-003"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["A-006","Q-029"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-019","baslik":"Erişilebilirlik doğrulaması","ihtiyac":"Yapısal erişilebilirlik kontrollerinin kapıda derlemeyi kırması; odak sırasının ölçülmesi; standart ölçütlerde makine ve insan payının alt kontrol düzeyinde ayrılması ve her ölçüt için uygulanabilirlik kaydı; kontrastla birlikte hesaplanan yazı ağırlığı/boyutunun ve algısal okunabilirliğin insanla onaylanması.","cozulecek_sorun":"Otomatik araçlar erişilebilirliğin yalnız bir kısmını yakalıyor; 'skor 100 = uyum' yanılgısı yaygın; kontrastı geçen metin silik kalabiliyor.","yetenek_siniflari":["Y-23"],"zorunluluk":"kosullu","kabul_olcutleri":["Hedef uyum düzeyindeki her ölçüt için makine/insan kanıtı kayıtlı.","Adı boş etkileşimli öğe 0."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-003","S-132"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["C-037","U-027"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-020","baslik":"İçerik doğruluğunun yetkili kaynakla eşlenmesi","ihtiyac":"Fiyat, isim, tutar gibi kritik verinin ekranda yetkili kayıt sistemiyle uçtan uca eşlenmesi; modelin belleğinin oracle sayılmaması.","cozulecek_sorun":"Dil modeli uydurma değer üretiyor; ekranda görünmek doğru olmak demek değil.","yetenek_siniflari":["Y-20"],"zorunluluk":"kosullu","kabul_olcutleri":["Kritik alanların %100'ü yetkili kaynakla eşli; uyuşmazlık yayını durduruyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-003"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-021","baslik":"Örtük oracle katmanı","ihtiyac":"Çökme, istisna, konsol ve ağ hatası, zaman aşımı ve bariz performans bozulmasının her kritik akışta otomatik yakalanması.","cozulecek_sorun":"Beklenti yazılmamış bariz hatalar kaçıyor.","yetenek_siniflari":["Y-20","Y-27"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kritik akışta konsol/ağ hatası 0.","Kritik akışlarda tohumlu rastgele etkileşim keşfi örtük oracle ile koşuyor; bulunan hata aynı tohum ve eylem kaydıyla yeniden üretilebiliyor; rastgele keşif tek başına iş kabulü yerine geçmiyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-004","S-003","S-096"]},"cember":"ic_tanimli","belirsizlik":"dusuk","codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#pdf_topic_coverage/F09","dogrulama":"kismen","ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-096 eklendi; mevcut metin değiştirilmedi.","kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-022","baslik":"Kusur sınıfı → doğrulayıcı ve risk → test kümesi eşlemesi","ihtiyac":"Her kusur sınıfı için hangi doğrulayıcının (makine, yapay zekâ, insan) ne düzeyde güvenilir olduğunun ve risk sınıfına göre hangi ek doğrulamaların zorunlu olduğunun tablolaştırılması.","cozulecek_sorun":"'Riske göre seç' deniyor ama eşleme tanımlı değil; 'test yeşil' ile 'kanıt yeterli' arasındaki bağ görünmüyor.","yetenek_siniflari":["Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her risk sınıfı için zorunlu doğrulama kümesi yazılı.","Kapanan kusurlarda kayıt şablonunun tüm alanları dolu."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-003","S-007"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["C-029","D-011"],"bagimliliklar":["N-K21-001"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-023","baslik":"Kalite eşiklerinin sayısal tanımı","ihtiyac":"Test gücü skoru, performans bütçesi, güvenlik bulgu seviyesi, erişilebilirlik uyum düzeyi, görsel fark eşiği, hakem kalibrasyon eşiği gibi kapı eşiklerinin sayısal ve sürümlü tanımlanması.","cozulecek_sorun":"Kapılar var ama eşikleri yok; aynı kapı ekipten ekibe farklı uygulanıyor.","yetenek_siniflari":["Y-35","Y-09"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça portföy/ART/ekip katmanlı eşik yönetimi gerekir (alt katman yalnız sıkılaştırabilir).","kabul_olcutleri":["Her kapının eşiği sürümlü yapılandırmada tanımlı ve koşu başında sabitleniyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-007","S-046"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-004","Q-028"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-024","baslik":"Arka uç, arayüz ve veri doğrulaması","ihtiyac":"Arka uç ve arayüzler için sözleşme testleri, veri bütünlüğü, göç doğrulaması ve olay (event) sözleşmesi kontrollerinin oracle kapsamına alınması.","cozulecek_sorun":"Oracle kaynakları büyük ölçüde ön yüz odaklı; arka uç ve veri oracle'ı yalnız dolaylı geçiyor.","yetenek_siniflari":["Y-20","Y-22"],"zorunluluk":"zorunlu","kabul_olcutleri":["Arka uç işlerinde sözleşme ve veri bütünlüğü kanıtı zorunlu.","Arayüzden yapılan işlemin kalıcı veri deposuna doğru yansıdığı ve tekrarında çift kayıt oluşmadığı uçtan uca doğrulanıyor; ekran görüntüsü tek başına veri etkisinin kanıtı sayılmıyor."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-001","S-030","S-096"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-021"],"codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#pdf_topic_coverage/F10","dogrulama":"kismen","ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-096 eklendi; mevcut metin değiştirilmedi.","kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-025","baslik":"İnsan davranış kabulü","ihtiyac":"Ürün davranışının gösterim ortamında insan tarafından kabul edilmesi ve reddin doğru aşamaya (inceleme veya spesifikasyon) dönmesi.","cozulecek_sorun":"Şartnameye uyan ama istenmeyen ürün çıkıyor. Kaynaklar insan testinin nerede yapılacağında çelişiyor (tüm testler geliştirme ortamında mı, gösterim ortamında insan testi mi?).","yetenek_siniflari":["Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["İnsan kabulü olmadan yayın yok.","İnsan kabulünün yapıldığı ortam tek ve yazılı.","İnsan kabul testi en az pozitif ve negatif senaryoları, kritik kullanıcı yolculuklarını, rastgele etkileşimle keşif testini ve arayüz işleminin kalıcı veriye yansıyıp yansımadığının kontrolünü kapsıyor; kontrol listesi dışında kalan bulgular ('başka?') ayrıca kaydediliyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-010","S-013","S-006","S-030","S-096"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["C-002","D-005","G-019","Q-016"],"bagimliliklar":["N-K06-004"],"codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#pdf_topic_coverage/F07,F08,F09,F10,F11","dogrulama":"dogrulandi","ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-096 eklendi; mevcut metin değiştirilmedi.","kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-026","baslik":"Kanıt paketi","ihtiyac":"Kabul kriteri sürümü, test kimlikleri ve sürümü, revizyon kimliği, paket özeti, test raporları, iz ve log bağlantılarından oluşan paketin iş kalemine bağlanması.","cozulecek_sorun":"'Tamam' iddiası denetlenemiyor; yayına neyin gittiği izlenemiyor.","yetenek_siniflari":["Y-28","Y-27"],"zorunluluk":"zorunlu","kabul_olcutleri":["Bitti durumundaki her işte doğrulanabilir özetli kanıt paketi var.","Paket özeti olmadan yayın reddediliyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-027","baslik":"Tek tamamlanma tanımı (DoD)","ihtiyac":"Boşluk analizi, dokümantasyon, bağımlılık kontrolü, yeşil testler, bağımsız kalite kontrolü gibi 'bitti' kapılarının tek bir DoD kontrol listesinde birleşmesi ve DoD sahibinin tanımlanması.","cozulecek_sorun":"Bitti kuralları beş ayrı role dağılmış; hazır olma için bir kapı var ama bitti için eşdeğer tek bir kapı yok. Boşluk analizi rolü diğer rollerin çıktısını yeniden denetliyor.","yetenek_siniflari":["Y-09","Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Tek DoD listesi var ve tüm kapılar çıktısını ona yazıyor.","Boşluk analizi tek başına işi bitti yapamaz."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-032","S-038","S-051","S-018"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["C-026","D-022","G-017","H-06"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-028","baslik":"Teslim öncesi boşluk analizi","ihtiyac":"Hedef durumun spesifikasyon ve kabul kriterlerinden çıkarılıp mevcut durumla özellik, test, yetki, göç, doküman, kullanıcı deneyimi, izleme ve işletim alanlarında karşılaştırılması; açık boşluk varken bitti verilmemesi.","cozulecek_sorun":"Göç, izleme ve işletim eksikleri teslimden sonra ortaya çıkıyor.","yetenek_siniflari":["Y-06"],"zorunluluk":"zorunlu","kabul_olcutleri":["Bitti işaretli işlerde açık boşluk 0."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-032","S-018"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["C-026","D-022","G-017"],"bagimliliklar":["N-K05-027"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-029","baslik":"Başlangıç test sağlığı","ihtiyac":"Görev başında ilgili mevcut testlerin çalıştırılması; önceden bozuk test ve altyapı hatasının yeni işin hatası sayılmaması.","cozulecek_sorun":"Önceden kırmızı olan test yeni göreve yükleniyor ve bütçe haksız tüketiliyor.","yetenek_siniflari":["Y-20","Y-18"],"zorunluluk":"zorunlu","kabul_olcutleri":["Başlangıç test raporu her koşuda saklanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["A-007","Q-040"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-030","baslik":"Kritik bileşenlerde biçimsel belirtim, model denetimi ve çalışma zamanı değişmezleri","ihtiyac":"Eşzamanlılık protokolleri, dağıtık koordinasyon, para ve bakiye hesapları, yetkilendirme mantığı ve durum makineleri gibi kritik bileşenlerde hafif biçimsel belirtim (durum makinesi, değişmez, ön ve son koşul) yazılması ve model denetimi ya da makinece denetlenen ispatla doğrulanması; belirtimin insan tarafından onaylanması; ajanın ürettiği ispatın bağımsız denetleyicide yeniden doğrulanması; belirtimin boş veya anlamsız olmadığının (belirtim bozulunca ispatın kırılması) denetlenmesi; kritik değişmezlerin (para korunumu, çift işlem yok, sıralama) üretimde çalışma zamanı izleyicisiyle de denetlenmesi.","cozulecek_sorun":"Test, eşzamanlılık ve arıza sıralamasına bağlı nadir hataları yakalayamaz; büyük kesintilerin bir kısmı yarış durumlarından doğar. Ajanlar biçimsel doğrulamada hızla ilerliyor ama depo ölçeğinde hâlâ sınırlı; zayıf belirtimi geçen ispat ise sahte güven üretir.","yetenek_siniflari":["Y-67","Y-22","Y-27"],"zorunluluk":"kosullu","olcek_etkisi":"Ekip sayısından çok kritik bileşen sayısına bağlıdır; ortak belirtim kütüphanesi ve uzmanlık havuzu birkaç ekipte paylaşılabilir.","kabul_olcutleri":["Kademe 0 ve 'biçimsel yöntem gerektirir' etiketli bileşenlerin listesi ve her biri için onaylı belirtim ile doğrulama sonucu var.","Model denetimi veya ispat sonucu bağımsız denetleyiciden geliyor; ajan beyanı kabul edilmiyor.","Kritik değişmezler üretimde izleniyor ve ihlal olay açıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-352","S-353","S-354","S-355"],"not":"Bir bulut sağlayıcısı 10 büyük sistemde biçimsel belirtim ve model denetimiyle başka yolla bulunamayacak hatalar bulduğunu raporladı. 12.504 belirtimli 2025 kıyaslamasında başarı dillere göre %27–%82; 2026 depo ölçekli kıyaslamada en iyi ajan 43 örneğin 27'sini tam çözdü, en zorlarında hiç belirtim kapatamadı. 2025 bölge kesintisinin kök nedeni bir yarış durumuydu. Benzer mevcut ihtiyaç: N-K05-011; fark: K05-011 özellik tabanlı, metamorfik doğrulama ve önceki sürümden değişmez çıkarımını kapsar; önceden yazılmış biçimsel belirtim, model denetimi, ispat doğrulama ve üretimde değişmez izleme yok. Koşul: kademe 0 kritik algoritma veya dağıtık koordinasyon içeren ürünler."},"cember":"ic_bosluk","belirsizlik":"yuksek","bagimliliklar":["N-K05-011"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K05-031","baslik":"Kabul kanıtının geçerlilik bağlamı ve koşul değişince yeniden açılması","ihtiyac":"Her kabul kanıtının; dayandığı ihtiyaç ve kabul kriteri sürümü, incelenen çıktı, kullanılan kural/yetenek paketi/model sürümü, erişilebilen bilgi, yetki ve etkili dış koşullarla birlikte kaydedilmesi. Bu koşullardan biri değiştiğinde (kod aynı kalsa bile) kanıtların 'etkilenmedi', 'yeniden değerlendirilmeli' ve 'artık kullanılamaz' olarak ayrılması; yeniden inceleme bitene kadar eski kanıtın hangi sınırlı kullanımda geçerli kaldığının açık olması.","cozulecek_sorun":"Kanıt yalnız kod revizyonuna bağlanırsa model, iş kuralı, yönerge, yetki veya dış sistem değiştiğinde eski kabul kendiliğinden sürer; tersine, her küçük değişiklik bütün kanıtı gerekçesiz sıfırlarsa doğrulama yükü taşınamaz hale gelir.","yetenek_siniflari":["Y-28","Y-43","Y-29"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça ortak kural, model ve arayüz değişikliklerinin başka ekiplerin kabul kanıtını etkileme olasılığı artar; kanıt–koşul bağı ekipler arası görünür olmalıdır.","kabul_olcutleri":["Her kanıt paketinde ihtiyaç/kriter sürümü, çıktı kimliği, kural–yetenek paketi–model sürümleri ve etkili dış koşullar kayıtlı.","Model, kural veya iş kuralı değişikliğinden sonra etkilenen kanıtlar listelenebiliyor; kod değişmedi gerekçesiyle kabul otomatik sürmüyor.","Önemsiz değişiklikler bütün kanıtı sıfırlamıyor; her yeniden açma kararında değişiklik–kanıt ilişkisi ve etkisi açıklanıyor.","Etkisi bilinmeyen bir koşul değişikliği tamamlanmış doğrulama gibi raporlanmıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-095","S-375","S-377"],"not":"Ölçüm çerçevesi değerlendirmenin kullanım koşullarına yakın yapılmasını ve genellenebilirlik sınırının belgelenmesini ister; köken modeli türeme, revizyon ve geçersizleşmeyi ayrı ilişkiler olarak tanımlar. Benzer mevcut ihtiyaçlar: N-K06-003 (yalnız revizyon değişince eski yeşilin geçersizliği), N-K13-009 (koşu başında sabitleme), N-K23-010 (değişiklik öncesi regresyon). Fark: kod dışı koşul değişiminin mevcut kabul kanıtını hangi ölçüde geçersizleştirdiği tanımlı değildi."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K05-026","N-K13-009"],"iliskili":["G-036","Q-072"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T21; ihtiyac-kumeleri/kumeler/01_amac_ve_ortak_anlayis/03_ihtiyac_ifadesi_ve_kabul.json#I03-04","dogrulama":"kismen","kaynak_url":["https://airc.nist.gov/airmf-resources/playbook/measure/","https://www.w3.org/TR/prov-dm/"],"kume":"K05","alan":"A-deger-akisi"},{"id":"N-K06-001","baslik":"Güvenli sürüm kontrolü işlemleri","ihtiyac":"İşlem öncesi dal, çalışma ağacı ve uzak durumun kontrolü; kullanıcı değişikliklerinin korunması; depo kurallarının uygulanması; silme, üzerine yazma ve zorla gönderme gibi yıkıcı işlemlerin açık insan izni olmadan yapılmaması; geçmişin korunması.","cozulecek_sorun":"Kullanıcı işinin kaybolması ve geçmişin bozulması; kaydedilmiş ajan olaylarında dondurma sırasında üretim verisinin silinmesi.","yetenek_siniflari":["Y-33","Y-09","Y-42"],"zorunluluk":"zorunlu","kabul_olcutleri":["İzinsiz yıkıcı işlem sayısı 0.","Yıkıcı işlem isteği önce deneme çalıştırması ve insan onayı gerektiriyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-037","S-062","S-149"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["Q-024"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-002","baslik":"Paralel değişikliklerin birleştirilmesi ve birleştirme kuyruğu","ihtiyac":"Paralel ajanların ve ekiplerin değişikliklerinin sıralı bir birleştirme kuyruğundan geçmesi; çakışma tahmini; çakışma çözümünün sahibi.","cozulecek_sorun":"Ajan değişikliklerinde birleştirme çakışması sık; tek görev ölçeğinde düşünülmüş 'ana dal ilerledi' kuralı çok ekipte kuyruğu tıkar.","yetenek_siniflari":["Y-33","Y-38"],"zorunluluk":"olcege_bagli","olcek_etkisi":"1–2 ekipte basit sıralama yeter; 10+ ekipte kuyruk ve çakışma tahmini zorunlu.","kabul_olcutleri":["Çakışma oranı ve kuyruk bekleme süresi ölçülüyor.","Çakışma çözümünün sahibi tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-006","S-018","S-119"]},"cember":"ic_bosluk","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["R-015","U-007"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-003","baslik":"Birleşim sonrası yeniden doğrulama","ihtiyac":"Güncel ana dalla birleşik tam revizyonun yeniden test edilmesi; revizyon değişince eski yeşilin geçersiz sayılması; teslim edilen paketin revizyonunun kanıttaki revizyonla aynı olması.","cozulecek_sorun":"Ana dal ilerleyince eski kanıt geçersiz kalıyor ama kullanılmaya devam ediyor.","yetenek_siniflari":["Y-33","Y-20"],"zorunluluk":"zorunlu","kabul_olcutleri":["Teslim edilen paketin revizyon kimliği kanıttakiyle birebir aynı.","İnsanın incelediği gösterim veya önizleme ortamındaki sürüm kimliği kanıt paketindeki revizyonla aynı; ortak önizleme adresi başka bir sürüme geçtiğinde bu durum inceleyene görünür."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-062","S-095"]},"cember":"ic_tanimli","belirsizlik":"dusuk","codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#do_not_add_or_assume; research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.md","dogrulama":"kismen","ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-095 eklendi; mevcut metin değiştirilmedi.","kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-004","baslik":"Test ortamı ile teslim ortamlarının ayrımı","ihtiyac":"Tüm otomatik testlerin geliştirme ortamında koşması; üst ortamların teslim ve sunum ortamı olması; üst ortamda bulunan sorunun bağlantılı işle geliştirme ortamında yeniden üretilmesi; insan kabul testinin hangi ortamda yapılacağının tek biçimde tanımlanması.","cozulecek_sorun":"Test ve yayın ortamları karışıyor. Kaynaklar çelişiyor: 'üst ortamlar test ortamı değildir' ile 'gösterim ortamında insan testi'.","yetenek_siniflari":["Y-34","Y-19"],"zorunluluk":"zorunlu","kabul_olcutleri":["Yayın ortamında koşan kabul testi 0 (ya da insan kabulü için tanımlı tek istisna).","Her sunum bulgusu bağlantılı işe dönüşüyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007","S-010","S-013"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["C-002","D-005","G-019","Q-016"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-005","baslik":"Mevcut yayın hattına kanıtla devir","ihtiyac":"Doğrulanmış paketin 'yayına hazır' durumu, revizyon kimliği ve paket özetiyle mevcut yayın hattına devredilmesi; mevcut hattın değiştirilmemesi.","cozulecek_sorun":"Ajan hattı mevcut sürekli teslim sürecini bozabilir.","yetenek_siniflari":["Y-34","Y-28"],"zorunluluk":"zorunlu","kabul_olcutleri":["Mevcut yayın hattı yapılandırmasında değişiklik 0.","Devredilen her paketin kanıt paketi var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-062"],"not":"Mevcut yayın hattının ve ortamların var olduğu bir varsayımdır."},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["A-001","Q-008"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-006","baslik":"Ortam terfi zincirinin tek tanımı","ihtiyac":"Ortam zincirinin (erken erişim, beta, sürüm adayı, üretim veya hazırlık, kanarya, üretim) ve her geçişin ölçütünün tek biçimde tanımlanması.","cozulecek_sorun":"Kaynaklarda iki farklı zincir var; 'alpha sınırında' gibi ifadeler belirsiz.","yetenek_siniflari":["Y-34"],"zorunluluk":"zorunlu","kabul_olcutleri":["Ortam listesi, geçiş ölçütleri ve her geçişin sahibi yazılı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-010","S-013"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["A-001","C-003","D-005","G-019","Q-008","Q-017"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-007","baslik":"Birleştirme ve dağıtım yetkilerinin ayrılması, yayın hattının tek sahibi","ihtiyac":"Birleştirme ve dağıtım yetkilerinin ayrı olması; yayın hattının tek sahibinin olması.","cozulecek_sorun":"Kaynaklarda iki farklı otomasyon sistemi yayını sahipleniyor gibi görünüyor.","yetenek_siniflari":["Y-34","Y-25"],"zorunluluk":"zorunlu","kabul_olcutleri":["Yayın hattının sahibi ve yetki ayrımı karar kaydında yazılı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062","S-006"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["C-033","D-016","Q-008"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-008","baslik":"Geri alma, kademeli yayın ve özellik bayrağı","ihtiyac":"Ajan kaynaklı değişikliğin üretimde kademeli açılması, geri alma ölçütlerinin önceden tanımlanması ve özellik bayrağıyla riskin sınırlanması.","cozulecek_sorun":"Kaynaklarda yalnız 'bağlantılı hata aç' var; kademeli yayın ve geri alma ölçütü yok. Yapay zekâ kullanımı kararlılık metrikleriyle negatif ilişkili.","yetenek_siniflari":["Y-34"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Her yayında geri alma ölçütü ve yöntemi tanımlı.","Geri alma süresi ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-010","S-102"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"üretim","iliskili":["G-028"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-009","baslik":"Veri şeması göçünün güvenli yürütülmesi","ihtiyac":"Göçlerin ortamlar boyunca sıralı, geri alınabilir ve doğrulanabilir biçimde yürütülmesi.","cozulecek_sorun":"Kaynaklarda göç yalnız bir boşluk alanı ve doküman türü; yürütme ve geri alma sahipsiz.","yetenek_siniflari":["Y-34","Y-19"],"zorunluluk":"kosullu","kabul_olcutleri":["Her göçün geri alma yolu ve doğrulama kontrolü var."],"kanit":{"duzey":"cikarim","kaynaklar":["S-032"]},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K03-011"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K06-010","baslik":"SLO temelli otomatik kanarya ve ilerleme kararı","ihtiyac":"Kademeli yayında her adımın ilerleme veya geri alma kararının, SLO'ya bağlı göstergelerin kanarya ile kontrol grubu arasında istatistiksel karşılaştırmasına dayanarak otomatik verilmesi; aynı değerlendirmenin yapılandırma ve veri değişikliklerine de uygulanması; kararın kanıt paketine eklenmesi ve mevcut yayın hattına yalnız karar sinyali olarak bağlanması.","cozulecek_sorun":"Geri alma ölçütü önceden yazılsa da (K06-008) kararın insan gözlemine kalması ajan hacminde ölçeklenmez; küçük ama sürekli bozulmalar gözden kaçar.","yetenek_siniflari":["Y-34","Y-60","Y-27"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Günlük değişiklik sayısı arttıkça insan gözlemiyle kanarya değerlendirmesi imkânsızlaşır; ortak değerlendirme hizmeti gerekir.","kabul_olcutleri":["Kademe 0–1 hizmetlerde her kademeli yayın adımı SLO göstergelerine dayalı otomatik karar üretiyor.","Otomatik geri alınan yayınların oranı ve kaçırılan bozulmalar (sonradan olay olan yayınlar) ölçülüyor.","Karar ve dayandığı göstergeler kanıt paketinde."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-363","S-310"],"not":"Otomatik kanarya analiz hizmeti ikili, yapılandırma ve veri seti değişikliklerini SLO'ya bağlı göstergelerle değerlendirir ve çok sayıda olayı önlediği raporlanır. Benzer mevcut ihtiyaç: N-K06-008; fark: K06-008 kademeli yayını ve geri alma ölçütünün varlığını ister; ölçütün SLO'ya bağlı ve otomatik değerlendirilmesini tanımlamaz. Mevcut yayın hattı değiştirilmez; karar sinyali devir noktasına eklenir."},"cember":"ic_bosluk","belirsizlik":"orta","olcek_esigi":"üretim","bagimliliklar":["N-K06-008"],"kume":"K06","alan":"A-deger-akisi"},{"id":"N-K07-001","baslik":"Kodla eşzamanlı dokümantasyon","ihtiyac":"Kod değişikliğiyle aynı görevde tanıtım dokümanı, arayüz sözleşmesi, karar kaydı, göç notu, satır içi ve işletim dokümanlarının güncellenmesi; kod ile doküman çelişirken bitti verilmemesi.","cozulecek_sorun":"Doküman koddan kopuyor; ajanlar ve insanlar eski bilgiyle çalışıyor.","yetenek_siniflari":["Y-37"],"zorunluluk":"zorunlu","kabul_olcutleri":["Etkilenen her doküman aynı görevde güncellenmiş.","Kod–doküman çelişkisi varken bitti yok."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-038","S-028"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K07","alan":"A-deger-akisi"},{"id":"N-K07-002","baslik":"Dokümandaki iddiaların doğrulanması","ihtiyac":"Dokümandaki örnek komutların ve kullanım örneklerinin otomatik çalıştırılarak doğrulanması; var olmayan özelliğin yazılmaması.","cozulecek_sorun":"Doküman uydurma veya eskimiş bilgi içeriyor.","yetenek_siniflari":["Y-20","Y-37"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Dokümandaki komutlar otomatik doğrulamada çalışıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-028"]},"cember":"ic_tanimli","belirsizlik":"dusuk","olcek_esigi":"2+ ekip","kume":"K07","alan":"A-deger-akisi"},{"id":"N-K07-003","baslik":"Karar kayıtlarının yaşam döngüsü","ihtiyac":"Karar kayıtlarının nerede tutulacağının, kimin önereceğinin ve onaylayacağının, nasıl eskiyip yerini yenisine bırakacağının tanımlanması.","cozulecek_sorun":"Karar kaydı birçok kaynakta anılıyor ama yaşam döngüsü yok; teknoloji sınırı gerekçesi ile karar kaydı arasındaki bağ kurulmamış.","yetenek_siniflari":["Y-37"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her karar kaydının durumu (önerildi, kabul, yerini aldı) ve sahibi var."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-053","S-038","S-040"]},"cember":"ic_bosluk","belirsizlik":"dusuk","kume":"K07","alan":"A-deger-akisi"},{"id":"N-K07-004","baslik":"Örtük kurumsal bilginin yazıya dökülmesi","ihtiyac":"Ekiplerin bildiği ama yazmadığı kuralların, istisnaların ve alan bilgisinin ajanların kullanabileceği biçimde yazılması; bilgi tazeliğinin denetlenmesi.","cozulecek_sorun":"Ajan kurum standardını bilmiyor; eskimiş doküman ajanı yanıltıyor.","yetenek_siniflari":["Y-37","Y-08"],"zorunluluk":"zorunlu","kabul_olcutleri":["Sık tekrarlanan insan düzeltmelerinin yazılı kurala dönüşme oranı ölçülüyor.","Dokümanların son doğrulama tarihi izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-103","S-121"]},"cember":"dis_eksik","belirsizlik":"orta","kume":"K07","alan":"A-deger-akisi"},{"id":"N-K07-005","baslik":"Okunabilir sonuç raporu","ihtiyac":"Tamamlanan işin, değişikliğin ve test kanıtlarının insanların ve denetçilerin okuyabileceği kısa bir raporla iş kalemine yazılması; başarı durumunun gerçek çıkış kodundan gelmesi.","cozulecek_sorun":"Kanıt var ama insan okuyamıyor; ajan beyanı rapor sanılıyor.","yetenek_siniflari":["Y-11","Y-28"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her kapanışta rapor ve kanıt bağlantısı var.","Rapordaki durum çalıştırıcı sonucu ile aynı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-018","S-028"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["U-026"],"kume":"K07","alan":"A-deger-akisi"},{"id":"N-K07-006","baslik":"Terim sözlüğü ve kanonik adlandırma","ihtiyac":"Rol, durum, kapı ve artefakt adlarının tek sözlükte, tek yazımla tanımlanması.","cozulecek_sorun":"Aynı rol farklı belgelerde farklı adlarla yazılmış; 'sağlayıcı' terimi model sağlayıcı, ajan çalışma zamanı ve bağlayıcı anlamlarında karışık kullanılıyor.","yetenek_siniflari":["Y-37"],"zorunluluk":"zorunlu","kabul_olcutleri":["Tüm tanımlarda tek ad; otomatik ad denetimi."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-020","S-022","S-028","S-043"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["G-011"],"kume":"K07","alan":"A-deger-akisi"},{"id":"N-K07-007","baslik":"Kural ve talimat dili","ihtiyac":"Kural, talimat ve şablonların hangi dilde tutulacağının kararlaştırılması; Türkçe gereksinim ile İngilizce kod/doküman arasındaki geçişin tanımlanması.","cozulecek_sorun":"Kurallar karışık dilde; Türkçe anlama kalitesi doğrulanmamış.","yetenek_siniflari":["Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Dil politikası yazılı.","Türkçe gereksinimlerle yapılan görevlerde kalite ayrıca ölçülüyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-051","S-017"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["D-014","Q-026","R-025","U-044"],"bagimliliklar":["N-K23-009"],"kume":"K07","alan":"A-deger-akisi"},{"id":"N-K07-008","baslik":"Ortak akış notasyonu","ihtiyac":"Tüm akışların aynı notasyonla (ajan, standart süreç, hata, karar, döngü, insan) ve aynı renk anlamıyla çizilmesi.","cozulecek_sorun":"Renk anlamı kaynaklar arasında farklı (yeşil bir yerde insan, bir yerde doğrulandı); akışlar karşılaştırılamıyor.","yetenek_siniflari":["Y-37"],"zorunluluk":"opsiyonel","kabul_olcutleri":["Tek lejant ve renk sözlüğü var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-052","S-054","S-010","S-006"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["C-014"],"kume":"K07","alan":"A-deger-akisi"},{"id":"N-K08-001","baslik":"Aşamalı geri bildirim triyajı","ihtiyac":"Her ortam aşamasındaki bulgunun sınıflanması (kriter ihlali → hata; yeni istek → ürün sahibi; teknik → hata; kapsam değişimi → ürün sahibi; üretim olayı → olay sorumlusu) ve bağlantılı işe dönüşmesi.","cozulecek_sorun":"Sunum ve yayın geri bildirimi kayboluyor ya da yanlış yere gidiyor.","yetenek_siniflari":["Y-32","Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her geri bildirim sınıflanıp bir işe bağlanıyor.","Teknik kabulden sonra etkilenen taraflardan (kullanıcı, destek, bakım) gelen itiraz 'testler geçti' gerekçesiyle otomatik kapatılmıyor; itirazın hangi ihtiyaç veya kararı yeniden açtığı ve sonucu izlenebilir.","Reddedilen itirazın gerekçesi ve dayanılan kabul kaynağı bildirene görünür; itirazı değerlendirmek için ilgisiz gizli bilgi taraflara açılmıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-095","S-374"]},"cember":"ic_tanimli","belirsizlik":"dusuk","codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T08; ihtiyac-kumeleri/kumeler/05_sureklilik_ve_ogrenme/02_ekonomi_olcum_ve_ogrenme.json#I16-05","dogrulama":"dogrulandi","kaynak_url":["https://airc.nist.gov/airmf-resources/airmf/5-sec-core/"],"ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-095, S-374 eklendi; mevcut metin değiştirilmedi.","kume":"K08","alan":"A-deger-akisi"},{"id":"N-K08-002","baslik":"Kaçan hatadan regresyon testi","ihtiyac":"Her kaçan hatanın hatalı sürümde kırmızı, düzeltilmiş sürümde yeşil olan bir regresyon testine dönüşmesi; bağımsız doğrulamadan sonra sürümlü regresyon havuzuna eklenmesi; yeni işlerin güncel test sürümünü alması.","cozulecek_sorun":"Aynı hata tekrar ediyor.","yetenek_siniflari":["Y-22","Y-20"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kapanan hataların %100'ünde regresyon testi var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007","S-010"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K08","alan":"A-deger-akisi"},{"id":"N-K08-003","baslik":"Test ekleme ile ürün kuralı değiştirme yetkilerinin ayrılması","ihtiyac":"Test eklemenin ve ürün kuralını (kabul kriterini) değiştirmenin ayrı yetkiler olması; yeni ürün davranışının ayrı backlog işi olması; test iyileştirmenin ayrı bütçesi olması.","cozulecek_sorun":"Test yoluyla ürün kuralı değişiyor.","yetenek_siniflari":["Y-09","Y-25"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kabul kriteri değişikliği yalnız ürün sahibi rolüyle yapılabiliyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K08","alan":"A-deger-akisi"},{"id":"N-K08-004","baslik":"Kopya iş engeli","ihtiyac":"Aynı hatadan kopya iş açılmaması; ilişkili bulguların tek işe bağlanması.","cozulecek_sorun":"Kopya işler kapasiteyi tüketiyor ve ölçümleri bozuyor.","yetenek_siniflari":["Y-45"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kopya hata oranı ölçülüyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K08","alan":"A-deger-akisi"},{"id":"N-K08-005","baslik":"Ajan kaynaklı değişikliklerin üretim etkisinin izlenmesi","ihtiyac":"Ajan katkılı değişikliklerin değişiklik başarısızlık oranı, geri alma oranı, kurtarma süresi ve kullanıcıya kaçan kusur oranının insan değişiklikleriyle ayrı izlenebilmesi.","cozulecek_sorun":"Ajan etkisi üretimde görünmüyor; yapay zekâ benimsemesi kararlılıkla negatif ilişkili bulunmuş.","yetenek_siniflari":["Y-27","Y-39"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Değişiklik kaynağı (ajan/insan/karma) üretim metriklerinde ayrıştırılabiliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-101","S-102"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"üretim","kume":"K08","alan":"A-deger-akisi"},{"id":"N-K08-006","baslik":"Olaylardan kural ve yetenek paketine geri besleme","ihtiyac":"Olay ve kök neden analizlerinden çıkan derslerin kural, yetenek paketi veya test havuzuna kontrollü (değerlendirmeli ve onaylı) biçimde aktarılması.","cozulecek_sorun":"Aynı tür hata farklı ekiplerde tekrar ediyor; öğrenme ekip sınırında kalıyor.","yetenek_siniflari":["Y-40","Y-29"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Her kök neden analizinde kural/test/paket önerisi alanı var ve öneriler değerlendirmeden geçiyor.","Hata durumuna düşen her iş, hata sınıfı ve kanıtıyla iyileştirme adayı olarak kaydediliyor; iyileştirme ayrı bir iş olarak değerlendirilip onaylanıyor, çalışan görev kendi korumalarını veya kabul ölçütünü değiştirmiyor."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-061","S-062","S-097"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","bagimliliklar":["N-K11-009"],"codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#pdf_topic_coverage/B12","dogrulama":"kismen","ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-097 eklendi; mevcut metin değiştirilmedi.","kume":"K08","alan":"A-deger-akisi"},{"id":"N-K08-007","baslik":"Olay sonrası öğrenmenin tasarıma dönmesi","ihtiyac":"Ürün olaylarının suçlamasız analizinden çıkan bulguların yalnız teste ve kurala değil tasarım artefaktlarına dönmesi: karar kaydı güncellemesi, yeni mimari uygunluk kuralı, hazırlık inceleme maddesi, tehdit modeli güncellemesi, SLO ve uyarı revizyonu, bağımlılık bozulmuş modu; eylem maddelerinin sahip, doğrulanabilir sonuç ve süreyle iş takip sistemine girmesi; kapanış oranının ve etkinliğinin (aynı olay sınıfının tekrarı) ölçülmesi; analiz şablonunda ajan katkısı alanı (hangi ajan değişikliği, hangi kapı veya korkuluk neden yakalamadı).","cozulecek_sorun":"Olaylardan öğrenme birçok kurumda gayriresmî ve dağınık kalıyor; eylem maddeleri kapanmıyor, aynı arıza tekrar ediyor. K08-006 dersleri yalnız kural, yetenek paketi ve test havuzuna aktarır; mimari ve işletim tasarımına dönüş tanımlı değil.","yetenek_siniflari":["Y-63","Y-37","Y-32","Y-40"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça aynı ders farklı ekiplerde yeniden öğrenilir; ortak şablon ve ortak depo gerekir.","kabul_olcutleri":["Her önemli olay analizinde tasarım artefaktı etkisi alanı dolu (etki yoksa gerekçeli).","Öncelikli eylem maddelerinin hedef sürede kapanma oranı ve tekrar eden olay sınıfı oranı raporlanıyor.","Ajan katkılı olaylarda kaçırılan kapı/korkuluk kayıtlı ve ilgili kapıya iyileştirme işi açılmış."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-290","S-329","S-312","S-318"],"not":"2025 vaka çalışması: yüksek güvenilirlik hedefli bir kurumda başarısızlıktan öğrenme gayriresmî, dağınık ve yaşam döngüsüne tutarsız bağlı; engeller zaman, personel değişimi, dağınık dokümantasyon. Örnek politika bütçenin %20'sini tüketen olaylar için öncelikli eylem maddesi ister. Benzer mevcut ihtiyaç: N-K08-006; fark: K08-006 geri beslemeyi kural/paket/test havuzuyla sınırlar; K08-002 regresyon testini ister. Tasarım artefaktlarına dönüş, eylem maddesi etkinliği ve ajan katkısı analizi yok."},"cember":"ic_bosluk","belirsizlik":"dusuk","bagimliliklar":["N-K08-006"],"kume":"K08","alan":"A-deger-akisi"},{"id":"N-K08-008","baslik":"Ekipler arası olay örüntüsü analizi ve ortak ders havuzu","ihtiyac":"Ekiplerin olay ve ramak kala kayıtlarının ortak bir sınıflamayla (tetikleyici türü: kod, yapılandırma, veri, bağımlılık, kapasite; katkıda bulunan faktörler; değişiklik kaynağı) tutulması; ekipler arası tekrar eden örüntülerin periyodik analiz edilip ortak güvenilirlik standardına, hazırlık kontrol listesine ve kural katmanlarına aktarılması; dış kurumların yayımladığı olay raporlarından ders çıkarılması.","cozulecek_sorun":"Her ekip yalnız kendi olayından öğrenirse aynı hata sınıfı diğer ekiplerde tekrar eder; ajanlar aynı zayıf kalıbı ekipler arasında hızla çoğaltabilir.","yetenek_siniflari":["Y-63","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"3+ ekipte örüntü ancak ortak sınıflamayla görünür; 10+ ekipte bu analiz olmadan standart güncellenemez.","kabul_olcutleri":["Olay kayıtlarının %100'ü ortak sınıflamada.","Her program artımında ekipler arası örüntü raporu inceleme ve uyarlama gündeminde.","Ramak kala kaydı oranı ve dış olay raporlarından çıkarılan eylem sayısı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-318","S-329"],"not":"İşletim hazırlık incelemesi rehberi geçmiş olayları, ramak kalaları ve henüz yaşanmamış endişe verici arıza modlarını ayrı kategoriler olarak incelemeyi önerir. Benzer mevcut ihtiyaç: N-K24-009; fark: K24-009 ajan olaylarını ve değerlendirme gerilemelerini program gündemine alır; ürün olaylarının ortak sınıflaması ve ekipler arası örüntü analizi yok."},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"3+ ekip","bagimliliklar":["N-K24-009"],"kume":"K08","alan":"A-deger-akisi"},{"id":"N-K09-001","baslik":"Rol ile modelin ayrılması","ihtiyac":"Ajan rolünün (görev tanımı, araçlar, izinler) modelden ayrı tanımlanması; modelin role yalnız referans olarak bağlanması; aynı modelin birden çok rolde, aynı rolün farklı modellerle çalışabilmesi.","cozulecek_sorun":"Model ile ajan karıştırılıyor; model değişince rol tanımı da değişiyor.","yetenek_siniflari":["Y-01","Y-02"],"zorunluluk":"zorunlu","kabul_olcutleri":["Rol şemasında model yalnız bir referans alanı.","Model değişimi kod değişikliği gerektirmiyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-025","S-016","S-028"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["C-035"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-002","baslik":"Rol başına birincil ve yedek model","ihtiyac":"Her rol için birincil ve en az bir yedek modelin tanımlanması; sağlayıcı kesintisinde veya hız sınırında bozulmuş modda çalışma kuralı.","cozulecek_sorun":"Tek modele ya da sağlayıcıya bağımlılık; kesinti ekiplerin program hedeflerini doğrudan vuruyor.","yetenek_siniflari":["Y-02"],"zorunluluk":"zorunlu","olcek_etkisi":"10+ ekip aynı anda aynı sağlayıcıya yüklendiğinde hız sınırı ve kesinti etkisi katlanır.","kabul_olcutleri":["Tüm rollerde birincil ve yedek tanımlı.","Kesinti tatbikatında hangi rolün yedeğe geçtiği ve hangi işin beklediği biliniyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-028","S-021"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["C-031","D-017","R-006","R-036","R-038","U-030","U-040"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-003","baslik":"Küçük modelden güçlü modele yükseltme kuralları","ihtiyac":"Şema hatası, çelişki veya düşük güven durumunda işin daha güçlü modele ya da planlayıcıya yükseltilmesinin kurallarla tanımlanması; yükseltme oranının izlenmesi.","cozulecek_sorun":"Küçük model karmaşık işte hata yapıyor; her işe en güçlü modeli kullanmak maliyeti patlatıyor.","yetenek_siniflari":["Y-02","Y-30"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Yükseltme tetikleyicileri yazılı ve yükseltme oranı raporlanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-028","S-029","S-123"]},"cember":"ic_tanimli","belirsizlik":"orta","olcek_esigi":"pilot sonrası","iliskili":["C-031","D-017"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-004","baslik":"Karar türü × izinli model sınıfı matrisi","ihtiyac":"Birleştirme, test kapsamı, kabul gibi kritik kararların hangi model sınıflarına tek başına bırakılamayacağının tanımlanması.","cozulecek_sorun":"Küçük ve hızlı yardımcı modellerin kritik karar vermesi hatalı kabul üretiyor.","yetenek_siniflari":["Y-02","Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Karar türü × model sınıfı matrisi yazılı ve hat tarafından uygulanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-029"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-005","baslik":"İnceleme için model ailesi çeşitliliği","ihtiyac":"Denetçi modelin yazar modelden farklı aileden seçilmesi; aynı ailenin farklı boyutlarının çeşitlilik sayılmaması; aile bilgisinin model kaydında tutulması.","cozulecek_sorun":"Ortak kör noktalar; kendi ailesini kayırma. Kaynaktaki atamada planlama, test, ön yüz kodu ve denetimin birincil modeli aynı.","yetenek_siniflari":["Y-02","Y-07"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her incelemede en az bir inceleyici farklı ailede.","Test yazarı ile kod yazarının modeli aynıysa kayıtta görünür."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-028","S-029","S-140"],"not":"Farklı aile bağımsız doğruluk garantisi değildir; yalnız bir risk azaltıcıdır."},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["A-009","C-021","D-011"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-006","baslik":"Akıl yürütme seviyesinin rol bazında ayarı ve kaydı","ihtiyac":"Düşünme/akıl yürütme seviyesinin rol ve iş türüne göre ayarlanması, her çağrıda kaydedilmesi, değerlendirmede seviyeye göre raporlanması.","cozulecek_sorun":"Aynı model farklı ayarda farklı sonuç veriyor; sonuçlar karşılaştırılamıyor.","yetenek_siniflari":["Y-01","Y-27"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her çağrıda seviye kayıtlı; değerlendirme raporları seviyeye göre ayrışıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-027","S-029"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-007","baslik":"Uzun bağlamı gerçekten kullanabilme","ihtiyac":"Büyük depo ve belge işlerinde uzun bağlam penceresinin gerçekten kullanılabildiğinin kendi depo boyutunda ölçülmesi; taşma stratejisi.","cozulecek_sorun":"Pencere boyutu kullanım garantisi değil; bağlam uzadıkça kalite düşüyor.","yetenek_siniflari":["Y-16","Y-29"],"zorunluluk":"kosullu","kabul_olcutleri":["Kendi depo boyutunda çok belgeli erişim testi eşik üstünde.","Taşma stratejisi tanımlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-025","S-029","S-127"]},"cember":"ic_tanimli","belirsizlik":"orta","kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-008","baslik":"Çok kipli girdi işleme","ihtiyac":"Ekran görüntüsü, belge sayfası, diyagram ve kaydın modele iletilebilmesi; yerel sürümün gerçek kiplerinin kayıtta tutulması; algılama modeli bulgularının deterministik testle teyidi; diyagramdan çıkarılan gereksinimlerde görsel kontrol.","cozulecek_sorun":"Görsel ve deneyim hataları görülmüyor; diyagram okları yanlış çözümleniyor (bu çalışmanın kendi kaynaklarında da yaşandı).","yetenek_siniflari":["Y-04"],"zorunluluk":"kosullu","kabul_olcutleri":["Görsel bulgular deterministik tarayıcı testiyle teyit ediliyor.","Model kaydında 'yerel kipler' alanı var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-014","S-029","S-028"]},"cember":"ic_tanimli","belirsizlik":"orta","kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-009","baslik":"Barındırma biçimi kararı ve gerekçesi","ihtiyac":"Modelin kurum içinde mi, bölgesel mi, hizmet olarak mı kullanılacağının veri sınıfı, maliyet, kalite ve yasal çerçeveyle gerekçelendirilmesi; kapalı hizmet sürümü ile indirilebilir sürümün aynı ürün sayılmaması.","cozulecek_sorun":"Kaynaklar yerel barındırmaya yöneliyor ama gerekçe (gizlilik, maliyet, kamu kısıtı) yazılmamış; ölçümler hizmet sürümü ile yerel sürümü karıştırıyor.","yetenek_siniflari":["Y-03","Y-36"],"zorunluluk":"zorunlu","kabul_olcutleri":["Barındırma kararı veri sınıflarına göre yazılı.","Ölçümler 'hizmet' / 'yerel' etiketli."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-027","S-025","S-018","S-163","S-164"]},"cember":"ic_bosluk","belirsizlik":"yuksek","iliskili":["A-008","D-002","G-027","H-04","Q-010","Q-011","R-038","U-032","U-041"],"bagimliliklar":["N-K22-005"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-010","baslik":"Modele özel sunum reçetesi ve şablon uyumu","ihtiyac":"Her model için sürümlü, test edilmiş başlatma tarifi ve sağlık kontrolü; araç çağrısı ve akıl yürütme alanlarının modelin mesaj biçimine uygunluğunun (dosya okuma/yazma, kabuk, yapılandırılmış çıktı, uzun araç döngüsü, kopma sonrası devam) test edilmesi.","cozulecek_sorun":"'Uyumlu arayüz' tek başına yetmiyor; model ayağa kalkmıyor veya araç çağrılarını yanlış biçimliyor.","yetenek_siniflari":["Y-03","Y-01"],"zorunluluk":"kosullu","kabul_olcutleri":["Her modelde uyumluluk test paketi geçiyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-016","S-029","S-017"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["R-031"],"bagimliliklar":["N-K09-009"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-011","baslik":"Model sunum kapasitesi planı","ihtiyac":"Seçilecek model seti için bellek, çıktı hızı, eşzamanlı oturum ve gecikme hedeflerinin hesaplanması.","cozulecek_sorun":"Model boyutları çok farklı; donanım bütçesi, eşzamanlı oturum sayısı ve gecikme hedefi bilinmiyor.","yetenek_siniflari":["Y-38","Y-03"],"zorunluluk":"kosullu","kabul_olcutleri":["Eşzamanlı oturum ve gecikme hedefleri yazılı; kapasite hesabı belgeli."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-029","S-018","S-019"]},"cember":"ic_bosluk","belirsizlik":"yuksek","iliskili":["Q-012","R-026","U-041"],"bagimliliklar":["N-K09-009"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-012","baslik":"Model kaydı","ihtiyac":"Her model için sürüm, lisans, bağlam, kipler, aile, sunum reçetesi, şablon, akıl yürütme seviyeleri, ölçüm sonuçları ve son doğrulama tarihinin tek kayıtta tutulması.","cozulecek_sorun":"Model bilgisi dağınık ve hızla eskiyor; yeni sürümler, önizlemeler ve arşivlenen projeler karar tabanını geçersizleştiriyor.","yetenek_siniflari":["Y-35","Y-02"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her modelin kaydı tam ve son doğrulama tarihi eşikten eski değil."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-024","S-025","S-029"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["G-005"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-013","baslik":"Model sürüm sabitleme ve kayma izleme","ihtiyac":"Kullanılan model sürümlerinin sabitlenmesi; sağlayıcı değişikliklerinin ve emeklilik takvimlerinin izlenmesi; sabit bir referans setinin düzenli koşturularak davranış kaymasının yakalanması.","cozulecek_sorun":"Aynı model adı altında davranış zamanla değişiyor; kalibre edilmiş sınırlar ve kurallar sessizce geçersizleşiyor.","yetenek_siniflari":["Y-43","Y-29"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Model sürümü her koşuda kayıtlı.","Referans set düzenli koşuyor ve kayma alarmı tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-126","S-061"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"üretim","iliskili":["R-005","U-001"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K09-014","baslik":"Türkçe gereksinim ve arama kalitesi","ihtiyac":"Türkçe kabul kriterlerinin ve Türkçe arama sorgularının model ve yardımcı modellerde ayrıca ölçülmesi.","cozulecek_sorun":"Türkçe başarı hiçbir model için doğrulanmamış.","yetenek_siniflari":["Y-29","Y-04"],"zorunluluk":"zorunlu","kabul_olcutleri":["Türkçe görev alt kümesinde başarı ve Türkçe erişim kalitesi eşiği tanımlı ve ölçülüyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-017","S-014","S-029"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["A-015","G-026","R-025"],"bagimliliklar":["N-K23-009"],"kume":"K09","alan":"B-ajan-platformu"},{"id":"N-K10-001","baslik":"Başsız ve programatik çalışma","ihtiyac":"Ajanın insan arayüzü olmadan programatik olarak çağrılabilmesi; şemalı sonuç ve olay akışı döndürmesi; oturumun kimlikle devam ettirilebilmesi.","cozulecek_sorun":"Geliştirme ortamına bağlı ajanlar otomatik hatta kullanılamıyor; sonuç makinece okunamıyor.","yetenek_siniflari":["Y-05"],"zorunluluk":"zorunlu","kabul_olcutleri":["Ajan komut satırı/programatik arayüzle çağrılıyor ve şemalı sonuç dönüyor.","Kesintiden sonra aynı oturum sürdürülebiliyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062","S-061"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K10","alan":"B-ajan-platformu"},{"id":"N-K10-002","baslik":"Değiştirilebilir çalışma zamanı ve ortak adaptör sözleşmesi","ihtiyac":"Ajan çalışma zamanının ortak bir girdi zarfı (görev, revizyon, kriter sürümü, bütçe, izinler) ve ortak bir sonuç şeması üzerinden bağlanması; çalışma zamanı değişince orkestrasyon ve kuralların değişmemesi.","cozulecek_sorun":"Alan hızla değişiyor; tek çalışma zamanına kilitlenme riski yüksek. Kaynaklarda varsayılan çalışma zamanı konusunda üç farklı cevap var.","yetenek_siniflari":["Y-05"],"zorunluluk":"zorunlu","kabul_olcutleri":["İki farklı çalışma zamanı aynı sözleşmeyle çalışıyor; süreç kodu değişmiyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-061","S-062", run aynı görevi sürmesi (bölünmüş beyin); birden çok yeniden deneme sahibinin maliyeti ve yan etkiyi katlaması.","yetenek_siniflari":["Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her durum alanının tek yazarı var.","İkinci bir sistem aynı görevi başlatamıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062","S-061","S-006"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["C-018","D-001","R-021"],"kume":"K13","alan":"B-ajan-platformu"},{"id":"N-K13-002","baslik":"Kesintiden devam","ihtiyac":"Süreç, işçi veya sunucu çökmesinden sonra aynı koşunun, aynı onay referanslarıyla kaldığı adımdan sürmesi; uzun ajan adımlarının sınırlı alt adımlara bölünmesi.","cozulecek_sorun":"Uzun işler kesintide kayboluyor; tek opak adım çökmede saatlerce baştan koşuyor.","yetenek_siniflari":["Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Çökme tatbikatında koşu kaldığı yerden devam ediyor ve yan etki tekrarlanmıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-021","S-062","S-061"]},"cember":"ic_tanimli","belirsizlik":"orta","kume":"K13","alan":"B-ajan-platformu"},{"id":"N-K13-003","baslik":"Günlerce insan bekleme","ihtiyac":"Ürün sahibi, kalite veya teknik lider kararı beklenirken koşunun kaynak tüketmeden beklemesi, cevap gelince aynı aşamadan sürmesi.","cozulecek_sorun":"Bekleme sırasında süreç kayboluyor ya da işçi meşgul kalıyor.","yetenek_siniflari":["Y-12","Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Bekleme sırasında servis yeniden başlasa da aynı koşu ve onay referansı sürüyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062","S-061","S-006"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K13","alan":"B-ajan-platformu"},{"id":"N-K13-004","baslik":"Dış yan etkilerde idempotency ve uzlaştırma","ihtiyac":"Değişiklik önerisi açma, birleştirme, dağıtım gibi dış yan etkilerin tekrar anahtarıyla bir kez yapılması; belirsiz durumda uzlaştırma.","cozulecek_sorun":"Yeniden deneme yüzünden ikinci değişiklik önerisi veya çift dağıtım n deneme","ihtiyac":"Hata sınıfına göre hedef role yönlendirme (ekran → ön yüz, sunucu → arka uç, test/çalıştırma → test rolü, belirsiz beklenti → planlayıcı/ürün sahibi, altyapı → işletim); her sınıfın deneme üst sınırı; çözülemeyenin iş kalemine gerekçesiyle yazılması; altyapı hatasında kör otomatik yeniden başlatma yapılmaması.","cozulecek_sorun":"Sonsuz döngü, sahipsiz hata, yanlış role giden iş.","yetenek_siniflari":["Y-12","Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her hata sınıfının hedefi ve üst sınırı tanımlı.","Sınıfsız hata 0."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-018","S-006","S-007","S-021"]},"cember":"ic_tanimli","belirsizlik":"dusuk","bagimliliklar":["N-K20-001"],"kume":"K13","alan":"B-ajan-platformu"},{"id":"N-K13-009","baslik":"Koşu başında bağlamın sabitlenmesi","ihtiyac":"Koşu başında revizyon, kabul kriteri sürümü, politika/kural/paket sürümleri, model sürümleri ve bütçenin sabitlenmesi; koşu kimliğinin iş + kriter sürümüne bağlanması.","cozulecek_sorun":"Koşu ortasında kural veya kriter kayması; sonuçların yeniden üretilememesi.","yetenek_siniflari":["Y-12","Y-35"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her koşu kaydında sabitlenen sürümlerin tam listesi var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-061","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K13","alan":"B-ajan-platformu"},{"id":"N-K13-010","baslik":"Süreç kodu ve politika sürümlemesi, yeniden oynatma testi","ihtiyac":"Akış tanımının ve politikaların sürümlenmesi; yeni sürüm yayınlanınca açık koşuların bozulmaması; eski geçmişlerin yeniden oynatma testinden geçmesi.","cozulecek_sorun":"Kural veya akış değişince açık koşular bozuluyor.","yetenek_siniflari":["Y-12","Y-35"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Yeni sürüm yayındayken eski koşular yeniden oynatma testini geçiyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062","S-061"]},"cember":"ic_tanimli","belirsizlik":"orta","olcek_esigi":"üretim","kume":"K13","alan":"B-ajan-platformu"},{"id":"N-K13-011","baslik":"Büyük artefaktların dış depoda tutulması","ihtiyac":"Kod farkı, log, rapor gibi büyük artefaktların dış depoda saklanması; süreçte yalnız referans tutulması.","cozulecek_sorun":"Süreç geçmişi ve yük sınırları aşılıyor.","yetenek_siniflari":["Y-28","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Süreç yükü eşiği aşmıyor; artefaktlar referansla erişilebilir."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062","S-063"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K13","alan":"B-ajan-platformu"},{"id":"N-K13-012","baslik":"Yetkili ve tekilleştirilmiş başlatma","ihtiyac":"İş takip yorumu veya olaydan gelen başlatma isteğinin imza ve aktör yetkisinin doğrulanması; aynı olayın ikinci kez gelmesinde tek aktif koşu; yetkisiz isteğin gerekçeyle reddi.","cozulecek_sorun":"Aynı görev için paralel koşular; yetkisiz başlatma.","yetenek_siniflari":["Y-12","Y-25","Y-11"],"zorunluluk":"zorunlu","kabul_olcutleri":["Aynı olay iki koşu üretmiyor.","Yetkisiz başlatma isteklerinin %100'ü reddediliyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-062","S-030"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K13","alan":"B-ajan-platformu"},{"id":"N-K13-013","baslik":"Yaşam döngüsü sahibinin mimari kararı","ihtiyac":"Yaşam döngüsünün dayanıklı iş akışı motorunda mı, tek sunuculu bir görev panosunda mı, yoksa graf tabanlı bir durum makinesinde mi tutulacağının ölçek, işletim yükü ve ekip yetkinliği ölçütleriyle karar kaydına bağlanması.","cozulecek_sorun":"Kaynaklar orkestratör konusunda çelişiyor: biri bir sıralayıcıyı 'kabul edildi' diyor, biri graf motoru öneriyor, biri dayanıklı motor; ölçek gerekçesi ölçülmemiş.","yetenek_siniflari":["Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Karar kaydı ölçütleri, alternatifleri ve geri dönüş koşulunu içeriyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-016","S-021","S-019","S-020","S-061","S-062"],"not":"Bu bir araç seçimi değil, mimari sınıf kararı ik","kaynaklar":["S-061"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K14","alan":"B-ajan-platformu"},{"id":"N-K14-007","baslik":"Proje ve ekip bazında bellek izolasyonu","ihtiyac":"Ajan belleğinin proje/ekip/kiracı bazında ayrılması; bellek sızıntısının ve projeler arası karışmanın ölçülmesi; bellek temizliği.","cozulecek_sorun":"Projeler arası bilgi karışıyor; bellek zehirlenmesi kalıcı hale geliyor.","yetenek_siniflari":["Y-16","Y-36"],"zorunluluk":"olcege_bagli","olcek_etkisi":"10+ ekipte çok kiracılı bellek zorunlu.","kabul_olcutleri":["Proje ayrımı testle doğrulanmış.","Bellek temizleme ve süre politikası tanımlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-061","S-151"]},"cember":"ic_tanimli","belirsizlik":"orta","olcek_esigi":"2+ ekip","iliskili":["R-013","R-034"],"kume":"K14","alan":"B-ajan-platformu"},{"id":"N-K14-008","baslik":"Bağlam penceresi bütçesi","ihtiyac":"Seçici bağlam yükleme, özetleme ve önbellekleme ile görevin bağlamının sınırlandırılması; bağlam boyutunun izlenmesi.","cozulecek_sorun":"Bağlam uzadıkça kalite düşüyor; maliyetin büyük kısmı girdi token'ından geliyor.","yetenek_siniflari":["Y-16","Y-30"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Görev başına bağlam boyutu izleniyor ve eşik tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-127","S-123"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"pilot sonrası","iliskili":["R-019","U-003"],"kume":"K14","alan":"B-ajan-platformu"},{"id":"N-K14-009","baslik":"Bilgi tazeliği denetimi","ihtiyac":"Dokümanların ve karar kayıtlarının son doğrulama tarihinin izlenmesi; eskimiş bilginin ajana işaretli sunulması.","cozulecek_sorun":"Eskimiş doküman ajanı yanıltıyor.","yetenek_siniflari":["Y-37"],"zorunluluk":"opsiyonel","kabul_olcutleri":["Eşikten eski belgeler bağlamda 'eski' işaretiyle sunuluyor."],"kanit":{"duzey":"cikarim","kaynaklar":[]},"cember":"dis_eksik","belirsizlik":"orta","kume":"K14","alan":"B-ajan-platformu"},{"id":"N-K14-010","baslik":"Bilgi düzeltmesinin türevlere yayılması ve eski kopyadan geri dönüşün önlenmesi","ihtiyac":"Bir bilgi (iş kuralı, bellek kaydı, doküman, karar) düzeltildiğinde veya kullanımdan kaldırıldığında ona dayanan özetlerin, bellek kayıtlarının, değerlendirmelerin, kararların ve bekleyen işlerin bulunup geçerliliklerinin yeniden belirlenmesi; eski kopya, yedek veya önbellekten dönen geçersiz bilginin kendiliğinden güncel sayılmaması; ilk gözlem, önerilen genelleme, yetkili bilgi ve kabul edilmiş kuralın ayrı köken ve geçerlilikle tutulması; fiziksel silme ile denetim için korunması gereken tarihsel kaydın ayrı ele alınması.","cozulecek_sorun":"Kaynak düzeltildiği halde eski özet veya bellek kaydı yanlış davranışı üretmeye devam eder; yedekten dönüşte geri alınmış erişim veya geçersiz içerik görünmeden yeniden etkinleşir; tek başarılı işten çıkarılan alışkanlık başka alanda zorunlu kural gibi uygulanır.","yetenek_siniflari":["Y-16","Y-37","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"Ortak bellek ve ortak kural katmanı büyüdükçe bir düzeltmenin etkilediği türev sayısı ve ekip sayısı artar; türev izi olmadan düzeltme ekipler arasında tutarsız yayılır.","kabul_olcutleri":["Yanlış bir iş kuralı düzeltildiğinde ona dayanan özet, bellek kaydı ve bekleyen karar listelenebiliyor; değerlendirilmemiş türevler güncel doğru bilgi diye sunulmuyor.","Silinmiş veya kullanımdan kaldırılmış bilgi yedekten döndüğünde yeniden kullanım engeli korunuyor ya da doğrulanamadığı açıkça işaretleniyor.","Düzeltme sonrası yeni işlerde doğru bilgi kullanılıyor; düzeltmenin başka görevlerde gerileme yaratıp yaratmadığı ölçülüyor.","Denetim için saklanan tarihsel kayıt ile güncel karar için kullanılabilen bilgi ayrı işaretli."],"kanit":{"duzey":"arastirma","kaynaklar":["S-095","S-377","S-378","S-379"],"not":"Köken modeli türeme, revizyon ve geçersizleşmeyi ayırır; ajan belleği değerlendirmesi seçici unutmayı (çelişen bilginin yönetimi) ayrı bir yeterlilik olarak ölçer; olağanüstü durum planlaması kurtarma sonrası bilinen iyi duruma dönüşü ve doğrulamayı ister. Benzer mevcut ihtiyaçlar: N-K14-006 (yetkili kaynak ayrımı), N-K14-009 (tazelik), N-K22-009 (saklama/silme). Fark: düzeltmenin türevlere yayılması ve eski kopyadan geri dönüş tanımlı değildi."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K14-006","N-K22-009"],"iliskili":["G-036","Q-073","U-077"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T15; ihtiyac-kumeleri/kumeler/02_ajan_bilgi_ve_etkilesim/03_bilgi_baglam_ve_bellek.json#I07-04,I07-06","dogrulama":"dogrulandi","kaynak_url":["https://www.w3.org/TR/prov-dm/","https://arxiv.org/abs/2507.05257","https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf"],"kume":"K14","alan":"B-ajan-platformu"},{"id":"N-K15-001","baslik":"Görev başına izole çalışma alanı","ihtiyac":"Her görev ve her deneme için temiz revizyondan kurulan izole bir çalışma kopyası, veritabanı ve test verisi.","cozulecek_sorun":"Denemeler ve görevler arası kirlenme; önceden bozuk durumun yeni göreve yazılması.","yetenek_siniflari":["Y-18","Y-19"],"zorunluluk":"zorunlu","kabul_olcutleri":["Görevler arası paylaşılan değişken durum 0.","Her deneme temiz revizyondan başlıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-018","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K15","alan":"B-ajan-platformu"},{"id":"N-K15-002","baslik":"Yürütme yalıtımı","ihtiyac":"Çalışma kopyasının ötesinde, ağ çıkışı izin listesi, dosya sistemi, süre, işlemci/bellek ve gizli bilgi erişimi sınırları olan bir yürütme yalıtımı.","cozulecek_sorun":"Çalışma kopyası tek başına güvenlik yalıtımı değil; geliştirme araçlarındaki açıklar veri sızdırma ve uzaktan kod çalıştırmaya yol açabiliyor.","yetenek_siniflari":["Y-18"],"zorunluluk":"zorunlu","kabul_olcutleri":["Ağ, sır, işlemci ve süre sınırları çalıştırıcıda tanımlı ve test edilmiş."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-063","S-062","S-145","S-151"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["R-008","R-034"],"kume":"K15","alan":"B-ajan-platformu"},{"id":"N-K15-003","baslik":"Test verisi yönetimi","ihtiyac":"Görev başına test verisinin hazırlanması, gerektiğinde sentetik veya maskeli veri kullanılması ve temizlenmesi.","cozulecek_sorun":"Ajan gerçek kişisel veriye erişebiliyor; test verisi görevler arasında kirleniyor.","yetenek_siniflari":["Y-19","Y-36"],"zorunluluk":"kosullu","kabul_olcutleri":["Kişisel veri içeren ortamlarda maskeleme zorunlu ve denetlenmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-006","S-162"]},"cember":"dis_eksik","belirsizlik":"orta","kume":"K15","alan":"B-ajan-platformu"},{"id":"N-K15-004","baslik":"Ajanın üretim kimliği olmaması","ihtiyac":"Ajanların üretim ortamına yazma kimliği taşımaması; ortam terfisinin yalnız yayın hattından yapılması.","cozulecek_sorun":"Ajan ortamlar arasında atlayıp üretim verisini etkileyebiliyor.","yetenek_siniflari":["Y-25","Y-34"],"zorunluluk":"zorunlu","kabul_olcutleri":["Hiçbir ajan kimliğinin üretim yazma yetkisi yok."],"kanit":{"duzey":"arastirma","kaynaklar":["S-152","S-149"]},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["R-022"],"kume":"K15","alan":"B-ajan-platformu"},{"id":"N-K15-005","baslik":"Hesaplama ve sürekli entegrasyon kapasitesi","ihtiyac":"Ajanların artırdığı değişiklik hacmine göre test çalıştırıcı, sürekli entegrasyon ve model sunum kapasitesinin ölçülmesi ve ölçeklenmesi.","cozulecek_sorun":"Değişiklik hacmi artınca kuyruklar doyuyor; akış tıkanıyor.","yetenek_siniflari":["Y-38"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Kuyruk bekleme süreleri izleniyor ve eşiği tanımlı.","Hacmi iki katına çıkaran yük testi yapılmış."],"kanit":{"duzey":"arastirma","kaynaklar":["S-107"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["Q-012","R-015","R-026","U-008"],"kume":"K15","alan":"B-ajan-platformu"},{"id":"N-K15-006","baslik":"Ekipler arası adil kaynak paylaşımı","ihtiyac":"Paylaşılan çalıştırıcı, test altyapısı ve model kapasitesinin ekipler/ART'lar arasında kota ve öncelikle paylaştırılması.","cozulecek_sorun":"Bir ekibin toplu işi diğer ekiplerin akışını durduruyor.","yetenek_siniflari":["Y-38","Y-30"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Tek ekipte gereksiz; ekip sayısı arttıkça zorunlu. Ekip ekleme/çıkarma yalnız yapılandırma değişikliği olmalı.","kabul_olcutleri":["Ekip/ART bazında kota ve öncelik kuralları tanımlı ve uygulanıyor.","Ertelenen veya reddedilen işin nedeni ve yeniden ele alınma koşulu kayıtlı; düşük öncelikli işin bekleme süresi izleniyor ve eşik aşıldığında görünür bir karar üretiliyor.","Bir ekibin yeniden deneme ve alt iş artışı diğer ekiplerin kabul edilmiş iş sınıfı için bekleme koşulunu bozmuyor; durdurma, durum sorgulama ve devretme işlemleri aşırı yük altında da öncelikli çalışıyor.","Kapasite ve kota, istek sayısıyla değil gerçek kaynak tüketimiyle ölçülüyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-095","S-386"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["Q-001","R-026","R-034"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T13; ihtiyac-kumeleri/kumeler/03_guvenli_ve_tutarli_yurutme/01_orkestrasyon_ve_durum.json#I09-08","dogrulama":"dogrulandi","kaynak_url":["https://sre.google/sre-book/handling-overload/"],"ice_aktarilan":"E1 karşılaştırması: son 3 kabul ölçütü ve kanıt kaynaklarından S-095, S-386 eklendi; mevcut metin değiştirilmedi.","kume":"K15","alan":"B-ajan-platformu"},{"id":"N-K15-007","baslik":"Yerel deneme ortamı ile üretim çalıştırıcılarının ayrılması","ihtiyac":"Pilot/deneme ortamı ile ekiplerin kullanacağı üretim çalıştırıcılarının ayrı tanımlanması ve aralarındaki farkların bilinmesi.","cozulecek_sorun":"Tek makinede çalışan pilot, ekip ölçeğine taşınınca farklı davranıyor; tek kullanıcı tehdit modeli ekip için yeterli değil.","yetenek_siniflari":["Y-18","Y-38"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Pilot ve üretim ortam farkları
