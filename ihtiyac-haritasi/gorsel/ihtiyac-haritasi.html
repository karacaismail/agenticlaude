platformu"},{"id":"N-K16-004","baslik":"Yedekten dönüş ve kurtarma tatbikatı","ihtiyac":"Durum, kanıt ve yapılandırma depolarının yedeklenmesi ve düzenli kurtarma tatbikatı.","cozulecek_sorun":"Hattın durumu kaybolursa açık işlerin nerede kaldığı bilinmez.","yetenek_siniflari":["Y-28","Y-12"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Kurtarma tatbikatı başarılı ve periyodu tanımlı.","Kurtarma sonrası devam noktası; kesinti sırasında insanların ve dış sistemlerin yaptığı değişiklikler, güncel yetki ve kabul kararlarıyla uzlaştırılmadan güvenilir sayılmıyor.","Tatbikatta yedeğin okunabilmesi ile temel işin kabul koşullarıyla yeniden yapılabilmesi ayrı kanıtlanıyor; yedekten dönen eski iş, insanın bu arada tamamladığı dış etkiyi ikinci kez üretmiyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-061","S-063","S-095","S-378"]},"cember":"ic_tanimli","belirsizlik":"dusuk","olcek_esigi":"üretim","iliskili":["R-035"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T16; ihtiyac-kumeleri/kumeler/05_sureklilik_ve_ogrenme/01_isletim_ve_kurtarma.json#I15-04","dogrulama":"kismen","kaynak_url":["https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf"],"ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-095, S-378 eklendi; mevcut metin değiştirilmedi.","kume":"K16","alan":"B-ajan-platformu"},{"id":"N-K16-005","baslik":"Bileşen sürümleme ve güvenli güncelleme","ihtiyac":"İşçi, model, araç ve kural bileşenlerinin sürümlenmesi; güncellemenin açık koşuları bozmadan, değerlendirme ve geri dönüş planıyla yapılması.","cozulecek_sorun":"İşçi sürümü güncellenince açık koşular ve kalibrasyon bozuluyor.","yetenek_siniflari":["Y-35","Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her güncelleme için değerlendirme sonucu ve geri dönüş planı var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-061"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["R-032"],"kume":"K16","alan":"B-ajan-platformu"},{"id":"N-K16-006","baslik":"Bileşen bakım durumu takibi","ihtiyac":"Kullanılan her bileşenin bakım durumunun (aktif, bakım modu, arşiv, üretici ömrü sonu) periyodik izlenmesi ve yedek planı.","cozulecek_sorun":"Çekirdek bir bileşen terk edilebilir veya lisansı değişebilir; alan çok hızlı değişiyor.","yetenek_siniflari":["Y-35"],"zorunluluk":"zorunlu","kabul_olcutleri":["Bileşen durumları periyodik kontrol ediliyor ve kritik bileşenlerin yedek planı var."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-061","S-019"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["R-020","R-032","R-037"],"kume":"K16","alan":"B-ajan-platformu"},{"id":"N-K16-007","baslik":"Bozulmuş mod","ihtiyac":"Model sunucusu, sağlayıcı veya orkestrasyon kesintisinde hangi işlerin bekleyeceğinin, hangilerinin yedekle süreceğinin ve insanların nasıl çalışmaya devam edeceğinin tanımlanması.","cozulecek_sorun":"Kesintide ekipler hem ajan hem kendi akışlarını kaybediyor.","yetenek_siniflari":["Y-02","Y-42"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Kesinti senaryolarının her biri için bozulmuş mod yazılı ve tatbik edilmiş.","Zorunlu kontrol, inceleme veya dış hizmet yanıt vermediğinde sonuç 'kontrol geçti' olarak işaretlenmiyor; zorunlu kabul kanıtı olmayan sonuç normal kabul sayılmıyor.","Alternatif yol veri hedefini, yetkiyi veya kanıt türünü değiştiriyorsa bu değişiklik görünür ve önceki izin otomatik devralınmıyor.","Bozulmuş mod kararı işin geri alınabilirliğine göre ayrışıyor: taslak iş sürebilir, geri alınamaz etkisi olan iş bekliyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-028","S-095","S-387"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["G-022","R-006","R-035","R-036","U-030"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T14; ihtiyac-kumeleri/kumeler/05_sureklilik_ve_ogrenme/01_isletim_ve_kurtarma.json#I15-05","dogrulama":"kismen","kaynak_url":["https://sre.google/sre-book/addressing-cascading-failures/"],"ice_aktarilan":"E1 karşılaştırması: son 3 kabul ölçütü ve kanıt kaynaklarından S-095, S-387 eklendi; mevcut metin değiştirilmedi.","kume":"K16","alan":"B-ajan-platformu"},{"id":"N-K16-008","baslik":"Platform sahipliği","ihtiyac":"Ajan platformunun (model erişimi, çalışma çerçevesi, protokol, orkestrasyon, gözlem, değerlendirme) ekipler arası paylaşılan bir hizmet olarak tek bir sahibinin olması.","cozulecek_sorun":"Her ekip kendi altyapısını kuruyor; sorumluluk dağılıyor.","yetenek_siniflari":["Y-39"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Platform sahibi ve hizmet kapsamı tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-102","S-103","S-171"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","iliskili":["Q-004","R-033","U-045"],"bagimliliklar":["N-K24-004"],"kume":"K16","alan":"B-ajan-platformu"},{"id":"N-K16-009","baslik":"Arıza senaryosu tatbikatları","ihtiyac":"Üretime almadan önce şu senaryoların tatbik edilmesi: aynı olayın iki kez gelmesi, işçinin yamadan sonra ölmesi, bayat kira ile yazma, onay beklenirken servisin yeniden başlaması, kriter veya yamanın değişmesi, model değişimi, testin silinmesi/atlanması/referansın değişmesi, işçi sürümünün güncellenmesi.","cozulecek_sorun":"Dayanıklılık iddiaları ölçülmemiş; hiçbir arıza senaryosu çalıştırılmamış.","yetenek_siniflari":["Y-12","Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Sekiz senaryonun her biri için tatbikat sonucu kayıtlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-061","S-063"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-005"],"kume":"K16","alan":"B-ajan-platformu"},{"id":"N-K16-010","baslik":"Bileşen değişimi ve devreden çıkarmada iş anlamının taşınması ve açık kayıp","ihtiyac":"Bir platform bileşeni, sağlayıcı, ajan rolü veya yetenek paketi değiştirildiğinde ya da devreden çıkarıldığında; devam eden, iptal edilmiş ve tamamlanmış işlerin kayıtlarının, sürüm ilişkilerinin, karar gerekçelerinin ve kanıt bağlarının kimlik ve anlamıyla taşınabilmesi; taşınamayan veri, özellik veya kanıtın açıkça listelenmesi; önceki kabulün yeni ortam için kendiliğinden geçerli sayılmaması; devreden çıkarılan bileşenin kimlik, erişim ve zamanlanmış etkilerinin sahipsiz kalmaması.","cozulecek_sorun":"Dosya dışa aktarılabildiği için karar geçmişinin ve ilişkilerin de taşındığı varsayılır; aynı alan adı farklı birim, zaman veya durum anlamıyla aktarılır; eski hizmet kapandıktan sonra kabul kanıtına erişilemez; kullanımdan kalkan ajan veya paketin erişimi ve zamanlanmış işleri açık kalır.","yetenek_siniflari":["Y-28","Y-35","Y-62"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Pilotta bileşen sayısı azdır; yaygınlaştıkça bileşen ve sağlayıcı değişimleri sıklaşır ve birden çok ekibin geçmiş kanıtını etkiler.","olcek_esigi":"pilot sonrası","kabul_olcutleri":["Bileşen değişiminden sonra örnek devam eden, iptal edilmiş ve tamamlanmış işler yeni ortamda kimlik ve ilişkileriyle okunabiliyor; eksik parça varsa iş tamamlanmış sayılmıyor.","Taşınamayan veri, özellik ve kanıt listesi değişim kararıyla birlikte kayıtlı.","Aynı alan adıyla farklı anlam (birim, zaman, durum) taşıyan aktarım tespit ediliyor; biçimsel geçerlilik tek başına yeterli sayılmıyor.","Devreden çıkarılan her bileşen, rol veya paket için kalan kimlik, erişim ve zamanlanmış iş sayısı sıfır ya da gerekçeli."],"kanit":{"duzey":"arastirma","kaynaklar":["S-095","S-383","S-377","S-376"],"not":"Web veri rehberi sürüm bilgisini, kimliklerin korunmasını, erişilemeyen veri için açıklama verilmesini ve arayüzde kırıcı değişiklikten kaçınılmasını önerir; risk yönetimi çerçevesi amaçla uyumsuz sistemlerin devreden çıkarılması için mekanizma ve sorumluluk ister. Benzer mevcut ihtiyaçlar: N-K16-005 (sürümleme ve güvenli güncelleme), N-K16-006 (bakım durumu ve yedek plan), N-K18-003 (yetim kimlikler). Fark: değişimde iş anlamının ve kanıtın taşınması ile devreden çıkarma sonrası kalan etki tanımlı değildi."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K16-005","N-K16-006"],"iliskili":["G-036"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T17; ihtiyac-kumeleri/kumeler/02_ajan_bilgi_ve_etkilesim/01_ajan_ve_model_yetenekleri.json#I05-07; ihtiyac-kumeleri/kumeler/05_sureklilik_ve_ogrenme/01_isletim_ve_kurtarma.json#I15-07","dogrulama":"kismen","kaynak_url":["https://www.w3.org/TR/dwbp/","https://www.w3.org/TR/prov-dm/","https://airc.nist.gov/airmf-resources/playbook/manage/"],"kume":"K16","alan":"B-ajan-platformu"},{"id":"N-K17-001","baslik":"İnsan karar noktaları envanteri","ihtiyac":"Hangi kararın insan gerektirdiğinin tek listede tanımlanması: başlatma, belirsizlik cevabı, senaryo kilidi, plan onayı, test/eşik değişikliği onayı, yüksek/yasaklı risk onayı, yıkıcı işlem izni, yeni teknoloji onayı, insan davranış kabulü, sunum bulgusu triyajı, bütçe aşımı teşhisi.","cozulecek_sorun":"İnsan noktaları kaynaklara dağılmış; bazı akışlarda insan her tekrarı yürütüyor, bazılarında kritik karar atlanıyor.","yetenek_siniflari":["Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her insan noktası için tetikleyici, karar hakkı olan rol sınıfı ve beklenen kanıt yazılı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-010","S-013","S-018","S-003","S-001"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-002","H-05","Q-015"],"kume":"K17","alan":"C-guvence-ve-yonetisim"},{"id":"N-K17-002","baslik":"Kimlikli ve içeriğe bağlı onay","ihtiyac":"Onayın kimliği doğrulanmış kişiyle ve onaylanan içeriğin özetiyle (spesifikasyon, yama, ortam) bağlanması; içerik değişince onayın geçersiz olması.","cozulecek_sorun":"Eski onay yeni yamada kullanılıyor; bildirim kanalındaki onay izlenemiyor.","yetenek_siniflari":["Y-31","Y-28","Y-25"],"zorunluluk":"zorunlu","kabul_olcutleri":["Yama veya kriter değişince onay otomatik geçersiz.","Her onayda kişi, zaman ve içerik özeti kayıtlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-061","S-063","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["R-017"],"kume":"K17","alan":"C-guvence-ve-yonetisim"},{"id":"N-K17-003","baslik":"Standart engel kaydı ve sahipliği","ihtiyac":"Her 'engel' çıktısının rol, neden, kanıt, gereken karar, sahip ve süre hedefi içeren standart bir kayda dönüşmesi; engelin kime gittiğinin ve hangi düzeyde (ekip, ART, portföy) çözüleceğinin tanımlanması.","cozulecek_sorun":"Rollerin çoğu 'engel raporla' ile bitiyor ama raporun alıcısı tanımsız; engelli işin backlog'daki durumu belirsiz.","yetenek_siniflari":["Y-31","Y-32"],"zorunluluk":"zorunlu","kabul_olcutleri":["Sahipsiz engel sayısı 0.","Engel çözüm süreleri ölçülüyor.","Ekipler üstü koordinasyon katmanına yükseltme tetikleri yazılı (ekipler arası bağımlılık, çelişen hedef, ortak politika ihlali, kapasite çatışması, tekrarlayan hata örüntüsü); rutin iş bu katmanın onay kuyruğuna girmiyor."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-031","S-032","S-043","S-049","S-052","S-097"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-002","Q-021"],"codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#pdf_topic_coverage/B05","dogrulama":"kismen","ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-097 eklendi; mevcut metin değiştirilmedi.","kume":"K17","alan":"C-guvence-ve-yonetisim"},{"id":"N-K17-004","baslik":"Bekleme süreleri ve eskalasyon","ihtiyac":"İnsan bekleme durumları için süre hedefi, aşımında eskalasyon ve bekleme süresinin aktif süreden ayrı ölçülmesi.","cozulecek_sorun":"Aktif süre sınırı insan beklemesini dışlıyor, dolayısıyla bekleme sınırsız uzayabiliyor.","yetenek_siniflari":["Y-31","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her bekleme durumunun süre hedefi ve eskalasyon yolu var.","Bekleme süresinin dolması veya yanıt gelmemesi onay ya da kabul kararı üretmiyor; sessizlik izin sayılmıyor.","Yetkili karar verici ulaşılamaz durumdayken yalnız geri döndürülebilir ve yetki genişletmeyen faaliyetler sürüyor; bağımlı eylem açık ar":["S-001"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K17","alan":"C-guvence-ve-yonetisim"},{"id":"N-K17-010","baslik":"'Değerlendiremiyorum' hakkı ve onaycı için anlamlı kontrol koşulları","ihtiyac":"İnceleme ve onay atanan kişinin değişikliği değerlendirecek bilgi, süre veya yetkinliğe sahip olmadığını cezasız biçimde bildirip işi yetkin bir inceleyiciye yönlendirebilmesi; risk sınıfı başına asgari kanıt erişimi ve inceleme süresinin güvenceye alınması; olay sonrası analizde onaycının gerçekte sahip olduğu kontrol koşullarının (bilgi, süre, iş yükü) değerlendirilmesi.","cozulecek_sorun":"Otomasyonlu sistemlerde sorumluluk sistem üzerinde sınırlı kontrolü olan en yakın insana yüklenir (ahlaki çarpışma bölgesi). İnsan yalnız 'onaylayıcı' olarak konumlandırıldığında gerçek kontrolü olmadan suçun taşıyıcısı olur; bu da ya körlemesine onaya ya da savunmacı reddetmeye iter.","yetenek_siniflari":["Y-31","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"İnceleme yükü arttıkça onaycıların zaman baskısı artar; 10+ ekipte yönlendirme havuzu rol sınıfı ve yetkinlik kaydına dayanmalı.","kabul_olcutleri":["Onay yüzeyinde 'değerlendiremiyorum' seçeneği ve yönlendirme akışı var; kullanımı ölçülüyor ve cezalandırılmıyor.","Olay sonrası analiz şablonunda onaycının kontrol koşulları bölümü zorunlu.","Risk sınıfı başına asgari inceleme süresi ve kanıt erişimi tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-202","S-192","S-157"],"not":"Ahlaki çarpışma bölgesi kavramı (Elish 2019). Otonom araç kazasında operatörlerin etkisiz gözetimi ve otomasyon rehavetine karşı mekanizma yokluğu katkıda bulunan etken sayıldı (NTSB HAR-19/03). Düzenleme, gözetimi yapan kişinin çıktıyı kullanmamaya, göz ardı etmeye veya tersine çevirmeye karar verebilmesini istiyor (Madde 14/4-d). Benzer mevcut ihtiyaç: N-K25-004; fark: N-K25-004 her çıktının sorumlu insanını, N-K17-006 onay ekranının zorunlu alanlarını tanımlıyor; onaycının reddetme/yönlendirme hakkı ve anlamlı kontrolün koşulları tanımsız."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-033"],"bagimliliklar":["N-K25-004"],"kume":"K17","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-001","baslik":"Ürün yetkilendirmesinin tek karar noktasında ve deterministik olması","ihtiyac":"Ürünün 'kim, neyi, hangi koşulda yapabilir' kararının arka uçta tek karar noktasında, rol/öznitelik/ilişki/sahiplik/kaynak düzeyi modelleriyle verilmesi; ön yüz kontrolünün güvenlik sayılmaması; dil modelinin yetki kararı vermemesi; yetkisiz ve doğrudan arayüz çağrısı testleri.","cozulecek_sorun":"Yetki ön yüzde veya modelde kontrol ediliyor; bozuk erişim kontrolü en yaygın güvenlik riski.","yetenek_siniflari":["Y-24"],"zorunluluk":"kosullu","kabul_olcutleri":["Korunan her uçta yetkisiz ve doğrudan çağrı testi ret dönüyor.","Yetki kararlarında dil modeli çağrısı 0."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-050","S-022","S-028","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["C-020","D-021","G-009","Q-034"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-002","baslik":"Ürün yetkisi ile hat yetkisinin ayrılması","ihtiyac":"'Yetkilendirme' kavramının iki ayrı ihtiyaç olarak tanımlanması: üretilen ürünün yetki modeli ve ajan hattının kendi izinleri (kim başlatır, kim onaylar, ajan neyi yapabilir).","cozulecek_sorun":"Kaynaklarda aynı rol adı bir yerde ürün yetkisini, bir yerde ajanın çalışma zamanı izinlerini kapsıyor.","yetenek_siniflari":["Y-24","Y-25"],"zorunluluk":"zorunlu","kabul_olcutleri":["İki kapsam ayrı ihtiyaç ve ayrı sahiplerle tanımlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-050","S-021","S-022","S-028"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["C-020","G-009","Q-034"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-003","baslik":"Ajan kimliği ve en az yetki","ihtiyac":"Her ajan koşusunun kısa ömürlü, göreve özel, en az yetkili kimlik bilgisiyle çalışması; yetim makine kimliklerinin envanterlenmesi ve kapatılması.","cozulecek_sorun":"Aşırı yetkili ve yetim makine kimlikleri saldırı yüzeyini büyütüyor.","yetenek_siniflari":["Y-25"],"zorunluluk":"zorunlu","kabul_olcutleri":["Ajan kimlik bilgileri görev süresiyle sınırlı.","Kullanılmayan makine kimliği envanteri periyodik temizleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-151","S-152"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["A-014","G-006","H-08","U-009"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-004","baslik":"Gizli bilgi yönetimi","ihtiyac":"Sırların ajan bağlamına, istemlere, kural dosyalarına, loglara ve izlere düşmemesi; sırların çalışma ortamı dışında tutulması; sır taraması (değişiklik öncesi ve geçmiş).","cozulecek_sorun":"Yapay zekâ destekli depolarda sır sızıntısı oranı daha yüksek; kötü amaçlı paketler ajan araçlarını sır aramak için kullanabiliyor.","yetenek_siniflari":["Y-25","Y-21"],"zorunluluk":"zorunlu","kabul_olcutleri":["Değişiklik öncesi ve geçmiş sır taraması aktif.","İz ve loglarda sır taraması yapılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-062","S-135","S-148"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["H-08","R-009","U-020"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-005","baslik":"İstem enjeksiyonuna dayanıklı tasarım","ihtiyac":"İş kalemi, yorum, doküman, bağımlılık açıklaması ve web içeriğinin güvenilmeyen girdi olarak ayrılması; önce planla sonra yürüt gibi mimari desenlerle ajanın yetkisinin kısıtlanması; yüksek riskli araç çağrılarının ayrıca onaylanması.","cozulecek_sorun":"Gizlenmiş talimatlar ajanın hedefini ele geçirebiliyor; filtreleme tek başına yetmiyor; LLM güvenlik risk listelerinde ilk sırada.","yetenek_siniflari":["Y-26","Y-18"],"zorunluluk":"zorunlu","kabul_olcutleri":["Dış içerik okuyan ajanların yazma ve ağ yetkileri kısıtlı.","Enjeksiyon senaryoları kırmızı takım testinde denenmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-144","S-150","S-151","S-145"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili" varlık/itibar kontrolünden geçmeden eklenemiyor.","Yayınlanan her pakette malzeme listesi var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-110","S-111","S-159","S-147"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-006","H-08","R-010","R-031","U-013"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-009","baslik":"Güvenlik taraması kapısı","ihtiyac":"Statik ve dinamik güvenlik analizi, altyapı kodu taraması ve bağımlılık zafiyeti taramasının deterministik kapıda koşması.","cozulecek_sorun":"Üretilen kodda güvenlik açığı oranı yüksek; yapay zekâ kullananlar daha güvensiz kod yazıp kodlarından daha emin oluyor.","yetenek_siniflari":["Y-21"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kritik/yüksek bulgu varken birleştirme yok.","Güvenlik bulgu eşikleri sayısal tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-030","S-133","S-134"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["G-004","Q-028","R-032"],"bagimliliklar":["N-K05-012"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-010","baslik":"Dışarıya gidecek veri politikası","ihtiyac":"Barındırılan servislere ve dış modellere hangi veri alanlarının gidebileceğinin alan bazında yazılması; kod, iş kalemi ve kişisel verinin sınıflandırılması.","cozulecek_sorun":"Kod ve görev metni izinsiz dışarı çıkıyor; veri sınıfı bilinmeden model barındırma kararı verilemiyor.","yetenek_siniflari":["Y-36","Y-02"],"zorunluluk":"zorunlu","kabul_olcutleri":["Alan bazında izin listesi var ve hat tarafından uygulanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062","S-162"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["D-002","G-027","Q-010","Q-043","R-011","U-042"],"bagimliliklar":["N-K22-005"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-011","baslik":"İz ve loglarda kişisel veri ve sır maskeleme","ihtiyac":"Ajan izlerinin, istemlerin ve logların kişisel veri ve sır açısından maskelenmesi; izleme sisteminin yeni bir hassas veri deposuna dönüşmemesi.","cozulecek_sorun":"İzler kimlik numarası, e-posta ve anahtar biriktirebiliyor.","yetenek_siniflari":["Y-36","Y-27"],"zorunluluk":"kosullu","kabul_olcutleri":["İz verisinde periyodik veri kaybı önleme taraması yapılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-162","S-135"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["R-009","R-011","U-018"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-012","baslik":"Ajan hattına kırmızı takım testi","ihtiyac":"Canlıya almadan önce ve periyodik olarak ajan hattına saldırı simülasyonu: dolaylı istem enjeksiyonu, araç zehirlenmesi, kural dosyası arka kapısı, sır sızdırma.","cozulecek_sorun":"Bilinmeyen saldırı yolları canlıda keşfediliyor.","yetenek_siniflari":["Y-47"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Kırmızı takım bulguları kapatılmadan hat genişletilmiyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-153","S-151"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"üretim","iliskili":["G-006","R-008","U-010"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-013","baslik":"Geliştirici makinelerindeki ajan araçlarının güvenliği","ihtiyac":"Geliştirici makinelerinde çalışan ajan araçlarının uç nokta politikasıyla sınırlanması; kötü amaçlı paketlerin bu araçları kullanmasının önlenmesi.","cozulecek_sorun":"Kötü amaçlı paketler geliştirici makinesindeki yapay zekâ komut satırı araçlarını sır aramak için kullandı.","yetenek_siniflari":["Y-25","Y-18"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Uç nokta politikası ajan araçlarının izinlerini kapsıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-148"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","iliskili":["R-033","U-012"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K18-014","baslik":"Adına işlem yapılan taraf ile yürütücünün ayrılması ve yetki iptalinin yayılması","ihtiyac":"Devredilmiş her eylemde adına hareket edilen insanın, o an eylemi yürüten ajan veya servisin ve geçerli yetki dayanağının ayrı kaydedilmesi; bir insanın ya da ajanın yetkisi geri alındığında kuyruktaki, çalışmakta olan, alt ajana devredilmiş ve kesintiden dönen işlerin yeniden etki yaratma hakkının güncel yetki durumuna göre belirlenmesi; iptalin tüm uçlara ulaşmasının doğrulanması ve yayılım süresinde hangi davranışa izin verildiğinin tanımlı olması.","cozulecek_sorun":"Aynı servis kimliği farklı insanlar adına iş yaptığında hangi eylemin kimin yetkisine dayandığı kaybolur; üst oturum kapatıldığında bütün alt izinlerin de iptal edildiği varsayılır, oysa iptal sunucular arasında gecikmeyle yayılabilir ve ilişkili izinlerin iptali politikaya bağlıdır; eski yetki zincirinin kaydı güncel erişim hakkı gibi kullanılır.","yetenek_siniflari":["Y-25","Y-28","Y-12"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip ve ajan sayısı arttıkça ortak servis kimlikleri, zincirleme devirler ve ekip değişiklikleri artar; iptal yayılımı ekipler arası bir güvenlik sınırı olur.","kabul_olcutleri":["Her ajan eyleminin kaydında adına hareket edilen taraf, yürütücü kimlik ve yetki dayanağı ayrı alanlarda.","Yetki geri alındıktan sonra bekleyen alt iş veya kesintiden dönen koşu eski izinle yeni etki oluşturamıyor (tatbikatla doğrulanmış).","İptal bildirimi başarısız olduğunda bu 'tamamlandı' sayılmıyor; iptalin doğrulanamadığı uçlar görünür.","İptal yayılım süresi boyunca izin verilen ve verilmeyen davranış yazılı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-095","S-380","S-381"],"not":"Yetki değişim standardı devirde adına işlem yapılan özne ile yetki devredilen aktörü ayrı gösterir; iptal standardı iptalin sunucular arasında gecikmeyle yayılabileceğini ve ilişkili izinlerin iptalinin sunucu politikasına bağlı olduğunu belirtir. Benzer mevcut ihtiyaçlar: N-K18-003 (kısa ömürlü en az yetkili kimlik, yetim kimlik temizliği), N-K27-007 (gözetim devri). Fark: adına işlem/yürütücü ayrımı ve iptalin devam eden işlere yayılımı tanımlı değildi."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K18-003","N-K19-002"],"iliskili":["G-037","Q-074","U-074"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T12; ihtiyac-kumeleri/kumeler/03_guvenli_ve_tutarli_yurutme/02_guvenlik_yetki_ve_guven.json#I10-09","dogrulama":"dogrulandi","kaynak_url":["https://www.rfc-editor.org/rfc/rfc8693.html","https://www.rfc-editor.org/rfc/rfc7009.html"],"kume":"K18","alan":"C-guvence-ve-yonetisim"},{"id":"N-K19-001","baslik":"Uçtan uca iz","ihtiyac":"İş kalemi → koşu → ajan → araç çağrısı → model çağrısı zincirinin ortak bir kimlikle izlenmesi; istem, araç çağrısı, karar, süre ve maliyetin kaydı.","cozulecek_sorun":"Ajan kara kutu; maliyet ve kalite görünmüyor; hata kaynağı bulunamıyor.","yetenek_siniflari":["Y-27"],"zorunluluk":"zorunlu","kabul_olcutleri":["Ortak görev kimliği tüm iz parçalarında var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-063","S-062","S-175"],"not":"Üretken yapay zekâ telemetri şeması hâlâ gelişiyor; şema değişebilir."},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["U-038"],"kume":"K19","alan":"C-guvence-ve-yonetisim"},{"id":"N-K19-002","baslik":"Değiştirilemez denetim kaydı","ihtiyac":"Kim, ne zaman, hangi model/kural/paket/istem sürümüyle ne üretti ve kim onayladı bilgisinin değiştirilemez biçimde tutulması.","cozulecek_sorun":"Sorumluluk ve adli inceleme yapılamıyor; eşik gevşetmeleri gizlenebiliyor.","yetenek_siniflari":["Y-28"],"zorunluluk":"zorunlu","kabul_olcutleri":["Denetim kaydı zincirinin bütünlüğü doğrulanabiliyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-021","S-157","S-160"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["R-017","R-023"],"kume":"K19","alan":"C-guvence-ve-yonetisim"},{"id":"N-K19-003","baslik":"Beklenti ve eşik değişikliklerinin izi","ihtiyac":"Test, eşik, tolerans, maske ve görsel referans değişikliklerinin kim, ne zaman, neden bilgisiyle değiştirilemez biçimde kaydedilmesi.","cozulecek_sorun":"Eşik gevşetmesi sessizce yapılabiliyor.","yetenek_siniflari":["Y-28"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her beklenti değişikliğinde gerekçe ve onaylayan kayıtlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-002"]},"cember":"ic_tanimli","belirsizlik":"dusuk","bagimliliklar":["N-K05-005"],"kume":"K19","alan":"C-guvence-ve-yonetisim"},{"id":"N-K19-004","baslik":"Kanıt ve artefakt saklama","ihtiyac":"Kanıt paketleri, raporlar, loglar ve izlerin referansla erişilebilir biçimde saklanması; saklama süresinin tanımlanması.","cozulecek_sorun":"Denetimde kanıta ulaşılamıyor ya da hassas veri gereğinden uzun saklanıyor.","yetenek_siniflari":["Y-28","Y-36"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her artefakt türü için saklama süresi tanımlı."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-006","S-063"]},"cember":"ic_bosluk","belirsizlik":"orta","bagimliliklar":["N-K22-009"],"kume":"K19","alan":"C-guvence-ve-yonetisim"},{"id":"N-K19-005","baslik":"Yeniden üretilebilirlik","ihtiyac":"Bir koşunun sonucunun, sabitlenen sürümler ve kayıtlı girdilerle yeniden üretilebilmesi ya da farkın açıklanabilmesi; belirlenimsizliğin çoklu koşuyla ölçülmesi.","cozulecek_sorun":"Aynı girdiye farklı çıktı; denetimde açıklanamayan fark.","yetenek_siniflari":["Y-28","Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Denetim örnekleminde koşular yeniden oynatılabiliyor veya fark açıklanabiliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-125","S-061"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["U-035"],"kume":"K19","alan":"C-guvence-ve-yonetisim"},{"id":"N-K19-006","baslik":"İnsan katkısının kaydı","ihtiyac":"Üretilen koda insan katkısının (yönlendirme, düzenleme, onay) kaydedilmesi; yazarlık bilgisinin korunması.","cozulecek_sorun":"Tamamen ajan üretimi kodun fikri mülkiyet koruması zayıf olabilir; kimin neyi yazdığı sonradan kanıtlanamıyor.","yetenek_siniflari":["Y-28"],"zorunluluk":"kosullu","kabul_olcutleri":["Değişikliklerde insan katkısı türü kayıtlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-166","S-167"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["Q-031","U-016"],"bagimliliklar":["N-K22-003"],"kume":"K19","alan":"C-guvence-ve-yonetisim"},{"id":"N-K19-007","baslik":"Program ve ekip görünürlüğü","ihtiyac":"Ajan işlerinin durumu, kuyrukları, engelleri, maliyeti ve kalite sinyallerinin ekip, ART ve portföy düzeyinde görülebilmesi.","cozulecek_sorun":"Ajan etkisi ekip içinde kalıyor; program düzeyinde karar verilemiyor.","yetenek_siniflari":["Y-39","Y-27"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Ekip, ART ve portföy görünümleri aynı veriden besleniyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-171"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","kume":"K19","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-001","baslik":"Tek, sürümlü deneme/süre/maliyet politikası","ihtiyac":"Tüm deneme, süre ve maliyet sınırlarının tek, sürümlü bir politika kaynağında tutulması; her deneme türünün hangi sayacı artırdığının tanımlanması; her ajan çağrısından önce kontrol edilmesi; ilk dolan sınırda durulması.","cozulecek_sorun":"Kaynaklarda sayılar çelişiyor (davranış başına 3+2 / 3+3=6; görev başına 10 / 12; düzeltme ajanı 4 / 6; 'max 12' döngüsünün neyi saydığı belirsiz). Çelişkili sayılar koda dökülürse yanlış sınırlar binlerce işe kopyalanır.","yetenek_siniflari":["Y-09","Y-35","Y-30"],"zorunluluk":"zorunlu","kabul_olcutleri":["Politika dosyası tek kaynak; her sayacın anlamı yazılı.","Her çağrı öncesi bütçe kontrolü kayıtlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007","S-013","S-030","S-061","S-062"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["A-011","C-001","D-003","G-003","H-06","Q-019","R-002"],"kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-002","baslik":"Sayaç anlamları","ihtiyac":"Yalnız 'kod değişti ve doğrulama başarısız' olayının kod deneme sayacını artırması; beklenen RED'in ve başarılı döngünün sayılmaması; altyapı denemelerinin ayrı sayılması; deterministik kapı, kalite dönüşü, test düzeltme, belirsizlik turu ve görev bölme sayaçlarının ayrı tanımlanması.","cozulecek_sorun":"Haksız bütçe tüketimi; farklı türde denemelerin aynı sayaçta toplanması.","yetenek_siniflari":["Y-30","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Sayaç olayları türe göre etiketli.","Altyapı sayacı kod sayacından ayrı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-007","S-006","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["C-001","D-003","G-003","Q-020"],"bagimliliklar":["N-K20-001"],"kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-003","baslik":"Sıfırlanamayan paylaşılan görev bütçesi","ihtiyac":"Sayaçların yalnız görev kimliğine bağlı olması; model, alt ajan veya yeni koşu değişiminin bütçeyi yenilememesi; paralel dalların bütçeyi önceden ayırması.","cozulecek_sorun":"Model veya ajan değiştirerek bütçe atlatılıyor.","yetenek_siniflari":["Y-30","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Model değişimi kalan bütçeyi değiştirmiyor (test).","Sayaç sıfırlama arayüzü yok."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-004","baslik":"Aktif süre ile insan beklemesinin ayrılması","ihtiyac":"Aktif süre sayacının insan beklemesi sırasında durması; insan beklemesinin ayrı ölçülmesi.","cozulecek_sorun":"Bekleme bütçeyi tüketiyor ya da tersine bekleme hiç sınırlanmıyor.","yetenek_siniflari":["Y-30","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Aktif süre sayacı bekleme sırasında duruyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","bagimliliklar":["N-K17-004"],"kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-005","baslik":"Görev başına maliyet tavanı ve birimi","ihtiyac":"Görev, davranış ve ekip başına maliyet tavanının değeri ve biriminin tanımlanması; maliyet biriminin (model + araç + yalıtım + orkestrasyon + depolama + insan müdahalesi) / kabul edilmiş görev olarak ölçülmesi.","cozulecek_sorun":"Maliyet tavanı var ama değeri ve birimi yok; token ucuzluğu tek başına tasarruf sanılıyor.","yetenek_siniflari":["Y-30"],"zorunluluk":"zorunlu","kabul_olcutleri":["Tavanın değeri, birimi ve kapsamı yazılı.","Kabul edilmiş görev başına maliyet medyan ve üst yüzdelik olarak raporlanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007","S-061","S-062"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-008","Q-013","R-007","R-037","U-039"],"kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-006","baslik":"Uzun kuyruklu maliyet dağılımının yönetimi","ihtiyac":"Aynı görevde bile çok değişken olan token tüketiminin izlenmesi; üst yüzdelik sapmaların yakalanması; tahminlerin aralık olarak verilmesi.","cozulecek_sorun":"Ajan işleri sohbete göre katlarca fazla token harcıyor; modeller kendi maliyetini tahmin edemiyor; çok ajanlı yapı maliyeti katlıyor.","yetenek_siniflari":["Y-30","Y-27"],"zorunluluk":"zorunlu","kabul_olcutleri":["Görev başı maliyetin üst yüzdeliği izleniyor ve alarm eşiği tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-123","S-176"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-008","R-007","U-002"],"kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-007","baslik":"Maliyetin ekip, ART ve portföye atfı ve kotalar","ihtiyac":"Maliyetin ekip, ART, portföy, iş kalemi ve rol bazında atfedilmesi; ekip/ART kotaları; kapasite planlamasında token/maliyet bütçesinin yer alması.","cozulecek_sorun":"Maliyet görünmüyor; bir ekibin tüketimi diğerlerini etkiliyor; bütçe aşımı geç fark ediliyor.","yetenek_siniflari":["Y-30","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip sayısı belirsiz olduğundan kota ve etiketler yapılandırmayla eklenip çıkarılabilmeli.","kabul_olcutleri":["Her maliyet kaydında ekip/ART etiketi var.","Kota aşımında tanımlı davranış (bekle, yükselt, onay iste) var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-123","S-171"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","iliskili":["G-008","Q-003","Q-013","R-007"],"kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-008","baslik":"Toplu işler için ayrı bütçe","ihtiyac":"Backlog normalizasyonu gibi toplu işlerin zorunlu bir toplu bütçe girdisiyle ve aşımda durmayla yürütülmesi.","cozulecek_sorun":"Toplu iş sınırsız maliyet üretebilir.","yetenek_siniflari":["Y-30"],"zorunluluk":"zorunlu","kabul_olcutleri":["Toplu iş bütçesiz başlatılamıyor; aşımda duruyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K20-009","baslik":"Spesifikasyon kalitesinin maliyet kontrolü olarak ele alınması","ihtiyac":"Hazır olma kalitesi ile görev maliyeti arasındaki ilişkinin ölçülmesi ve hazır olma kapısının maliyet kontrolü olarak da kullanılması.","cozulecek_sorun":"Ayrıntılı spesifikasyon yerine çıplak hikâye verildiğinde maliyet belirgin artıyor.","yetenek_siniflari":["Y-30","Y-44"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["DoR puanı ile görev maliyeti ilişkisi raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-124"]},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"pilot sonrası","iliskili":["U-021"],"bagimliliklar":["N-K01-006"],"kume":"K20","alan":"C-guvence-ve-yonetisim"},{"id":"N-K21-001","baslik":"Tek risk ölçeği tanımı","ihtiyac":"Olasılık ve etki için tek bir ölçeğin (seviye sayısı, her seviyenin takvim/maliyet/performans/güvenlik/veri boyutlarında tanımı, olasılık bantları) seçilmesi ve tüm akışlarda kullanılması.","cozulecek_sorun":"Kaynaklarda 3, 4 ve 5 seviyeli farklı risk modelleri ve 3×3, 5×5, 10×10 referans matrisler var; aynı değişiklik farklı akışta farklı riskli sayılıyor.","yetenek_siniflari":["Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Tek ölçek ve seviye tanımları yazılı; tüm akışlar aynı ölçeği kullanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-030","S-013","S-053","S-057","S-058","S-059","S-060"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["C-010","D-004","G-018","H-06","Q-018"],"kume":"K21","alan":"C-guvence-ve-yonetisim"},{"id":"N-K21-002","baslik":"Risk kategorileri","ihtiyac":"Değişiklik risk kategorilerinin (işlev ve iş kuralları, güvenlik ve gizlilik, güvenilirlik ve kurtarma, performans ve verimlilik, deneyim ve erişilebilirlik, veri ve sözleşmeler, kod/mimari/işletim) tanımlanması ve her değişikliğin her kategori için 'etkilenir/etkilenmez' kararı alması.","cozulecek_sorun":"Fonksiyon dışı gereksinimler atlanıyor.","yetenek_siniflari":["Y-06","Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her değişiklikte kategori bazında etkilenme kararı kayıtlı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-030","S-053"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K21","alan":"C-guvence-ve-yonetisim"},{"id":"N-K21-003","baslik":"Risk seviyesi → eylem eşlemesi","ihtiyac":"Her risk seviyesinin otomasyon düzeyini belirlemesi (ör. yasaklı → dur ve geri al; yüksek → insan onayı; orta/düşük → otomatik), eşlemenin tek biçimde tanımlanması.","cozulecek_sorun":"Kaynaklar çelişiyor: bir akışta düşük risk de aksiyon planı döngüsüne giriyor, diğerinde düşük/orta doğrudan geçiyor; risk adımının akıştaki yeri de farklı.","yetenek_siniflari":["Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Seviye → eylem tablosu tek ve yazılı; akışta riskin değerlendirildiği nokta tek."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-030","S-013","S-062"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["C-010","D-004","G-018","Q-018"],"bagimliliklar":["N-K21-001"],"kume":"K21","alan":"C-guvence-ve-yonetisim"},{"id":"N-K21-004","baslik":"Yasaklı değişiklik sınıfı","ihtiyac":"Hangi değişikliklerin ajan tarafından hiç yapılamayacağının (yasaklı) listelenmesi; yasaklı sınıfın normal onayla açılamaması, politika değişikliği gerektirmesi.","cozulecek_sorun":"Yasaklı değişikliğin otomatik düzeltme döngüsüne girmesi.","yetenek_siniflari":["Y-09","Y-42"],"zorunluluk":"zorunlu","kabul_olcutleri":["Yasaklı sınıfta otomatik düzeltme 0.","Yasaklı değişiklik listesi yazılı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-030","S-062"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["Q-018"],"kume":"K21","alan":"C-guvence-ve-yonetisim"},{"id":"N-K21-005","baslik":"Program risk kaydı","ihtiyac":"Programın kendi risklerinin (model kayması, sağlayıcı kesintisi, regülasyon takvimi, kapasite, beceri körelmesi vb.) tek bir kayıtta sahip, olasılık, etki ve izleme sinyaliyle tutulması; program artımı planlamasında risk ele alma yöntemiyle ilişkilendirilmesi.","cozulecek_sorun":"Program riskleri değişiklik risklerinden ayrılmamış; ajan özgü riskler planlamaya girmiyor.","yetenek_siniflari":["Y-39"],"zorunluluk":"zorunlu","kabul_olcutleri":["Program risk kaydı var ve periyodik gözden geçiriliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-153","S-171"]},"cember":"dis_eksik","belirsizlik":"orta","kume":"K21","alan":"C-guvence-ve-yonetisim"},{"id":"N-K21-006","baslik":"Risk aksiyon planı döngüsünün tanımı","ihtiyac":"Ana süreçteki 'aksiyon planı yarat, en fazla 12 kez çözüm dene, aşarsa hata' döngüsünün neyi saydığının ve 'devam' sonrası akışın nereye gittiğinin tanımlanması.","cozulecek_sorun":"Döngünün sayacı ve çıkışı tanımsız; görev toplam deneme sınırıyla karışıyor.","yetenek_siniflari":["Y-12","Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Döngünün sayacı, çıkışı ve görev bütçesiyle ilişkisi yazılı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-030"]},"cember":"ic_bosluk","belirsizlik":"yuksek","iliskili":["C-001","G-003","Q-019"],"bagimliliklar":["N-K20-001"],"kume":"K21","alan":"C-guvence-ve-yonetisim"},{"id":"N-K21-007","baslik":"Yapay zekâ etki değerlendirmesi","ihtiyac":"Geliştirilen ürün yüksek riskli bir alanda ise (ör. kredi skorlama, işe alım, kamu hizmeti) yapay zekâ destekli geliştirme sürecinin kanıtlarının etki değerlendirmesine ve teknik dokümantasyona girmesi.","cozulecek_sorun":"Ürünün risk sınıfı bilinmeden geliştirme sürecinin kanıt yükümlülüğü bilinemiyor.","yetenek_siniflari":["Y-28"],"zorunluluk":"kosullu","kabul_olcutleri":["Her ürünün yapay zekâ düzenlemesi açısından risk sınıfı kayıtlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-158","S-156"]},"cember":"dis_eksik","belirsizlik":"yuksek","iliskili":["Q-030","R-023"],"bagimliliklar":["N-K22-006"],"kume":"K21","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-001","baslik":"Model lisans ve kullanım şartları envanteri","ihtiyac":"Her modelin tam sürümü için lisans, ticari ve çok kiracılı kullanım uygunluğu, indirme koşulları, kullanıcı eşikleri, ayrı tokenizer lisansı ve hukuk onayının kaydı; hizmet olarak kullanılan modellerde verinin eğitimde kullanımı, saklama süresi ve çıktı haklarının kaydı.","cozulecek_sorun":"Açık ağırlıklı modellerin çoğunda kullanım kısıtı var; 'değiştirilmiş izin verici' lisans izin verici lisansla aynı değil; lisansların hukuki incelemesi yapılmamış.","yetenek_siniflari":["Y-35"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kullanılan her modelin lisans kaydı ve hukuk onayı var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-025","S-029","S-014","S-019","S-168"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["R-012","R-037"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-002","baslik":"Açık kaynak bileşen lisans uyumu","ihtiyac":"Kullanılan bileşenlerin lisanslarının dağıtım biçimine (iç kullanım, müşteriye sunulan platform, çok kiracılı hizmet) göre değerlendirilmesi; üretilen kodda lisanslı koda benzerlik taraması.","cozulecek_sorun":"Modeller zaman zaman lisanslı koda çarpıcı biçimde benzeyen kod üretiyor ve lisans bilgisini yanlış veriyor; bazı bileşen lisansları çok kiracılı kullanımı kısıtlıyor.","yetenek_siniflari":["Y-21"],"zorunluluk":"zorunlu","kabul_olcutleri":["Dağıtılan yazılımda benzerlik ve lisans taraması zorunlu.","Bileşen lisansları dağıtım biçimine göre değerlendirilmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-019","S-061","S-137"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["R-012","U-017"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-003","baslik":"Üretilen kodun fikri mülkiyeti","ihtiyac":"Ajan üretimi kodun eser sahipliği ve korunabilirliği konusunda hukuki görüş; iş ve yüklenici sözleşmelerine yapay zekâ çıktısı hükmü; kritik algoritmalar için koruma stratejisi.","cozulecek_sorun":"Tamamen otonom üretilen çıktı telif korumasından yoksun kalabilir; yalnız istem yazmak yeterli insan kontrolü sayılmayabilir.","yetenek_siniflari":["Y-28"],"zorunluluk":"zorunlu","kabul_olcutleri":["Hukuki görüş alınmış ve sözleşme hükümleri güncellenmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-166","S-167"]},"cember":"dis_eksik","belirsizlik":"yuksek","iliskili":["G-007","Q-031","R-012","U-016"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-004","baslik":"Değişiklik yazarlık kimliği politikası","ihtiyac":"Değişiklik kayıtlarındaki yazar ve kaydeden kimliğinin kurum politikasına göre tüm ortamlarda (yerel, bulut, yalıtılmış çalışma ortamı) aynı biçimde zorlanması; araç/bot ortak yazar imzası eklenmemesi; başkasına ait geçmişin korunması.","cozulecek_sorun":"Yerel koruma bulut veya yalıtılmış ortamda çalışan ajanları kapsamıyor; yazarlık bilgisi bozulabiliyor.","yetenek_siniflari":["Y-25","Y-33"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her değişiklik üreten ortamda aynı yazarlık denetimi çalışıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-061"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-005","baslik":"Kişisel veri, veri yerelliği ve yurt dışı aktarım","ihtiyac":"Hangi verinin hangi modele (kurum içi/bölgesel/yurt dışı) gidebileceğinin veri sınıfına göre tanımlanması; yurt dışı aktarım bildirim süreçleri; sağlayıcının alt işleyici değişikliklerinin izlenmesi; istem ve loglarda veri minimizasyonu.","cozulecek_sorun":"Kişisel veri koruma rehberleri üretken yapay zekâ yaşam döngüsü boyunca yükümlülük tanımlıyor; yurt dışı aktarım için süreli bildirim yükümlülüğü var; kamu ve kritik altyapıda tedarik kısıtları olabilir.","yetenek_siniflari":["Y-36","Y-03"],"zorunluluk":"zorunlu","kabul_olcutleri":["Veri sınıfı × model barındırma matrisi yazılı ve hukuk onaylı.","Sağlayıcı alt işleyici değişiklikleri izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-162","S-163","S-164","S-161"]},"cember":"dis_eksik","belirsizlik":"yuksek","iliskili":["D-002","G-007","G-027","H-04","Q-010","Q-011","R-011","R-038","U-019","U-032"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-006","baslik":"Yapay zekâ düzenlemeleri ve insan gözetimi yükümlülükleri","ihtiyac":"Yapay zekâ düzenlemelerinin (insan gözetimi, kayıt tutma, şeffaflık, yapay zekâ okuryazarlığı) ve takvimlerinin izlenmesi; geliştirilen ürünlerin risk sınıfına göre geliştirme süreci kanıtlarının hazırlanması.","cozulecek_sorun":"Düzenleme takvimleri değişiyor; geliştirme ajanları çoğu zaman yüksek riskli değil ama geliştirilen ürün öyleyse süreç kanıtı gerekir.","yetenek_siniflari":["Y-28"],"zorunluluk":"kosullu","kabul_olcutleri":["Uyum takvimi izleniyor ve sahibi var.","Ürün bazında düzenleme kapsamı kayıtlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-157","S-158","S-178","S-165"]},"cember":"dis_eksik","belirsizlik":"yuksek","iliskili":["G-007","Q-030","R-023","U-031"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-007","baslik":"Siber güvenlik ve ürün sorumluluğu yükümlülükleri","ihtiyac":"Ürün pazarına göre siber dayanıklılık (zafiyet raporlama, malzeme listesi) ve ürün sorumluluğu (siber güvenlik kusuru dahil yazılım) yükümlülüklerinin ve ulusal siber güvenlik mevzuatının izlenmesi.","cozulecek_sorun":"Yeni düzenlemeler yazılımı ve tedarik zincirini kapsıyor; raporlama yükümlülükleri başladı.","yetenek_siniflari":["Y-41","Y-28"],"zorunluluk":"kosullu","kabul_olcutleri":["Ürün bazında yükümlülük listesi ve sahibi var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-159","S-160","S-164"]},"cember":"dis_eksik","belirsizlik":"yuksek","iliskili":["Q-030","U-031"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-008","baslik":"Sağlayıcı yönetimi","ihtiyac":"Model ve hizmet sağlayıcılarıyla veri saklama, verinin eğitimde kullanımı, alt işleyiciler, hizmet seviyesi ve fikri mülkiyet taahhütlerinin sözleşmeyle yönetilmesi.","cozulecek_sorun":"Sözleşmedeki kör noktalar veri ve mülkiyet riskine dönüşüyor.","yetenek_siniflari":["Y-02"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her sağlayıcı sözleşmesinde bu başlıklar değerlendirilmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-163","S-161"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-007","Q-043","U-019","U-042"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-009","baslik":"Saklama ve silme politikası","ihtiyac":"İz, log, kanıt, bellek ve öğrenme arşivleri için saklama sürelerinin ve silme süreçlerinin yasal ve denetim gerekliliklerine göre tanımlanması.","cozulecek_sorun":"Kanıt gerektiği süre saklanmıyor ya da kişisel veri gereğinden uzun tutuluyor.","yetenek_siniflari":["Y-36","Y-28"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her veri türü için saklama süresi ve silme süreci tanımlı."],"kanit":{"duzey":"cikarim","kaynaklar":["S-162"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["U-038"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-010","baslik":"Kurum yapay zekâ politikası ve yönetim sistemi","ihtiyac":"Kurum düzeyinde açık, iletilmiş bir yapay zekâ kullanım politikası; onaylı kullanım alanları; kayıt dışı kullanımın önlenmesi; yönetim sistemi yaklaşımıyla sürekli iyileştirme.","cozulecek_sorun":"Belirsiz kurallar kayıt dışı kullanımı artırıyor; açık ve iletilmiş duruş yapay zekâdan değer alan kurumların ortak özelliği.","yetenek_siniflari":["Y-35"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Politika yayımlanmış, sahibi ve gözden geçirme periyodu var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-103","S-155"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","iliskili":["R-033"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K22-011","baslik":"Dış projelerin yapay zekâ katkı politikalarına uyum","ihtiyac":"Ekiplerin dış açık kaynak projelere yaptığı katkılarda katkı öncesi projenin yapay zekâ katkı politikasının (yasak, açıklama zorunluluğu, sorumluluk beyanı) kontrol edilmesi; ajan destekli katkının yasak olduğu projelerde ajan kullanılmaması; açıklama zorunluluğu kurumun yazarlık kimliği politikasıyla (bot ortak yazar imzası eklenmemesi) çatıştığında çözümün karar kaydına bağlanması.","cozulecek_sorun":"Bazı projeler yapay zekâ üretimi katkıyı telif ve köken beyanı kaygısıyla yasaklıyor, bazıları açıklama ve tam insan sorumluluğu şartıyla kabul ediyor. Lisans uyumu ve kurum içi yazar kimliği tanımlı; dış projenin katkı kuralları kapsanmıyor.","yetenek_siniflari":["Y-21","Y-37"],"zorunluluk":"kosullu","olcek_etkisi":"Dış katkı yapan ekip sayısı arttıkça envanterin merkezi tutulması gerekir.","kabul_olcutleri":["Dış katkı yapılan projelerin yapay zekâ politikası envanteri var ve katkı öncesi kontrol ediliyor.","Kurum yazarlık politikası ile dış proje kuralı çatışmaları için karar kaydı var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-245","S-246","S-247","S-248"],"not":"Bir dağıtım projesi 2025'te açıklama ve tam sorumluluk şartıyla yapay zekâ destekli katkıya izin verdi; başka bir dağıtım 2024'te yasakladı; bir emülatör projesi köken beyanı gerekçesiyle yasaklayıp 2026'da sınırlı gevşetmeyi tartışıyor. Benzer mevcut ihtiyaç: N-K22-004; fark: N-K22-004 kurum içi yazar kimliği politikasını, N-K22-002 bileşen lisans uyumunu ele alıyor; dış projelerin yapay zekâ katkı kuralları ve bunların kurum politikasıyla çatışması tanımsız."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K22-004"],"kume":"K22","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-001","baslik":"Kurumun kendi görev seti","ihtiyac":"Kapanmış ve doğrulanmış çözümü olan geçmiş işlerden, iş türü × modül × karmaşıklık kırılımında katmanlanmış, kabul kriterleri önceden dondurulmuş, gizli testli bir değerlendirme seti; setin düzenli yenilenmesi.","cozulecek_sorun":"Kıyaslama puanları kurum içi başarıyı göstermiyor: açık setlerde sızıntı ve zayıf test var, özel kod tabanlarında başarı düşüyor.","yetenek_siniflari":["Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Katmanlanmış ve dondurulmuş görev seti var.","Set periyodik yenileniyor.","Görev setindeki her örnek kökeniyle (gerçek iş kaydı, taraf anlatımı, sentetik) etiketli; sentetik örnek gerçek kullanım kanıtı gibi sunulmuyor.","Normal tamamlamanın yanında belirsizlikte bekleme, devir, iptal, kısmi sonuç ve sonradan ortaya çıkan hata örneklerinin temsil durumu görünür; örneği olmayan dil, iş türü ve risk kesitleri açık bırakılıyor, veri yokluğu sıfır hata sayılmıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-017","S-138","S-139","S-095","S-375"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-005","H-07","U-024"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T01; ihtiyac-kumeleri/kumeler/01_amac_ve_ortak_anlayis/01_deger_ve_kapsam.json#I01-01","dogrulama":"kismen","kaynak_url":["https://airc.nist.gov/airmf-resources/playbook/measure/"],"ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-095, S-375 eklendi; mevcut metin değiştirilmedi.","kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-002","baslik":"Adil karşılaştırma koşulları","ihtiyac":"Karşılaştırılan yapılandırmalar için aynı çalışma zamanı sürümü, araçlar, istem, izin, test, bağlam, adım/süre bütçesi ve doğru şablonun kullanılması; eşitlenemeyen farkların raporlanması; değerlendirme yapılandırmasının sonuçla birlikte saklanması; önce katman belirlenip aynı işi yapan seçeneklerin karşılaştırılması.","cozulecek_sorun":"Aynı model farklı çalıştırıcıda farklı puan alıyor; pazarlama iddiası kanıt sanılıyor.","yetenek_siniflari":["Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Değerlendirme yapılandırması özetlenip sonuçla saklanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-017","S-015","S-061"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-003","baslik":"Çoklu koşu ve güven aralığı","ihtiyac":"Her yapılandırmanın her görevde en az 3 kez koşturulması; başarı, tutarlılık, süre, maliyet ve müdahalenin dağılımıyla raporlanması.","cozulecek_sorun":"Tek koşu yanıltıyor; belirlenimsizlik yüksek.","yetenek_siniflari":["Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Sonuçlar güven aralığıyla raporlanıyor.","Raporlarda yalnız en iyi deneme seçilmiyor; toplam deneme, k denemede tutarlılık ve insan yardımı başarıyla birlikte veriliyor.","Ara adım başarısı ile son iş durumu ayrı değerlendiriliyor; insan düzeltmesi gizlenerek tam özerk başarı raporlanmıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-017","S-125","S-095","S-385"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["U-035"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T20; ihtiyac-kumeleri/kumeler/04_dogruluk_ve_urun_nitelikleri/01_oracle_test_ve_kanit.json#I11-07","dogrulama":"dogrulandi","kaynak_url":["https://arxiv.org/abs/2406.12045"],"ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-095, S-385 eklendi; mevcut metin değiştirilmedi.","kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-004","baslik":"Role özel metrikler","ihtiyac":"Kodlama rolü için gizli kabul testleri ve eski testlerin geçmesi (test zayıflatma = başarısız); test rolü için bilinen hata/mutasyon yakalama, yanlış nedenle başarısızlık, gereksiz taklit nesne ve kararsız test sayısı; denetim rolü için doğrulanmış hata kümesinde yakalama ve yanlış alarm; sınıflandırıcılar için kalibrasyon ve kaçırma oranı.","cozulecek_sorun":"'Uzun rapor = başarı' yanılgısı; roller tek metrikle ölçülünce yanlış
