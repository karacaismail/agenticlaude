<style>
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#E7ECE9; --surface-3:#DCE3DF;
  --ink:#121A17; --muted:#56635E; --faint:#8A9892; --line:#D1D9D5;
  --accent:#2446C7; --accent-soft:#E2E7FA; --accent-ink:#FFFFFF;
  --ok:#1E7A55; --ok-soft:#DCEFE6; --warn:#B7791F; --warn-soft:#F6EAD3; --bad:#C0392B; --bad-soft:#F7DEDA;
  --dA:#2F5BD3; --dB:#8A4FC2; --dC:#13837F; --dD:#5E6B7D; --dE:#C2410C; --dF:#A21C5B;
  --shadow:0 1px 2px rgba(18,26,23,.06),0 6px 20px rgba(18,26,23,.06);
  --f-display:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1311; --surface:#141C19; --surface-2:#1B2521; --surface-3:#23302B;
    --ink:#E5ECE8; --muted:#9BA9A3; --faint:#6E7C76; --line:#2A3631;
    --accent:#8FA6FF; --accent-soft:#1E2747; --accent-ink:#0D1311;
    --ok:#4CC38A; --ok-soft:#15352A; --warn:#E3A546; --warn-soft:#3A2D14; --bad:#F07A6B; --bad-soft:#3F1F1B;
    --dA:#7F9BFF; --dB:#C39AF0; --dC:#4FC7C1; --dD:#A3AEBD; --dE:#F59A5B; --dF:#F07FB4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1311; --surface:#141C19; --surface-2:#1B2521; --surface-3:#23302B;
  --ink:#E5ECE8; --muted:#9BA9A3; --faint:#6E7C76; --line:#2A3631;
  --accent:#8FA6FF; --accent-soft:#1E2747; --accent-ink:#0D1311;
  --ok:#4CC38A; --ok-soft:#15352A; --warn:#E3A546; --warn-soft:#3A2D14; --bad:#F07A6B; --bad-soft:#3F1F1B;
  --dA:#7F9BFF; --dB:#C39AF0; --dC:#4FC7C1; --dD:#A3AEBD; --dE:#F59A5B; --dF:#F07FB4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.2vw,44px);font-weight:760;font-stretch:88%;line-height:1.05}
h2{font-size:clamp(20px,2.4vw,26px);font-weight:700;font-stretch:92%}
h3{font-size:16px;font-weight:650}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* header */
header.top{padding-block:28px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.top-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
.lede{margin-top:10px;color:var(--muted);max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:720;font-stretch:85%;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.circlebar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:14px;background:var(--surface-2)}
.circlebar i{display:block;height:100%}
.legend-inline{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)}

/* nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:6px}

main{padding-block:26px 80px}
section.pane{display:none}
section.pane.on{display:block}
.pane-head{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.pane-head p{max-width:70ch;color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.card h3+p,.card h3+ul{margin-top:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.chart{width:100%;height:420px}
.scroll-x{overflow-x:auto}
ul.clean{list-style:none;margin:0;padding:0}
ul.bul{margin:8px 0 0;padding-left:18px}
ul.bul li{margin-block:4px}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);white-space:nowrap;cursor:default}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-acc{background:var(--accent-soft);color:var(--accent)} .p-neu{background:var(--surface-2);color:var(--muted)}
.dom{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}

/* overview */
.goal{font-family:var(--f-display);font-size:clamp(18px,2vw,22px);font-weight:560;font-stretch:95%;line-height:1.35;max-width:60ch}
.domain-card{display:flex;flex-direction:column;gap:10px}
.domain-card .big{font-family:var(--f-display);font-size:34px;font-weight:720;font-stretch:85%;line-height:1;font-variant-numeric:tabular-nums}
.minibar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.minibar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.principle{display:grid;grid-template-columns:52px 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.principle:first-child{border-top:0}

/* circle */
.circle-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
#ch-cember{height:680px}
.prio{border-left:3px solid var(--line);padding:6px 0 6px 12px}
.prio.P1{border-color:var(--bad)} .prio.P2{border-color:var(--warn)} .prio.P3{border-color:var(--accent)}

/* explorer */
.filters{display:grid;grid-template-columns:2fr repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.filters input,.filters select{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.count-line{font-size:13px;color:var(--muted);margin-bottom:8px}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.t th{position:sticky;top:0;text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--surface-2)}
.t-title{font-weight:560}
.t-sub{color:var(--muted);font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* lists */
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vs > div{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quad .card{min-height:0}
.quad .qn{font-family:var(--f-display);font-size:30px;font-weight:720;font-stretch:85%;line-height:1}
.pestel-filter{display:flex;flex-wrap:wrap;gap:6px;margin-block:10px}
.pestel-filter button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.pestel-filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.35);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
aside.drawer.on{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer-body{padding:16px 20px calc(40px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.drawer-body h4{font-family:var(--f-mono);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.xbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.rel{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px;align-items:baseline}
@media (prefers-reduced-motion:reduce){aside.drawer,.scrim{transition:none}}

/* responsive */
@media (max-width:980px){
  .top-grid,.circle-layout,.grid2{grid-template-columns:minmax(0,1fr)}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .q{grid-column:1/-1}
  #ch-cember{height:560px}
}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid4,.quad,.vs{grid-template-columns:minmax(0,1fr)}
  #ch-cember{height:420px}
  table.t thead{display:none}
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
  table.t tr{border-bottom:1px solid var(--line);padding:8px 0}
  table.t td{border:0;padding:3px 12px}
}
</style>

4","K15","K16","K19","K20","K22","K23","K30","K32"]}],"baglam":"Başında SAFe portföy/program katmanı olan, sayısı ve bileşimi kesin olmayan çok sayıda scrum ekibi; yaklaşık 12.000 kayıtlık backlog; Türkiye ve KVKK.","cozulecek_ana_sorun":"Ajanlar kod üretmeyi hızlandırıyor; ama insanlar ve ajanlar birlikte nasıl çalışacak, iş ve sorumluluk nasıl paylaşılacak, ekipler ve ekiplerin ajanları birbirine nasıl bağlanacak, üretilen yazılımın güvenilirliği test ötesinde nasıl sağlanacak tanımlanmadan bu hız güvenilir yazılıma ve kurumsal hıza dönüşmüyor. Mevcut kaynaklar ekip düzeyinde güçlü bir doğrulama akışı tanımlıyor ama insanı çoğunlukla onaylayıcı olarak konumluyor; birlikte çalışma, ekip çalışma sistemi, çok ekip, güvenilirlik mühendisliği, güvenlik, hukuk, ölçüm ve platform işletimi boyutları çemberin dışında kalmıştı.","basari_tanimi":["Her iş, tek ve doğrulanabilir bir tanımla akışa giriyor ve kanıt paketiyle çıkıyor.","Beklentiler koddan bağımsız kaynaktan geliyor; testlerin gücü ölçülüyor; üretime kaçan kusur ve değişiklik başarısızlık oranı başlangıç değerine göre kötüleşmiyor.","İnsanlar yalnız tanımlı karar noktalarında, doğru bağlamla ve ölçülen bekleme süreleriyle devreye giriyor.","Deneme, süre ve maliyet tek politikayla sınırlanıyor ve ekip/ART'a atfediliyor.","Ekip eklemek veya çıkarmak yeniden tasarım değil yapılandırma değişikliği gerektiriyor.","Ajan hattı güvenlik, veri koruma ve lisans yükümlülüklerini karşılıyor; her karar izlenebiliyor.","Model, çalışma zamanı ve kural seçimleri kurumun kendi görev setindeki ölçüme dayanıyor.","İnsanlar ve ajanlar görev türüne ve riske göre belirlenmiş iş birliği biçimleriyle çalışıyor; iş devri kayıpsız, ajanın ne yaptığı ve neden yaptığı görülebiliyor, insan her an yönlendirip devralabiliyor.","İnsanların ajanlara güveni ölçülen başarıyla uyumlu (ne aşırı ne yetersiz); ekiplerin yetkinliği korunuyor ve gelişiyor.","Ekipler ortak çalışma anlaşmaları, ritüeller ve bilgi paylaşımıyla ajanlarla birlikte ve birbirleriyle çakışmadan çalışıyor.","Üretilen yazılımın güvenilirliği test sonuçlarıyla değil, üretimdeki hizmet hedefleri, güvenli tasarım ve mimari uygunlukla da gösteriliyor."],"kapsam":["Talep, görev tanımı ve hazır olma","Backlog, ayrıştırma, bağımlılık ve önceliklendirme","Kod tabanı bağlamı ve mimari sınırlar","Uygulama ve tasarım kalitesi","Doğrulama, test oracle ve kalite kapıları","Entegrasyon, sürüm kontrolü ve yayın","Dokümantasyon ve kurumsal bilgi","Geri bildirim, işletim ve sürekli iyileştirme","Model erişimi, seçimi ve barındırma","Ajan çalışma çerçevesi","Yetenek paketleri, kurallar ve talimat yönetimi","Araç ve bağlam erişim protokolü, entegrasyonlar","Orkestrasyon ve dayanıklı yürütme","Bağlam, bilgi erişimi ve bellek","Çalışma ortamı, izolasyon ve kapasite","Ajan platformunun işletimi ve sürdürülebilirliği","İnsan gözetimi, onay ve eskalasyon","Güvenlik, yetkilendirme ve gizlilik","İzlenebilirlik, gözlemlenebilirlik ve denetim","Bütçe, maliyet ve deneme politikası","Risk yönetimi","Uyum, hukuk ve lisans","Değerlendirme ve ölçüm","Ölçekli çevik koordinasyon","Roller, yetkinlik ve değişim yönetimi","İş takip sistemi ve iş kalemi yaşam döngüsü","İnsan–ajan iş birliği modeli, yetki devri ve iş devri","Ortak bağlam, yönlendirme ve inceleme ergonomisi","Karşılıklı öğrenme ve insan yetkinliğinin gelişimi","Ekip çalışma sistemi: anlaşmalar, ritimler ve sürekli iyileştirme","Ekipler arası iş birliği, sahiplik ve sosyo-teknik yapı","Çalışan hakları, iş güvencesi ve insan sürdürülebilirliği","Ürün güvenilirlik mühendisliği ve işletilebilirlik","Güvenli ve gizlilik odaklı ürün tasarımı","Mimari uygunluk ve sürdürülebilir kod sağlığı"],"bilincli_kapsam_disi":[{"konu":"Araç, ürün, model ve sağlayıcı seçimi","gerekce":"Kullanıcı talimatı: ihtiyaç belirlenecek, araç belirlenmeyecek. Seçim bu haritadaki kabul ölçütlerine göre sonra yapılır."},{"konu":"Projelendirme: takvim, sprint/PI planı, kişi ataması, parasal bütçe tutarı","gerekce":"Kullanıcı talimatı: projelendirme yapılmayacak; bu çalışma projelendirmenin girdisidir."},{"konu":"Geliştirilecek ürünlerin kendi işlevsel gereksinimleri","gerekce":"Bu harita ürünleri geliştiren sistemin ihtiyaçlarını kapsar, ürünlerin değil."},{"konu":"Model eğitimi veya ince ayar","gerekce":"Kaynaklarda kalıcılık, prosedürel öğrenme ve model eğitimi ayrı tutuluyor; model eğitimi ihtiyaç olarak çıkmadı."},{"konu":"Mevcut yayın hattının yeniden tasarımı","gerekce":"Kaynak: mevcut sürüm adayı → üretim süreci değiştirilmez; yalnız devir noktası ihtiyaçtır."}],"kullanici_kisitlari":["Veriler yalnız ihtiyacı ve çözülmesi gereken sorunu tanımlar; çözen araç, ürün veya marka adı içermez.","Projelendirme yapılmaz; ama projelendirme için boşluk kalmaz.","Ekip sayısı (10+) ve ekip bileşimi kesin değildir; son aşama kapsamı belirsizdir.","Teknoloji belirsiz, ihtiyaç belirlidir."],"ilkeler":[{"id":"P-01","ilke":"Deterministik önce, yapay zekâ sonra","aciklama":"Ucuz ve kesin kontroller (derleme, statik analiz, testler, taramalar) pahalı yapay zekâ denetiminden önce koşar; sonuçları yorumlanmaz.","kaynaklar":["S-030","S-013","S-062"]},{"id":"P-02","ilke":"Dil modeli yorumlar, deterministik motor karar verir","aciklama":"Yetki, bağımlılık sırası, bütçe, durum geçişi ve risk eylemi kararları programatik verilir; dil modeli açıklar ve önerir.","kaynaklar":["S-022","S-062","S-028"]},{"id":"P-03","ilke":"Beklenti bağımsız kaynaktan gelir","aciklama":"Test beklentisi koddan veya mevcut çıktıdan türetilemez; kaynağı ürün kararı, sözleşme, mevzuat veya onaylı örnektir.","kaynaklar":["S-001","S-003","S-008"]},{"id":"P-04","ilke":"Üreten, doğrulayan ve kabul eden ayrıdır","aciklama":"Kod yazan, beklentiyi yazan ve kabul eden roller ve bağlamlar ayrılır; başarıyı yalnız bağımsız çalıştırıcı yazar.","kaynaklar":["S-001","S-007","S-052"]},{"id":"P-05","ilke":"Kanıt yoksa bitti yok","aciklama":"RED kanıtı, kanıt paketi ve 'test edilmedi' durumu olmadan geçiş yapılmaz.","kaynaklar":["S-052","S-006","S-007"]},{"id":"P-06","ilke":"Sınırlı döngü, zorunlu eskalasyon, sıfırlanmayan sayaç","aciklama":"Her döngünün sınırı vardır; sınır aşılınca iş insana devredilir; model veya ajan değiştirmek bütçeyi yenilemez.","kaynaklar":["S-006","S-007","S-062"]},{"id":"P-07","ilke":"Kritik belirsizlik varsayıma gömülmez","aciklama":"Belirsizlik açık soru, risk veya engel olarak kaydedilir.","kaynaklar":["S-031","S-036"]},{"id":"P-08","ilke":"İnsan ve ajan birlikte üretir; iş bölümü görev ve riske göre esnektir, sorumluluk insandadır","aciklama":"Kaynaklardaki 'insan karar ve istisnayı yönetir, kodu ajan yazar' ilkesi kullanıcının amaç tanımıyla genişletildi: insan yalnız onaylayıcı değil; görev türüne göre önde, eşli ya da gözden geçiren olabilir. Rutin tekrarı otomasyon yürütür; insan noktaları az, açık ve kanıtlıdır.","kaynaklar":["S-006","S-003","S-090"]},{"id":"P-09","ilke":"Tek doğruluk kaynağı","aciklama":"Durumun, kuralların ve kabul kriterlerinin her birinin tek sahibi ve tek kaynağı vardır.","kaynaklar":["S-062","S-061","S-051"]},{"id":"P-10","ilke":"Kurallar sürümlüdür, koşu başında sabitlenir, ajan değiştiremez","aciklama":"Kural ve politika değişiklikleri insan onaylıdır ve yalnız yeni koşulara uygulanır.","kaynaklar":["S-061","S-062","S-028"]},{"id":"P-11","ilke":"Ölçmeden optimize etme, ölçmeden ölçekleme","aciklama":"Performans iyileştirmesi, sınır kalibrasyonu, model ve kural seçimi ölçüme dayanır.","kaynaklar":["S-046","S-006","S-017"]},{"id":"P-12","ilke":"Olgunluğa uygun karmaşıklık; çözülmüş probleme ikinci teknoloji yok","aciklama":"Kapsam hedef olgunluk seviyesine göre sınırlanır; yeni teknoloji gerekçe ister.","kaynaklar":["S-039","S-040"]},{"id":"P-13","ilke":"Yıkıcı işlem açık insan izni ister","aciklama":"Silme, üzerine yazma, zorla gönderme ve üretime yazma ajan yetkisinde değildir.","kaynaklar":["S-037","S-062"]},{"id":"P-14","ilke":"Ekip sayısı değişkendir","aciklama":"Yapı, ekip ve kapsam değiştiğinde yeniden tasarım değil yapılandırma değişikliği gerektirmelidir.","kaynaklar":["S-090"]},{"id":"P-15","ilke":"Önce ihtiyaç, sonra araç","aciklama":"Araçlar, bu haritadaki ihtiyaçları ve kabul ölçütlerini karşılayıp karşılamadıklarına göre sonradan seçilir.","kaynaklar":["S-090","S-061"]},{"id":"P-16","ilke":"İnsan birlikte üreten taraftır","aciklama":"Onay noktası tasarlamak yetmez; iş birliği modu, devir, ortak bağlam ve karşılıklı öğrenme ayrıca tasarlanır. Ajan görev işinin yanında ekip işini de (iletişim, koordinasyon, öngörülebilirlik) destekler.","kaynaklar":["S-094","S-186","S-249"]},{"id":"P-17","ilke":"Otonomi bilinçli, işlev bazlı ve geri alınabilir bir karardır","aciklama":"Otonomi yetenekten ayrı ayarlanır; bilgi toplama, karar ve eylem için ayrı düzeylenir; kazanıldığı gibi tanımlı tetikleyicilerle kaybedilir.","kaynaklar":["S-094","S-182","S-184"]},{"id":"P-18","ilke":"Anlamlı kontrol olmadan sorumluluk yüklenmez","aciklama":"Onaycıya bilgi, süre ve yetkinlik sağlanmadıysa sorumluluk ona yıkılmaz; 'değerlendiremiyorum' demek meşru bir çıktıdır. Her ajan çıktısının hesap verebilir bir insanı ve sahip ekibi vardır. Ancak bir insan yalnız yeterli bilgi, süre ve yetkiye sahipse sorumlu tutulabilir; aksi halde risk sistem sahibindedir.","kaynaklar":["S-094","S-202","S-157","S-240","S-250"]},{"id":"P-19","ilke":"Her adımı onaylatmak yerine görünürlük ve ucuz müdahale","aciklama":"Gözetimin etkinliği güvenilir görünürlük, durum kaybettirmeyen yönlendirme ve geri alma ile sağlanır; her eylemi onaylatmak yorgunluk üretir.","kaynaklar":["S-094","S-185","S-204"]},{"id":"P-20","ilke":"Doğrulamayı ucuzlatmadan otomasyon yanlılığı azalmaz","aciklama":"İnceleme birimi küçük, niyete eşli ve okunur olmalıdır; aşırı güven doğrulamanın maliyetiyle birlikte düşer.","kaynaklar":["S-094","S-215","S-107","S-209"]},{"id":"P-21","ilke":"Belirsizlik açık ve kalibre söylenir; uzun açıklama güven değildir","aciklama":"Her iddia epistemik durumuyla sunulur; güven dili standart ve ölçülmüş olur.","kaynaklar":["S-094","S-207","S-206"]},{"id":"P-22","ilke":"Devir yapılandırılmıştır ve alıcı teyidiyle kapanır","aciklama":"İnsan↔ajan↔ajan devirlerinde durum, açık kararlar, varsayımlar ve taahhütler aynı şemayla aktarılır.","kaynaklar":["S-094","S-188","S-113"]},{"id":"P-23","ilke":"Ajanın itiraz yükümlülüğü vardır","aciklama":"Sessiz itaat de sessiz sapma da kusurdur; 'değişiklik gerekmez' geçerli ve ödüllendirilen bir sonuçtur.","kaynaklar":["S-094","S-198","S-199","S-200"]},{"id":"P-24","ilke":"Yetkinlik verim uğruna harcanmaz","aciklama":"Öğrenme için bilinçli olarak insan işi ve öğrenme kipi ayrılır; onay yetkisi gösterilmiş yetkinliğe bağlanır.","kaynaklar":["S-094","S-237","S-169","S-234"]},{"id":"P-25","ilke":"İnsan düzeltmesi birinci sınıf öğrenme sinyalidir, döngü insana kapanır","aciklama":"Düzeltmeler kaynağında sınıflanır, yalnız kontrollü hattan kurala dönüşür ve akıbeti düzeltene gösterilir.","kaynaklar":["S-094","S-228","S-204"]},{"id":"P-26","ilke":"Katkı verisi hesap verebilirlik ve öğrenme içindir, bireysel gözetim için değil","aciklama":"Köken ve düzeltme verisinin kullanım amacı önceden yazılır; görünmez katkılar (yönlendirme, inceleme, spesifikasyon) tanınır. Çalışanlara ilişkin telemetri varsayılan olarak ekip düzeyinde toplulaştırılır. Bireysel erişim istisnaidir, gerekçelidir ve kayıtlıdır. Ajan metrikleri bireysel performans göstergesi yapılmaz.","kaynaklar":["S-094","S-242","S-243","S-295","S-282"]},{"id":"P-27","ilke":"Norm açıklığı araçtan önce gelir","aciklama":"Ekip, ajanla nasıl çalışacağını yazılı ve açık biçimde bilmeden araç ve otonomi genişletilmez. Belirsizlik korku ve kayıt dışı kullanım üretir.","kaynaklar":["S-094","S-255","S-213"]},{"id":"P-28","ilke":"Aynı titizlik: ajan işi için 'bitti' gevşetilmez","aciklama":"Ajan çıktısı insan işiyle aynı kapılardan geçer. Ek olarak sorumlu insan değişikliği açıklayabilmelidir.","kaynaklar":["S-094","S-250","S-268"]},{"id":"P-29","ilke":"Kapasitenin birimi insan dikkatidir","aciklama":"Planlama ajan üretim hızına değil, insanın yönlendirme, izleme, inceleme ve kabul için ayırabileceği süreye dayanır.","kaynaklar":["S-094","S-266"]},{"id":"P-30","ilke":"Alanın kuralı geçerlidir","aciklama":"Ekip sınırını aşan değişiklikte başlatan ekibin değil, sahip ekibin kuralları, eşikleri ve onayı uygulanır.","kaynaklar":["S-094","S-279","S-274"]},{"id":"P-31","ilke":"Çalışma sistemi de bir üründür","aciklama":"Roller, ritüeller ve anlaşmalar sürümlenir, ölçülür ve hipotezli deneylerle değiştirilir. Yapay zekâ mevcut güçlü ve zayıf yanları büyütür.","kaynaklar":["S-094","S-196","S-253"]},{"id":"P-32","ilke":"Değişim çalışanlarla birlikte yapılır","aciklama":"Yeni teknolojinin çalışanlara etkisi konusunda temsilcilerin görüşü alınır, kararlar ve bilinmeyenler dürüstçe paylaşılır, esaslı değişiklikler yasal usule uyar.","kaynaklar":["S-094","S-301","S-299"]},{"id":"P-33","ilke":"Gelişim hattını koru","aciklama":"Bugünün verimi yarının kıdemlisini tüketmemeli. Gençlerin verimli zorlanması ve mentorluk bilinçli olarak korunur.","kaynaklar":["S-094","S-237","S-263"]},{"id":"P-34","ilke":"Bilişsel yük yok olmaz, yer değiştirir","aciklama":"Üretim ucuzladığında yük doğrulama, entegrasyon ve muhakemeye kayar. Ekip sınırları ve kapsamı bu yeni yüke göre ayarlanır.","kaynaklar":["S-094","S-283","S-285"]},{"id":"P-35","ilke":"Güvenilirlik hedefi kullanıcı deneyiminden türetilir ve %100 değildir.","aciklama":"Hedef, kullanıcının fark edebileceği güvenilirlik düzeyine göre konur; aradaki pay (hata bütçesi) hız ile güvenilirlik arasındaki pazarlığı nesnel hale getirir.","kaynaklar":["S-094","S-311","S-310"]},{"id":"P-36","ilke":"Hata bütçesi değişikliği kimin yazdığına bakmaz; ama otonominin tavanını belirler.","aciklama":"İnsan ve ajan değişiklikleri bütçeyi aynı biçimde tüketir; bütçe eridiğinde önce en hızlı ve en az gözetimli değişiklik kaynağı yavaşlatılır.","kaynaklar":["S-094","S-312","S-102"]},{"id":"P-37","ilke":"Hız ve istikrar birlikte ölçülür ve birlikte raporlanır.","aciklama":"Yalnız hız raporu yayımlanmaz; yapay a (ilk günden).","olgunluk_ve_belirsizlik":"Tıp ve havacılıkta olgun devir protokolleri var; ajanlara uyarlaması yeni; düşük–orta belirsizlik.","kanit":["S-094"]},{"id":"Y-50","grup":"Doğrulama ve kalite","ad":"İnceleme ergonomisi ve değişiklik ayrıştırma","cozdugu_sorun":"Büyük ve karma ajan değişikliklerinin insan tarafından anlaşılamaması ve incelemenin körlemesine onaya dönüşmesi.","ne_zaman_zorunlu":"İnceleme bekleme süresi ve değişiklik boyutu artmaya başladığında; pratikte pilot başında.","olgunluk_ve_belirsizlik":"Değişiklik ayrıştırma ve belirsizlik vurgusu üzerine hakemli çalışmalar var; ürünleşme kısmi; orta belirsizlik.","kanit":["S-094"]},{"id":"Y-51","grup":"İnsan–ajan iş birliği","ad":"Dikkat ve bildirim yönetimi","cozdugu_sorun":"Ajan kaynaklı bildirimlerin insan dikkatini parçalaması, uyarı yorgunluğu ve gözetim kapsamının sınırsız büyümesi.","ne_zaman_zorunlu":"Kişi başı paralel koşu ve bildirim hacmi arttığında.","olgunluk_ve_belirsizlik":"Genel bildirim yönetimi olgun; ajan gözetimine özgü kesinti bütçesi ve kapsam sınırı yeni; orta belirsizlik.","kanit":["S-094"]},{"id":"Y-52","grup":"Değerlendirme ve öğrenme","ad":"İnsan düzeltme sinyali ve tercih öğrenme","cozdugu_sorun":"Günlük insan düzeltmelerinin sınıflanmadan kaybolması; aynı düzeltmenin tekrar tekrar yapılması; öğrenmenin insana görünmemesi.","ne_zaman_zorunlu":"Pilot başında yakalama; yaygınlaştırmada otomatik tekrar tespiti ve döngü kapatma.","olgunluk_ve_belirsizlik":"Düzenlemelerden tercih öğrenme araştırma düzeyinde; endüstride inceleme yorumundan öğrenme örnekleri var; orta belirsizlik.","kanit":["S-094"]},{"id":"Y-53","grup":"Organizasyon ve yetkinlik","ad":"Yetkinlik kaydı ve öğrenme desteği","cozdugu_sorun":"Onay yetkisinin yetkinlikten kopması, yeni başlayanların öğrenmeden teslim etmesi ve uzmanlık yolunun kuruması.","ne_zaman_zorunlu":"Yeni başlayanlar hatta alındığında ve alan bazlı onay yönlendirmesi gerektiğinde.","olgunluk_ve_belirsizlik":"Eğitim ve yetkinlik yönetimi olgun; ajan çağına özgü öğrenme kipi ve gelişim işi tahsisi yeni; orta–yüksek belirsizlik.","kanit":["S-094"]},{"id":"Y-54","grup":"Gözlemlenebilirlik, denetim ve işletim","ad":"Parça düzeyinde katkı kökeni kaydı","cozdugu_sorun":"İnsan ve ajan katkısının değişiklik içinde ayırt edilememesi; inceleme yönlendirmesi, denetim ve fikri mülkiyet için köken eksikliği.","ne_zaman_zorunlu":"Etkileşimli ve hat içi çalışma birlikte kullanıldığında; fikri mülkiyet veya denetim sorusu doğduğunda.","olgunluk_ve_belirsizlik":"Açık belirtim taslakları 2026'da ortaya çıktı; standartlaşma erken; yüksek belirsizlik.","kanit":["S-094"]},{"id":"Y-55","grup":"Teslim hattı ve iş yönetimi","ad":"Yazılım varlık ve sahiplik kataloğu","cozdugu_sorun":"Kod alanı, servis ve ortak varlıkların sahip ekibinin, ekip arayüzünün ve etkileşim modunun bilinmemesi; ajan değişikliklerinin inceleme yönlendirmesinin ve sınır aşan değişiklik onayının dayanaksız kalması.","ne_zaman_zorunlu":"2+ ekip ve ekip sınırını aşan ajan değişikliği başladığında.","olgunluk_ve_belirsizlik":"Hizmet kataloğu ve geliştirici portalı sınıfı olgun. Ajan inceleme yönlendirmesi, dört rol kaydı ve sosyo-teknik uyum ölçümüyle entegrasyonu yeni; belirsizlik orta.","kanit":["S-094"]},{"id":"Y-56","grup":"Orkestrasyon ve planlama","ad":"İş üstlenme ve niyet koordinasyonu","cozdugu_sorun":"Farklı ekiplerin ajanlarının aynı işi yapması ya da aynı alana eşzamanlı ve çelişen değişiklik üretmesi; çakışmanın ancak birleştirmede fark edilmesi.","ne_zaman_zorunlu":"2+ ekibin ajanları ortak depolarda paralel çalışmaya başladığında.","olgunluk_ve_belirsizlik":"Araştırma aşamasında; ön-baskılarda umut verici sonuçlar var, kurumsal ölçekte kanıt yok. Belirsizlik yüksek.","kanit":["S-094"]},{"id":"Y-57","grup":"Değerlendirme ve öğrenme","ad":"Gizlilik korumalı çalışan deneyimi ve ekip sağlığı ölçümü","cozdugu_sorun":"İnsan boyutunun (iyi oluş, bilişsel yük, psikolojik güvenlik, iş birliği ağı) ölçülmemesi ya da ölçümün bireysel izlemeye dönüşmesi.","ne_zaman_zorunlu":"Pilot öncesi başlangıç değeri için ilk günden.","olgunluk_ve_belirsizlik":"Anket ölçekleri ve toplulaştırma yöntemleri olgun. Asgari grup büyüklüğü, ajan telemetrisiyle birleştirme kuralları ve hukuki çerçeve kuruma özgü; belirsizlik düşük–orta.","kanit":["S-094"]},{"id":"Y-58","grup":"Bağlam, bilgi, kurallar ve araç erişimi","ad":"Çalışma sistemi deposu ve sürüm yönetimi","cozdugu_sorun":"Ritüel, çalışma anlaşması, karar hakkı ve DoR/DoD tanımlarının dağınık, sürümsüz ve ekipler arası tutarsız olması; hangi ekibin hangi sürümle çalıştığının bilinmemesi.","ne_zaman_zorunlu":"2+ ekipte; 10+ ekipte kritik.","olgunluk_ve_belirsizlik":"Ayrı bir ürün sınıfı gerekmeyebilir; Y-35 ve Y-37 genişletilerek kurulabilir. Belirsizlik düşük.","kanit":["S-094"]},{"id":"Y-59","grup":"Yürütme ortamı ve güvenlik","ad":"Çalışan verisi için amaç bağlı erişim ve toplulaştırma","cozdugu_sorun":"Ajan telemetrisinin bireysel izleme aracına dönüşmesi; çalışan verisine amaç dışı ve kayıtsız erişim.","ne_zaman_zorunlu":"Çalışanlara ilişkin telemetrinin toplanmaya başladığı ilk günden.","olgunluk_ve_belirsizlik":"Amaç bağlı erişim denetimi ve toplulaştırma teknikleri biliniyor; ajan izlerine uygulanması yeni. Y-36 ve Y-25 genişletmesi olarak da kurulabilir.","kanit":["S-094"]},{"id":"Y-60","grup":"Gözlemlenebilirlik, denetim ve işletim","ad":"SLO ve hata bütçesi yönetimi","cozdugu_sorun":"Kullanıcı odaklı SLI tanımı, SLO kaydı, bütçe hesabı, yanma hızı uyarısı ve bütçe durumunun politika motoruna ve yayın kararına sinyal olarak verilememesi.","ne_zaman_zorunlu":"Ajan değişiklikleri üretime aktığında ve kademe 0–1 hizmetler için ilk günden.","olgunluk_ve_belirsizlik":"Yöntem olgun; bütçe durumunun ajan otonomisine bağlanması yeni ve deneyseldir.","kanit":["S-094"]},{"id":"Y-61","grup":"Doğrulama ve kalite","ad":"Ürün dayanıklılık deneyi ve hata enjeksiyonu","cozdugu_sorun":"Bağımlılık kesintisi, gecikme, kaynak tükenmesi ve bozuk yanıt gibi arızaların patlama yarıçapı sınırlı ve durdurulabilir biçimde üretilememesi; gözlemlenebilirliğin arızayla doğrulanamaması.","ne_zaman_zorunlu":"Kademe 0–1 hizmetler üretimdeyken; önce üretim öncesinde.","olgunluk_ve_belirsizlik":"Yöntem olgun; dil modeliyle otomatik deney tasarımı araştırma aşamasında.","kanit":["S-094"]},{"id":"Y-62","grup":"Gözlemlenebilirlik, denetim ve işletim","ad":"Hizmet kataloğu ve bağımlılık envanteri","cozdugu_sorun":"Hizmetlerin sahibi, kritiklik kademesi, SLO'su, iç ve dış bağımlılıkları, işletim dokümanı ve hazırlık inceleme durumunun tek yerde sorgulanamaması.","ne_zaman_zorunlu":"2+ ekip ve kademe modeli kurulduğunda.","olgunluk_ve_belirsizlik":"Olgun sınıf; güncelliğin koddan ve çalışma zamanı verisinden otomatik sağlanması belirsiz.","kanit":["S-094"]},{"id":"Y-63","grup":"Gözlemlenebilirlik, denetim ve işletim","ad":"Olay yönetimi ve olay sonrası öğrenme deposu","cozdugu_sorun":"Ürün olaylarının ortak sınıflamayla kaydedilememesi, eylem maddelerinin izlenememesi, ajan katkısı ve tasarım artefaktı etkisinin kayda geçmemesi.","ne_zaman_zorunlu":"Üretimdeki ilk ürün olayından itibaren; ortak sınıflama 3+ ekipte.","olgunluk_ve_belirsizlik":"Olgun sınıf; ajan katkısı taksonomisi yeni.","kanit":["S-094"]},{"id":"Y-64","grup":"Yürütme ortamı ve güvenlik","ad":"Tehdit ve gizlilik modelleme çalışma alanı","cozdugu_sorun":"Tehdit ve gizlilik modellerinin sürümlü, farkı alınabilir, önlemleri teste bağlı yaşayan artefaktlar olarak tutulamaması.","ne_zaman_zorunlu":"Kademe 0–1 hizmetlere dokunan ilk epikte.","olgunluk_ve_belirsizlik":"Yöntem olgun; değişiklik düzeyi otomatik fark ve dil modeli taslağının güvenilirliği belirsiz.","kanit":["S-094"]},{"id":"Y-65","grup":"Doğrulama ve kalite","ad":"Mimari uygunluk denetimi ve modülerlik ölçümü","cozdugu_sorun":"Katman, bağımlılık yönü, modül ve ekip sınırı kurallarının deterministik denetlenememesi; bağlaşım metriklerinin zaman serisi olarak izlenememesi.","ne_zaman_zorunlu":"Ajanların mevcut kod tabanına yazmaya başladığı andan lan":"B-ajan-platformu","amac":"Ajanların araç kullanarak iş yaptığı çalışma ortamının değiştirilebilir, programatik, sınırları belli ve denetlenebilir olması.","kapsam":["başsız/programatik çalışma","yapılandırılmış sonuç","oturum devamı","ortak adaptör sözleşmesi","rol tanımı kaydı","koşullu rol yükleme","alt ajanlar ve rol ayrımı","çalışma zamanı sınıfları","yetki ve izin arayüzü"],"kapsam_disi":["yaşam döngüsü ve durum sahipliği (K13)","model seçimi (K09)"],"komsu_kumeler":["K09","K11","K12","K13","K18"],"sayi":10},{"id":"K11","ad":"Yetenek paketleri, kurallar ve talimat yönetimi","alan":"B-ajan-platformu","amac":"Kuralların, sınırların ve yeniden kullanılabilir iş bilgisinin tek kaynaktan, sürümlü ve ajanların değiştiremeyeceği biçimde yönetilmesi.","kapsam":["kural dosyası ve kural yöneticisi","görev tipine göre kural seti etkinleştirme","yetenek paketleri","sürümleme ve koşu başında sabitleme","ortak ve ekip-özel kurallar","kontrollü öğrenme ve yayın","yapılandırma varlık türleri"],"kapsam_disi":["kural içeriklerinin kendisi (A alanı kümeleri)"],"komsu_kumeler":["K07","K10","K13","K23","K24"],"sayi":11},{"id":"K12","ad":"Araç ve bağlam erişim protokolü, entegrasyonlar","alan":"B-ajan-platformu","amac":"Ajanların iş takip, sürüm kontrolü, test, doküman ve diğer sistemlere tek tip, sürümü sabit ve yetkisi sınırlı bir arayüzle erişmesi.","kapsam":["standart araç/bağlam protokolü","sistem bağlayıcıları","araç kaydı ve sürüm sabitleme","araç başına yetki","iş takip sistemiyle iki yönlü eşleme","insan iletişim kanalları"],"kapsam_disi":["araç seçimi (bilinçli olarak kapsam dışı)"],"komsu_kumeler":["K10","K14","K18","K26"],"sayi":6},{"id":"K13","ad":"Orkestrasyon ve dayanıklı yürütme","alan":"B-ajan-platformu","amac":"Uzun süren, insan bekleyen, çok adımlı ajan işlerinin kesintiye dayanıklı, tek durum sahibiyle ve tekrarlanabilir biçimde yürütülmesi.","kapsam":["tek durum sahibi","kesintiden devam","insan bekleme","sınırlı ve sınıflandırılmış yeniden deneme","paralel alt süreçler","idempotent yan etkiler","iptal ve zaman aşımı","süreç ve politika sürümleme","hata yönlendirme","koşu başında bağlam sabitleme"],"kapsam_disi":["bütçe değerleri (K20)","insan kararının kendisi (K17)"],"komsu_kumeler":["K10","K17","K19","K20","K26"],"sayi":13},{"id":"K14","ad":"Bağlam, bilgi erişimi ve bellek","alan":"B-ajan-platformu","amac":"Ajanın doğru işi yapması için gereken bilgiye, doğru sürümüyle, kaynağı belli ve sızıntısız biçimde ulaşması.","kapsam":["kod tabanı indeksleme","semantik arama","güncel dış bilgi ve kaynak hiyerarşisi","sürüme özgü doküman","bellek ve durum ayrımı","proje izolasyonu","bağlam penceresi yönetimi","dil (Türkçe) kalitesi"],"kapsam_disi":["ilişki haritasının içeriği (K03)"],"komsu_kumeler":["K03","K07","K09","K12","K18"],"sayi":10},{"id":"K15","ad":"Çalışma ortamı, izolasyon ve kapasite","alan":"B-ajan-platformu","amac":"Her ajan işinin temiz, izole, sınırları belli bir ortamda koşması ve paylaşılan kaynakların ölçekte adil kullanılması.","kapsam":["görev başına izole çalışma alanı","yürütme yalıtımı (ağ, dosya, süre, kaynak)","başlangıç sağlık kontrolü","test verisi","hesaplama ve hızlandırıcı kapasitesi","ekipler arası kaynak paylaşımı"],"kapsam_disi":["güvenlik politikası içeriği (K18)"],"komsu_kumeler":["K06","K09","K18","K20","K24"],"sayi":7},{"id":"K16","ad":"Ajan platformunun işletimi ve sürdürülebilirliği","alan":"B-ajan-platformu","amac":"Ajan destekli teslim hattının kendisinin bir ürün gibi işletilmesi: hizmet hedefleri, olay yönetimi, güncelleme, kurtarma ve bileşen yaşam döngüsü.","kapsam":["hattın hizmet seviyesi hedefleri","olay yönetimi ve işletim dokümanları","yedekten dönüş ve kurtarma tatbikatı","bileşen sürümleme ve güncelleme","bileşen bakım durumu","kesinti ve bozulmuş mod","platform sahipliği"],"kapsam_disi":["ürünün üretim işletimi (K08)"],"komsu_kumeler":["K08","K13","K15","K18","K24"],"sayi":10},{"id":"K17","ad":"İnsan gözetimi, onay ve eskalasyon","alan":"C-guvence-ve-yonetisim","amac":"İnsanların yalnızca gerçekten insan kararı gereken noktalarda, doğru bağlamla, kimlikli ve süresi ölçülen biçimde devreye girmesi.","kapsam":["insan karar noktaları envanteri","kimlikli ve içeriğe bağlı onay","engel (blocker) kaydı ve sahipliği","bekleme süreleri ve eskalasyon","onay kapasitesi","otomasyon yanlılığına karşı inceleme yüzeyi","takılan işlerin geri alınması"],"kapsam_disi":["onay veren rollerin kimler olacağı (K25)"],"komsu_kumeler":["K05","K13","K25","K26"],"sayi":10},{"id":"K18","ad":"Güvenlik, yetkilendirme ve gizlilik","alan":"C-guvence-ve-yonetisim","amac":"Hem üretilen ürünün hem de ajan hattının güvenli olması: yetki kararlarının deterministik olması, ajanların en az yetkiyle çalışması, verinin ve sırların korunması.","kapsam":["ürün yetkilendirmesi","ajan ve hat yetkileri","yıkıcı işlem denetimi","gizli bilgi yönetimi","istem enjeksiyonu ve içerik zehirlenmesi","tedarik zinciri","veri çıkışı ve kişisel veri","güvenlik taraması","acil durdurma"],"kapsam_disi":["hukuki yükümlülüklerin yorumu (K22)"],"komsu_kumeler":["K10","K12","K15","K19","K22"],"sayi":14},{"id":"K19","ad":"İzlenebilirlik, gözlemlenebilirlik ve denetim","alan":"C-guvence-ve-yonetisim","amac":"Her ajan işinin kim, neyi, hangi sürümle, hangi kanıta dayanarak yaptığının sonradan eksiksiz izlenebilmesi.","kapsam":["uçtan uca iz","değiştirilemez denetim kaydı","kanıt ve artefakt saklama","yeniden üretilebilirlik","beklenti/eşik değişikliklerinin izi","saklama süreleri"],"kapsam_disi":["metriklerin yorumlanması (K23)"],"komsu_kumeler":["K05","K13","K18","K22","K23"],"sayi":7},{"id":"K20","ad":"Bütçe, maliyet ve deneme politikası","alan":"C-guvence-ve-yonetisim","amac":"Ajan denemelerinin, sürenin ve maliyetin tek, sürümlü ve atlatılamaz bir politikayla sınırlanması; maliyetin doğru yere atfedilmesi.","kapsam":["sayaç türleri ve anlamları","tek bütçe politikası","sıfırlanamayan paylaşılan bütçe","altyapı denemelerinin ayrımı","aktif süre ve insan beklemesi","maliyet birimi ve atfı","ekip/ART kotaları","kalibrasyon"],"kapsam_disi":["parasal bütçe onayı (projelendirme)"],"komsu_kumeler":["K13","K15","K23","K24"],"sayi":9},{"id":"K21","ad":"Risk yönetimi","alan":"C-guvence-ve-yonetisim","amac":"Değişikliklerin ve programın risklerinin ortak bir ölçekle sınıflanması ve risk seviyesinin otomasyon düzeyini belirlemesi.","kapsam":["risk ölçeği tanımı","risk kategorileri","seviye → eylem eşlemesi","yasaklı değişiklik sınıfı","risk kaydı","riske göre doğrulama derinliği","program düzeyi risk"],"kapsam_disi":["tek tek risk kayıtları (03-analizler/risk-kaydi.json)"],"komsu_kumeler":["K05","K17","K22","K24"],"sayi":7},{"id":"K22","ad":"Uyum, hukuk ve lisans","alan":"C-guvence-ve-yonetisim","amac":"Model, bileşen ve üretilen kodun lisans, fikri mülkiyet, kişisel veri ve yapay zekâ düzenlemeleri açısından uygun olması.","kapsam":["model lisansları","açık kaynak bileşen lisansları","üretilen kodun fikri mülkiyeti ve yazarlık","kişisel veri ve veri yerelliği","yapay zekâ düzenlemeleri ve insan gözetimi yükümlülükleri","dağıtım biçimine göre değerlendirme","saklama ve silme"],"kapsam_disi":["hukuki görüşün kendisi"],"komsu_kumeler":["K09","K18","K19"],"sayi":11},{"id":"K23","ad":"Değerlendirme ve ölçüm","alan":"C-guvence-ve-yonetisim","amac":"Ajanların, modellerin, kuralların ve bütün hattın gerçek işte ne kadar iyi çalıştığının kendi görevlerimizle, adil ve tekrarlanabilir biçimde ölçülmesi.","kapsam":["kendi görev seti","adil karşılaştırma","tekrar ve güven aralığı","role özel metrikler","doğrulayıcı kalibrasyonu","sınır kalibrasyonu","teslim ve akış metrikleri","Türkçe yetkinlik","regresyon değerlendirmesi"],"kapsam_disi":["araç seçimi"],"komsu_kumeler":["K05","K09","K11","K20","K24"],"sayi":17},{"id":"K24","ad":"Ölçekli çevik koordinasyon","alan":"D-organizasyon-ve-olcek","amac":"Başında SAFe portföy/program katmanı olan, sayısı ve bileşimi kesin olmayan çok sayıda ekibin ajan destekli hatta birlikte, çakışmadan ve adil çalışması.","kapsam":["portföy ve program katmanıyla hizalanma","ekipler arası bağımlılık","ortak platform ve etkinleştirici işler","ortak kurallar ve ekip-özel kurallar","kapasite ve kuyruk adaleti","çok depolu çalışma","program artımı planlamasına girdi","yaygınlaştırma kriterleri"],"kapsam_disi":["takvim ve ekip ataması (projelendirme)"],"komsu_kumeler":["K02","K11","K20","K25","K26"],"sayi":14},{"id":"K25","ad":"Roller, yetkinlik ve değişim yönetimi","alan":"D-organizasyon-ve-olcek","amac":"İnsan rollerinin ajanlarla birlikte yeniden tanımlanması, gerekli yetkinliklerin kazanılması ve değişimin ölçülebilir biçimde benimsenmesi.","kapsam":["insan rol sınıfları ve karar hakları","SAFe rolleriyle eşleme","inceleme kapasitesi","eğitim ve kalibrasyon","beceri körelmesi","güven ve benimseme","iletişim ve geri bildirim"],"kapsam_disi":["kişi bazlı atama (projelendirme)"],"komsu_kumeler":["K17","K24"],"sayi":10},{"id":"K26","ad":"İş takip sistemi ve iş kalemi yaşam döngüsü","alan":"D-organizasyon-ve-olcek","amac":"İş kalemlerinin tek bir yaşam döngüsü ve durum modeliyle yönetilmesi; iş takip sisteminin ajan hattıyla tutarlı ama yetkisi sınırlı bir yansıma olması.","kapsam":["iş kalemi şeması","durum modeli ve pano eşlemesi","komutla başlatma","iki yönlü eşleme ve yazma yetkisi","sonuç ve kanıtın iş kalemine yazılması","toplu içe aktarma"],"kapsam_disi":["görev içeriğinin kalitesi (K01)"],"komsu_kumeler":["K01","K02","K12","K13","K17"],"sayi":6},{"id":"K30","ad":"Ekip çalışma sistemi: anlaşmalar, ritimler ve sürekli iyileştirme","alan":"D-organizasyon-ve-olcek","amac":"Her ekibin ve ART'ın insan–ajan birlikte çalışmasını düzenleyen yazılı ve sürümlü çalışma anlaşmalarına, uyarlanmış ritüellere, insan gözetim kapasitesine dayalı planlama ve tahmin pratiğine sahip olması. Ayrıca çalışma sisteminin kendisini sürümleyen, ölçen ve deneyle iyileştiren bir döngüye sahip olması.","kapsam":["ekip çalışma anlaşmaları ve yapay zekâ kullanım normları","yapay zekâ/ajan katkısının açıklanması","ajan işine özgü DoR/DoD maddeleri ve anlama kanıtı","insan gözetim kapasitesine dayalı sprint kapasitesi ve tahmin tabanı","sprint planlama, günlük koordinasyon, gözden geçirme ve retrospektifin uyarlanması","ajanın ekip sosyal alanındaki konumu ve etkileşim sınırları","çalışma sisteminin sürümlenmesi, sahibi ve deneyle değiştirilmesi"],"kapsam_disi":["kurum düzeyi yapay zekâ politikası (K22)","ajanların uyduğu makine kuralları ve katmanları (K11)","portföy/ART bağımlılık ve maliyet atfı (K24, K20)","iş kalemi şablonu ve hat kapıları (K01, K05)"],"komsu_kumeler":["K24","K25","K23","K05","K01","K17","K26"],"sayi":10},{"id":"K31","ad":"Ekipler arası iş birliği, sahiplik ve sosyo-teknik yapı","alan":"D-organizasyon-ve-olcek","amac":"Ajanların ekip sınırlarını kolayca aştığı bir ortamda kod, karar ve ortak varlıkların sahipliğinin ve hesap verebilirliğin bilinçli yönetilmesi. Kapsamda ekipler arası katkı, çakışma çözümü, bilgi paylaşımı, ekip topolojisi, bilişsel yük ve dağıtık çalışma var.","kapsam":["alan sahipliği kataloğu ve dört rolün ayrımı (başlatan, yönlendiren, onaylayan, alan sahibi)","hesap verebilirliğin kontrol koşulu ve görev kanıtı","ekip sınırını aşan ajan değişikliği protokolü","ortak kural ve yetenek paketi deposuna iç kaynak katkı modeli","ekipler arası ajan çakışmalarının iş öncesi tespiti ve kademeli çözümü","ekip topolojileri, etkileşim modları, bilişsel yük ve Conway etkileri","uygulama toplulukları ve ekipler arası öğrenme","dağıtık ve hibrit ekiplerde eşgüdüm"],"kapsam_disi":["birleştirme kuyruğu ve sıcak nokta dosya mekaniği (K06, K24-008)","ajan platformunun sahibi ekip (K24-004, K16-008)","planlı ekipler arası bağımlılık grafiği (K24-003)"],"komsu_kumeler":["K24","K11","K06","K07","K08","K16","K17","K25"],"sayi":11},{"id":"K32","ad":"Çalışan hakları, iş güvencesi ve insan sürdürülebilirliği","alan":"D-organizasyon-ve-olcek","amac":"Ajanlı çalışma sisteminin Türkiye iş ve veri koruma hukukuna uygun kurulması. Çalışanların iş güvencesine, psikolojik güvenliğine, sağlığına, öğrenme ve kariyer gelişimine zarar vermemesi. Değişimin çalışanlar ve temsilcileriyle birlikte yürütülmesi.","kapsam":["ajan telemetrisi ve çalışan verisinde amaç sınırlaması","bireysel performans değerlendirmesinde ajan verisinin kullanımı ve değerlendirmede adalet","çalışma koşulu değişikliği, iç yönetmelik ve çalışanın zarar sorumluluğu","çalışan temsilcisi ve sendika danışması","psikososyal risk ve iş yükü sınırları","iş güvencesi iletişimi ve işgücü geçiş taahhütleri","psikolojik güvenlik","kariyer basamakları, genç çalışan gelişim yolu ve işe alıştırma"],"kapsam_disi":["insan rol sınıfları ve karar hakları (K25-001, K25-002)","rol bazlı yapay zekâ okuryazarlığı eğitimi (K25-005)","uzmanlar için yapay zekâsız tatbikat (K25-006)","müşteri/ürün kişisel verisi ve yurt dışı aktarım (K22-005)"],"komsu_kumeler":["K25","K22","K19","K23","K18","K17"],"sayi":10},{"id":"K27","ad":"İnsan–ajan iş birliği modeli, yetki devri ve iş devri","alan":"E-insan-ajan-birlikte-calisma","amac":"Her iş türünde insan ile ajandan hangisinin önde olduğunu, yetkinin hangi işlevde ne ölçüde devredildiğini ve işin insan↔ajan↔ajan arasında bağlam kaybı olmadan el değiştirmesini; anlaşmazlıkların nasıl çözüleceğini tanımlamak.","kapsam":["iş birliği modu kataloğu ve mod seçimi","işlev bazlı ve dinamik otonomi","insandan ajana etkileşim sözleşmesi","ajan→insan ve ajan→ajan devir paketleri","yarım kalan işin devralınması","gözetim sorumluluğunun devri","ortak çalışma alanında kalem sahipliği","etkileşimli ve hat içi çalışmanın eşdeğer güvencesi","insan–ajan ve ajan–ajan anlaşmazlık protokolü"],"kapsam_disi":["insan karar noktaları envanteri ve kimlikli onay (K17)","kesintiden devam ve dayanıklı yürütme mekanizması (K13)","ajanlar arası iletişim protokolünün teknik biçimi (K12)","rol sınıfları ve karar hakları (K25)"],"komsu_kumeler":["K17","K13","K10","K12","K02","K25"],"sayi":11},{"id":"K28","ad":"Ortak bağlam, yönlendirme ve inceleme ergonomisi","alan":"E-insan-ajan-birlikte-calisma","amac":"İnsanın ajanın ne yaptığını, neden yaptığını ve ne kadar emin olduğunu makul bilişsel maliyetle görebilmesi; gerektiğinde planı birlikte kurup yürütmeyi yönlendirebilmesi ve geri alabilmesi; incelemeyi otomasyon yanlılığına ve dikkat yorgunluğuna düşmeden yapabilmesi.","kapsam":["ortak plan ve plan önizlemesi","yürütme sırasında yönlendirme","adım düzeyinde geri alma","canlı çalışma anlatısı ve varsayım günlüğü","iddia düzeyinde epistemik durum","incelemeye hazır paketleme ve niyet–parça eşlemesi","dikkat bütçesi ve bildirim politikası","karar vermeye hazır insan istekleri","güven kalibrasyonu ve bilişsel zorlama","inceleyici dikkatinin ölçülmesi"],"kapsam_disi":["onay ekranının zorunlu alanları ve karşı gerekçe (K17)","değiştirilemez denetim izi (K19)","yapay zekâ denetçisinin otomatik incelemesi (K05)","genel gözlemlenebilirlik altyapısı (K19)"],"komsu_kumeler":["K17","K05","K19","K07","K12","K26"],"sayi":14},{"id":"K29","ad":"Karşılıklı öğrenme ve insan yetkinliğinin gelişimi","alan":"E-insan-ajan-birlikte-calisma","amac":"İnsanların ajanlarla çalışırken yetkinliğini koruyup geliştirmesi ve yeni kuşağın uzmanlaşma yolunun sürmesi; ajanın da insan düzeltmelerinden ve ekip konvansiyonlarından kontrollü biçimde öğrenmesi; birlikte çalışmanın katma değerinin ölçülmesi ve katkının adil tanınması.","kapsam":["insan düzeltmelerinin yakalanması ve döngünün kapatılması","ajanın ekibe alıştırılması","öğrenme odaklı çalışma kipi","gelişim işleri ve çıraklık yolu","yetkinliğe bağlı inceleme yetkisi","beceri körelmesinin öncü göstergeleri","tamamlayıcılık ölçümü","katkı kökeni ve amaca bağlı kullanımı","ekip çalışma anlaşması ve iş birliği retrospektifi","insan–ajan çalışma becerisi"],"kapsam_disi":["genel yapay zekâ okuryazarlığı eğitimi (K25)","dönemsel yapay zekâsız tatbikat (K25)","kontrollü öğrenme hattının teknik yayın mekanizması (K11)","yazar kimliği politikası (K22)"],"komsu_kumeler":["K25","K11","K08","K23","K24","K19"],"sayi":11},{"id":"K33","ad":"Ürün güvenilirlik mühendisliği ve işletilebilirlik","alan":"F-guvenilir-yazilim","amac":"İnsan ve ajanların birlikte ürettiği yazılımın üretimde ölçülebilir hedeflere göre güvenilir çalışması; güvenilirlik durumunun değişiklik hızını ve ajan otonomisini yönetmesi.","kapsam":["hizmet ve bileşen kritiklik kademeleri","kullanıcı yolculuğuna dayalı SLI/SLO kataloğu","hata bütçesi politikası ve bütçe–otonomi–hız bağı","yapılandırma, bayrak ve veri düzlemi değişikliği güvencesi","üretime hazırlık ve işletilebilirlik incelemesi","tasarımdan gözlemlenebilirlik ve belirti temelli uyarı","ürün dayanıklılık deneyleri ve oyun günleri","ürün için geri yükleme ve felaket kurtarma","veri sözleşmeleri, üretim veri kalitesi ve veri onarımı","dış ve ekipler arası hizmet bağımlılıklarının güvenilirliği","ekipler arası ortak güvenilirlik standardı","program düzeyinde hız–istikrar karar kuralı","işletim sahipliği ve anlaşılabilirlik"],"kapsam_disi":["ajan hattının kendi hizmet hedefleri ve işletimi (K16)","olaylardan öğrenme süreci ve geri besleme (K08)","yayın hattının mekaniği ve ortam terfisi (K06)","tedarikçi sözleşmeleri (K22)","ürün güvenlik ve gizlilik tasarımı (E2)","mimari uygunluk ve kod sağlığı (E3)"],"komsu_kumeler":["K06","K08","K16","K17","K21","K23","K24"],"sayi":17},{"id":"K34","ad":"Güvenli ve gizlilik odaklı ürün tasarımı","alan":"F-guvenilir-yazilim","amac":"Üretilen ürünün güvenlik ve gizlilik niteliklerinin koddan önce, tasarımda ve her değişiklikte sistematik biçimde ele alınması; ajanların güvenli varsayılanlardan ve ölçülebilir güvenlik gereksinimlerinden başlaması.","kapsam":["epik ve özellik düzeyinde ürün tehdit modellemesi","değişiklik düzeyinde güvenlik ilgisi triyajı ve tehdit modeli farkı","kötüye kullanım ve suistimal senaryoları","gizlilik tehdit modellemesi ve etki değerlendirmesi tetikleyicisi","güvenli varsayılanlar ve onaylı başlangıç şablonları","kademeye göre güvenlik gereksinimi tabanı ve izlenebilirlik","yapay zekâ koduna özgü zayıflık profili","zafiyetten kök neden ve varyant analizi"],"kapsam_disi":["ajan hattının güvenliği, kimlikleri ve yetkileri (K18)","güvenlik taraması kapısının işletimi (K18-009)","ürün yetkilendirme karar noktası (K18-001)","hukuki yükümlülüklerin yorumu (K22)"],"komsu_kumeler":["K01","K05","K18","K21","K22"],"sayi":8},{"id":"K35","ad":"Mimari uygunluk ve sürdürülebilir kod sağlığı","alan":"F-guvenilir-yazilim","amac":"Ajan hızıyla üretilen kodun zaman içinde mimari niyete uygun, anlaşılır ve bakımı sürdürülebilir kalması; yapay zekâ üretimi kodun uzun vadeli etkisinin kurum içi kanıtla izlenmesi.","kapsam":["çalıştırılabilir mimari kurallar (uygunluk fonksiyonları)","modülerlik ve mimari sağlık metrikleri","ekipler arası sınır ihlali tespiti","teknik borç kaydı ve yönetimi","köken kohortuyla uzun vadeli bakım kanıtı","özellik bayrağı ve ölü kod yaşam döngüsü","ürün bağımlılıklarının sağlık ve güncellik yönetimi"],"kapsam_disi":["etki analizi ve ilişki haritası (K03)","tasarım ilkesi ve anti-kalıp denetimi (K04)","tedarik zinciri güvenliği (K18)","genel teslim ve kod sağlığı metrik tanımları (K23)"],"komsu_kumeler":["K03","K04","K07","K23","K24"],"sayi":7}],"ihtiyaclar":[{"id":"N-K01-001","baslik":"Doğal dil talebinden yapılandırılmış görev spesifikasyonu","ihtiyac":"Serbest metinle gelen talebin; kurallar, kod tabanı bulguları, dış araştırma, riskler, karar kaydı bağlantıları ve DoD ile birlikte, şeması belli bir görev spesifikasyonuna dönüştürülmesi.","cozulecek_sorun":"Serbest metin ajanlarca tutarlı uygulanamıyor; aynı talep her koşuda farklı yorumlanıyor. Çıplak kullanıcı hikâyesi ajan maliyetini de belirgin biçimde artırıyor.","yetenek_siniflari":["Y-06","Y-44"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça ortak şema zorunlu hale gelir; ekip-özel alanlar şemanın uzantısı olmalı, çatalı olmamalı.","kabul_olcutleri":["Spesifikasyonların %100'ünde şemadaki zorunlu alanlar dolu ve her iddia bir kaynağa bağlı.","Aynı talepten iki bağımsız üretimde zorunlu alanlar anlamca uyumlu."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-013","S-030","S-041","S-018","S-124"],"not":"Spesifikasyonu hangi rolün ürettiği kaynaklarda farklı adlarla geçiyor (araştırma rolü, planlayıcı, adı geçen ama tanımlanmayan bir 'spesifikasyon ajanı')."},"cember":"ic_bosluk","belirsizlik":"orta","kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-002","baslik":"Tek ve makinece doğrulanabilir iş kalemi şablonu","ihtiyac":"Kullanıcı hikâyesi, kullanıcı personası, problem tanımı, negatif kapsam, karar kaydı bağlantısı, DoD, görev açıklaması, riskler, üst iş (epik) ilişkisi ve türlerine ayrılmış kabul kriterlerini (ana akış, hata, yetki, kenar durum, korunacak mevcut davranış) içeren tek bir şema.","cozulecek_sorun":"Kaynaklarda 9 ve 10 bölümlü iki şablon var; kabul kriterleri ile DoD'nin ayrı mı aynı mı olduğu belirsiz. Şablon doğrulanamadığı için eksik iş kalemleri akışa giriyor.","yetenek_siniflari":["Y-32","Y-35"],"zorunluluk":"zorunlu","kabul_olcutleri":["Şema doğrulamasını geçmeyen iş kalemi 'hazır' durumuna geçemez.","Kabul kriteri ile DoD'nin ayrımı yazılı ve tüm ekiplerde aynı."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-053","S-054"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["C-012"],"bagimliliklar":["N-K01-001"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-003","baslik":"Makinece denetlenebilir negatif kapsam","ihtiyac":"Yapılmayacak işlerin, dokunulmayacak dosya/modüllerin, yasak yöntemlerin ve istenmeyen yan etkilerin somut ve denetlenebilir biçimde yazılması; ihlalin otomatik tespit edilmesi.","cozulecek_sorun":"Ajanlar kapsam dışına taşıyor. Reddedilen ajan değişikliklerinin başlıca nedenlerinden biri istenmeyen özellik ve kapsam kayması.","yetenek_siniflari":["Y-09","Y-14"],"zorunluluk":"zorunlu","kabul_olcutleri":["Negatif kapsamdaki bir alana dokunan değişiklik otomatik işaretlenir ve birleştirilemez.","Negatif kapsam alanı boş olan iş kalemi oranı raporlanır."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-053","S-118"],"not":"Kaynak yazım kuralını veriyor ('her madde somut ve kontrol edilebilir'); zorlama mekanizmasını vermiyor."},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-015"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-004","baslik":"Ölçülebilir kabul kriterleri ve kabul/ret örnekleri","ihtiyac":"'Mobilde düzgün görünmeli' gibi belirsiz ifadelerin ölçülebilir kısıtlara (genişlik aralığı, taşma yok, minimum dokunma hedefi vb.) çevrilmesi; uygulamadan önce en az bir kabul ve bir ret örneğinin onaylanması.","cozulecek_sorun":"Belirsiz kriter her koşuda farklı yorumlanıyor; ajan 'iyi'nin ne olduğunu mevcut koddan çıkarıyor.","yetenek_siniflari":["Y-44"],"zorunluluk":"zorunlu","kabul_olcutleri":["Öznel sıfat içeren kabul kriteri sayısı 0.","Uygulama başlamadan her kriter için onaylı kabul ve ret örneği var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-003","S-010"]},"cember":"ic_tanimli","belirsizlik":"orta","kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-005","baslik":"Her beklenti için zorunlu oracle alanları","ihtiyac":"Her kabul kriteri için beklenen sonuç, beklentinin kaynağı (ürün kararı, sözleşme, mevzuat, onaylı örnek), doğrulama yöntemi ve kapsam dışı kalanın yazılması.","cozulecek_sorun":"Kaynağı sorgulanmamış beklenti 'doğru' sayılıyor; test, kodun mevcut davranışını onaylıyor.","yetenek_siniflari":["Y-44","Y-22"],"zorunluluk":"zorunlu","kabul_olcutleri":["Oracle alanlarından biri boşsa iş kalemi hazır veya bitti durumuna geçemez.","Her testte beklentinin kaynağı izlenebilir.","Oracle alanlarında izin verilen sonuç çeşitliliği ve henüz karara bağlanmamış davranış ayrı işaretleniyor; karara bağlanmamış davranış 'bilinmiyor/karar gerekli' durumu ve kararı verecek rol sınıfıyla kayıtlı.","Zorunlu olmayan uygulama ayrıntısına bağlı testler meşru alternatif çözümü reddetmiyor; beklenti ile kontrol çeliştiğinde sonuç otomatik geçti veya kaldı sayılmıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-001","S-003","S-128","S-095","S-384"]},"cember":"ic_tanimli","belirsizlik":"dusuk","bagimliliklar":["N-K01-004"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T18; ihtiyac-kumeleri/kumeler/04_dogruluk_ve_urun_nitelikleri/01_oracle_test_ve_kanit.json#I11-01","dogrulama":"dogrulandi","kaynak_url":["https://arxiv.org/abs/2609.08149"],"ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-095, S-384 eklendi; mevcut metin değiştirilmedi.","kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-006","baslik":"Hazır olma (DoR) kapısı","ihtiyac":"Kodlamadan önce problem tanımı, kapsam, kabul kriterleri, bağımlılıklar, erişimler, tasarım/arayüz beklentisi, test yaklaşımı ve engel durumunun kontrol edilmesi; kritik bilgi eksikse işin hazır sayılmaması.","cozulecek_sorun":"Hazır olmayan iş kodlamaya giriyor ve yanlış hedefe emek harcanıyor.","yetenek_siniflari":["Y-06","Y-44","Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Hazır onayı olmayan hiçbir iş kodlamaya girmez.","'Kritik bilgi' tanımı yazılı ve sınıflandırılmış.","DoR puanı ile görev maliyeti ve kabul oranı arasındaki ilişki raporlanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-036","S-013","S-018","S-124","S-143"],"not":"'Kritik bilgi' kaynaklarda tanımlanmamış. Dil modeli tek başına iş kalemi kusurlarını orta doğrulukla buluyor; kural tabanlı kontrolle birlikte iki kapılı yapı öneriliyor."},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["U-021"],"bagimliliklar":["N-K01-002"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-007","baslik":"Sınırlı belirsizlik giderme ve açık sorunun sahibine yazılması","ihtiyac":"Eksik veya belirsiz bilgi için sınırlı sayıda (kaynaklarda en fazla 2) araştırma/netleştirme döngüsü; sonunda belirsizlik kalırsa açık sorunun iş kalemine yazılıp işin sahibine devredilmesi ve aynı noktadan devam edilmesi.","cozulecek_sorun":"Ajan belirsizliği varsayımla dolduruyor. Çok ajanlı sistem hatalarının önemli bir payı açıklama istememekten kaynaklanıyor.","yetenek_siniflari":["Y-31","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Döngü sınırı aşıldığında işin sahibine devir %100.","Soru, cevap ve cevabın kaynağı izlenebilir biçimde kaydedilir.","Açıklama isteme oranı ve cevap bekleme süresi ölçülür."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-013","S-030","S-041","S-006","S-113"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["Q-020"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-008","baslik":"Görevde yazmayan bilinmeyenlerin taranması","ihtiyac":"Dış servis/arayüz, eski kod davranışı, dağıtım ve veri göçü, yasal kısıt, iç entegrasyon ve bağımlılık yüzeylerinde görevde yazılmamış belirsizliklerin taranması; kritik belirsizliğin varsayıma gömülmeden risk veya engel olarak kaydedilmesi.","cozulecek_sorun":"Gizli bağımlılık, mevzuat ve eski davranış görevin sonunda ortaya çıkıyor. Kaynaktaki tetik koşulu ('harici temas var mı?') iç bilinmeyenleri (eski kod, iç entegrasyon) kapsamıyor.","yetenek_siniflari":["Y-14","Y-17"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kritik her belirsizlik bir risk veya engel kaydına dönüşür; belgelenmemiş varsayım sayısı 0.","Tetik koşulu iç yüzeyleri de kapsar."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-031","S-018"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["C-015","C-034"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-009","baslik":"Okunabilir davranış senaryolarının insan onayıyla kilitlenmesi","ihtiyac":"Kabul kriterlerinin, kod bilmeyenin de okuyup onaylayabileceği davranış senaryolarına (verilen–olduğunda–o zaman) çevrilmesi, insan onayıyla kilitlenmesi ve kabul testlerinin tek beklenti kaynağı olması.","cozulecek_sorun":"'Şartname doğru mu?' sorusunu test disiplini çözemez; bu soruyu yalnız insan cevaplayabilir.","yetenek_siniflari":["Y-31","Y-35"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kilitli senaryo olmadan kabul testi yazılmaz.","Kilitli senaryonun her değişikliği yeni sürüm ve onay kaydı üretir."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-010","S-013","S-002"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["Q-014"],"bagimliliklar":["N-K01-004"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-010","baslik":"Kabul kriteri ve spesifikasyon sürümlemesi","ihtiyac":"Kabul kriterlerinin ve spesifikasyonun sürümlü tutulması; bir koşu süresince sabit kalması; değişikliğin yalnız yetkili onayla yeni sürüm olarak yapılması ve eski onayları geçersiz kılması.","cozulecek_sorun":"Hedef koşu sırasında sessizce kayıyor; eski onay yeni kapsamda kullanılıyor.","yetenek_siniflari":["Y-35","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Koşu süresince kabul kriterlerinin özeti (hash) değişmez.","Kriter değişince önceki onaylar otomatik geçersiz olur."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-007","S-061","S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-011","baslik":"Kabul kriterini yazma ve onaylama hakkının tanımı","ihtiyac":"Kabul kriterini kimin yazdığının, kimin onayladığının ve ajanların hangi sınırda öneri yapabileceğinin tek biçimde tanımlanması.","cozulecek_sorun":"Kaynaklar çelişiyor: bir akışta planlayıcı ajan tamamlanma koşulunu yazıyor, DoR rolü kriter uyduramıyor, bir başkasında kriterler ürün sahibinden geliyor. Sahipsiz kriter oracle problemini derinleştirir.","yetenek_siniflari":["Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her kabul kriterinin yazan ve onaylayan rolü kayıtlı.","Ajan önerisi insan onayı olmadan kriter olamaz."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-018","S-036","S-006","S-053"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["C-009","G-002","Q-014"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-012","baslik":"İş türüne göre akış seçimi","ihtiyac":"Yeni özellik, hata düzeltme, yeniden düzenleme, doküman, altyapı, araştırma, veri ve tasarım işlerinin ayırt edilmesi; her tür için uygun akışın ve test-önce uygunluğunun belirlenmesi.","cozulecek_sorun":"Her işe aynı test-önce akışı uygulanıyor. Kod dışı işler ve testi olmayan eski kod akış dışında kalıyor; ajanların başarısı iş türüne göre çok değişiyor.","yetenek_siniflari":["Y-45","Y-06"],"zorunluluk":"zorunlu","kabul_olcutleri":["İş türü alanı zorunlu ve her türün akışı yazılı.","Kod dışı iş türleri için de bir tamamlanma tanımı var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-008","S-009","S-117","S-118"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["A-007","C-006","D-020","G-020","Q-035"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-013","baslik":"Görev spesifikasyonu şemasının kendi sürümlemesi","ihtiyac":"İş kalemi ve spesifikasyon şemasının sürümlenmesi, eski sürümle açılmış işlerin geçişinin tanımlanması.","cozulecek_sorun":"Şema değiştikçe açık işler ile yeni işler farklı alanlara sahip oluyor; ajanlar ve kapılar tutarsız çalışıyor.","yetenek_siniflari":["Y-35"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Her iş kalemi şema sürümünü taşır.","Şema değişikliğinin geçiş kuralı yazılı."],"kanit":{"duzey":"cikarim","kaynaklar":["S-062"]},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"3+ ekip","bagimliliklar":["N-K01-002"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K01-014","baslik":"Kalite özniteliği senaryoları","ihtiyac":"Epik ve özellik şablonunda güvenilirlik, güvenlik, gizlilik, gözlemlenebilirlik, bakım kolaylığı ve uyumluluk için ölçülebilir kalite özniteliği senaryolarının (uyaran, ortam, yanıt, yanıt ölçüsü) zorunlu alan olması; senaryoların kritiklik kademesinden türeyen varsayılanlarla önceden doldurulması ve DoD'de doğrulanması; işlevsel olmayan gereksinimlerin tek tek hikâyelerde kaybolmadan backlog kısıtı olarak yaşaması.","cozulecek_sorun":"Mevcut iş kalemi şablonu işlevsel davranışı, yetki ve kenar durumlarını kapsıyor; işlevsel olmayan gereksinimler yazılmazsa ajanlar onları üretmez, doğrulayıcılar denetlemez.","yetenek_siniflari":["Y-44","Y-32"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok ekipte kademe varsayılanları, ekiplerin aynı kalite tabanından başlamasını sağlar.","kabul_olcutleri":["Kademe 0–1 hizmetlere dokunan epiklerde kalite özniteliği senaryoları dolu ve her birinin doğrulama yöntemi var.","Öznel ifade içeren kalite gereksinimi sayısı 0.","Kalite özniteliği ihlali kanıt paketinde ayrı boyut olarak raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-371","S-372"],"not":"Çerçeve işlevsel olmayan gereksinimleri tüm backlog düzeylerinde kalıcı kısıt ve DoD parçası olarak tanımlar; kalite modeli 2023 sürümünde güvenlik ve güvenilirlik alt niteliklerini günceller. Benzer mevcut ihtiyaç: N-K01-002; fark: K01-002 kabul kriterini ana akış, hata, yetki, kenar durum ve korunacak davranış türlerine ayırır; işlevsel olmayan kalite gereksinimleri tür olarak yok. K04-009 yalnız performans bütçesini kapsar."},"cember":"ic_bosluk","belirsizlik":"dusuk","bagimliliklar":["N-K01-002"],"kume":"K01","alan":"A-deger-akisi"},{"id":"N-K02-001","baslik":"Büyük backlog'un ortak şablona toplu dönüştürülmesi","ihtiyac":"Park edilmiş ~12.000 kayıtlık ham backlog'un ön yüz/arka uç vb. ayrımıyla ortak şablona dönüştürülmesi; eksiklerin listelenip ürün sahibi kuyruğuna düşmesi; toplu işin hız ve maliyet tavanıyla yürümesi.","cozulecek_sorun":"Ham backlog şablona uymuyor; ajanlar bu kayıtlarla çalışamıyor.","yetenek_siniflari":["Y-45","Y-44","Y-30"],"zorunluluk":"zorunlu","olcek_etkisi":"Kayıt sayısı kesin değil; kayıt sayısı arttıkça insan gözden geçirmesi örneklemeye dönmek zorunda kalır.","kabul_olcutleri":["Dönüşüm oranı, insan düzeltme oranı, süre ve maliyet raporlanır.","Tavan aşılınca toplu iş durur."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-030","S-054","S-062"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["A-003","Q-007"],"bagimliliklar":["N-K01-002"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-002","baslik":"Toplu dönüşümün insan gözden geçirme modeli","ihtiyac":"Kaynaktaki 'insan okur, anlar, günceller' adımının hangi kapsamda (tamamı mı, örneklem mi, risk sınıfına göre mi) ve hangi kapasiteyle yapılacağının tanımlanması.","cozulecek_sorun":"Binlerce kaydın tek tek insan tarafından okunması kapasite olarak mümkün olmayabilir; kapasite hesabı yok.","yetenek_siniflari":["Y-31","Y-45"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Gözden geçirme kapsamı ve örnekleme kuralı yazılı.","Gözden geçirilen ve geçirilmeyen kayıtlar ayrı etiketli."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-030","S-054"]},"cember":"ic_bosluk","belirsizlik":"yuksek","olcek_esigi":"yüksek hacim","iliskili":["G-024","Q-007"],"bagimliliklar":["N-K02-001"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-003","baslik":"Yinelenen, eskimiş ve birleşmesi gereken kayıtların tespiti","ihtiyac":"Backlog'da anlamca aynı işlerin, eskimiş kayıtların ve birleşmesi gereken parçaların tespit edilip insan kararına sunulması.","cozulecek_sorun":"Aynı iş için yinelenen değişiklikler ve istenmeyen özellikler emek israfına dönüşüyor.","yetenek_siniflari":["Y-45","Y-15"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Tekilleştirme önerilerinin kesinliği ölçülür.","Eskimiş kayıtlar akışa girmeden ayrılır."],"kanit":{"duzey":"arastirma","kaynaklar":["S-118"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"yüksek hacim","iliskili":["G-031","Q-007","U-022"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-004","baslik":"İş hiyerarşisi ve ayrıştırma sorumluluğu","ihtiyac":"Portföy epiği → özellik → hikâye → görev hiyerarşisinin ve büyük işi küçük, bağımsız doğrulanabilir işlere kimin (insan/ajan) ayıracağının tanımlanması.","cozulecek_sorun":"Kümeleme ve önceliklendirme rolleri 'parçalanmış görev' bekliyor; parçalamayı kimin yaptığı tanımlı değil. Uzun görevlerde ajan başarısı düşüyor.","yetenek_siniflari":["Y-32","Y-06"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her iş kalemi bir üst işe bağlı.","Ayrıştırmayı yapan rol ve ayrıştırma sonucu onaylayan rol tanımlı.","Görev boyutu için üst sınır tanımlı."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-044","S-053","S-106"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["U-037"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-005","baslik":"Görevlerin bağımsız kümelere ayrılması","ihtiyac":"Parçalanmış görevlerin ilişki ve bağımlılığa göre, birbirinden bağımsız başlatılabilecek kümelere ayrılması; bağımsızlığın doğrulanması ve sınırlı bölme denemesinden sonra engel kaydı.","cozulecek_sorun":"Paralel çalışma, çakışma ve bekleme olmadan mümkün olmuyor.","yetenek_siniflari":["Y-13"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kümeler arasında bağımlılık kenarı 0.","En fazla 2 bölme denemesinden sonra bölünemeyen iş engel olarak kaydedilir."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-044","S-030","S-051"]},"cember":"ic_tanimli","belirsizlik":"dusuk","bagimliliklar":["N-K02-004","N-K03-001"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-006","baslik":"Bağımlılığa dayalı sıralama","ihtiyac":"Geliştirme sırasının iş kaydı sırasına göre değil; teknik bağımlılık, ilişkisel bağımlılık, temel bileşen ve tüketici bileşen analizine göre (temel → bağımlılık → tüketici) belirlenmesi; hazır olmayan altyapı üzerinde iş başlatılmaması.","cozulecek_sorun":"Altyapı hazır olmadan üst katmanda geliştirme yapılıyor.","yetenek_siniflari":["Y-13"],"zorunluluk":"zorunlu","kabul_olcutleri":["Sıralama bağımlılık grafiğine göre ihlalsiz.","Önkoşulu tamamlanmamış iş 'başlatılamaz' durumunda kalır."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-049","S-043"]},"cember":"ic_tanimli","belirsizlik":"dusuk","bagimliliklar":["N-K02-005"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-007","baslik":"Bağımlılık ve sıralama kararlarının deterministik hesaplanması","ihtiyac":"Döngü tespiti, topolojik sıralama ve küme bağımsızlığı kontrolünün programatik yapılması; dil modelinin yalnız yorumlama ve açıklama yapması.","cozulecek_sorun":"Dil modeli bağımlılık uydurabiliyor; sıralama her koşuda farklı çıkabiliyor.","yetenek_siniflari":["Y-13","Y-14"],"zorunluluk":"zorunlu","kabul_olcutleri":["Bağımlılık ve sıralama kararlarında dil modeli çağrısı 0.","Dil modeli çıktısı ile programatik sonuç arasındaki fark raporlanır."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062","S-028","S-022"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-008","baslik":"Paralellik ile sıralama arasındaki karar sahipliği","ihtiyac":"Kümelemenin 'her küme bağımsız başlayabilir' kararı ile önceliklendirmenin 'önce temel' kararı çeliştiğinde hangi rolün karar vereceğinin tanımlanması.","cozulecek_sorun":"İki rol aynı alanda farklı kararlar üretiyor; kararın sahibi yok.","yetenek_siniflari":["Y-13","Y-09"],"zorunluluk":"zorunlu","kabul_olcutleri":["Çelişki durumunda karar kuralı ve karar sahibi yazılı."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-044","S-049"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["C-025"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-009","baslik":"Değer, etki, efor ve risk tabanlı önceliklendirme modeli","ihtiyac":"İşlerin etki × efor, gecikme maliyeti ve risk boyutlarıyla önceliklendirilmesi; önceliklendirme kararının kime ait olduğunun ve bağımlılık sırasıyla nasıl birleşeceğinin tanımlanması.","cozulecek_sorun":"Kaynaklarda yalnız referans matris görselleri var; binlerce iş için bir önceliklendirme modeli ve karar hakkı tanımlı değil.","yetenek_siniflari":["Y-39","Y-45"],"zorunluluk":"zorunlu","kabul_olcutleri":["Önceliklendirme boyutları ve ölçekleri yazılı.","Bağımlılık sırası ile değer önceliği birleşme kuralı yazılı."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-055","S-056","S-171"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-031"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-010","baslik":"İşin ajana uygunluğunun sınıflandırılması","ihtiyac":"Her işin ajanla yapılmaya uygunluğunun (tam otomatik, ajan + insan, yalnız insan) iş türü, modül, karmaşıklık ve risk açısından sınıflandırılması.","cozulecek_sorun":"Her iş ajana veriliyor. Oysa doküman, derleme ve kurallı göç işlerinde başarı yüksek, karmaşık mevcut kodda ve performans işlerinde düşük.","yetenek_siniflari":["Y-45","Y-06"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her iş kaleminde uygunluk sınıfı var.","Sınıfa göre kabul oranı ve maliyet raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-117","S-118","S-174","S-108"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-031","R-018","U-023"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-011","baslik":"Eşzamanlı iş sınırı ve iş çekme kuralı","ihtiyac":"Kişi, ekip ve ajan başına eşzamanlı iş sınırı; hazır işin sırayla çekilmesi; aynı hata için kopya iş açılmaması.","cozulecek_sorun":"Aşırı paralellik kuyrukları ve incelemeyi tıkıyor; kopya işler emek israfına yol açıyor.","yetenek_siniflari":["Y-32","Y-12"],"zorunluluk":"zorunlu","olcek_etkisi":"Pilot varsayımı 'kişi başına 1 aktif iş' idi; 10+ ekipte sınırın ekip ve ajan kapasitesine göre yeniden tanımlanması gerekir.","kabul_olcutleri":["Eşzamanlı iş sınırı ihlali 0.","Kopya iş oranı ölçülüyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-062"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["A-004"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-012","baslik":"Backlog boyutu ile eşzamanlılığın ayrılması","ihtiyac":"Kapasite ve altyapı kararlarının backlog'daki kayıt sayısına göre değil, ölçülen aktif yüke (eşzamanlı koşu, süre, bekleme) göre verilmesi.","cozulecek_sorun":"12.000 kayıt eşzamanlı yük sanılarak gereksiz büyük altyapı tasarlanabiliyor, ya da tersine gerçek yük görülmüyor.","yetenek_siniflari":["Y-38","Y-27"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kapasite kararları ölçülmüş aktif yük verisine dayanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-061"]},"cember":"ic_tanimli","belirsizlik":"orta","iliskili":["A-004","A-012","C-032"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K02-013","baslik":"Görev boyutu ve küçük parti sınırı","ihtiyac":"Ajan işlerinin ve değişiklik önerilerinin boyutuna üst sınır konması; büyük işlerin bölünmesi.","cozulecek_sorun":"Büyük değişiklik incelenemiyor; büyük partiler kararsızlıkla ilişkili; uzun görevlerde ajan tutarlılığı düşüyor.","yetenek_siniflari":["Y-33"],"zorunluluk":"zorunlu","kabul_olcutleri":["Değişiklik başına boyut sınırı tanımlı ve aşan öneri bölünüyor.","Değişiklik boyutu dağılımı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-101","S-107","S-118","S-106"]},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["R-001","U-037"],"bagimliliklar":["N-K02-004"],"kume":"K02","alan":"A-deger-akisi"},{"id":"N-K03-001","baslik":"Uygulama geneli ilişki ve bağımlılık haritası","ihtiyac":"Modül, servis, arayüz, veri modeli ve görevler arasındaki ilişkilerin tek bir haritada sorgulanabilir olması; her görevin etkilediği alanın bu haritadan çıkarılması.","cozulecek_sorun":"Etki alanı bilinmeden yapılan değişiklik bağımlı modülleri kırıyor.","yetenek_siniflari":["Y-14"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok depolu ve çok ekipli yapıda harita ekip sahipliği bilgisini de taşımalı.","kabul_olcutleri":["Her görev için etkilenen modül/servis/arayüz/veri modeli listesi üretiliyor.","Kaçan etki (sonradan kırılan bağımlılık) sayısı ölçülüyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-051","S-030","S-043"]},"cember":"ic_bosluk","belirsizlik":"orta","kume":"K03","alan":"A-deger-akisi"},{"id":"N-K03-002","baslik":"İlişki haritasının koddan üretilmesi ve güncelliği","ihtiyac":"Haritanın kod tabanından otomatik üretilmesi, değişiklikten sonra belirli sürede yenilenmesi ve güncelliğinin ölçülmesi; haritayı kimin işlettiğinin tanımlanması.","cozulecek_sorun":"Elle tutulan harita bayatlıyor; kaynaklar haritanın varlığını varsayıyor ama üretimini ve güncelliğini tanımlamıyor.","yetenek_siniflari":["Y-14"],"zorunluluk":"zorunlu","kabul_olcutleri":["Kod değişikliği ile harita güncellemesi arasındaki gecikme ölçülüyor ve eşiği tanımlı."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-051"
