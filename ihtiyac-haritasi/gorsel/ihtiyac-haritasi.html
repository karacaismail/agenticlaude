evcut ihtiyaç: N-K25-006; fark: N-K25-006 dönemsel yapay zekâsız tatbikat istiyor; günlük işten sürekli öncü gösterge üretmiyor."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"zamanla (3–6 ay)","bagimliliklar":["N-K25-006"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-008","baslik":"İnsan–ajan birleşiminin tamamlayıcılık ölçümü","ihtiyac":"İş türü ve iş birliği modu bazında insan+ajan birleşiminin yalnız ajan ve yalnız insan başarımına göre değer katıp katmadığının ölçülmesi (kalite, süre, yeniden iş); sonucun iş birliği modu seçimine ve otonomi politikasına geri beslenmesi.","cozulecek_sorun":"İnsan+yapay zekâ birleşimleri ortalamada en iyi tek taraftan kötü; karar görevlerinde kayıp, üretim görevlerinde kazanç var. Deneyimli geliştiricilerle yapılan randomize çalışmada yapay zekâ kullanımı işi yavaşlattı, katılımcılar ise hızlandıklarını düşündü. Mevcut metrikler ajanı veya algıyı ölçüyor, birleşimin katma değerini değil.","yetenek_siniflari":["Y-29","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Pilotta az örneklemle yalnız eğilim görülür; yaygınlaştırma kararından (N-K23-013) önce iş türü bazında ölçülmesi gerekir.","kabul_olcutleri":["Kurum görev setinde iş türü × mod kırılımında tamamlayıcılık raporu var.","Tamamlayıcılığı negatif çıkan iş türü–mod eşleşmeleri için mod değişikliği kararı kayıtlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-181","S-225","S-104"],"not":"Meta-analiz (106 deney, 370 sonuç, 2024). Açıklamalı yapay zekâ desteği tamamlayıcı ekip başarımı üretmekte zorlanıyor (CHI 2021). Deneyimli açık kaynak geliştiricileriyle randomize çalışmada yapay zekâ ile iş %19 yavaşladı, katılımcılar ~%20 hızlandıklarını düşündü (2025). Benzer mevcut ihtiyaç: N-K23-008; fark: N-K23-007 ajan metriklerini, N-K23-008 algılanan–ölçülen farkını, N-K23-012 üretim içi kabulü ölçüyor; insan+ajan birleşiminin tek başına taraflara göre katma değeri ölçülmüyor."},"cember":"dis_eksik","belirsizlik":"yuksek","olcek_esigi":"pilot sonrası","bagimliliklar":["N-K23-008"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-009","baslik":"Katkı kökeninin ayrıntılı kaydı ve amaca bağlı kullanımı","ihtiyac":"Her değişiklikte insan ve ajan katkısının parça düzeyinde kökeninin (kim/ne üretti, kim düzenledi, kim yönlendirdi, kim onayladı) sürüm kontrolündeki yazar kimliğinden ayrı bir kayıtta tutulması; bu verinin inceleme yönlendirmesi, denetim ve fikri mülkiyet için kullanılması; bireysel performans değerlendirmesinde ajan kullanım miktarı veya üretilen satır sayısı gibi göstergelerin kullanılmaması; yönlendirme, spesifikasyon ve inceleme gibi görünmez katkıların tanınması.","cozulecek_sorun":"İnsan katkısının kaydı ve yazar kimliği politikası (bot ortak yazar imzası yok) tanımlı; parça düzeyi köken ve verinin hangi amaçla kullanılabileceği tanımsız. Sektörde yapay zekâ kullanımının performans değerlendirmesine bağlanması yaygınlaşıyor; bu gösteriş amaçlı kullanım ve çalışan izleme kaygısı doğurur.","yetenek_siniflari":["Y-54","Y-28","Y-36"],"zorunluluk":"zorunlu","olcek_etkisi":"Kayıt hacmi değişiklik sayısıyla doğrusal büyür; 10+ ekipte kullanım amacı sınırı yazılı değilse veri ekipler arası kıyas ve bireysel izleme için kötüye kullanılabilir (U-038).","kabul_olcutleri":["Parça düzeyi köken kaydı, yazar kimliği politikasıyla çelişmeden tutuluyor.","Köken verisinin izinli kullanım amaçları yazılı; bireysel performans kullanımına ilişkin sınır karar kaydında.","İnceleme ve yönlendirme katkıları ekip görünürlüğünde sayılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-242","S-243","S-244","S-245"],"not":"Satır aralıklarını üreten konuşma ve katkıcıyla ilişkilendiren açık köken belirtimi taslağı (2026). İki büyük şirket 2025'te yapay zekâ kullanımını performans değerlendirmesine bağladı. Bir dağıtım projesinin politikası: katkının tam sorumluluğu insanda, yapay zekâ nihai karar verici olamaz. Benzer mevcut ihtiyaç: N-K19-006; fark: N-K19-006 insan katkısının kaydını, N-K22-004 değişiklik yazar kimliği politikasını tanımlıyor; parça düzeyinde köken, verinin kullanım amacı sınırı ve görünmez katkıların tanınması yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K19-006"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-010","baslik":"Ekip düzeyinde insan–ajan çalışma anlaşması ve iş birliği retrospektifi","ihtiyac":"Her ekibin çalışma anlaşmasında ajanla çalışma maddelerinin bulunması (kullanılan iş birliği modları, ajan değişikliklerinde inceleme beklentisi, bildirim saatleri, gözetim sorumluluğu, anlaşmazlıkta izlenecek yol); ekip retrospektiflerinde iş birliği sürtünmelerinin (kötü devir, yanlış varsayım, gereksiz kesinti, güven kırılması) bir sürtünme kaydından beslenerek ele alınması ve eylemlerin kural, mod veya yetenek paketi değişikliğine bağlanması.","cozulecek_sorun":"Ajan olayları program düzeyinde inceleme ve uyarlama gündemine giriyor; günlük iş birliği sürtünmesi ekip düzeyinde görünmüyor ve iyileştirme döngüsüne girmiyor. Yapay zekâ ekiplerin mevcut güçlü ve zayıf yanlarını büyütüyor; açık ve iletilmiş bir yapay zekâ tutumu temel yetenek sayılıyor.","yetenek_siniflari":["Y-32","Y-37"],"zorunluluk":"zorunlu","olcek_etkisi":"10+ ekipte ekip anlaşmalarının ortak asgari maddeleri ART düzeyinde, ayrıntıları ekip düzeyinde tutulmalı; sürtünme kayıtları program düzeyi incelemeye (N-K24-009) özetlenmeli.","kabul_olcutleri":["Her ekibin çalışma anlaşmasında ajan maddeleri var ve dönemsel gözden geçiriliyor.","Retrospektiflerden çıkan iş birliği eylemlerinin kapanma oranı izleniyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-094","S-196","S-213","S-230"],"not":"yıllık yazılım teslim performansı araştırması 2025 bulgularından (yapay zekâ bir büyüteç; açık yapay zekâ tutumu ve kullanıcı odaklılık) ve insan faktörleri önerilerinden (sürekli geri bildirim, net görev tahsisi) çıkarılmıştır. Benzer mevcut ihtiyaç: N-K24-009; fark: N-K24-009 ajan olaylarını ve değerlendirme gerilemelerini program düzeyine taşıyor; ekip çalışma anlaşması ve ekip retrospektifinde iş birliği sürtünmesi ele alınmıyor."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K24-009"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K29-011","baslik":"İnsan–ajan çalışma becerisinin uygulamalı kazandırılması","ihtiyac":"Genel yapay zekâ okuryazarlığının ötesinde işi ajana devretme, yönlendirme, ajan çıktısını inceleme ve ne zaman ajansız çalışılacağına karar verme becerilerinin uygulamalı olarak kazandırılması (gözetimli ilk koşular, iyi ve kötü örnek kütüphanesi, akran paylaşımı); beceri düzeyinin iş verisiyle (terk edilen koşu, yeniden iş, yönlendirme etkinliği) izlenmesi.","cozulecek_sorun":"Rol bazlı eğitim sınırlar, hata modları ve güvenli kullanımı kapsıyor; ajanla birlikte çalışma pratik bir beceri. Deneyimsiz kullanıcılar sorunlu oturumları deneyimlilere göre yaklaşık üç kat daha sık terk ediyor; üretmekten değerlendirmeye kayan rol yeni bilişsel yükler getiriyor.","yetenek_siniflari":["Y-53","Y-37"],"zorunluluk":"zorunlu","olcek_etkisi":"Her yeni ekip katılımında tekrarlanır; 10+ ekipte akran paylaşımı ve örnek kütüphanesi ölçek ekonomisi sağlar.","kabul_olcutleri":["Rol bazlı uygulamalı müfredat ve örnek kütüphanesi var.","Yeni kullanıcıların ilk koşuları gözetimli; beceri göstergelerinin zamanla değişimi izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-183","S-230","S-238"],"not":"Kullanım analizinde yeni başlayanlar sorunlu oturumları %19, deneyimliler %5–7 oranında terk ediyor; uzmanlık arttıkça talimat başına ajan eylemi artıyor. İnsan faktörleri: bilgi çalışanının rolü üretimden değerlendirmeye kayıyor. Benzer mevcut ihtiyaç: N-K25-005; fark: N-K25-005 yapay zekâ okuryazarlığı ve güvenli kullanım eğitimi istiyor; devretme, yönlendirme ve inceleme becerilerinin uygulamalı kazanımı ve iş verisiyle izlenmesi yok."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K25-005"],"kume":"K29","alan":"E-insan-ajan-birlikte-calisma"},{"id":"N-K33-001","baslik":"Hizmet ve bileşen kritiklik kademeleri","ihtiyac":"Ürün hizmetlerinin ve paylaşılan kritik bileşenlerin kullanıcı etkisi, para ve güvenlik etkisi, veri hassasiyeti, düzenleme kapsamı ve bağımlı sayısına göre az sayıda kritiklik kademesine ayrılması; kademenin SLO hedefini, üretime hazırlık incelemesinin derinliğini, dayanıklılık deneyi sıklığını, tehdit modeli derinliğini, biçimsel yöntem gereksinimini ve o hizmete dokunan ajan işlerinin otonomi tavanını belirleyen tek anahtar olması.","cozulecek_sorun":"Tüm hizmetlere aynı güvence düzeyi uygulanırsa kritik hizmette güvence yetersiz, düşük riskli işte gereksiz yavaşlık oluşur. Mevcut risk sınıflaması (K21) değişikliğin türünü sınıflar; değişikliğin dokunduğu hizmetin kritikliğini ve bundan türeyen zorunlu güvence paketini sınıflamaz.","yetenek_siniflari":["Y-62","Y-09","Y-35"],"zorunluluk":"zorunlu","olcek_etkisi":"Tek ekipte basit bir liste yeterlidir; 10+ ekipte kademe tablosu ekipler arası ortak güvence dili ve denetim anahtarı olur.","kabul_olcutleri":["Her üretim hizmeti ve paylaşılan bileşen kayıtta bir kritiklik kademesine ve bir insan sahibine sahip.","Kademe → zorunlu uygulamalar tablosu sürümlü politikada tanımlı ve her değişikliğin risk sınıflamasına girdi olarak akıyor.","Kademesi atanmamış hizmete ajan değişikliği otomatik birleştirilemiyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-316","S-318","S-342","S-372"],"not":"Hazırlık incelemesi ve güvenlik doğrulama standartları güvence derinliğini hizmetin kritikliğine göre ayarlar; kademenin otonomi tavanını da belirlemesi çıkarımdır. Benzer mevcut ihtiyaç: N-K21-002; fark: K21-002 değişiklik risk kategorilerini tanımlar; hizmetin kendisinin kritikliğini ve kademeye bağlı zorunlu güvence paketini tanımlamaz. Bu anahtar olmadan E1, E2 ve E3'teki ihtiyaçların hangi hizmette ne derinlikte uygulanacağı belirlenemez."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-035","H-14"],"bagimliliklar":["N-K21-002"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-002","baslik":"Kullanıcı yolculuğuna dayalı SLI/SLO kataloğu","ihtiyac":"Her ürün hizmeti için kritik kullanıcı yolculuklarından türetilmiş hizmet düzeyi göstergelerinin (başarı oranı, gecikme, veri tazeliği, doğruluk), hedef değerlerinin, ölçüm penceresinin, ölçüm noktasının ve sahibinin sürümlü bir katalogda tutulması; hedefin %100 olmaması, ürün sahibiyle birlikte belirlenmesi ve dönemsel gözden geçirilmesi.","cozulecek_sorun":"Hedef tanımlı değilse 'yeterince güvenilir' tartışması öznel kalır; ajan hızının üretime etkisi ölçülemez, hata bütçesi hesaplanamaz. Mevcut K16-001 yalnız ajan hattının kendi hizmet hedeflerini kapsar, ürettiği yazılımı değil.","yetenek_siniflari":["Y-60","Y-27"],"zorunluluk":"zorunlu","olcek_etkisi":"10+ ekipte katalog, hizmet zincirindeki hedeflerin birbirini tutması ve ekipler arası karşılaştırma için ortak kaynak olur.","kabul_olcutleri":["Kademe 0–1 hizmetlerin %100'ünde en az bir yolculuk temelli SLI ve onaylı SLO var.","SLI ölçümü kullanıcıya en yakın noktadan yapılıyor ve ölçüm tanımı kodla birlikte sürümlü.","SLO'lar en az çeyrekte bir gözden geçiriliyor; her değişiklik gerekçesiyle kayıtlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-310","S-313","S-311"],"not":"Yerleşik güvenilirlik mühendisliği rehberleri SLO'yu kullanıcı deneyiminden türetmeyi ve %100 hedeften kaçınmayı önerir. Benzer mevcut ihtiyaç: N-K16-001; fark: K16-001 hattın hedeflerini tanımlar; ürün hizmetlerinin kullanıcı odaklı güvenilirlik hedefleri haritada yok. Ürünlerde bugün SLO olgunluğunun ne olduğu bilinmediği için belirsizlik orta."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-035","H-14"],"bagimliliklar":["N-K16-001"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-003","baslik":"Onaylı hata bütçesi politikası","ihtiyac":"SLO'dan türeyen hata bütçesinin ürün, mühendislik ve işletim tarafından önceden onaylanmış yazılı bir politikaya bağlanması: bütçe tükenince hangi değişikliklerin durduğu (ör. yalnız güvenlik ve kritik düzeltmeler geçer), hangi istisnaların geçerli olduğu (dış neden, kapsam dışı kullanıcı, yanlış sınıflanmış hata), bütçenin belirli bir oranını tek başına tüketen olay için zorunlu olay sonrası analiz ve anlaşmazlıkta son karar sahibi.","cozulecek_sorun":"Politikasız hata bütçesi yalnız bir göstergedir; teslim baskısında istisnalarla delinir ve hız–güvenilirlik kararı her seferinde yeniden pazarlık konusu olur.","yetenek_siniflari":["Y-60","Y-09","Y-35"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok ekipli yapıda paylaşılan bağımlılığın bütçeyi tüketmesi sık görülür; dış neden istisnası ve atıf kuralı olmadan politika uygulanamaz.","kabul_olcutleri":["Politika sürümlü, onaylı ve tetiklediği eylemler makinece okunabilir biçimde politika deposunda.","Bütçesi tükenmiş hizmette politika dışı yayın sayısı 0; her istisna gerekçe ve onaylayanla kayıtlı.","Bütçenin tanımlı oranını (ör. %20) tek başına tüketen her olay için olay sonrası analiz açılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-312","S-311"],"not":"Yayımlanmış örnek politika, bütçe aşımında P0 ve güvenlik dışı yayınların durdurulmasını, istisna sınıflarını ve anlaşmazlıkta üst yönetime eskalasyonu tanımlar."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-035","H-14"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-004","baslik":"Hata bütçesi durumunun ajan otonomisine ve değişiklik hızına bağlanması","ihtiyac":"Hizmetin hata bütçesi durumunun (sağlıklı, eriyor, tükendi) o hizmete dokunan ajan işlerinin otonomi kademesini, eşzamanlı açık ajan değişikliği sınırını, değişiklik boyutu tavanını ve otomatik birleştirme hakkını politika motoru üzerinden belirlemesi; bütçe eridikçe otonominin otomatik daralması, iyileşme ölçülünce insan onayıyla geri açılması; bütçenin değişikliğin kaynağına bakmadan tüketilmesi ama kısıtın öncelikle ajan hızına uygulanması.","cozulecek_sorun":"Kademeli otonomi (K17-007) test ve inceleme sinyallerine dayanır, üretim sinyaline bağlı değildir; ajanlar istikrarı bozulmuş bir hizmete aynı hızla değişiklik göndermeye devam edebilir. Sektör araştırmaları yapay zekâ benimsemesinin teslim istikrarıyla olumsuz ilişkili olduğunu iki yıl üst üste raporluyor.","yetenek_siniflari":["Y-60","Y-42","Y-09","Y-31"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ajan değişikliklerinin üretime aktığı andan itibaren zorunlu; paylaşılan hizmetlerde kısıt ekip düzeyinde değil hizmet düzeyinde uygulanmalı.","kabul_olcutleri":["Bütçesi tükenmiş hizmete ajan kaynaklı otomatik birleştirme sayısı 0.","Bütçe durumu → otonomi kademesi eşlemesi sürümlü politikada ve koşu başında sabitleniyor.","Otonomi daraltma ve geri açma olayları denetim kaydında; geri açma insan onaylı ve iyileşme ölçümüne bağlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-312","S-319","S-102","S-320"],"not":"Bütçe tükenince yayını dondurmak yerleşik uygulamadır; bütçe durumunu ajan otonomi kademesine eşlemek bu uygulamanın çıkarımsal uzantısıdır. 2024 sektör raporu benimsemedeki her %25 artışta istikrarda yaklaşık %7,2 düşüş raporladı; 2025 raporu hızla olumlu, istikrarla olumsuz ilişkinin sürdüğünü belirtiyor. Benzer mevcut ihtiyaç: N-K17-007; fark: K17-007 güven skorunu test/inceleme verisine dayandırır; üretimdeki güvenilirlik durumunu otonomiye ve hıza bağlayan bir mekanizma yok."},"cember":"ic_bosluk","belirsizlik":"orta","olcek_esigi":"üretim","iliskili":["G-035","H-14"],"bagimliliklar":["N-K17-007"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-005","baslik":"Yapılandırma, bayrak ve veri düzlemi değişikliklerinin güvencesi","ihtiyac":"Çalışma zamanı yapılandırması, özellik bayrağı, politika ve kota tanımı, kural ve referans veri dosyası gibi kod dışı değişikliklerin de sürümlü, şema doğrulamalı, boyut ve alan sınırı denetimli, kademeli yayılan, hızlı geri alınabilen ve öldürme anahtarı olan bir değişiklik sınıfı olarak ele alınması; sistemin kendi ürettiği yapılandırma dosyalarının da dış girdi gibi doğrulanması; ajanların bu değişiklikleri kod değişikliğiyle aynı risk sınıflamasından geçirmesi.","cozulecek_sorun":"Son yılların büyük kesintilerinin önemli bir kısmı kod değil yapılandırma, politika veya içerik verisi değişikliğinden çıktı ve saniyeler içinde tüm filoya yayıldı. Kod için kurulan kapılar bu yolu kapsamazsa ajanlar kapıların dışından üretimi etkileyebilir.","yetenek_siniflari":["Y-34","Y-09","Y-35","Y-06"],"zorunluluk":"zorunlu","olcek_etkisi":"Paylaşılan yapılandırma ve bayrak sistemleri çok ekipli yapıda ortak kesinti noktasıdır; bir ekibin değişikliği tüm ekipleri etkileyebilir.","kabul_olcutleri":["Üretimi etkileyen her yapılandırma/veri değişikliği sürümlü, şemaya karşı doğrulanmış ve kademeli yayılıyor; anlık küresel yayılım yalnız tanımlı acil durum prosedürüyle.","Yeni kod yolları bayrak arkasında yayılıyor ve bayrak kapalıyken varsayılan davranış test edilmiş.","Yapılandırma/veri değişikliği kaynaklı olay oranı ayrı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-360","S-361","S-362","S-363"],"not":"Olay raporları: 2025 sonunda bir içerik dağıtım sağlayıcısında veritabanı yetki değişikliği kendi ürettiği özellik dosyasını iki katına çıkarıp küresel kesinti yarattı; 2024'te bir güvenlik ürününde içerik güncellemesindeki alan sayısı uyuşmazlığı küresel çökme yarattı ve kademeli yayılım sonradan eklendi; 2025'te bir bulut sağlayıcısında boş alanlı politika verisi bayraksız yeni kod yolunu tetikledi. Otomatik kanarya analizi yapılandırma ve veri seti değişikliklerini de kapsar. Benzer mevcut ihtiyaç: N-K06-008; fark: K06-008 ajan kaynaklı kod değişikliğinin kademeli açılmasını kapsar; kod dışı değişikliklerin doğrulanması ve kademeli yayılımı tanımlı değil. Mevcut yayın hattının yeniden tasarımı bilinçli kapsam dışıdır; bu ihtiyaç hattı değil değişiklik sınıfını tanımlar."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-035","H-14"],"bagimliliklar":["N-K06-008"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-006","baslik":"Üretime hazırlık ve işletilebilirlik incelemesi","ihtiyac":"Yeni hizmet, büyük özellik veya mimari değişiklik genel kullanıma açılmadan önce kritiklik kademesine göre derinleşen bir hazırlık incelemesi: SLO ve panolar, uyarılar ve bağlı işletim dokümanları, nöbet sahibi, kapasite ve yük sınırı, bağımlılık ve bozulmuş mod analizi, geri yükleme ve geri alma tatbikatı, güvenlik ve gizlilik değerlendirmesi sonuçları, veri saklama; kontrol listesinin kurumun kendi olay ve ramak kala analizlerinden beslenmesi ve incelemenin periyodik tekrarlanması.","cozulecek_sorun":"DoD tek bir işin bittiğini denetler; bir hizmetin üretimde işletilebilir olup olmadığını denetlemez. Ajanlar işlevsel olarak doğru ama izlenemeyen, geri alınamayan veya nöbetçinin anlamadığı sistemler üretebilir.","yetenek_siniflari":["Y-62","Y-31","Y-37","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok ekipte ortak kontrol listesi ve ekip/ürün ekleri (katmanlı) gerekir; inceleme kapasitesi yeni bir darboğaz olabilir, kademeye göre derinlik bunu sınırlar.","kabul_olcutleri":["Kademe 0–1'de hazırlık incelemesi tamamlanmadan genel kullanıma açılış yok.","Kontrol listesinin her maddesi en az bir geçmiş olaya, ramak kalaya veya bilinen arıza moduna bağlı.","İnceleme kademe 0 için en az yılda bir tekrarlanıyor; sapmalar iş kalemine dönüşüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-316","S-318"],"not":"Hazırlık incelemesi tasarım ve bağımlılıklar, izleme, kriz müdahalesi, kapasite, dağıtım ve performansı kapsar; işletim hazırlık incelemesi kontrol listesini kurumun kendi olay analizlerinden türetmeyi ve dönemsel tekrarı önerir. Benzer mevcut ihtiyaç: N-K05-027; fark: DoD ve teslim öncesi boşluk analizi iş kalemi düzeyindedir; hizmet düzeyinde işletilebilirlik kapısı haritada yok."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-035","H-14"],"bagimliliklar":["N-K05-027"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-007","baslik":"Tasarımdan gözlemlenebilirlik","ihtiyac":"Her davranış için telemetri gereksiniminin (SLI'ya katkı, yapılandırılmış log olayları, iz yayılımı ve korelasyon kimliği, iş olayı metrikleri, hata sinyalleri) kabul kriteri ve DoD'nin parçası olarak yazılması; gözlemlenebilirliğin enjekte edilen arızalarla doğrulanması (arıza tetiklendiğinde izleme sinyalinin görünür olup olmadığı); log ve iz standardının talimatla değil deterministik kapıyla denetlenmesi.","cozulecek_sorun":"Ajan üretimi sistemler işlevsel olarak doğru olsa da arızaların küçük bir kısmında teşhis sinyali üretiyor; ajanlar log talimatlarına çoğunlukla uymuyor ve onarım işi kayıt dışı biçimde insanlara kalıyor. Bu, tespit ve kurtarma süresini uzatır.","yetenek_siniflari":["Y-27","Y-20","Y-61"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekipler arası ortak telemetri sözlüğü ve iz yayılımı olmazsa hizmetler arası olaylar birleştirilemez; 10+ ekipte zorunlu ortak standart gerekir.","kabul_olcutleri":["Davranış üreten her iş kaleminde telemetri gereksinimi alanı dolu ve doğrulama yöntemine bağlı.","Kritik yolculuklarda arıza enjeksiyonu testinde enjekte edilen arızaların hedef oranı (ör. ≥%90) izleme sinyaliyle tespit ediliyor.","Log/iz şeması ve korelasyon kimliği ihlali birleştirmeyi engelliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-323","S-324","S-315"],"not":"2026 çalışması: ajan üretimi mikro servislerde enjekte edilen arızaların en fazla %13,99'u izleme sinyaliyle görünür oldu. Başka bir 2026 çalışması: 4.550 ajan değişikliğinde açık log talimatı %4,7 oranında veriliyor, ajanlar yapıcı taleplerin %67'sine uymuyor, sonradan log onarımlarının %72,5'ini insanlar yapıyor; yazarlar deterministik korkuluk öneriyor. Benzer mevcut ihtiyaç: N-K05-021; fark: K05-021 test sırasında örtük hataları yakalar; üretimde teşhis edilebilirliği tasarım gereksinimi yapmaz. K19 ajan hattının izini kapsar, ürünün telemetrisini değil."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-035","H-14"],"bagimliliklar":["N-K05-021"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-008","baslik":"Belirti temelli ve bütçe yanma hızına dayalı uyarı","ihtiyac":"Ürün uyarılarının neden temelli (işlemci, tekil hata) yerine kullanıcı belirtisi ve hata bütçesi yanma hızı (çoklu pencere, çoklu hız) üzerine kurulması; her uyarının sahibi, işletim dokümanı ve eylem yolu olması; uyarı kalitesinin (eylemsiz uyarı, uyarısız fark edilen olay) ölçülmesi.","cozulecek_sorun":"Ajan hızıyla artan değişiklik hacmi gürültülü uyarıları çoğaltır; nöbetçi yorgunluğu gerçek olayların kaçırılmasına ve tükenmişliğe yol açar.","yetenek_siniflari":["Y-60","Y-27"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Hizmet ve ekip sayısı arttıkça uyarı gürültüsü doğrusal değil çarpımsal büyür; ortak uyarı standardı gerekir.","kabul_olcutleri":["Kademe 0–1 hizmetlerde her SLO için yanma hızı uyarısı tanımlı.","Eylemsiz kapanan uyarı oranı ve uyarısız (müşteri bildirimiyle) fark edilen olay oranı ölçülüyor ve hedefi var.","Her uyarı bir işletim dokümanına ve sahibine bağlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-314","S-315"],"not":"Rehber, SLO savunması için çoklu pencere ve çoklu yanma hızı tekniğini en uygun yaklaşım olarak önerir."},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"üretim","iliskili":["G-035","H-14"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-009","baslik":"Ürün dayanıklılık deneyleri ve oyun günleri","ihtiyac":"Kritik hizmetlerde kararlı durum hipotezi (SLI) üzerine kurulu, patlama yarıçapı sınırlı, otomatik durdurma koşulu tanımlı dayanıklılık deneylerinin (bağımlılık kesintisi, gecikme, kaynak tükenmesi, örnek/bölge kaybı, bozuk yanıt) önce üretim öncesinde, olgunlaştıkça kontrollü üretimde düzenli koşturulması; ajanın yazdığı yeniden deneme, zaman aşımı, devre kesici ve idempotency kodunun bu deneylerle doğrulanması; ekipler arası oyun günleri.","cozulecek_sorun":"Dayanıklılık tasarımı (K04-011) yazılı olsa da gerçek arızada davranış doğrulanmadıkça varsayım olarak kalır; yeniden deneme fırtınası, zincirleme arıza ve toparlanmada sürü etkisi birim testinde görünmez.","yetenek_siniflari":["Y-61","Y-19","Y-27"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Çok ekipli hizmet zincirlerinde tek ekip deneyleri zincir davranışını göstermez; ekipler arası oyun günü gerekir.","kabul_olcutleri":["Kademe 0–1 hizmetlerde her çeyrekte en az bir deney kayıtlı; hipotez, sonuç ve bulgular iş kalemine bağlı.","Her deneyin patlama yarıçapı ve otomatik durdurma koşulu önceden onaylı.","Deney bulgularının kapanma oranı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-325","S-326","S-327","S-328","S-362"],"not":"Kaos mühendisliği ilkeleri kararlı durum hipotezi, gerçek olayların çeşitlenmesi, üretimde deney ve patlama yarıçapının küçültülmesini içerir; 2025 çalışması 50 sektör kaynağında uygulamanın dağıtım hatlarına yerleştiğini raporlar. 2025 bulut olayında toparlanmadaki sürü etkisi kesintiyi uzattı. Benzer mevcut ihtiyaç: N-K16-009; fark: K16-009 ajan hattının arıza senaryolarını, K04-011 dayanıklılık gereksinimlerinin yazılmasını kapsar; ürünün gerçek arıza davranışını deneyle doğrulayan ihtiyaç yok."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"üretim","iliskili":["G-035"],"bagimliliklar":["N-K16-009"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-010","baslik":"Ürün için geri yükleme ve felaket kurtarma hedefleri","ihtiyac":"Kademe bazında kurtarma süresi ve kabul edilebilir veri kaybı hedeflerinin tanımlanması; yedeğin değil geri yüklemenin düzenli ve otomatik doğrulanması; silme işlemlerinde yumuşak silme ve gecikmeli yok etme; ajanın erişebildiği ortamlarda yedeklerin ajan kimliklerinin silme yetkisi dışında tutulması.","cozulecek_sorun":"Yedekler çoğu zaman gerçek bir geri yükleme denenene kadar çalışmıyor çıkar; ajanın yıkıcı eylemine karşı son savunma geri yüklemedir. K16-004 yalnız ajan platformunun durum ve kanıt depolarını kapsar.","yetenek_siniflari":["Y-28","Y-36","Y-61"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça veri deposu sayısı artar; merkezi tatbikat takvimi ve kanıt kaydı gerekir.","kabul_olcutleri":["Kademe 0–1 veri depolarında geri yükleme tatbikatı periyodu tanımlı ve son tatbikat hedef süre içinde başarılı.","Kurtarma hedefini aşan tatbikat bulgusu engelleyici iş kalemine dönüşüyor.","Yedekler ve yumuşak silinmiş veriler ajan kimliklerinin yazma/silme yetkisi dışında."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-317","S-359","S-149"],"not":"Rehberin ana tezi: istenen yedek değil geri yüklemedir; yumuşak silme, katmanlı yedek ve bant dışı doğrulama birlikte kullanılır. 2017 olay raporunda birden çok yedek mekanizmasının çalışmadığı ancak olayda anlaşıldı; 2025'te bir ajan kod dondurma sırasında üretim veritabanını sildi ve kurtarma yolu yetersizdi. Benzer mevcut ihtiyaç: N-K16-004; fark: K16-004 ajan platformunun kendi depolarını kapsar; üretilen ürünün veri kurtarma hedefleri ve tatbikatı haritada yok."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-035"],"bagimliliklar":["N-K16-004"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-011","baslik":"Veri sözleşmeleri ve üretim veri kalitesi denetimi","ihtiyac":"Hizmetler ve ekipler arasında akan veri (olay, tablo, dosya, dışa aktarım) için üretici–tüketici veri sözleşmesi (şema, anlam, birim, geçerli aralık, tamlık, tazelik, benzersizlik); bu sözleşmelerin yalnız testte değil üretimde sürekli doğrulanması, zaman dilimleri arası sapma tespiti, kritik kayıtların yetkili kaynakla periyodik uzlaştırılması ve ihlalde tüketiciyi koruyan karantina.","cozulecek_sorun":"Testler geçse de üretimde bozuk, eksik veya anlamı kaymış veri sessizce yayılır; ajan üretimi dönüşüm ve entegrasyon kodu ince anlam hataları taşıyabilir. K05-020 ve K05-024 doğruluğu test anında denetler, üretimde sürekli denetlemez.","yetenek_siniflari":["Y-66","Y-27","Y-20"],"zorunluluk":"kosullu","olcek_etkisi":"Ekipler arası veri akışları arttıkça sözleşmesiz değişiklik kırılmaları çoğalır; 3+ ekipte merkezi sözleşme kaydı gerekir.","kabul_olcutleri":["Kademe 0–1 veri akışlarının %100'ünde sürümlü veri sözleşmesi ve sahibi var.","Sözleşme ihlali üretimde tanımlı süre içinde tespit edilip tüketiciye yayılmadan karantinaya alınıyor.","Kritik alanlarda periyodik uzlaştırma raporu ve uyuşmazlık oranı hedefi var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-356","S-357","S-358","S-360"],"not":"Bildirimsel veri 'birim testleri' ile büyük ölçekli veri kalitesi doğrulaması ve üretim hatlarında zaman dilimi özeti karşılaştırması yayımlanmış yöntemlerdir; veri kalitesi modeli doğruluk, tamlık, tutarlılık, güncellik gibi nitelikleri tanımlar. Benzer mevcut ihtiyaç: N-K05-024; fark: K05-024 veri bütünlüğünü test kapsamında ister; üretimde sürekli veri kalitesi denetimi, sözleşme ve uzlaştırma ihtiyacı yok. Koşul: kalıcı veri taşıyan veya ekipler arası veri akışı olan hizmetler."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-035"],"bagimliliklar":["N-K05-024"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-012","baslik":"Veri onarımı ve toplu veri düzeltmesinin güvenli yürütülmesi","ihtiyac":"Şema göçü dışındaki veri düzeltme, geri doldurma ve toplu güncelleme işlemlerinin ayrı bir değişiklik türü olarak ele alınması: etkilenecek kayıt kümesinin önceden sayılması, deneme çalıştırması, örneklem doğrulaması, önce/sonra uzlaştırma, geri alma verisinin saklanması, kademeli uygulama ve insan onayı; ajanın düzeltme betiği yazabilmesi ama üretimde yürütememesi.","cozulecek_sorun":"Veri düzeltmeleri çoğu zaman sürüm kontrolü ve test dışında, elle ve geri dönüşsüz yapılır; ajan yazımı düzeltmedeki kapsam hatası doğrudan müşteri verisini bozar.","yetenek_siniflari":["Y-34","Y-09","Y-66","Y-28"],"zorunluluk":"kosullu","olcek_etkisi":"Ekip sayısıyla birlikte ortak veri depolarına dokunan düzeltmeler ekipler arası etki yaratır.","kabul_olcutleri":["Üretim verisine dokunan her düzeltmede tahmini ve gerçekleşen etkilenen kayıt sayısı kayıtlı; eşik farkı işlemi durduruyor.","Geri alma verisi olmadan düzeltme yürütülemiyor.","Düzeltme betiği sürümlü, iş kalemine bağlı ve bağımsız çalıştırıcıdan yürütülüyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-094","S-149","S-317"],"not":"Ayrı değişiklik türü önerisi çıkarımdır; ajan kaynaklı üretim veri kaybı olayı ve veri bütünlüğü rehberi dayanağıdır. Benzer mevcut ihtiyaç: N-K06-009; fark: K06-009 şema göçünü, K18-007 yıkıcı eylem iznini kapsar; veri içeriği düzeltmesinin doğruluk güvencesi tanımlı değil. Koşul: kalıcı veri taşıyan hizmetler."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-035"],"bagimliliklar":["N-K06-009"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-013","baslik":"Dış hizmet ve tedarikçi bağımlılıklarının çalışma zamanı güvenilirliği","ihtiyac":"Ürünün çalışma zamanında bağımlı olduğu dış hizmetlerin (bulut bölgesi, ödeme, kimlik, mesajlaşma, içerik dağıtımı, dış arayüzler) envanteri: kritiklik, taahhüt edilen ve gerçekleşen hizmet düzeyi, arıza modu, zaman aşımı ve yeniden deneme bütçesi, bozulmuş mod ve yedek, yoğunlaşma riski (aynı sağlayıcı veya bölgede toplanma) ve çıkış stratejisi; sağlayıcı olaylarının hizmetin SLO'suna etkisinin ölçülmesi.","cozulecek_sorun":"Bir hizmet ancak kritik bağımlılıklarının bileşimi kadar erişilebilir; tek bir sağlayıcı olayı çok sayıda ürünü aynı anda düşürebilir. Harita tedarikçiyi sözleşme (K22-008), güvenlik (K18-008) ve platform bileşeni (K16-006) açısından ele alıyor; ürünün çalışma zamanı güvenilirliği açısından değil.","yetenek_siniflari":["Y-62","Y-27","Y-61"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekipler bağımsız kararlarla aynı sağlayıcıya yığılabilir; portföy düzeyinde görünürlük olmadan yoğunlaşma fark edilmez. Düzenlemeye tabi sektörlerde üçüncü taraf risk kaydı yasal gereksinim olabilir.","kabul_olcutleri":["Kademe 0–1 hizmetlerin her kritik dış bağımlılığı için arıza modu ve bozulmuş mod davranışı yazılı ve dayanıklılık deneyinde doğrulanmış.","Hizmetin SLO'su bağımlılıkların taahhüt ve gerçekleşen değerleriyle tutarlılık kontrolünden geçmiş.","Yoğunlaşma raporu (aynı sağlayıcıya/bölgeye bağımlı kritik hizmet sayısı) periyodik üretiliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-364","S-355","S-361","S-365"],"not":"Hizmetin erişilebilirliğinin bağımlılıklarıyla sınırlı olduğu yayımlanmış bir analizdir. 2025'te bir bulut bölgesindeki yarış durumu yaklaşık 15 saatlik zincirleme kesinti yarattı. Finans sektörü için AB operasyonel dayanıklılık tüzüğü üçüncü taraf bilgi ve iletişim teknolojisi riskinin kaydını zorunlu kılar. Benzer mevcut ihtiyaç: N-K22-008; fark: K22-008 sözleşme taahhütlerini yönetir; bağımlılığın hizmet tasarımına ve SLO'ya etkisini, bozulmuş modunu ve yoğunlaşmasını yönetmez."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K22-008"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-014","baslik":"Ekipler arası iç hizmet sözleşmeleri ve bağımlılık SLO bileşimi","ihtiyac":"Ekiplerin birbirine sunduğu hizmetler için iç hizmet düzeyi anlaşmaları (sağlayıcı ekibin SLO'su, tüketicinin beklentisi, kota ve sınırlama, değişiklik bildirim süresi) ve tüketici hizmetin SLO'sunun bağımlılık zincirinden hesaplanabilir olması; bir ekibin hata bütçesi tüketiminin başka ekibe atfının kurala bağlanması.","cozulecek_sorun":"Çok ekipli yapıda bir ekibin hizmeti diğerinin kritik bağımlılığıdır; yazılı iç sözleşme yoksa hata bütçesi atfı ve önceliklendirme ekipler arası çatışmaya döner.","yetenek_siniflari":["Y-62","Y-60","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"İki ekipte sözlü anlaşma yetebilir; 10+ ekipte bağımlılık zinciri insan belleğinde tutulamaz.","kabul_olcutleri":["Ekipler arası her kritik çağrı ilişkisi için iç sözleşme kaydı var.","Hizmet kataloğundan bağımlılık zinciri ve bileşik erişilebilirlik tahmini üretilebiliyor.","Bütçe atfı anlaşmazlıklarının karar sahibi ve süresi tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-364","S-312"],"not":"Örnek hata bütçesi politikası başka ekibin hizmet kesintisini istisna sınıfı olarak ele alır; bağımlılık bileşimi analizi yayımlanmıştır. Benzer mevcut ihtiyaç: N-K24-003; fark: K24-003 planlama bağımlılıklarını (iş) ele alır; bu ihtiyaç çalışma zamanı bağımlılıklarını (hizmet) ve güvenilirlik taahhütlerini ele alır."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","bagimliliklar":["N-K24-003"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-015","baslik":"Ekipler arası ortak güvenilirlik standardı","ihtiyac":"Kritiklik kademesine göre asgari güvenilirlik gereksinimlerini (SLO zorunluluğu, hazırlık incelemesi, gözlemlenebilirlik, geri yükleme, dayanıklılık deneyi sıklığı, tehdit modeli derinliği, mimari kurallar, bağımlılık yönetimi) tek, sürümlü bir standartta toplayan; her maddeyi bir doğrulama yöntemine bağlayan; ekip ve hizmet bazında uyumu panoda gösteren; istisnaları süreli ve sahipli tutan ortak standart ve bunun portföy/ART/ekip katmanlarına yerleşimi.","cozulecek_sorun":"Ekipler farklı güvence düzeyleriyle çalıştığında ajanlar da ekipten ekibe farklı kalitede yazılım üretir; 'güvenilir' kavramı ekipler arasında karşılaştırılamaz. Çerçeve işlevsel olmayan gereksinimleri tüm backlog düzeylerinde kısıt olarak konumlar ama içeriğini kurum tanımlamalıdır.","yetenek_siniflari":["Y-35","Y-09","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"10+ ekipte standart yoksa ekipler arası güvence farkı sistemik riske dönüşür; standardın kendisi de ekip ekleriyle katmanlanmalıdır.","kabul_olcutleri":["Standart sürümlü ve her maddesi bir doğrulama yöntemine (otomatik kapı veya inceleme) bağlı.","Ekip ve hizmet bazında uyum oranı panoda; süresi dolmuş istisna 0.","Standart değişiklikleri duyuruluyor ve geçiş süresiyle yürürlüğe giriyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-371","S-372","S-318"],"not":"Kalite modeli güvenilirliği hatasızlık, erişilebilirlik, hata toleransı ve kurtarılabilirlik alt nitelikleriyle tanımlar; çerçeve işlevsel olmayan gereksinimleri her düzeyde DoD'nin parçası sayar. Benzer mevcut ihtiyaç: N-K24-007; fark: K24-007 hangi kuralın hangi katmanda tutulacağını tanımlar; güvenilirliğin asgari içeriğini ve ekipler arası uyum ölçümünü tanımlamaz."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","bagimliliklar":["N-K24-007"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-016","baslik":"Program düzeyinde hız–istikrar dengesi karar kuralı","ihtiyac":"Teslim hızı göstergeleriyle (değişiklik sıklığı, teslim süresi) istikrar göstergelerinin (değişiklik başarısızlık oranı, geri alma, kurtarma süresi, SLO ihlali, olay sayısı) değişiklik kaynağına (ajan/insan/karma) göre ayrışmış olarak birlikte izlenmesi ve önceden kararlaştırılmış bir karar kuralının (ör. ajan kaynaklı değişiklik başarısızlık oranı eşiği aşarsa ilgili ekip veya hizmet sınıfında otonomi bir kademe düşer; iyileşme ölçülünce geri açılır) program düzeyinde uygulanması.","cozulecek_sorun":"Nedensel çalışmalar hız kazancının geçici, karmaşıklık ve uyarı artışının kalıcı olabildiğini; sektör raporları benimsemenin istikrarla olumsuz ilişkisini gösteriyor. Ölçüm ihtiyaçları (K08-005, K23-006) var ama ölçümden eyleme giden kural yok.","yetenek_siniflari":["Y-39","Y-42","Y-60"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip sayısı arttıkça tek ekip ölçümleri gürültülüdür; kural hizmet sınıfı veya ekip grubu düzeyinde uygulanmalı ve ekipler birbirleriyle değil kendi zaman serileriyle karşılaştırılmalı.","kabul_olcutleri":["Hız ve istikrar göstergeleri aynı panoda ve aynı zaman penceresinde raporlanıyor; yalnız hız içeren rapor yayımlanmıyor.","Karar kuralı yazılı, eşikleri sürümlü; tetiklenme durumları ve alınan eylem kayıtlı.","Kural en az yılda bir kalibre ediliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-319","S-102","S-320","S-321","S-104","S-177"],"not":"Bir nedensel çalışmada ajan benimsemesiyle statik analiz uyarıları yaklaşık %18, bilişsel karmaşıklık yaklaşık %39 arttı; bir randomize deneyde deneyimli geliştiriciler yapay zekâ araçlarıyla %19 daha yavaş çalıştı. Benzer mevcut ihtiyaç: N-K08-005; fark: K08-005 ajan/insan kaynağına göre üretim metriklerini ayrıştırır, K23-006 teslim metriklerini tanımlar; ikisi de ölçümden otonomi ve hız kararına giden kuralı tanımlamaz."},"cember":"ic_bosluk","belirsizlik":"orta","olcek_esigi":"üretim","bagimliliklar":["N-K08-005"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K33-017","baslik":"Ajan üretimi bileşenlerin işletim sahipliği ve anlaşılabilirliği","ihtiyac":"Üretimdeki her hizmet ve kritik bileşen için nöbet tutan bir insan sahibi ekibin bulunması; ajan ağırlıklı üretilmiş kritik bileşenlerde sahibin arıza modlarını, bağımlılıkları ve geri alma yolunu ajan desteği olmadan açıklayabildiğinin hazırlık incelemesinde doğrulanması; işletim dokümanlarının ajan tarafından taslaklanıp insan tarafından tatbikatla doğrulanması.","cozulecek_sorun":"Ajan üretimi dosyalarda bakım işinin büyük çoğunluğunu insanlar yapıyor; kimsenin tam anlamadığı kod olayda teşhisi uzatır ve 'ajan yaptı' sorumluluk belirsizliğini doğurur. K25-004 onay sorumluluğunu, K25-006 beceri korumasını kapsar, işletim sahipliğini değil.","yetenek_siniflari":["Y-31","Y-37","Y-62"],"zorunluluk":"zorunlu","olcek_etkisi":"Ajan hacmi arttıkça kişi başına sahip olunan kod büyür; sahiplik yükü ölçülmezse nöbet ekipleri aşırı yüklenir.","kabul_olcutleri":["Sahibi ve nöbet rotası olmayan hizmet üretime açılamıyor.","Kademe 0–1 bileşenlerde 'açıklama tatbikatı' hazırlık incelemesinin maddesi ve sonucu kayıtlı.","İşletim dokümanları son tatbikat tarihiyle tutuluyor; tatbikatı geçmiş doküman işaretli."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-322","S-324","S-373"],"not":"2026 çalışması: ajan üretimi dosyalardaki bakım işinin büyük çoğunluğunu insanlar yapıyor. Açıklama tatbikatı önerisi çıkarımdır. 2025 sonundaki bir bulut hizmeti kesintisinin ajan aracıyla ilişkisi ikincil kaynaklarda raporlandı; şirket 'yanlış yapılandırılmış erişim, kullanıcı hatası' açıklaması yaptı, birincil rapor doğrulanmadı. Benzer mevcut ihtiyaç: N-K25-004; fark: K25-004 her ajan çıktısının bir onaylayan insanı olmasını ister; üretimde işletme, nöbet ve anlama yükümlülüğünü tanımlamaz."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K25-004"],"kume":"K33","alan":"F-guvenilir-yazilim"},{"id":"N-K34-001","baslik":"Epik ve özellik düzeyinde ürün tehdit modellemesi","ihtiyac":"Kritik epik ve özelliklerde veri akışı, güven sınırları, varlıklar ve saldırı yüzeyi üzerinden yapılandırılmış tehdit modellemesi yapılması; sonuçların (tehdit, olasılık ve etki, önlem, kalan risk, sahip) sürümlü ve yaşayan bir artefakt olarak tutulması; önlemlerin kabul kriterine ve teste dönüşmesi; ajanın taslak çıkarabilmesi ama modelin güvenlik yetkinliği olan insanla birlikte tamamlanması.","cozulecek_sorun":"Güvenlik kusurlarının önemli kısmı koddan önce tasarımda oluşur ve kod taramasıyla yakalanamaz. Haritada tehdit modeli yalnız ajan hattı için boşluk olarak işaretli; üretilen ürün için yok. Dil modeliyle üretilen tehdit sınıflamalarının tutarlılığı sınırlı ve yeni risk sınıflarını kapsamada zorlanıyor.","yetenek_siniflari":["Y-64","Y-37","Y-06"],"zorunluluk":"zorunlu","olcek_etkisi":"10+ ekipte ortak tehdit kütüphanesi ve ekipler arası güven sınırlarının ortak modeli gerekir.","kabul_olcutleri":["Kademe 0–1 hizmetlere dokunan her epikte güncel tehdit modeli var ve her yüksek tehdit bir önleme ve teste bağlı.","Tehdit modeli ilgili mimari değişiklikten sonra tanımlı süre içinde güncelleniyor.","Ajan taslağı ile son model arasındaki fark (insanın eklediği/çıkardığı tehditler) kayıtlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-330","S-331","S-332","S-333","S-343"],"not":"Tehdit modelleme manifestosu sürekli iyileştirmeyi tek seferlik teslimata tercih eder. 220 makalelik inceleme çevik ortamda dokuz zorluk ve altı uygulama kategorisi raporlar. 2026 çalışmaları alan uyarlamalı dil modellerinin tehdit sınıflamasında tutarlı üstünlük göstermediğini ve yerleşik yöntemlerin tedarik zinciri ve insan merkezli risklerde yetersiz kaldığını bulur."},"cember":"dis_eksik","belirsizlik":"orta","kume":"K34","alan":"F-guvenilir-yazilim"},{"id":"N-K34-002","baslik":"Değişiklik düzeyinde güvenlik ilgisi triyajı ve tehdit modeli farkı","ihtiyac":"Her değişikliğin güven sınırına, kimlik doğrulama ve oturuma, yetkilendirmeye, kriptografiye, dış girdi ayrıştırmaya, veri sınıfına, dış bağımlılığa veya ağ yüzeyine dokunup dokunmadığının deterministik sinyaller ve yapılandırılmış sorularla sınıflanması; dokunanlarda ilgili tehdit modelinin farkının üretilmesi ve güvenlik incelemesine yönlendirilmesi; dokunmayanlarda ek yük getirilmemesi.","cozulecek_sorun":"Epik düzeyi tehdit modeli ajanların günde çok sayıda küçük değişikliğine yetişemez; her değişikliğe tam modelleme ise sürdürülemez. Çevik ortamda tehdit modellemesinin temel zorluğu süreklilik ve güncelliktir.","yetenek_siniflari":["Y-64","Y-14","Y-09","Y-31"],"zorunluluk":"zorunlu","olcek_etkisi":"Ajan hacmi arttıkça güvenlik incelemesi darboğaz olur; triyaj bu kapasiteyi yalnız ilgili değişikliklere yönlendirir.","kabul_olcutleri":["Değişikliklerin %100'ünde güvenlik ilgisi sınıfı kayıtlı.","Güvenlik ilgili değişiklik tehdit modeli farkı veya gerekçeli 'etki yok' kaydı olmadan birleşmiyor.","Sınıflamanın kaçırdığı güvenlik ilgili değişiklik oranı olay ve incelemelerden geriye dönük ölçülüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-331","S-330"],"not":"Değişiklik düzeyi fark önerisi, çevik tehdit modellemesi literatüründeki sürekli ve artımlı modelleme uygulamalarından çıkarımdır. Benzer mevcut ihtiyaç: N-K21-002; fark: K21-002 'güvenlik ve gizlilik' risk kategorisini tanımlar; kategoriyi belirleyen güvenlik ilgisi sinyallerini ve tehdit modeli farkını tanımlamaz."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K21-002"],"kume":"K34","alan":"F-guvenilir-yazilim"},{"id":"N-K34-003","baslik":"Kötüye kullanım ve suistimal senaryoları","ihtiyac":"Kabul kriteri türlerine kötüye kullanım senaryolarının eklenmesi: nesne ve işlev düzeyi yetki atlatma, iş akışı adımı atlama, numaralandırma, hız ve kaynak istismarı, fiyat/miktar manipülasyonu, yeniden oynatma; bu senaryoların ürün sahibi ve güvenlik yetkinliğiyle birlikte yazılıp teste bağlanması.","cozulecek_sorun":"Ajanlar ve testler ana akışa ve hata akışına odaklanır; saldırganın sistem kurallarını bilinçli olarak istismar ettiği iş mantığı açıkları taramayla bulunmaz. Yapay zekâ üretimi kodda doğrudan nesne referansı açıkları insan koduna göre belirgin biçimde daha sık.","yetenek_siniflari":["Y-44","Y-22","Y-24"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekipler arası ortak kötüye kullanım kalıp kütüphanesi senaryo yazımını hızlandırır.","kabul_olcutleri":["Kimlik, para, kişisel veri veya kota içeren her hikâyede en az bir kötüye kullanım senaryosu ve ona bağlı test var.","Başka kullanıcının kaynağına erişim (nesne düzeyi yetki) testleri her korunan uçta otomatik.","Kötüye kullanım senaryosu içermeyen yüksek riskli hikâye 'hazır' durumuna geçemiyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-337","S-338","S-339"],"not":"Kötüye kullanım durumları güvenlik gereksinimi çıkarımı için yerleşik yöntemdir. 2025 kod güvenliği raporu yapay zekâ kodunda güvensiz doğrudan nesne referansının yaklaşık 1,91 kat daha olası olduğunu raporlar. Benzer mevcut ihtiyaç: N-K01-002; fark: K01-002'de 'yetki' kabul kriteri türü, K05-010'da yetki perspektifi var; saldırgan bakışı ve iş mantığı istismarı ayrı bir tür olarak tanımlı değil."},"cember":"ic_bosluk","belirsizlik":"dusuk","bagimliliklar":["N-K01-002"],"kume":"K34","alan":"F-guvenilir-yazilim"},{"id":"N-K34-004","baslik":"Gizlilik tehdit modellemesi ve etki değerlendirmesi tetikleyicisi","ihtiyac":"Kişisel veri işleyen özelliklerde gizlilik tehditlerinin (bağlanabilirlik, tanımlanabilirlik, inkâr edilemezlik, tespit edilebilirlik, veri ifşası, farkındalıksızlık ve müdahale edilemezlik, uyumsuzluk) sistematik değerlendirilmesi; veri envanteri ve akış haritasının özellik düzeyinde güncellenmesi; veri minimizasyonu, amaçla sınırlama ve varsayılan gizliliğin tasarım gereksinimi olması; yüksek riskli işlemede etki değerlendirmesinin otomatik tetiklenmesi; üretilen kodda yeni kişisel veri alanı ya da akışı eklenmesinin tespit edilmesi.","cozulecek_sorun":"Mevcut gizlilik ihtiyaçları ajan hattının verisini (istem, iz, dış modele giden veri) korur; üretilen ürünün kullanıcı verisini nasıl işlediğini tasarımda ele almaz. Ajanlar gereğinden fazla veri toplayan, loglayan veya saklayan kodu kolayca üretebilir.","yetenek_siniflari":["Y-64","Y-36","Y-14"],"zorunluluk":"kosullu","olcek_etkisi":"Ekipler arası veri paylaşımı arttıkça bağlanabilirlik riski ekip sınırlarını aşar; ortak veri envanteri gerekir.","kabul_olcutleri":["Kişisel veri işleyen her epikte gizlilik tehdit değerlendirmesi ve güncel veri akışı var.","Yeni kişisel veri alanı ekleyen değişiklik otomatik işaretleniyor ve veri envanteri güncellenmeden birleşmiyor.","Etki değerlendirmesi gerektiren işlemelerin tetikleyici kuralları yazılı ve uygulanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-334","S-335","S-336"],"not":"Gizlilik tehdit modelleme çerçevesi yedi tehdit türünü veri akış diyagramı üzerinde sistematik değerlendirir ve güvenlik tehdit modellemesiyle paralel yürütülebilir; veri koruma mevzuatı tasarımda ve varsayılan olarak veri korumayı ister. Benzer mevcut ihtiyaç: N-K22-005; fark: K22-005, K18-010 ve K18-011 ajan hattının verisini kapsar; ürünün kendi kişisel veri tasarımı ve gizlilik tehdit modeli yok. Koşul: kişisel veri işleyen ürünler."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K22-005"],"kume":"K34","alan":"F-guvenilir-yazilim"},{"id":"N-K34-005","baslik":"Güvenli varsayılanlar ve onaylı başlangıç şablonları","ihtiyac":"Ajanların ve insanların yeni hizmet, uç nokta, veri deposu ve istemci üretirken başlangıç noktası olarak kullandığı; güvenli varsayılanları (kimlik doğrulama açık, en az yetki, şifreli iletim ve depolama, güvenli ayrıştırıcılar, çıktı kodlama, sıkı içerik politikası, güvenli oturum ayarları, gizli bilginin dışarıda tutulması) içeren onaylı şablon ve kütüphanelerin bulunması; şablondan sapmanın gerekçe gerektirmesi ve otomatik tespit edilmesi.","cozulecek_sorun":"Güvenliği her değişiklikte yeniden kurmak yerine varsayılana gömmek hata sınıflarını toptan ortadan kaldırır; ajanlar örnek aldıkları kalıbı çoğaltır, güvensiz örnekten başlarsa güvensizliği ölçekler.","yetenek_siniflari":["Y-08","Y-35","Y-21"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok ekipte ortak şablon, ekipler arası güvenlik tabanını eşitlemenin en ucuz yoludur.","kabul_olcutleri":["Yeni hizmet ve uç noktaların hedef oranı (ör. %95) onaylı şablondan üretiliyor.","Güvenli varsayılanı kapatan yapılandırma değişikliği yüksek risk sınıfına düşüyor.","Şablonlar sürümlü, sahipli ve güvenlik testinden geçmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-341","S-343","S-339"],"not":"Tasarımda ve varsayılan olarak güvenlik ilkeleri, ürünün ek adım gerektirmeden yaygın saldırılara dayanıklı gelmesini ister. 2025 raporu sözdizimi doğruluğu %95'i aşarken güvenlik geçme oranının %45–55 bandında düz kaldığını raporlar. Benzer mevcut ihtiyaç: N-K03-008; fark: K03-008 yeni teknoloji eklemeyi kısıtlar; güvenli başlangıç noktası ve varsayılanlardan sapma denetimi tanımlamaz."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K03-008"],"kume":"K34","alan":"F-guvenilir-yazilim"},{"id":"N-K34-006","baslik":"Kademeye göre güvenlik gereksinimi tabanı ve izlenebilirlik","ihtiyac":"Seviyelendirilmiş bir uygulama güvenliği doğrulama standardından kritiklik kademesine uygun seviyenin seçilmesi; her gereksinimin uygulanabilirlik kaydı ve doğrulama yöntemine (otomatik test, tarama, inceleme) bağlanması; gereksinim → test → kanıt izlenebilirliğinin kanıt paketinde yer alması.","cozulecek_sorun":"'Güvenli olsun' belirsiz bir kabul kriteridir; ajanlar ölçülebilir güvenlik gereksinimi olmadan güvenliği tutarlı uygulayamaz. Tarama kapısı (K18-009) bilinen zafiyet desenlerini yakalar, eksik güvenlik kontrolünü (ör. hesap kilitleme yok) yakalamaz.","yetenek_siniflari":["Y-44","Y-21","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekipler arası ortak taban, güvenlik düzeyinin karşılaştırılabilir olmasını sağlar.","kabul_olcutleri":["Her hizmet için seçili seviye ve uygulanabilir gereksinim listesi var.","Uygulanabilir gereksinimlerin %100'ü bir doğrulama yöntemine bağlı; doğrulanmamış gereksinim 'test edilmedi' olarak raporlanıyor.","Gereksinim tabanı standardın yeni sürümünden sonra tanımlı sürede güncelleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-342","S-343","S-344"],"not":"2025'te yayımlanan doğrulama standardı yaklaşık 350 gereksinimi üç seviyede sunar; güvenli yazılım geliştirme çerçevesi gereksinimlerin tanımlanmasını ve doğrulanmasını ister, 1.2 taslağı Aralık 2025'te yayımlandı. Benzer mevcut ihtiyaç: N-K18-009; fark: K18-009 taramanın kapıda koşmasını ister; olumlu güvenlik gereksinimlerinin tanımı ve doğrulama izlenebilirliği yok."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K18-009"],"kume":"K34","alan":"F-guvenilir-yazilim"},{"id":"N-K34-007","baslik":"Yapay zekâ üretimi kodun zayıflık profiline göre hedefli güvenlik doğrulaması","ihtiyac":"Yapay zekâ üretimi kodda insan koduna göre daha sık görülen zayıflık sınıfları (çıktı kodlama ve betik enjeksiyonu, nesne düzeyi yetki, parola ve oturum işleme, güvensiz kriptografi, girdi doğrulama) için hedefli kural, negatif test kalıbı ve inceleme kontrol noktaları; güvenlik bulgu yoğunluğunun değişiklik kaynağına (ajan/insan/karma) göre izlenmesi ve profil değiştikçe kuralların güncellenmesi.","cozulecek_sorun":"Kod üretiminin sözdizimsel doğruluğu artarken güvenlik geçme oranları model kuşaklarından bağımsız olarak düşük kalıyor; genel tarama kapısı bu profili hedeflemiyor ve köken bazında ölçmüyor.","yetenek_siniflari":["Y-21","Y-22","Y-29"],"zorunluluk":"zorunlu","olcek_etkisi":"Ajan hacmi arttıkça aynı zayıf kalıp hızla çoğalır; ortak kural seti tüm ekiplere dağıtılmalıdır.","kabul_olcutleri":["Hedef zayıflık sınıflarının her biri için en az bir deterministik kontrol ve bir negatif test kalıbı var.","Güvenlik bulgu yoğunluğu köken bazında raporlanıyor.","Zayıflık profili en az altı ayda bir güncelleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-339","S-340"],"not":"100+ modelin kodu üzerinde yapılan 2025 değerlendirmesinde testlerin %45'inde güvenlik kusuru, betik enjeksiyonunda yaklaşık 2,74 kat artış raporlandı; 2026 güncellemesi durumun sürdüğünü belirtiyor. Sektör raporu olduğundan yöntem sınırlılıkları dikkate alınmalı. Benzer mevcut ihtiyaç: N-K18-009; fark: K18-009 genel tarama eşiği tanımlar; yapay zekâ koduna özgü zayıflık profiline göre hedefleme ve köken bazlı ölçüm yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K18-009"],"kume":"K34","alan":"F-guvenilir-yazilim"},{"id":"N-K34-008","baslik":"Zafiyetten tasarım dersine: kök neden ve varyant analizi","ihtiyac":"Üretimde veya testte bulunan her önemli zafiyet için kök neden analizi; aynı kalıbın kod tabanının geri kalanında ve diğer ekiplerin depolarında aranması (varyant analizi); şablon, kural ve güvenlik gereksinimi tabanının güncellenmesi; zafiyet sınıfı için regresyon kontrolünün eklenmesi.","cozulecek_sorun":"Ajanlar bir kalıbı çok sayıda yere kopyalayabildiğinden tek bir zafiyet sınıfı birden çok konumda bulunur; tekil düzeltme sorunu kapatmaz.","yetenek_siniflari":["Y-14","Y-21","Y-63"],"zorunluluk":"zorunlu","olcek_etkisi":"Varyant araması ekip depolarını aşmalıdır; 3+ ekipte ortak arama yeteneği gerekir.","kabul_olcutleri":["Kapanan yüksek ve kritik zafiyetlerin %100'ünde varyant araması kaydı var.","Zafiyet sınıfı için deterministik kontrol eklenmiş ya da neden eklenemediği yazılı.","Aynı zafiyet sınıfının tekrar oranı izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-343","S-136"],"not":"Güvenli yazılım geliştirme çerçevesi zafiyetlerin kök nedeninin analizini ve benzer zafiyetlerin aranmasını ister; kod klonlarındaki artış kalıp kopyalanmasının yaygınlaştığını gösterir. Benzer mevcut ihtiyaç: N-K08-002; fark: K08-002 kaçan hatadan regresyon testi üretir; zafiyet sınıfının kök nedenine, varyantlarına ve tasarım artefaktlarına dönüşünü tanımlamaz."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K08-002"],"kume":"K34","alan":"F-guvenilir-yazilim"},{"id":"N-K35-001","baslik":"Çalıştırılabilir mimari kurallar (uygunluk fonksiyonları)","ihtiyac":"Mimari niyetin (katmanlar, bağımlılık yönü, döngüsel bağımlılık yasağı, modül sınırları ve genel arayüz yüzeyi, izin verilen iletişim biçimleri, paylaşılan veri deposu yasağı) kod olarak yazılmış, her değişiklikte deterministik çalışan kurallara dönüştürülmesi; kuralların karar kayıtlarına bağlanması; ihlalin birleştirmeyi engellemesi; kural istisnalarının süreli ve sahipli olması.","cozulecek_sorun":"Yazılı mimari kurallar ve talimat dosyaları ajan davranışını tutarlı biçimde yönlendirmiyor; bazı modeller mimari kısıtları sıklıkla ihlal edip katmanlar arası yasak bağımlılıklar üretiyor. Aşınma yavaş biriktiği için değişiklik incelemesinde fark edilmiyor.","yetenek_siniflari":["Y-65","Y-14","Y-20","Y-37"],"zorunluluk":"zorunlu","olcek_etkisi":"Tek depoda basit kurallar yeter; çok ekipte kuralların katmanlı dağıtımı ve ortak kütüphanesi gerekir.","kabul_olcutleri":["Her depoda karar kayıtlarına bağlı mimari kural seti var ve deterministik kapıda koşuyor.","Yeni mimari kural ihlaliyle birleşen değişiklik sayısı 0; mevcut ihlaller azalan hedefli kayıtta.","Her kural bir karar kaydına ve sahibine bağlı; süresi dolmuş istisna 0."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-345","S-346","S-348","S-347","S-324"],"not":"Mimari uygunluk fonksiyonu mimari niteliklerin nesnel, otomatik ve sürekli değerlendirmesidir. 2025 çalışmasında altıgen mimari kısıtı altında bir açık ağırlıklı model %80 mimari ihlal oranı gösterdi. Log çalışması doğal dil talimatlarının yetersiz kaldığını ve deterministik korkuluk gerektiğini bulur. Benzer mevcut ihtiyaç: N-K03-010; fark: K03-010 konvansiyona uyumu raporlar, K04-008 anti-kalıpları tespit eder, K03-009 karar kaydını ajana gösterir; mimari niyeti makinece zorlayan ve karar kaydına bağlı kural yok."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K03-010"],"kume":"K35","alan":"F-guvenilir-yazilim"},{"id":"N-K35-002","baslik":"Modülerlik ve mimari sağlık metriklerinin zaman serisi","ihtiyac":"Ayrışma düzeyi, yayılım maliyeti, döngüsel bağımlılık sayısı, birlikte değişen modüller, mimari sıcak noktalar ve bilişsel karmaşıklık gibi metriklerin depo ve modül bazında zaman serisi olarak izlenmesi; eşik veya eğilim bozulmasında mimari incelemenin tetiklenmesi; ajan katkısı yüksek alanların ayrıca raporlanması.","cozulecek_sorun":"Kod sağlığı izlemesi (K23-014) klon ve yeniden düzenleme oranına odaklıdır; mimari düzeydeki bağlaşım artışı ayrıca ölçülmezse yapay zekâ benimsemesiyle görülen kalıcı karmaşıklık artışı geç fark edilir.","yetenek_siniflari":["Y-65","Y-46","Y-14"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Mimari bozulma aylar içinde görünür hale gelir; ekip sayısı arttıkça ekipler arası sınırlarda yoğunlaşır.","kabul_olcutleri":["Metrikler her birleştirmede veya haftalık hesaplanıyor ve modül sahiplerine görünür.","Eğilim eşiği aşımı otomatik mimari inceleme işi açıyor.","Ajan katkı oranı yüksek modüller için ayrı eğilim raporu var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-349","S-321","S-320"],"not":"Ayrışma düzeyi metriği 108 açık kaynak ve 21 endüstriyel projede bakım karmaşıklığıyla ilişkilendirildi. Ajan benimsemesinin bilişsel karmaşıklığı yaklaşık %39 artırdığı raporlandı. Benzer mevcut ihtiyaç: N-K23-014; fark: K23-014 klon, yeniden düzenleme ve sık değişen kodu izler; modüler yapı ve bağlaşım metrikleri kapsam dışında."},"cember":"ic_bosluk","belirsizlik":"orta","olcek_esigi":"zamanla (3–6 ay)","bagimliliklar":["N-K23-014"],"kume":"K35","alan":"F-guvenilir-yazilim"},{"id":"N-K35-003","baslik":"Ekipler arası sınır ihlali tespiti ve ART düzeyi mimari kurallar","ihtiyac":"ART düzeyinde tanımlanan mimari yol ve sınırların (hangi ekip hangi modülün sahibi, hangi arayüz genel, hangi iç yapı yasak) çalıştırılabilir kurallar olarak tüm ekip depolarına dağıtılması; bir ekibin veya ajanının başka ekibin iç modülüne doğrudan bağımlılık kurması, ortak veri deposuna yazması veya belgelenmemiş arayüz kullanması gibi sınır ihlallerinin tespit edilmesi.","cozulecek_sorun":"Ajanlar en kısa yolu seçer ve başka ekibin iç yapısını doğrudan kullanabilir; bu gizli bağlaşım ekipler arası bağımsız yayını ve sorumluluk sınırlarını bozar. Gevşek bağlaşımlı mimariye sahip ekipler yapay zekâdan daha fazla fayda görüyor.","yetenek_siniflari":["Y-65","Y-14","Y-35"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip sayısı arttıkça sınır sayısı karesel artar; tespit olmadan gizli bağlaşım koordinasyon maliyetini büyütür.","kabul_olcutleri":["Ekip sınırını aşan yeni gizli bağımlılık birleştirmeyi engelliyor.","Sahiplik haritası ve genel arayüz listesi ART düzeyinde sürümlü.","Sınır ihlali istisnaları iki ekibin de onayını gerektiriyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-345","S-102"],"not":"2025 sektör raporu gevşek bağlaşımlı mimariye sahip ekiplerin hızlanmadan fayda gördüğünü, sıkı bağlaşımlı olanların istikrarsızlık yaşadığını belirtir; ekip sınırı kuralları bunun çıkarımsal uygulamasıdır. Benzer mevcut ihtiyaç: N-K24-007; fark: K24-007 mimari yolun ART düzeyinde tutulacağını söyler; bunun çalıştırılabilir kurallara dönüşmesini ve ekipler arası ihlal tespitini tanımlamaz. K24-008 yalnız sıcak nokta dosyaların sahipliğini ele alır."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","bagimliliklar":["N-K24-007"],"kume":"K35","alan":"F-guvenilir-yazilim"},{"id":"N-K35-004","baslik":"Teknik borç kaydı ve yönetimi","ihtiyac":"Teknik borcun (bilerek alınmış kısa yol, eksik test, geçici çözüm, eskimiş bağımlılık, mimari sapma) iş takip sisteminde sınıflı, sahipli, 'faiz' tahminli (yavaşlattığı iş, taşıdığı risk) ve geri ödeme tetikleyicisi tanımlı kalemler olarak tutulması; ajanların bir işi tamamlarken aldığı kısa yolları ve bıraktığı geçici çözümleri yapılandırılmış biçimde borç kaydına yazması; borcun ekip ve hizmet bazında eğilim olarak izlenmesi.","cozulecek_sorun":"Teknik borç geliştirici zamanının önemli bir kısmını tüketiyor; ajanlar hızla çalışan ama borç bırakan kod üretirken bu borç kayıt dışı kalırsa görünmez biçimde birikir. K03-007 yalnız olgunluk geçişine engel borcu işaretler.","yetenek_siniflari":["Y-32","Y-46","Y-05"],"zorunluluk":"zorunlu","olcek_etkisi":"Paylaşılan bileşenlerde borcun sahibi belirsizleşir; çok ekipte borç sahipliği kuralı gerekir.","kabul_olcutleri":["Ajan sonuç şemasında 'bırakılan borç' alanı var; boşsa gerekçeli.","Borç kalemlerinin sahip, sınıf ve tetikleyici alanları %100 dolu.","Hizmet bazında borç eğilimi ve geri ödeme oranı raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-350","S-351"],"not":"Boylamsal çalışma geliştiricilerin zamanlarının ortalama %23'ünü teknik borç nedeniyle kaybettiğini buldu. 104 kaynaklı 2026 incelemesi dil modeli destekli geliştirmede 'hızlı entegrasyon borcu' gibi yeni borç türleri ve standart ölçüt eksikliği raporlar. Benzer mevcut ihtiyaç: N-K03-007; fark: K03-007 teknik borcu yalnız olgunluk seviyesi bağlamında işaretler; borcun yaşam döngüsü, faizi, geri ödemesi ve ajanın borç beyanı tanımlı değil."},"cember":"ic_bosluk","belirsizlik":"orta","bagimliliklar":["N-K03-007"],"kume":"K35","alan":"F-guvenilir-yazilim"},{"id":"N-K35-005","baslik":"Yapay zekâ üretimi kodun uzun vadeli bakım kanıtı (köken kohortu)","ihtiyac":"Değişiklik ve satır düzeyinde köken bilgisinin (ajan, insan, karma) korunması ve ajan üretimi kodun 6–12 aylık kohortlar halinde insan koduyla aynı modül ve iş türü içinde karşılaştırmalı izlenmesi: statik analiz uyarıları, bilişsel karmaşıklık, kusur yoğunluğu, değişim ve yeniden yazılma oranı, insan onarım payı, olaylara katkı; sonuçların otonomi, kural ve inceleme politikasına geri beslenmesi.","cozulecek_sorun":"Nedensel çalışmalar ajan benimsemesinde hız kazancının geçici, karmaşıklık ve uyarı artışının kalıcı olabildiğini gösterirken başka bir çalışma ajan üretimi dosyaların daha az bakım gerektirdiğini buluyor; kanıt çelişkili ve bağlama bağlı. Kurum kendi kanıtını üretmezse karar algıya dayanır.","yetenek_siniflari":["Y-46","Y-28","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Kohort anlamlılığı için yeterli değişiklik hacmi gerekir; çok ekipli yapıda ekipler arası karşılaştırma yerine ekip içi zaman serisi kullanılmalıdır.","kabul_olcutleri":["Köken bilgisi birleştirilen değişikliklerin %100'ünde kayıtlı ve satır düzeyine indirgenebiliyor.","Altı ayda bir kohort raporu yayımlanıyor ve en az bir politika kararına girdi oluyor.","Karşılaştırma aynı modül ve iş türü içinde, karıştırıcılar kontrol edilerek yapılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-320","S-321","S-322","S-136"],"not":"Çelişkili kanıt: fark-içinde-fark çalışmalarında kalıcı uyarı ve karmaşıklık artışı; 100 depoda 3.200 değişiklik inceleyen 2026 çalışmasında ajan dosyalarında daha seyrek bakım ama bakımın büyük kısmını insanların yapması; sektör raporunda kopyala-yapıştır kodun taşınmış kodu ilk kez geçmesi. Benzer mevcut ihtiyaç: N-K23-014; fark: K23-014 kod sağlığını köken ayrımı olmadan izler; N-K19-006 insan katkısını kaydeder. Köken bazlı kohort karşılaştırması ve politika geri beslemesi yok."},"cember":"ic_bosluk","belirsizlik":"yuksek","olcek_esigi":"zamanla (3–6 ay)","bagimliliklar":["N-K23-014"],"kume":"K35","alan":"F-guvenilir-yazilim"},{"id":"N-K35-006","baslik":"Özellik bayrağı ve ölü kod yaşam döngüsü","ihtiyac":"Her özellik bayrağının sahibi, amacı, son kullanma tarihi ve kaldırma işiyle birlikte oluşturulması; tam açılmış veya terk edilmiş bayrakların ve ulaşılamayan kodun periyodik tespit edilip kaldırılması; bayrak adlarının yeniden kullanılmaması.","cozulecek_sorun":"Ajanlar kademeli yayın için çok sayıda bayrak ve dal üretebilir; temizlenmeyen bayraklar kombinasyon patlaması yaratır ve eski kodun yeniden kullanılan bir bayrakla yanlışlıkla etkinleşmesi ağır olaylara yol açmıştır.","yetenek_siniflari":["Y-34","Y-14","Y-46"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Bayrak borcu zamanla birikir; paylaşılan bayrak sisteminde ekipler arası çakışma riski doğar.","kabul_olcutleri":["Süresi geçmiş bayrak sayısı hedefin altında ve her biri için kaldırma işi açık.","Bayrak adının yeniden kullanımı otomatik reddediliyor.","Ulaşılamayan kod raporu periyodik üretiliyor ve kaldırma işlerine dönüşüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-370"],"not":"2013 düzenleyici kararı: 2012'de kaldırılmamış eski kod, yeniden kullanılan bir bayrakla etkinleşti ve yaklaşık 460 milyon dolarlık zarara yol açtı. Benzer mevcut ihtiyaç: N-K06-008; fark: K06-008 bayrağı risk sınırlama aracı olarak ister; bayrağın yaşam döngüsü ve ölü kod temizliği tanımlı değil."},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"zamanla (3–6 ay)","bagimliliklar":["N-K06-008"],"kume":"K35","alan":"F-guvenilir-yazilim"},{"id":"N-K35-007","baslik":"Ürün bağımlılıklarının sağlık ve güncellik yönetimi","ihtiyac":"Ürün kodunun kullandığı kütüphane ve çerçevelerin bakım durumu (aktif/terk), sürüm gerisi, kullanımdan kaldırılmış arayüz kullanımı ve kırıcı değişiklik riskinin sürekli izlenmesi; ajanların kullanımdan kaldırılmış arayüz önermesinin kapıda tespiti; güncelleme ritminin ve küçük adımlı yükseltmenin politikaya bağlanması.","cozulecek_sorun":"Dil modelleri kütüphane evrimini izleyemediği için kullanımdan kaldırılmış arayüzleri sıkça önerir; küçük sürüm yükseltmelerinin de bir kısmı kırıcıdır. K16-006 yalnız platform bileşenlerini, K18-008 güvenlik ve varlık doğrulamasını kapsar.","yetenek_siniflari":["Y-41","Y-14","Y-17","Y-21"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekipler aynı bağımlılığın farklı sürümlerini kullandıkça yükseltme maliyeti çoğalır; ortak sürüm politikası gerekir.","kabul_olcutleri":["Kullanımdan kaldırılmış arayüz kullanan yeni kod kapıda işaretleniyor.","Kritik bağımlılıkların sürüm gerisi ve bakım durumu panoda.","Terk edilmiş bağımlılık için süreli değiştirme planı var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-367","S-366"],"not":"Yedi modelde 28.125 tamamlama isteğiyle yapılan çalışma kullanımdan kaldırılmış arayüz kullanımını belgeledi; bir paket deposunda büyük sürüm dışı yükseltmelerin %20,1'inin kırıcı değişiklik içerdiği raporlandı. Benzer mevcut ihtiyaç: N-K16-006; fark: K16-006 ajan platformunun bileşenlerini izler; K18-008 yeni paketin varlığını ve itibarını doğrular. Ürün bağımlılıklarının bakım durumu ve kullanımdan kaldırılmış arayüz kullanımı izlenmiyor."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K16-006"],"kume":"K35","alan":"F-guvenilir-yazilim"}],"bilinmeyen":{"sema":"ihtiyac-haritasi/bilinmeyenler@1","aciklama":"Dört çeyrekli bilinmeyenler analizi. Bilinmeyen bilinmeyenler hem iç hem dış mercekle (siyasi, ekonomik, sosyal, teknolojik, çevresel, yasal) taranmıştır.","mercek_notu":"Kaynakta bilinmeyenler 'dış çevre', boşluk analizi 'iç çevre' analiziyle eşlenmiş (C-015). Bu çalışmada bilinmeyenler hem iç hem dış çevre için taranmış, boşluk analizi ise mevcut ile hedef durum arasında yapılmıştır.","bilinen_bilinenler":[{"ifade":"Kaynaklarda ~12.000 kayıtlık park edilmiş bir backlog'dan söz ediliyor.","kaynaklar":["S-030","S-054"]},{"ifade":"Ekipte test-önce, rol ayrımı, deterministik kapılar ve insan kapıları üzerinde geniş bir mutabakat var; beş farklı akış önerisi ortak bir iskelette buluşuyor.","kaynaklar":["S-006","S-007","S-008","S-009","S-010","S-013"]},{"ifade":"Yaklaşık 20 uzman işlev ve bir kural yöneticisi tanımlanmış.","kaynaklar":["S-051","S-052"]},{"ifade":"Test o kanit":["S-094","S-332","S-331","S-330"],"sahip_rol_sinifi":["RL-01"]},{"id":"R-066","risk":"Mimari aşınma ve bakım maliyeti birikimi","aciklama":"Ajanlar mimari kısıtları ihlal eden kısa yollar üretir; bağlaşım ve karmaşıklık aylar içinde artar, hız düşer.","olasilik":4,"etki":3,"skor":12,"seviye":"yuksek","erken_sinyal":"Modülerlik metriklerinde eğilim bozulması; döngüsel bağımlılık ve statik uyarı artışı.","azaltan_ihtiyaclar":[],"kanit":["S-094","S-321","S-348","S-136"],"sahip_rol_sinifi":["RL-01"]},{"id":"R-067","risk":"Olay eylem maddelerinin kapanmaması ve olay sınıflarının tekrarı","aciklama":"Olay sonrası analizler yapılır ama eylem maddeleri özellik işi karşısında önceliklendirilmez; aynı olay sınıfı tekrarlar.","olasilik":4,"etki":3,"skor":12,"seviye":"yuksek","erken_sinyal":"Açık eylem maddesi yaşı; tekrar eden olay sınıfı oranı.","azaltan_ihtiyaclar":[],"kanit":["S-094","S-329","S-290"],"sahip_rol_sinifi":["RL-01"]},{"id":"R-068","risk":"Ekipler arası kırıcı değişiklik","aciklama":"Bir ekibin ajanı arayüz, olay şeması veya gözlenebilir davranışı değiştirir; tüketici ekipler üretimde kırılır.","olasilik":3,"etki":4,"skor":12,"seviye":"yuksek","erken_sinyal":"Tüketici tarafı hata artışı; sözleşme testi olmayan arayüz sayısı.","azaltan_ihtiyaclar":[],"kanit":["S-094","S-366","S-369"],"sahip_rol_sinifi":["RL-01"]},{"id":"R-069","risk":"İşletim sahipliği boşluğu","aciklama":"Üretimdeki ajan üretimi bileşenleri kimse tam anlamaz; olay müdahalesi uzar ve sorumluluk tartışmaya döner.","olasilik":3,"etki":4,"skor":12,"seviye":"yuksek","erken_sinyal":"Sahibi belirsiz hizmet sayısı; olayda 'kimse bilmiyor' kaydı; işletim dokümanı olmayan hizmet.","azaltan_ihtiyaclar":[],"kanit":["S-094","S-322","S-373"],"sahip_rol_sinifi":["RL-01"]},{"id":"R-070","risk":"Güvenilirlik standardının ek yük olarak algılanıp kayıt dışı yolların doğması","aciklama":"Kademe ve standart yükü fazla gelirse ekipler hizmetleri düşük kademede gösterir veya istisnaları kalıcılaştırır.","olasil const built = {}, charts = {};
function show(id){
  if(!document.getElementById(id)) id = "genel";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===id));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on", p.id===id));
  if(!built[id]){ BUILD[id](); built[id]=true; }
  drawCharts(id);
  try{ localStorage.setItem("ih-tab", id); }catch(e){}
  if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id);
}
$("#tabrow").addEventListener("click", e=>{const b=e.target.closest(".tab"); if(b){show(b.dataset.tab); window.scrollTo({top:0});}});

/* ---------- grafikler ---------- */
const CH = {};  // id -> {el, opt:()=>option, tab}
function reg(tab, el, opt, onclick){ CH[el] = {tab, opt, onclick}; }
function drawCharts(tab){
  if(typeof echarts==="undefined") return;
  Object.entries(CH).forEach(([el,c])=>{
    if(c.tab!==tab) return;
    const node = document.getElementById(el); if(!node) return;
    if(charts[el]) { charts[el].resize(); return; }
    const ch = echarts.init(node, null, {renderer:"canvas"});
    ch.setOption(c.opt());
    if(c.onclick) ch.on("click", c.onclick);
    charts[el] = ch;
  });
}
function rethemeAll(){ Object.keys(charts).forEach(el=>{ charts[el].dispose(); delete charts[el]; }); const on=document.querySelector(".pane.on"); if(on) drawCharts(on.id); }
window.addEventListener("resize", ()=>Object.values(charts).forEach(c=>c.resize()));
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rethemeAll); }catch(e){}
new MutationObserver(rethemeAll).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme","class"]});
const base = () => ({textStyle:{fontFamily:"IBM Plex Sans, system-ui, sans-serif",color:css("--ink")},
  tooltip:{backgroundColor:css("--surface"),borderColor:css("--line"),textStyle:{color:css("--ink"),fontSize:12.5},extraCssText:"box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:8px;max-width:340px;white-space:normal"}});
const axisTxt = () => ({color:css("--muted"),fontSize:11.5,fontFamily:"IBM Plex Sans, system-ui, sans-serif"});

const drawer=$("#drawer"), scrim=$("#scrim");
function closeDrawer(){ drawer.classList.remove("on"); scrim.classList.remove("on"); drawer.setAttribute("aria-hidden","true"); }
$("#dr-close").onclick = closeDrawer; scrim.onclick = closeDrawer;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });

function srcLine(id){
  const s = SRC[id]; if(!s) return `<span class="mono">${id}</span>`;
  if(s.url) return `<span class="mono">${id}</span> <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.aciklama)}</a> <span class="muted">(${esc(s.tur)})</span>`;
  return `<span class="mono">${id}</span> ${esc(s.baslik)}${s.yol?` <span class="muted mono" style="font-size:11px">· ${esc(s.yol)}</span>`:""}`;
}
function openNeed(id){
  const n = NB[id]; if(!n) return;
  const k = KB[n.kume];
  $("#dr-eyebrow").innerHTML = `${domTag(n.alan)}${esc(ALAN[n.alan].ad)} · ${n.kume} ${esc(k.ad)}`;

    ${n.olcek_etkisi?`<h4>Ölçek etkisi</h4><p>${esc(n.olcek_etkisi)}</p>`:""}
    ${(n.yetenek_siniflari||[]).length?`<h4>Yetenek sınıfları</h4><ul class="clean stack" style="gap:6px">${n.yetenek_siniflari.map(y=>`<li><span class="chip">${y}</span> ${esc(YB[y]?YB[y].ad:"")}</li>`).join("")}</ul>`:""}

    ${n.kanit.not?`<p class="muted" style="margin-top:8px;font-size:13.5px">${esc(n.kanit.not)}</p>`:""}

    ${rel?`<h4>İlişkili analiz kayıtları</h4><div class="rel">${rel}</div>`:""}`;
  drawer.classList.add("on"); scrim.classList.add("on"); drawer.setAttribute("aria-hidden","false");
  $("#dr-body").scrollTop = 0; $("#dr-close").focus();
}

function optCember(){
  const W = 360/K.length, idx = Object.fromEntries(K.map((k,i)=>[k.id,i]));
  const band = {ic_tanimli:[0.1,0.52],ic_bosluk:[0.7,0.26],dis_eksik:[1.12,0.34]};
  const sz = {zorunlu:10,olcege_bagli:8,kosullu:7,opsiyonel:6};
  const pts = c => N.filter(n=>n.cember===c).map(n=>{ const i=idx[n.kume], b=band[c];
    return {value:[b[0]+b[1]*hash(n.id,7), i*W + (0.14+0.72*hash(n.id,13))*W], id:n.id, symbolSize:sz[n.zorunluluk]}; });
  const circle = (r,type,w,col) => ({type:"line",coordinateSystem:"polar",silent:true,symbol:"none",data:Array.from({length:181},(_,i)=>[r,i*2]),lineStyle:{type,width:w,color:col},z:1});
  const series = [
    circle(1.05,"solid",2,css("--ink")),
    circle(0.64,[2,4],1,css("--faint")),
    ...K.map((k,i)=>({type:"line",coordinateSystem:"polar",silent:true,symbol:"none",data:[[0.06,i*W],[1.55,i*W]],lineStyle:{width:.6,color:css("--line")},z:0})),
    ...K.map((k,i)=>({type:"line",coordinateSystem:"polar",silent:true,symbol:"none",data:Array.from({length:8},(_,j)=>[1.66,i*W+0.6+j*(W-1.2)/7]),lineStyle:{width:7,color:dcol(k.alan),cap:"butt"},z:1})),
    {type:"scatter",coordinateSystem:"polar",silent:true,symbolSize:0,data:K.map((k,i)=>({value:[1.84,i*W+W/2],name:k.id})),label:{show:true,formatter:p=>p.name,color:css("--muted"),fontSize:10.5,fontFamily:"IBM Plex Mono, monospace"},z:2},
    ...["ic_tanimli","ic_bosluk","dis_eksik"].map(c=>({name:CEM[c].ad,type:"scatter",coordinateSystem:"polar",data:pts(c),itemStyle:{color:css(CEM[c].v),borderColor:css("--surface"),borderWidth:1,opacity:.92},emphasis:{scale:1.6,itemStyle:{borderColor:css("--ink")}},z:5})),
  ];
  return Object.assign(base(),{
    polar:{radius:["0%","84%"],center:["50%","52%"]},
    angleAxis:{type:"value",min:0,max:360,startAngle:90,clockwise:true,show:false},
    radiusAxis:{type:"value",min:0,max:1.9,show:false},
    legend:{top:4,left:"center",data:Object.values(CEM).map(c=>c.ad),textStyle:{color:css("--muted"),fontSize:12},itemWidth:10,itemHeight:10},
    tooltip:Object.assign(base().tooltip,{trigger:"item",formatter:p=>{ if(!p.data||!p.data.id) return ""; const n=NB[p.data.id];
      return `<div style="font-family:IBM Plex Mono,monospace;font-size:11px;opacity:.7">${n.id} · ${n.kume}</div><b>${esc(n.baslik)}</b><div style="opacity:.75;margin-top:4px">${esc(KB[n.kume].ad)}<br>${ZOR[n.zorunluluk]} · ${CEM[n.cember].ad}</div>`; }}),
    series});
}

function optKume(){
  const cats = K.map(k=>`${k.id}  ${short(k.ad,34)}`);
  const ser = ["ic_tanimli","ic_bosluk","dis_eksik"].map(c=>({name:CEM[c].ad,type:"bar",stack:"s",barWidth:14,data:K.map(k=>N.filter(n=>n.kume===k.id&&n.cember===c).length),itemStyle:{color:css(CEM[c].v)},label:{show:true,color:css("--surface"),fontSize:10.5,formatter:p=>p.value>1?p.value:""}}));
  return Object.assign(base(),{grid:{left:8,right:20,top:34,bottom:10,containLabel:true},legend:{top:0,textStyle:{color:css("--muted"),fontSize:12},itemWidth:10,itemHeight:10},
    tooltip:Object.assign(base().tooltip,{trigger:"axis",axisPointer:{type:"shadow"}}),
    xAxis:{type:"value",axisLabel:axisTxt(),splitLine:{lineStyle:{color:css("--line")}}},
    yAxis:{type:"category",inverse:true,data:cats,axisLabel:Object.assign(axisTxt(),{color:css("--ink"),fontSize:12}),axisTick:{show:false},axisLine:{lineStyle:{color:css("--line")}}},series:ser});
}
function optAg(){
  const seen=new Set(), links=[];
  K.forEach(k=>(k.komsu_kumeler||[]).forEach(o=>{ const key=[k.id,o].sort().join("-"); if(!seen.has(key)&&KB[o]){seen.add(key);links.push({source:k.id,target:o});} }));
  return Object.assign(base(),{tooltip:Object.assign(base().tooltip,{formatter:p=>p.dataType==="node"?`<b>${p.data.id}</b> ${esc(KB[p.data.id].ad)}<br>${KB[p.data.id].sayi} ihtiyaç`:""}),
    series:[{type:"graph",layout:"force",roam:true,draggable:true,force:{repulsion:260,edgeLength:[60,120],gravity:.12},
      data:K.map(k=>({id:k.id,name:k.id,symbolSize:14+k.sayi*1.5,itemStyle:{color:dcol(k.alan),borderColor:css("--surface"),borderWidth:2},label:{show:true,color:css("--ink"),fontSize:11,fontFamily:"IBM Plex Mono, monospace"}})),
      links, lineStyle:{color:css("--faint"),opacity:.55,width:1}, emphasis:{focus:"adjacency"}}]});
}
