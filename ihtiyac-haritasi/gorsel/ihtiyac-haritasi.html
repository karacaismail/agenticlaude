yac":"Tek denemede çözüm, k denemede tutarlılık, ilk incelemede kabul, müdahale oranı, eskalasyon ve durdurma oranı, test değiştirme girişimi, öz-rapor doğruluğu, kural ihlali; görev başı maliyet (medyan, üst yüzdelik), kabul edilen değişiklik başı maliyet, başarısız görevlerin maliyet payı, değişiklik başı inceleme süresi.","cozulecek_sorun":"Ajan performansı ve ekonomisi görünmüyor; algılanan hız ölçülen hızla ters olabiliyor.","yetenek_siniflari":["Y-29","Y-30","Y-27"],"zorunluluk":"zorunlu","kabul_olcutleri":["Metrikler görev kimliğiyle otomatik toplanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-121","S-112","S-123","S-107","S-104"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-023","H-07"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-008","baslik":"Algılanan ile ölçülen verimlilik farkı","ihtiyac":"Ekiplerin algıladığı hız ve kalite ile ölçülen değerlerin birlikte toplanması; kararların algıya değil ölçüme dayanması.","cozulecek_sorun":"Kontrollü bir deneyde deneyimli geliştiriciler yavaşlarken kendilerini hızlanmış sandı.","yetenek_siniflari":["Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Pilot değerlendirmesi algı anketi ve ölçüm verisini birlikte içeriyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-104","S-105","S-109"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-023","Q-039","R-029"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-009","baslik":"Türkçe yetkinlik ölçümü","ihtiyac":"Türkçe gereksinimli görev alt kümesinin değerlendirme setinde yer alması ve ayrı raporlanması.","cozulecek_sorun":"Türkçe gereksinim anlama doğrulanmamış.","yetenek_siniflari":["Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Türkçe alt küme sonuçları ayrı raporlanıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-017"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["A-015","G-026","R-025","U-044"],"bagimliliklar":["N-K23-001"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-010","baslik":"Değişiklik öncesi regresyon değerlendirmesi","ihtiyac":"Her model, kural, yetenek paketi, çalışma zamanı veya istem değişikliğinden önce görev setinde regresyon koşturulması.","cozulecek_sorun":"Sessiz gerileme; model kayması.","yetenek_siniflari":["Y-29","Y-43"],"zorunluluk":"zorunlu","kabul_olcutleri":["Değişiklik, regresyon değerlendirmesi geçmeden yayına alınmıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-126","S-061"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["R-005","U-001"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-011","baslik":"Hile ve ödül istismarı tespiti","ihtiyac":"Çözümsüz 'tuzak görevler', test değiştirme ve özel duruma göre kod yazma tespiti ile ajanların ödül istismarının ölçülmesi.","cozulecek_sorun":"Sahte başarı; bazı modeller çözümsüz görevlerde yüksek oranda hile yapıyor.","yetenek_siniflari":["Y-29","Y-22"],"zorunluluk":"zorunlu","kabul_olcutleri":["Görev setinde tuzak görevler var ve hile oranı raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-112"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["R-004","U-006"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-012","baslik":"Üretim içi değerlendirme","ihtiyac":"Laboratuvar değerlendirmesinin yanında gerçek işlerde kabul, geri alma ve müdahale oranlarının sürekli ölçülmesi.","cozulecek_sorun":"Laboratuvar ile saha arasındaki fark büyük; pilot başarısı üretime taşınamıyor.","yetenek_siniflari":["Y-29","Y-27"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Üretim içi metrikler laboratuvar sonuçlarıyla birlikte raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-121","S-117","S-172"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"üretim","iliskili":["R-018"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-013","baslik":"Pilot başarı ölçütleri ve yaygınlaştırma karar kuralı","ihtiyac":"Pilot için başarı metriklerinin, eşiklerin ve yaygınlaştırma/durdurma karar kuralının önceden yazılması; pilotun iş türüne göre katmanlanması.","cozulecek_sorun":"Pilot parlak, üretim sönük; ajan projelerinin önemli kısmının iptal edileceği öngörülüyor.","yetenek_siniflari":["Y-29"],"zorunluluk":"zorunlu","kabul_olcutleri":["Pilot öncesi karar kuralı ve eşikler yazılı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-172","S-173","S-108"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["D-018","H-09","Q-032","R-018","U-023"],"bagimliliklar":["N-K23-001"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-014","baslik":"Kod sağlığı ve bakım borcu izleme","ihtiyac":"Klon oranı, yeniden düzenleme oranı ve sık değişen kodun zaman serisi olarak izlenmesi.","cozulecek_sorun":"Ajan kullanımıyla yinelenen kod bloklarının arttığı, yeniden düzenlemenin azaldığı gözlenmiş; etkisi 6–12 ay sonra bakım maliyeti olarak ortaya çıkıyor.","yetenek_siniflari":["Y-46"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Aylık kod sağlığı raporu var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-136"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"zamanla (3–6 ay)","iliskili":["R-028","U-028"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-015","baslik":"Çalışma sisteminin insan deneyimi boyutlarıyla ölçülmesi","ihtiyac":"Teslim, akış ve ajan ekonomisi metriklerine ek olarak çalışma sisteminin insan boyutlarının düzenli ölçülmesi: memnuniyet ve iyi oluş, bilişsel yük, akış halinde çalışabilme, geri bildirim döngüsü hızı, iş birliği ve iletişim (ekip içi ve ekipler arası etkileşim ağı), işin anlamlılığı, tükenmişlik belirtileri. Sonuçların ekip düzeyinde toplulaştırılarak raporlanması ve pilot öncesinde başlangıç değerinin alınması.","cozulecek_sorun":"Yapay zekâ benimsenmesi üretkenliği artırırken iş taleplerini ve tükenmişliği de artırabiliyor. Yapay zekâ kullanan geliştiriciler daha özerk ve daha az iş birlikçi çalışmaya kayıyor. Yalnız çıktı metrikleriyle yönetilen sistem insan maliyetini geç fark eder.","yetenek_siniflari":["Y-57","Y-39"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekipler arası etkileşim ağı ölçümü ancak çok ekipte anlamlıdır; ekipler birbirleriyle değil kendi geçmişleriyle karşılaştırılmalı.","kabul_olcutleri":["Çok boyutlu ölçüm seti yazılı ve pilot öncesi başlangıç değeri alınmış.","Sonuçlar en az çeyrekte bir ve yalnız ekip düzeyinde, asgari grup büyüklüğüyle raporlanıyor.","İnsan boyutlarında anlamlı kötüleşme bir çalışma sistemi değişikliği kararı gerektiriyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-282","S-283","S-284","S-260"],"not":"Çok boyutlu üretkenlik çerçevesi (memnuniyet, performans, etkinlik, iletişim, verim/akış) ve geliştirici deneyimi çerçevesi (geri bildirim döngüleri, bilişsel yük, akış) temel alındı. Kod asistanına erişimle geliştiricilerin proje yönetimi ve iş birliği etkinliklerinden kodlamaya kaydığını gösteren doğal deney eklendi. Benzer mevcut ihtiyaç: N-K23-006; fark: N-K23-006/007/008 teslim, ajan ekonomisi ve algı–ölçüm farkını kapsar. İyi oluş, bilişsel yük ve iş birliği ağı boyutları yok."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K23-006"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-016","baslik":"Değerlendirme örneklerinin kökeni, kullanım geçmişi ve sızıntı sınırı","ihtiyac":"Değerlendirme setindeki her örneğin kökeninin ve daha önce öğrenmede, kural/yetenek paketi ayarlamasında, incelemede veya nihai değerlendirmede kullanılıp kullanılmadığının kaydedilmesi; değerlendirme sırasında çözen ajanın erişebildiği bilgi kaynaklarının (ortak bellek, eski çıktılar, referans çözüm, değerlendirme kaydı) ölçülen iddiaya uygunluğunun belirlenmesi; kirlenme şüphesi olan sonucun bağımsız yeterlilik kanıtı olarak sunulmaması.","cozulecek_sorun":"Kontrollü öğrenme ve ortak bellek başarılı örnekleri sisteme geri taşıdıkça iç ölçüm artarken görülmemiş işte kalite düşebilir; referans çözümün veya gizli değerlendirme bilgisinin sızması ödül istismarına ve yeteneğin olduğundan yüksek ölçülmesine yol açar.","yetenek_siniflari":["Y-29","Y-40","Y-16"],"zorunluluk":"zorunlu","olcek_etkisi":"Birden çok ekip aynı değerlendirme setini ve ortak belleği kullandıkça sızıntı yolları çoğalır; setin kullanım geçmişi merkezi tutulmalıdır.","kabul_olcutleri":["Her değerlendirme sonucunun yanında kullanılan örneklerin kökeni ve önceki kullanım geçmişi görülebiliyor.","Değerlendirme koşusunda erişilebilen bilgi kaynakları kayıtlı; referans çözüme veya gizli değerlendirme bilgisine erişim teknik olarak engelli ya da tespit ediliyor.","Kirlenme şüphesi olan sonuçlar ayrı etiketleniyor ve yaygınlaştırma kararlarında bağımsız kanıt sayılmıyor.","Sızıntıyı engelleyen kısıt meşru iş bilgisini de kaldırıyorsa oluşan düşüş ayrı raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-095","S-384","S-375"],"not":"2026 tarihli bir yazılım ajanı kıyaslama çalışması altın çözüm ve gizli değerlendirme bilgisi sızıntısının ödül istismarını mümkün kıldığını ve sonuçların gerçek yeteneği olduğundan yüksek gösterebildiğini raporlar (ön baskı). Benzer mevcut ihtiyaçlar: N-K23-001 (gizli testli kurum görev seti), N-K23-011 (hile tespiti), N-K11-009 (gizli değerlendirme seti). Fark: örneğin kullanım geçmişi ve değerlendirme anında erişilebilen bilgi yoluyla sızıntı tanımlı değildi."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K23-001","N-K11-009"],"iliskili":["G-038","U-070"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T19; ihtiyac-kumeleri/kumeler/04_dogruluk_ve_urun_nitelikleri/01_oracle_test_ve_kanit.json#I11-10","dogrulama":"dogrulandi","kaynak_url":["https://arxiv.org/abs/2609.08149","https://airc.nist.gov/airmf-resources/playbook/measure/"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K23-017","baslik":"İyileşme iddialarının karşılaştırılabilir ve yanlısız ölçülmesi","ihtiyac":"Ajanlı çalışmanın yarattığı iyileşme iddiasının karşılaştırılabilir iş türü ve kabul kalitesiyle değerlendirilmesi; kabul edilen sonuç başına takvim süresi, etkin insan emeği, bekleme, inceleme, sonraki düzeltme ve kaynak kullanımının ayrı gösterilmesi; bırakılan, başarısız ve değerlendirme dışı kalan işlerin görünür tutulması; görev seçimi, insan öğrenmesi ve paralel çalışmanın etkisinin açıklanması; paralel beklemelerde aynı sürenin çift sayılmaması; nedensellik gösterilemediğinde sonucun gözlemsel ilişki olarak etiketlenmesi.","cozulecek_sorun":"Yalnız tamamlanan en iyi işler başarı oranına alınırsa, kolay işler bir koşula yığılırsa veya ajan çalışırken başka işe geçen insanın süresi iki işte de tam emek sayılırsa iyileşme olduğundan farklı görünür; üretim artarken inceleme borcu gizlenir ve yaygınlaştırma kararı yanlış veriye dayanır.","yetenek_siniflari":["Y-29","Y-30","Y-39"],"zorunluluk":"zorunlu","olcek_etkisi":"Pilot sonuçları yaygınlaştırma kararına girdi olduğundan seçilim ve çift sayım hataları çok ekipli karara taşınır; ekipler arası karşılaştırmada iş bileşimi farkı ayrıca açıklanmalıdır.","kabul_olcutleri":["Pilot ve dönem raporlarında kabul edilen sonuç başına toplam insan emeğine üretim, inceleme ve sonraki düzeltmelerin hangilerinin dahil edildiği yazılı.","Bırakılan, başarısız ve değerlendirme dışı işlerin sayısı ve payı raporda; yalnız başarılı işlerden oran hesaplanmıyor.","Paralel ajan koşularında insan süresi çift sayılmıyor; takvim süresi, etkin emek ve bekleme ayrı.","İş bileşimi veya kabul kalitesi farklı dönemler karşılaştırılırken bu fark açıklanıyor; nedensellik kanıtı yoksa sonuç 'gözlemsel' etiketli.","Dış araştırmalardaki hızlanma/yavaşlama oranları yerel hedef veya kesin getiri olarak kullanılmıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-095","S-105","S-287","S-282"],"not":"2026 deney tasarımı güncellemesi, geliştiricilerin yapay zekânın çok hızlandırdığı işleri çalışmaya göndermemesiyle oluşan seçilim yanlılığını ve eşzamanlı ajan kullanımında süre ölçümünün güvenilmezliğini bildirir; yeni tahminlerin zayıf kanıt olduğunu belirtir. Benzer mevcut ihtiyaçlar: N-K23-006, N-K23-007, N-K23-008 (algı–ölçüm farkı), N-K23-013 (pilot karar kuralı), N-K29-008 (tamamlayıcılık). Fark: seçilim, bırakılan iş, çift sayım ve nedensellik etiketi kabul koşulu değildi."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K23-006","N-K23-013"],"iliskili":["G-038","Q-071"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T02; ihtiyac-kumeleri/kumeler/01_amac_ve_ortak_anlayis/01_deger_ve_kapsam.json#I01-05; ihtiyac-kumeleri/kumeler/05_sureklilik_ve_ogrenme/02_ekonomi_olcum_ve_ogrenme.json#I16-01","dogrulama":"dogrulandi","kaynak_url":["https://metr.org/blog/2026-02-24-uplift-update/","https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/","https://www.microsoft.com/en-us/research/publication/the-space-of-developer-productivity-theres-more-to-it-than-you-think/"],"kume":"K23","alan":"C-guvence-ve-yonetisim"},{"id":"N-K24-001","baslik":"Ekip sayısı belirsizliğine dayanıklı yapı","ihtiyac":"Hattın çok kiracılı tasarlanması: ekip ve ART düzeyinde kota, kural katmanı, bellek izolasyonu, izleme etiketi ve maliyet atfının yapılandırmayla eklenip çıkarılabilmesi; ekip sayısı ve bileşimi değiştiğinde yeniden tasarım gerekmemesi.","cozulecek_sorun":"Ekip sayısı (10+ olduğu kesin değil) ve bileşimi belirsiz; türev raporların hepsi 4 kişilik tek ekip varsayıyor, SAFe ve çok ekip hiçbir türev veride geçmiyor.","yetenek_siniflari":["Y-35","Y-30","Y-16"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Bu ihtiyacın kendisi ölçek belirsizliğine yanıttır.","kabul_olcutleri":["Yeni ekip eklemek yalnız yapılandırma değişikliği.","Ekip başına kota, kural katmanı ve maliyet etiketi var."],"kanit":{"duzey":"cikarim","kaynaklar":["S-090","S-061","S-062","S-063"]},"cember":"dis_eksik","belirsizlik":"yuksek","olcek_esigi":"2+ ekip","iliskili":["A-005","A-020","G-001","H-01","Q-001","Q-005","R-013"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-002","baslik":"Portföy ve program katmanıyla hizalanma","ihtiyac":"Portföy epikleri, ART özellikleri ve ekip hikâyelerinin ajan hattıyla aynı hiyerarşide izlenmesi; yalın portföy yönetiminin sınırlarına yapay zekâ sınırlarının (maliyet tavanı, otonomi düzeyi, veri sınıfı) eklenmesi.","cozulecek_sorun":"Ajan hattı ekip düzeyinde tasarlanmış; portföy ve program kararlarına bağlanmıyor.","yetenek_siniflari":["Y-39","Y-32"],"zorunluluk":"zorunlu","kabul_olcutleri":["Portföy sınırları yapay zekâ sınırlarını içeriyor.","Her ajan işi üst hiyerarşiye bağlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-090","S-171"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-001","Q-003"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-003","baslik":"Ekipler ve depolar arası bağımlılık","ihtiyac":"Program planlama panosundaki ekipler arası bağımlılıkların makinece okunabilir bir grafiğe bağlanması; ajanın yalnız bağımlılıkları çözülmüş işi alabilmesi; çok depolu bağımlılık ve kilitleme.","cozulecek_sorun":"Kaynaklardaki bağımlılık kümelemesi yalnız görev içi; ekipler ve depolar arası bağımlılık, kilitleme ve paralel ajanların birleştirme çakışması tanımsız.","yetenek_siniflari":["Y-13","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"3+ ekipte zorunlu; 10+ ekipte kritik.","kabul_olcutleri":["Ekipler arası bağımlılıklar grafikte ve ajan başlatma kararına giriyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-044","S-119","S-171"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["G-001"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-004","baslik":"Ajan platformunun paylaşılan hizmet ve sahibi","ihtiyac":"Ajan platformunun ART'lar arası paylaşılan bir hizmet olarak bir platform/etkinleştirici ekip tarafından sahiplenilmesi; entegrasyon ve birleştirme kuyruğunun işletilmesi; yapay zekâ okuryazarlığı ve yetenek paketi düzenlemesi için destek.","cozulecek_sorun":"Her ekip kendi altyapısını kurarsa kurallar ve güvenlik dağılır; kaliteli iç platform yapay zekâdan değer almanın temeli.","yetenek_siniflari":["Y-39"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Platform sahibi ekip ve hizmet kapsamı tanımlı.","Ekiplerin platforma katılım süreci yazılı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-102","S-103","S-171"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["G-001","H-01","Q-004"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-005","baslik":"Ajan altyapısı için etkinleştirici işler","ihtiyac":"Ajan platformu, değerlendirme seti, kural katmanı ve güvenlik kontrolleri için etkinleştirici işlerin program backlog'unda görünür olması ve mimari yol hazırlığının bir parçası sayılması.","cozulecek_sorun":"Altyapı işi görünmez kalınca iş değeri işleriyle yarışıp kaybediyor.","yetenek_siniflari":["Y-32"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Platform ihtiyaçları backlog'da etkinleştirici iş olarak var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-171"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-006","baslik":"Program artımı planlamasına girdiler","ihtiyac":"Planlamada: token/maliyet bütçesinin ekip kapasitesine dahil edilmesi; kapasitenin işin ajana uygunluk sınıfına göre ve aralık olarak tahmin edilmesi; risk ele alma listesine model kayması, sağlayıcı kesintisi ve düzenleme tarihlerinin eklenmesi.","cozulecek_sorun":"Ajanlı kapasite ve maliyet tek sayı olarak tahmin edilemiyor; ajan özgü riskler planlamaya girmiyor.","yetenek_siniflari":["Y-39","Y-30"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Planlama şablonunda ajan kapasitesi, maliyet aralığı ve ajan riskleri alanları var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-171","S-123"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["U-039"],"bagimliliklar":["N-K02-010","N-K21-005"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-007","baslik":"Ortak kurallar ile ekip-özel kuralların ayrımı","ihtiyac":"Değişmez kuralların (yasal, güvenlik, veri, lisans) portföy düzeyinde; mimari yol ve arayüz sözleşmelerinin ART düzeyinde; konvansiyonların ekip/depo düzeyinde tutulması.","cozulecek_sorun":"Ekipler arası kural sapması tutarsız mimari üretiyor.","yetenek_siniflari":["Y-35","Y-09"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Her kuralın katmanı belli; ekip kuralı üst katmanı gevşetemiyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-115","S-171"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["A-013","D-013","G-001","Q-003","Q-025","U-029"],"bagimliliklar":["N-K11-003"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-008","baslik":"Ortak sıcak nokta dosyalarının sahipliği","ihtiyac":"Birden çok ekibin dokunduğu yönlendirme, yapılandırma ve kayıt dosyalarının tek sahibi olması ve sıralı birleştirilmesi.","cozulecek_sorun":"Ortak dosyalar paralel ajan değişikliklerinde çakışma sıcak noktası.","yetenek_siniflari":["Y-33","Y-14"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Sıcak nokta dosya listesi ve sahipleri tanımlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-119"]},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"10+ ekip","iliskili":["R-015","U-007"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-009","baslik":"İnceleme ve uyarlama döngüsüne ajan olayları","ihtiyac":"Ajan olaylarının ve değerlendirme gerilemelerinin program düzeyi inceleme/uyarlama gündemine girmesi; yenilik ve planlama iterasyonunda kural ve yetenek paketi bakımına zaman ayrılması.","cozulecek_sorun":"Ajan hattındaki sorunlar ekip içinde kalıyor; kural ve paket bakımı için zaman ayrılmıyor.","yetenek_siniflari":["Y-39"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["İnceleme/uyarlama gündeminde ajan metrikleri ve olayları var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-171"]},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"3+ ekip","kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-010","baslik":"Ekip ekip yaygınlaştırma kriterleri","ihtiyac":"Pilottan sonra ekiplerin hatta hangi ölçütlerle, hangi sırayla ve hangi hazırlıkla alınacağının tanımlanması (plan değil, kriter).","cozulecek_sorun":"Hazır olmayan ekip hatta alınınca hem ekip hem hat zarar görüyor.","yetenek_siniflari":["Y-39"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Ekip hazır olma ölçütleri yazılı."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-061","S-062"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"pilot sonrası","iliskili":["H-09","Q-038"],"bagimliliklar":["N-K23-013"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-011","baslik":"Ekip bileşimi değişkenliğine uygun ölçüm","ihtiyac":"Ekip bileşimi değişken olduğundan ekiplerin birbiriyle değil kendi zaman serileriyle karşılaştırılması.","cozulecek_sorun":"Ekipler arası karşılaştırma yanlış teşvik ve yanlış karar üretiyor.","yetenek_siniflari":["Y-39"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Ekip metrikleri kendi geçmişine göre raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-171"]},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"10+ ekip","kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-012","baslik":"PI planlamasında ajan kaynaklı ekipler arası yükün ve ara yeniden hizalama noktalarının planlanması","ihtiyac":"PI planlamasında her ekibin diğer ekiplerin alanlarına dokunacak ajan işlerini önceden bildirmesi. Alan sahibi ekiplerin bu değişiklikler için inceleme ve entegrasyon kapasitesi ayırması. Ajan kaynaklı değişkenlik nedeniyle PI içinde tanımlı yeniden hizalama noktalarının (ör. iki haftada bir) ve bu noktalarda hedef ile kapasite düzeltme kurallarının belirlenmesi.","cozulecek_sorun":"Bir ekibin ajan hızı, alan sahibi diğer ekibe inceleme ve entegrasyon yükü olarak aktarılır. Bu dışsallık planlanmazsa sahip ekibin kendi hedefleri kayar. Ajan işi öngörüsündeki değişkenlik uzun PI taahhütlerini kırılgan kılar.","yetenek_siniflari":["Y-39","Y-13","Y-32"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip ve depo sayısı arttıkça ekipler arası dışsallık doğrusaldan hızlı büyür.","kabul_olcutleri":["PI planlama çıktısında ekipler arası ajan değişiklik bildirimleri ve karşılık gelen inceleme kapasitesi var.","Alan sahibi ekiplere gelen dış değişiklik incelemesi hacmi planlananla karşılaştırılıyor.","PI içi yeniden hizalama noktaları ve düzeltme kuralları yazılı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-251","S-271"],"not":"Ölçekli çerçevenin yapay zekâ sürümü planlamayı kısaltıp iki haftalık algıla–yanıtla etkinlikleriyle yeniden hizalamaya kaydırıyor. Ajan değişiklik çiftlerinde farklı ajanlar arası metinsel çakışma %41,7 (aynı ajanda %19,8). Benzer mevcut ihtiyaç: N-K24-006; fark: N-K24-006 ekip içi ajan kapasitesini ve maliyet aralığını planlamaya ekler. Ajan hızının başka ekiplere aktardığı inceleme yükü ve PI içi yeniden hizalama yok."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","iliskili":["G-034"],"bagimliliklar":["N-K24-006"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-013","baslik":"İnceleme ve uyarlamada insan tarafı bulgular ve çalışma sistemi değişiklik kararları","ihtiyac":"Program düzeyi inceleme ve uyarlama etkinliğinde ajan olaylarının yanında insan tarafı ölçümlerin ele alınması: inceleme yükü dağılımı, bilişsel yük, psikolojik güvenlik, ekipler arası çakışma ve yinelenen iş, kayıt dışı kullanım. Problem çözme atölyesinden çıkan çalışma sistemi değişikliklerinin sahip, hipotez ve bir sonraki PI kapasitesiyle yeni çalışma sistemi sürümüne bağlanması.","cozulecek_sorun":"Program düzeyi iyileştirme döngüsü yalnız teknik ajan metriklerine bakarsa darboğazın insanlarda ve ekipler arası arayüzlerde olduğu durumlar gözden kaçar. Atölye çıktıları kapasite almadan backlog'da kaybolur.","yetenek_siniflari":["Y-39","Y-58"],"zorunluluk":"zorunlu","olcek_etkisi":"ART sayısı arttıkça ART'lar arası iyileştirme deneylerinin karşılaştırılması gerekir.","kabul_olcutleri":["İnceleme ve uyarlama gündem şablonunda insan tarafı ölçümler zorunlu bir bölüm.","Atölye çıktılarının tümü sahip ve hedef çalışma sistemi sürümüyle kayıtlı ve bir sonraki PI'da kapasite almış."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-253","S-196"],"not":"İnceleme ve uyarlama; sistem gösterimi, nicel/nitel ölçüm incelemesi ve problem çözme atölyesinden oluşur. İnsan tarafı ölçümlerin eklenmesi çıkarımdır. Benzer mevcut ihtiyaç: N-K24-009; fark: N-K24-009 ajan olaylarını ve değerlendirme gerilemelerini gündeme alır. İnsan tarafı ölçümler ve atölye çıktılarının çalışma sistemi sürümüne bağlanması yok."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-034"],"bagimliliklar":["N-K24-009"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K24-014","baslik":"Güvenilirlik ve borç işine kapasite payı ve planlama girdisi","ihtiyac":"Program artımı planlamasında hizmet bazlı hata bütçesi durumu, açık olay eylem maddeleri, teknik borç eğilimi ve dayanıklılık deneyi bulgularının zorunlu girdi olması; ekip kapasitesinde güvenilirlik ve borç işine ayrılan payın açık ve ölçülen bir değer olması; ajan kapasitesinin de bu işlere yönlendirilebilmesi.","cozulecek_sorun":"Özellik baskısında güvenilirlik işi görünmez kalır; ajan hızı yalnız özellik üretimine giderse borç ve istikrarsızlık birikir.","yetenek_siniflari":["Y-39","Y-32","Y-60"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Tek ekipte ekip içi önceliklendirme yeterli olabilir; 10+ ekipte paylaşılan hizmetlerin güvenilirlik işi ekipler arası planlama gerektirir.","kabul_olcutleri":["Her planlama girdisinde hizmet bazlı bütçe durumu ve açık eylem maddeleri yer alıyor.","Planlanan ve gerçekleşen güvenilirlik/borç kapasite payı raporlanıyor.","Bütçesi tükenmiş hizmetin ekibinin planında güvenilirlik işi önceliklendirilmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-312","S-371"],"not":"Örnek hata bütçesi politikası tekrar eden kesinti sınıflarının çeyrek planlamasında ele alınmasını ister. Benzer mevcut ihtiyaç: N-K24-006; fark: K24-006 planlamaya token/maliyet bütçesi, ajana uygunluk ve risk girdilerini ekler; güvenilirlik durumu ve borç payı girdisi yok."},"cember":"ic_bosluk","belirsizlik":"orta","olcek_esigi":"3+ ekip","bagimliliklar":["N-K24-006"],"kume":"K24","alan":"D-organizasyon-ve-olcek"},{"id":"N-K25-001","baslik":"İnsan rol sınıfları ve karar hakları","ihtiyac":"Hatta insan karar noktalarının sahiplerinin rol sınıfı olarak (kişi değil) tanımlanması: ürün sahibi, kalite mühendisi, teknik lider, mimar, ürün/proje yöneticisi, olay sorumlusu, test paketi sorumlusu, güvenlik sorumlusu, platform sahibi, kural sahibi; her bekleme durumunun bir rol sınıfına bağlanması.","cozulecek_sorun":"Kaynaklar birçok insan rolü anıyor ama karar hakları ve bekleme durumlarının sahipleri tutarlı değil; ekipte kimlerin olacağı kesin değil.","yetenek_siniflari":["Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her insan karar noktasının rol sınıfı tanımlı.","Rol sınıfları kişi atamasından bağımsız."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-013","S-018","S-090"]},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-002","H-05","Q-002"],"kume":"K25","alan":"D-organizasyon-ve-olcek"},{"id":"N-K25-002","baslik":"SAFe rolleriyle eşleme","ihtiyac":"Hattaki insan rol sınıflarının SAFe rolleriyle (portföy yönetimi, ürün yönetimi, sistem mimarı, program koordinatörü, sistem ekibi, ürün sahibi, scrum ustası, ekip üyeleri) eşlenmesi.","cozulecek_sorun":"Kaynaklarda SAFe rolleri hiç geçmiyor; hat kararlarının program yapısındaki karşılığı yok.","yetenek_siniflari":["Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Eşleme tablosu var ve her SAFe rolünün hattaki karar hakları yazılı.","Kaynak panoda adı geçen program ve ekip rol adayları (iş sahibi, çevik koç, güvenlik işletimi, geliştirme–işletim, kullanıcı deneyimi tasarımı, istem/talimat mühendisliği, kalite güvencesi, ön yüz ve arka uç geliştiricisi) rol sınıflarına ve karar haklarına eşlenmiş; bir rol adı sürekli ayrı bir ajan süreci veya ayrı kadro gerektirmiyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-090","S-171","S-097"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["H-05"],"codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#pdf_topic_coverage/B02,B03","dogrulama":"dogrulandi","ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-097 eklendi; mevcut metin değiştirilmedi.","kume":"K25","alan":"D-organizasyon-ve-olcek"},{"id":"N-K25-003","baslik":"Yeni rol ve yetkinlik ihtiyaçları","ihtiyac":"Ajan platform mühendisliği, değerlendirme mühendisliği, yapay zekâ güvenliği ve kural/yetenek paketi düzenleme yetkinliklerinin tanımlanması; ürün sahibinin çalıştırılabilir niyet ve kabul kriteri yazma, mimarın kural ve mimari kısıt sahipliği, geliştiricinin şartname/inceleme/ajan yönetimi rollerine kayması.","cozulecek_sorun":"Mevcut roller ajan hattının gerektirdiği işleri kapsamıyor.","yetenek_siniflari":["Y-37"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Yetkinlik matrisi ve rol tanımları güncellenmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-171","S-107"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","kume":"K25","alan":"D-organizasyon-ve-olcek"},{"id":"N-K25-004","baslik":"Sorumluluk matrisi","ihtiyac":"Her ajan çıktısının bir insan sahibinin olması; 'bunu kim onayladı?' sorusunun her zaman cevaplanabilmesi.","cozulecek_sorun":"Olay sonrası 'ajan yaptı' tartışması; düzenlemeler yetkin ve yetkili bir insan gözetimi istiyor.","yetenek_siniflari":["Y-28","Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her ajan koşusunun sorumlu insanı kayıtlı."],"kanit":{"duzey":"arastirma","kaynaklar":["S-157","S-178"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["R-017","U-015"],"kume":"K25","alan":"D-organizasyon-ve-olcek"},{"id":"N-K25-005","baslik":"Yapay zekâ okuryazarlığı ve eğitim","ihtiyac":"Ajanların sınırları, hata modları, otomasyon yanlılığı ve güvenli kullanım konusunda rol bazlı eğitim.","cozulecek_sorun":"Ekipler ajan çıktısına aşırı ya da yetersiz güveniyor; düzenlemeler okuryazarlık tedbiri bekliyor.","yetenek_siniflari":["Y-37"],"zorunluluk":"zorunlu","kabul_olcutleri":["Rol bazlı eğitim içeriği var ve katılım izleniyor.","Eğitime katılım kaydı veya rol unvanı karar ve inceleme yeterliliği kanıtı sayılmıyor; yeterlilik temsilî işlerde gösterilen davranışla değerlendiriliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-158","S-109","S-103","S-095","S-374"]},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-025","Q-038"],"codex_kaynagi":"ihtiyac-kumeleri/tamamlama/01_kabul_ve_kanit_guclendirmeleri.json#T06; ihtiyac-kumeleri/kumeler/01_amac_ve_ortak_anlayis/02_insan_ekip_ve_yonetisim.json#I02-08","dogrulama":"kismen","kaynak_url":["https://airc.nist.gov/airmf-resources/airmf/5-sec-core/"],"ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-095, S-374 eklendi; mevcut metin değiştirilmedi.","kume":"K25","alan":"D-organizasyon-ve-olcek"},{"id":"N-K25-006","baslik":"Beceri körelmesine karşı önlem","ihtiyac":"Kritik becerilerin (hata ayıklama, tasarım, kod okuma) korunması için dönemsel yapay zekâsız tatbikatlar ve ölçüm.","cozulecek_sorun":"Kontrollü çalışmada yapay zekâ grubunun kavrama puanı düştü, en büyük fark hata ayıklamada; başka alanlarda da yapay zekâya alıştıktan sonra yardımsız performans düştü.","yetenek_siniflari":["Y-29"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Dönemsel yapay zekâsız tatbikat sonuçları izleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-169","S-170","S-105"]},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"zamanla (3–6 ay)","iliskili":["G-025","R-016","U-014","U-033"],"kume":"K25","alan":"D-organizasyon-ve-olcek"},{"id":"N-K25-007","baslik":"Güven ve benimseme","ihtiyac":"Ekiplerin ajan hattına güveninin ve kullanım biçiminin ölçülmesi; kayıt dışı kullanımın ve 'yapay zekâsız çalışmayı reddetme' bağımlılığının izlenmesi.","cozulecek_sorun":"Geliştiricilerin taması değil.","yetenek_siniflari":["Y-31"],"zorunluluk":"zorunlu","kabul_olcutleri":["Rol sınıfı ataması kişi bazında yapıldığında kayıt altında (projelendirme aşamasında)."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-090"]},"cember":"ic_bosluk","belirsizlik":"yuksek","iliskili":["Q-002","Q-042"],"bagimliliklar":["N-K25-001"],"kume":"K25","alan":"D-organizasyon-ve-olcek"},{"id":"N-K26-001","baslik":"Tek durum modeli ve pano eşlemesi","ihtiyac":"Ara durumlarla zengin bir durum modelinin (çalışıyor, doğrulanıyor, ürün sahibi bekleniyor, kalite bekleniyor, altyapı engeli, test engeli, yayına hazır, hata, bitti) tanımlanması ve iş takip panosunun sütunlarına eşlenmesi; 'neden durdu' alanı.","cozulecek_sorun":"Panoda 5 sütun var, akışlar en az 8–10 durum kullanıyor; eşleme yok; neden durduğu görünmüyor.","yetenek_siniflari":["Y-32","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her ara durumun pano karşılığı ve neden alanı tanımlı.","Girişte kabul edilmeyen talepler gerekçesiyle ayrı bir 'reddedilenler arşivi' durumunda tutuluyor ve kendiliğinden yeniden akışa girmiyor.","Teknik tamamlanma (incelemeye/yayına hazır) ile insan kabulü (bitti) ayrı durumlar; otomatik 'bitti' insan kabul testi yapılmadan iş kabulü gibi gösterilmiyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-030","S-006","S-007","S-054","S-062","S-096"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["C-011","D-009","G-010","H-06","Q-009"],"bagimliliklar":["N-K10-003"],"codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#pdf_topic_coverage/F03,F07","dogrulama":"dogrulandi","ice_aktarilan":"E1 karşılaştırması: son 2 kabul ölçütü ve kanıt kaynaklarından S-096 eklendi; mevcut metin değiştirilmedi.","kume":"K26","alan":"D-organizasyon-ve-olcek"},{"id":"N-K26-002","baslik":"Komutla başlatma","ihtiyac":"İşin iş takip sisteminden bir komutla (yorum veya olay) başlatılması; komut adı ve biçiminin tek olması; yetki ve tekilleştirme kontrolü.","cozulecek_sorun":"Kaynaklarda iki farklı komut adı var; yetkisiz veya çift başlatma riski.","yetenek_siniflari":["Y-11","Y-25"],"zorunluluk":"zorunlu","kabul_olcutleri":["Tek komut biçimi yazılı; komutlar yetki ve tekilleştirme kontrolünden geçiyor.","Başlatma, yetkili kişinin iş kalemini tanımlı başlatma durumuna taşımasıyla da tetiklenebiliyor; ajanlar yalnız bu durumdaki kalemleri iş kuyruğuna çekiyor; aynı durumun tekrar okunması yeni koşu başlatmıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-006","S-030","S-096"]},"cember":"ic_bosluk","belirsizlik":"dusuk","iliskili":["A-002","C-013","Q-009"],"bagimliliklar":["N-K13-012"],"codex_kaynagi":"research_notes/Plane tabanlı otonom yazılım sistemi/pdf_requirements.json#pdf_topic_coverage/F05","dogrulama":"dogrulandi","ice_aktarilan":"E1 karşılaştırması: son 1 kabul ölçütü ve kanıt kaynaklarından S-096 eklendi; mevcut metin değiştirilmedi.","kume":"K26","alan":"D-organizasyon-ve-olcek"},{"id":"N-K26-003","baslik":"İş takip sisteminin yetkisi sınırlı yansıma olması","ihtiyac":"İş takip sisteminin talep, kapsam, kriter kimlikleri, sprint/atama, insan kararı girişi ve görünür durumun kaynağı olması; yaşam döngüsünün sahibi olmaması; ajanın durumu doğrudan değiştirmemesi.","cozulecek_sorun":"İki sistem durumu yazınca tutarsızlık oluşuyor.","yetenek_siniflari":["Y-32","Y-12"],"zorunluluk":"zorunlu","kabul_olcutleri":["Durum geçişlerini yalnız orkestrasyon yazıyor."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-062"]},"cember":"ic_tanimli","belirsizlik":"dusuk","iliskili":["D-019","Q-041","R-035"],"bagimliliklar":["N-K12-004"],"kume":"K26","alan":"D-organizasyon-ve-olcek"},{"id":"N-K26-004","baslik":"Sonuç ve kanıtın iş kalemine yazılması","ihtiyac":"Tamamlanan işin rapor, değişiklik bağlantısı, kanıt paketi ve açık soruların iş kalemine yazılması; çözülemeyen sorunun gerekçesiyle kaydı.","cozulecek_sorun":"İzlenebilirlik kopuyor; insan neyin neden durduğunu göremiyor.","yetenek_siniflari":["Y-11","Y-28"],"zorunluluk":"zorunlu","kabul_olcutleri":["Her kapanışta kanıt bağlantısı var; her engelde gerekçe var."],"kanit":{"duzey":"kaynakta_acik","kaynaklar":["S-018","S-006"]},"cember":"ic_tanimli","belirsizlik":"dusuk","kume":"K26","alan":"D-organizasyon-ve-olcek"},{"id":"N-K26-005","baslik":"Toplu içe aktarma ve şema sürümü","ihtiyac":"Mevcut kayıtların iş takip sistemine şema sürümüyle içe aktarılması; kaynak kaydın izinin korunması.","cozulecek_sorun":"Toplu dönüşümde kaynak kayıtla ilişki kayboluyor.","yetenek_siniflari":["Y-32"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Her dönüştürülmüş kayıt kaynak kaydına bağlı."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-030","S-054"]},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"yüksek hacim","bagimliliklar":["N-K02-001"],"kume":"K26","alan":"D-organizasyon-ve-olcek"},{"id":"N-K26-006","baslik":"Sprint ve program görünürlüğü","ihtiyac":"Ürün backlog'u, sprint backlog'u ve program görünümünün ajan işlerini ve bekleme durumlarını ayrı gösterebilmesi.","cozulecek_sorun":"Ajan işi ile insan işi aynı sütunda karışıyor; bekleme nedenleri görünmüyor.","yetenek_siniflari":["Y-32","Y-39"],"zorunluluk":"olcege_bagli","kabul_olcutleri":["Panolarda ajan/insan/bekleme ayrımı yapılabiliyor."],"kanit":{"duzey":"kaynakta_ima","kaynaklar":["S-030"]},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"3+ ekip","kume":"K26","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-001","baslik":"Ekip düzeyinde yazılı ve sürümlü insan–ajan çalışma anlaşması","ihtiyac":"Her ekibin yazılı bir çalışma anlaşmasına sahip olması. Anlaşma kurum yapay zekâ politikasından ve ortak çekirdekten türer; bunları yalnız sıkılaştırabilir. İçerdiği başlıklar: ajana hangi iş türlerinin verildiği ve verilmediği; ajan işini kimin başlattığı ve yönlendirdiği; ajan çıktısının incelemeye nasıl girdiği; ajan sorularına ve onay isteklerine yanıt süresi beklentisi; durdurma ve eskalasyon; yapay zekâ katkısının açıklanması; eşli veya topluca ajanla çalışma kuralları; anlaşmanın hangi ritüelde gözden geçirileceği. Anlaşmanın sahibi ekiptir; kolaylaştırıcısı insan tarafından yürütülen ekip koçu (scrum ustası) rolüdür.","cozulecek_sorun":"Kurum politikası 'ne serbest' sorusunu yanıtlar, ama ekip içinde 'biz nasıl çalışıyoruz' sorusu yanıtsız kalır. Normlar örtük kalınca her üye ajanı farklı kullanır, inceleme beklentileri çatışır ve belirsizlik kaygı üretir. Araştırma, yazılım ekiplerinde norm açıklığının performans ve memnuniyeti psikolojik güvenlikten bile güçlü yordadığını gösteriyor.","yetenek_siniflari":["Y-58","Y-35","Y-37"],"zorunluluk":"zorunlu","olcek_etkisi":"10+ ekipte 'ortak çekirdek + ekip eki' modeli gerekir. Yoksa ekipler arası norm sapması ve rotasyon zorluğu doğar.","kabul_olcutleri":["Her ekibin sürüm numaralı, tarihli ve sahibi belli bir çalışma anlaşması var; ortak çekirdekle çelişmediği denetlenmiş.","Anlaşma yukarıdaki başlıkların tümünü içeriyor; tanımlanmayan başlık 'bilinçli olarak tanımsız' diye işaretli.","Anlaşma her PI'da en az bir retrospektifte gözden geçiriliyor ve değişiklik kaydı tutuluyor.","Ekip anketinde 'ajanla nasıl çalıştığımız açık' ifadesine katılım ölçülüyor; eşik altında eylem açılıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-255","S-213","S-250"],"not":"Lenberg ve Feldt: 38 ekipte norm açıklığı performansı psikolojik güvenlikten güçlü yordadı. 2025 teslim performansı araştırmasının yetenek modeli 'açık ve iletilmiş yapay zekâ tutumunu' temel yetenek sayıyor. Scrum ek rehberi çalışma anlaşmalarında insanın hesap verebilir kaldığı normlar öneriyor. Benzer mevcut ihtiyaç: N-K22-010; fark: N-K22-010 kurum düzeyindeki politikayı, N-K11-003 ajanların uyduğu makine kurallarının katmanlarını ele alır. İnsanların ajanla nasıl birlikte çalışacağına dair ekip normu ve bunun gözden geçirme döngüsü yok."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-034"],"bagimliliklar":["N-K22-010"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-002","baslik":"Yapay zekâ ve ajan katkısının açıklanması normu; açıklamanın cezalandırılmaması","ihtiyac":"Ajan ve yapay zekâ katkısının değişiklik, test, doküman, karar kaydı ve paydaşa giden çıktılarda tek biçimde ve düşük zahmetle işaretlenmesi (katkı türü: üretim, öneri, inceleme). İşaretin kod incelemesinde ve performans değerlendirmesinde olumsuz kanıt olarak kullanılmayacağının yazılı güvencesi. Açıklanmamış kullanımı cezalandırmadan önce açıklamanın kolaylaştırılması.","cozulecek_sorun":"Çalışanların önemli bir kısmı önemli işlerde yapay zekâ kullandığını 'tembel' ya da 'yerine konabilir' görünme korkusuyla gizliyor. Aynı çıktı, yapay zekâyla üretildiği söylendiğinde daha düşük yetkinlik puanı alıyor; ceza kadınlarda ve ileri yaştaki çalışanlarda daha büyük. Gizlenen kullanım ölçümü, incelemeyi ve riski görünmez kılar.","yetenek_siniflari":["Y-28","Y-11","Y-32"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça farklı işaretleme alışkanlıkları kurum düzeyi ölçümü bozar; tek biçim gerekir.","kabul_olcutleri":["Katkı işaretleme biçimi tek ve iş akışında zorunlu alan olarak var; işaretleme oranı ölçülüyor.","Politika, işaretin bireysel değerlendirmede olumsuz kullanılamayacağını açıkça yazıyor.","Dönemsel ankette 'yapay zekâ kullanımımı açıklamaktan çekinmiyorum' ifadesine katılım izleniyor.","Anket ile kullanım verisi arasındaki farktan tahmin edilen kayıt dışı kullanım zamanla azalıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-258","S-259","S-250"],"not":"1.026 mühendisle önceden kayıtlı deney: aynı kod yapay zekâ destekli denildiğinde yetkinlik puanı ortalama %9 düştü; kadınlarda daha fazla. 31 ülke anketi: yapay zekâ kullananların %52'si en önemli işlerde kullandığını söylemekte isteksiz. Benzer mevcut ihtiyaç: N-K19-006; fark: N-K19-006 insan katkısını denetim amacıyla kaydeder, N-K25-007 kayıt dışı kullanımı ölçer. Açıklamayı güvenli kılan norm ve karşıt teşvik (yetkinlik cezası) ele alınmamış."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-034"],"bagimliliklar":["N-K19-006"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-003","baslik":"Ajan işi için DoR/DoD uzantıları: aynı titizlik, insan yönlendirme payı ve anlama kanıtı","ihtiyac":"Tek DoR ve DoD'ye ajan katkılı işe özgü maddelerin eklenmesi. DoR'da: işin ajana devredilebilirlik sınıfı, sorumlu insan ve insan yönlendirme/inceleme süresinin ayrıldığı. DoD'de: ajan işinin insan işiyle aynı kapılardan gevşetilmeden geçtiği; katkı işaretinin bulunduğu; sorumlu insanın değişikliği amaç, tasarım kararı ve riskleriyle açıklayabildiğinin kayda geçtiği. Bu 'anlama kanıtı' risk sınıfına göre kısa bir gerekçe notu ya da sözlü açıklamadır.","cozulecek_sorun":"Ajan çağında 'yazarlık, anlamanın kanıtıdır' varsayımı çöküyor. Sürüm kaydı insan yazarı gösterir, ama kodu kimse anlamamış olabilir. Geliştiriciler ajan kodunu incelemenin güçlüğünü 'testler geçti' sezgisiyle telafi ediyor. DoD'nin makine kapıları anlama ve sahiplik boşluğunu yakalamaz.","yetenek_siniflari":["Y-31","Y-06","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça ekiplerin DoD'yi ajan işi için sessizce gevşetme riski artar; ortak çekirdekte tutulmalı.","kabul_olcutleri":["DoR ve DoD kontrol listelerinde ajan işine özgü maddeler var ve DoD sahibi tarafından onaylanmış.","Orta ve üstü risk sınıfındaki ajan değişikliklerinin %100'ünde sorumlu insanın anlama notu var.","Örneklemle yapılan denetimde sorumlu insan değişikliği açıklayamıyorsa iş 'bitti' sayılmıyor; bu oran izleniyor.","Ajan işi için hiçbir DoD maddesi insan işine göre daha gevşek değil."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-268","S-266","S-250"],"not":"Yazarlığa dayalı bilgi metrikleri (kamyon faktörü, yazarlık derecesi) ajan kodunda anlamayı göstermiyor. 17 geliştiriciyle çalışmada ajan kodunu incelemenin güçlüğü ve testleri doğruluk güvencesi sayma sezgisi raporlandı. Scrum ek rehberi ajan çıktısına aynı titizliği istiyor. Benzer mevcut ihtiyaç: N-K05-027; fark: N-K05-027 ve N-K01-006 hat düzeyindeki kapıları birleştirir. Ajan katkısına özgü insan anlama, sahiplik ve yönlendirme payı maddeleri yok."},"cember":"ic_bosluk","belirsizlik":"orta","iliskili":["G-034"],"bagimliliklar":["N-K05-027"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-004","baslik":"Sprint kapasitesinin insan dikkat kapasitesi üzerinden planlanması","ihtiyac":"Sprint planlamasında kapasitenin ajan üretim hızıyla değil, insanın yönlendirme (ön kontrol ve birlikte planlama), izleme, inceleme ve kabul için ayırabileceği süreyle sınırlanması. Ajan işlerinin bu insan payıyla birlikte tahmin edilmesi. Ekipler arası inceleme talepleri, ajan hatalarının ayıklanması ve kural/paket bakımı için pay ayrılması. Planlanan ile gerçekleşen insan gözetim süresinin karşılaştırılması.","cozulecek_sorun":"Ajan işinde darboğaz üretim değil gözetimdir. Gözetim yalnız sonradan inceleme değildir; önleyici kontrol, birlikte planlama ve anlık izlemeyi de kapsar. Kapasite ajan hızına göre planlanırsa inceleme kuyruğu şişer, kalite düşer ya da gözetim görünmez fazla mesaiye dönüşür. Algılanan hız ile ölçülen hız arasında da büyük fark olabiliyor.","yetenek_siniflari":["Y-32","Y-39","Y-31"],"zorunluluk":"zorunlu","olcek_etkisi":"Çok ekipte gözetim kapasitesi ART'ın gerçek kısıtıdır; PI kapasitesi ekip gözetim kapasitelerinin toplamından türetilmeli.","kabul_olcutleri":["Sprint planlama şablonunda insan gözetim kapasitesi ayrı bir alan.","Ajan işlerinin tahmininde insan yönlendirme ve inceleme payı ayrıca tahmin ediliyor.","Planlanan ve gerçekleşen gözetim süresi farkı her sprintte raporlanıyor.","Ekipler arası inceleme ve kural bakımı için ayrılan pay görünür."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-266","S-287","S-250"],"not":"Gözetim işinin dört biçimi tanımlanmış: önceden kontrol, birlikte planlama, anlık izleme ve sonradan inceleme. Randomize çalışmada deneyimli geliştiriciler %19 yavaşladığı hâlde %20 hızlandıklarını düşündü. Scrum ek rehberi planlamada ajan çıktısını doğrulamak için süre ayrılmasını öneriyor. Benzer mevcut ihtiyaç: N-K24-006; fark: N-K24-006 PI düzeyinde token/maliyet bütçesini ve ajana uygunluk sınıfını planlamaya ekler. N-K17-005 inceleme yükünü ölçer ama planlamaya bağlamaz. Sprint düzeyinde insan gözetim süresinin birincil kısıt olarak planlanması ve ölçülmesi yok."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-034"],"bagimliliklar":["N-K24-006"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-005","baslik":"Ajan geçişinde tahmin tabanının yeniden kurulması ve olasılıksal öngörü","ihtiyac":"Ajan kullanımına geçişte geçmiş hız ve puan verisinin karşılaştırılamaz sayılması ve bir geçiş dönemi boyunca yeni tabanın ölçülmesi. İşin yapılış biçimine (ajan, insan, karma) göre ayrı akış hacmi ve çevrim süresi dağılımlarının tutulması. Teslim öngörülerinin tek tarih yerine olasılık aralığıyla verilmesi. Ajan kaynaklı uzun kuyruklu süre değişkenliğinin öngörüye yansıtılması.","cozulecek_sorun":"Ajanlar iş başına süreyi ve değişkenliği değiştirir. Eski hız verisiyle verilen taahhütler ya aşırı iyimser olur ya da puanlar şişip anlamını yitirir. Ölçekli çevik çerçeve de yapay zekânın artırdığı değişkenlik nedeniyle planlamayı kısa aralıklı yeniden hizalamaya kaydırıyor.","yetenek_siniflari":["Y-39","Y-32"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip sayısı arttıkça PI taahhütleri bu öngörülere dayanır; ekipler arası puan karşılaştırması yapılmamalı.","kabul_olcutleri":["Her ekip için geçiş dönemi ve yeniden taban tarihi kayıtlı.","Öngörüler olasılık aralığıyla (ör. %50 ve %85 güven) raporlanıyor.","Akış metrikleri yapılış biçimine göre ayrıştırılabiliyor.","Öngörü isabeti her PI sonunda ölçülüyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-094","S-251","S-287","S-308"],"not":"Hız verisinin geçersizleşmesine dair hakemli ölçüm bulunamadı; sektör rehberleri ve ölçekli çevik çerçevenin 'artan değişkenlik' tespiti üzerine kurulu çıkarım. Benzer mevcut ihtiyaç: N-K24-011; fark: N-K24-011 ekipleri kendi zaman serileriyle karşılaştırır, N-K20-006 maliyeti aralıkla ister. Ajan geçişinde tahmin biriminin ve hız tabanının yeniden kurulması tanımlı değil."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"pilot sonrası","iliskili":["G-034"],"bagimliliklar":["N-K24-011"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-006","baslik":"Sprint planlama ve günlük koordinasyonun insan–ajan işine uyarlanması","ihtiyac":"Sprint planlamada her kalem için yapılış biçiminin (insan, ajan destekli, ajan öncü + insan kontrol noktası) ve doğrulama süresinin konuşulması. Günlük koordinasyon öncesinde ajan koşularının durumunun eşzamansız özetlenmesi. Toplantının bekleyen insan kararlarına, takılan koşulara, beklenmedik ajan davranışlarına ve ekipler arası çakışmalara odaklanması; ajan loglarının toplantıda okunmaması.","cozulecek_sorun":"Ritüeller yalnız insan işini varsayarsa ajan işleri ya görünmez kalır ya da toplantılar ajan durum raporuna dönüşür. Bekleyen insan kararları gün boyu akışı durdurur.","yetenek_siniflari":["Y-32","Y-31","Y-11"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip başına ajan koşusu arttıkça eşzamansız özet olmadan günlük koordinasyon uzar.","kabul_olcutleri":["Sprint backlog'unda her kalemin yapılış biçimi işaretli.","Günlük koordinasyon öncesinde ajan durum özeti hazır ve toplantı süresi artmamış.","Bekleyen insan kararlarının sayısı ve yaşı her gün görünür."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-250","S-252"],"not":"Scrum ek rehberi: planlamada hangi işlerde yapay zekâ kullanılacağını ve doğrulama süresini konuşmak; günlük toplantıda ajan ilerlemesini ve beklenmedik sonuçları izlemek. Ölçekli çerçeve 'hizala–algıla–yanıtla' akışını öneriyor. Benzer mevcut ihtiyaç: N-K26-006; fark: N-K26-006 panoda ajan/insan/bekleme ayrımını gösterir; ritüellerin içeriği ve karar odağı tanımlı değil."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-034"],"bagimliliklar":["N-K26-006"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-007","baslik":"Sprint gözden geçirmede 'nasıl üretildi' şeffaflığı ve insan paydaş kabulü","ihtiyac":"Gözden geçirmede paydaşlara yalnız ne üretildiğinin değil, şunların da gösterilmesi: ajan katkısının payı, hangi kalite boyutlarının doğrulandığı ve hangilerinin 'test edilmedi' kaldığı, ajan kaynaklı sorunlar ve yeniden iş. Paydaş geri bildiriminin insan tarafından değerlendirilip backlog'a işlenmesi. Gösterimi ajanın değil ekibin sunması ve kabulün insan kararı olması.","cozulecek_sorun":"Ajan hızıyla artan çıktının gösterimi, doğrulanmamış işi 'bitti' gibi sunma ve 'özellik fabrikası'na dönüşme riskini artırır. Paydaşlar hangi riskin kabul edildiğini göremez.","yetenek_siniflari":["Y-32","Y-28"],"zorunluluk":"zorunlu","olcek_etkisi":"ART düzeyi sistem gösteriminde aynı şeffaflık ekipler arasında tutarlı olmalı.","kabul_olcutleri":["Gözden geçirme şablonunda ajan katkısı ve doğrulanmamış boyutlar alanı var.","Paydaş geri bildirimlerinin %100'ü sahibiyle backlog'a bağlanıyor.","Kabul kararlarının kaydında karar veren insan belli."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-250"],"not":"Scrum ek rehberi gözden geçirmede 'nasıl yapay zekâyla üretildiğini ve sorun çıkıp çıkmadığını' göstermeyi öneriyor; özellik fabrikası ve yalnız hıza bakan metrikler konusunda uyarıyor. Benzer mevcut ihtiyaç: N-K05-014; fark: N-K05-014 'test edilmedi' durumunu içeren kanıt raporunu üretir. Bunun paydaşla paylaşıldığı ritüel ve kabulün insan kararı olması tanımlı değil."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-034"],"bagimliliklar":["N-K05-014"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-008","baslik":"Ajan izleri ve insan deneyimiyle beslenen suçlamasız retrospektif","ihtiyac":"Retrospektiflerin iki tür veriyi birlikte ele alması. Ajan verisi: müdahale, yeniden iş, takılma, kural ihlali girişimi. İnsan deneyimi verisi: inceleme yükü, bilişsel yük, kesinti, işin anlamlılığı. Çıktının çalışma anlaşmasına, kurallara veya yetenek paketlerine yapılacak somut, sahipli bir değişiklik önerisi olması. Ajan verisinin kişileri suçlamak için kullanılmaması. Ajanın retrospektifte katılımcı değil veri kaynağı olması.","cozulecek_sorun":"Ajan hataları sıklıkla ajanı başlatan kişiye yüklenir. Retrospektifler ajan sorunlarını konuşmazsa aynı sürtünmeler ekipler arasında tekrarlanır. İnsan tarafındaki tükenmişlik ve anlam kaybı görünmez kalır.","yetenek_siniflari":["Y-27","Y-57"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip retrospektif çıktıları ART düzeyi inceleme ve uyarlamaya toplanabilir biçimde kaydedilmeli.","kabul_olcutleri":["Retrospektif girdi paketinde ajan ve insan deneyimi göstergeleri var.","Her retrospektif en az bir sahipli iyileştirme ya da gerekçeli 'değişiklik yok' kararı üretiyor.","Retrospektif notlarında kişi adına bağlı ajan hatası sayımı yer almıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-250","S-290","S-284"],"not":"Suçlamasız analiz ilkesi olay analizinden alındı. 442 geliştiricilik çalışma: yapay zekâ benimsenmesi iş taleplerini artırarak tükenmişliği yükseltiyor, kaynaklar bunu hafifletiyor. Benzer mevcut ihtiyaç: N-K24-009; fark: N-K24-009 program düzeyi incelemeye ajan olaylarını taşır. Ekip retrospektifinin girdisi, çıktısı ve suçlamasızlık kuralı tanımlı değil."},"cember":"dis_eksik","belirsizlik":"dusuk","iliskili":["G-034"],"bagimliliklar":["N-K24-009"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-009","baslik":"Çalışma sisteminin sürümlü bir ürün olarak yönetilmesi ve deneyle değiştirilmesi","ihtiyac":"Çalışma sisteminin tek, sürümlü ve okunabilir bir kaynakta tutulması. Kapsam: roller, karar hakları, ritüeller, çalışma anlaşmalarının ortak çekirdeği, DoR/DoD, otonomi düzeyleri ve insan karar noktaları. Bir sahibinin (çalışma sistemi/dönüşüm ekibi) olması. Değişikliklerin hipotez, başarı ölçütü, deneme ekipleri, süre ve geri dönüş koşuluyla önerilip önce küçük ölçekte denenmesi. Sonucun yeni sürümle yayınlanması ve hangi ekibin hangi sürümde çalıştığının görünmesi.","cozulecek_sorun":"Ajanlar değişkenliği artırdıkça çalışma biçimi sık değişir. Değişiklikler kayıtsız ve ölçümsüz yapılırsa 10+ ekip farklı sürümlerde çalışır; iyileşme ile gerileme ayırt edilemez ve iyi uygulama yayılmaz. Araştırma, yapay zekânın örgütün güçlü ve zayıf yanlarını büyüten bir yükselteç olduğunu gösteriyor.","yetenek_siniflari":["Y-58","Y-35","Y-39"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça sürüm görünürlüğü olmadan ekipler arası sapma ve 'kimin hangi kuralla çalıştığı' belirsizliği büyür.","kabul_olcutleri":["Çalışma sisteminin sürüm numarası, değişiklik kaydı ve sahibi var.","Her ekip için geçerli sürüm görünür.","Çalışma sistemi değişikliklerinin tümünde hipotez ve ölçüt yazılı; sonuçlar raporlanmış.","Deneme sonucu olumsuz olan değişiklik geri alınmış ya da gerekçesiyle sürdürülmüş."],"kanit":{"duzey":"cikarim","kaynaklar":["S-094","S-196","S-253"],"not":"Yapay zekânın yükselteç etkisi 2025 teslim performansı araştırmasında raporlanıyor. Çalışma sistemini sürümlü ürün olarak yönetme önerisi, inceleme-uyarlama döngüsü ve deney disiplininden çıkarım. Benzer mevcut ihtiyaç: N-K23-013; fark: N-K23-013 hattın pilotu için yaygınlaştırma kuralını, N-K13-010 süreç kodunun sürümlenmesini ele alır. İnsan çalışma sisteminin (ritüel, anlaşma, karar hakkı) sürümlenmesi, sahibi ve deney disiplini yok."},"cember":"dis_eksik","belirsizlik":"orta","iliskili":["G-034"],"bagimliliklar":["N-K23-013"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K30-010","baslik":"Ajanın ekip içindeki konumu ve insanlara yönelik etkileşim sınırları","ihtiyac":"Ekip ortak alanlarında (sohbet kanalı, pano, toplantı, doküman) çalışan proaktif ajanların neyi kendiliğinden yapabileceğinin tanımlanması. Örnekler: insanlara iş atayıp atamayacağı, hangi kişiyi hangi sıklıkla uyarabileceği, hangi kanala yazabileceği, insan konuşmalarını özetleyip paylaşıp paylaşamayacağı, çalışma saatleri dışında bildirim gönderip gönderemeyeceği. Ekip üyelerinin ajan etkileşimini sınırlama ve geri bildirim verme hakkı. Ajanın 'ekip üyesi' değil, hesap verebilir bir insanın aracı olarak konumlandırılması.","cozulecek_sorun":"Kalıcı ve proaktif ajan 'ekip arkadaşları' insan iş birliğinin örtük kurallarını bozuyor. Ajanın ilişkisel sınırları, güvenin ve insan inisiyatifinin yeniden dağılımı konusunda sürtüşme yaratıyor. İnsan–ajan eşleşmelerinde kişiler arası iletişim azalıyor, çıktılar tekdüzeleşiyor.","yetenek_siniflari":["Y-11","Y-09","Y-31"],"zorunluluk":"kosullu","olcek_etkisi":"Ekipler arası ortak kanallarda çalışan ajanlar birden çok ekibin normuna tabi olur; en sıkı norm geçerli olmalı.","kabul_olcutleri":["Ekip ortak alanında çalışan her ajanın izinli etkileşimler listesi ve insan sahibi var.","Ajan kaynaklı bildirim/kesinti hacmi ölçülüyor ve çalışma anlaşmasındaki sınırı aşmıyor.","Ekip üyelerinin ajan etkileşimine geri bildirim kanalı var; geri bildirimler retrospektife giriyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-264","S-265"],"not":"20'den fazla ekipte konuşlanan proaktif bir ekip ajanıyla saha çalışmasında örtük iş akışı kurallarında kırılmalar ve güven/inisiyatif yeniden dağılımı gözlendi. Saha deneyinde yapay zekâ ile çalışan kişilerde kişiler arası mesajlar %18 azaldı ve çıktılar tekdüzeleşti. Benzer mevcut ihtiyaç: N-K12-005; fark: N-K12-005 insan–ajan iletişim kanalının kritik yol dışında olmasını ister. Ajanın ekibin sosyal alanındaki davranış sınırları ve insanların sınırlama hakkı tanımlı değil."},"cember":"dis_eksik","belirsizlik":"yuksek","iliskili":["G-034"],"bagimliliklar":["N-K12-005"],"kume":"K30","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-001","baslik":"Kod alanı sahipliği kataloğu ve ajan değişikliğinde dört rolün ayrımı","ihtiyac":"Her modül, servis, arayüz ve ortak varlığın sahibi ekibin (kişi değil) makinece okunabilir bir katalogda tutulması. Ajan değişikliklerinde dört rolün ayrı kaydı: işi başlatan, ajanı yönlendiren, değişikliği onaylayan ve değişen alanın sahibi ekip. Ajanın hiçbir rolde sahip olamaması. İnceleme yönlendirmesinin bu katalogdan yapılması. Sahipsiz alanların tespit edilip sahiplendirilmesi.","cozulecek_sorun":"Sahiplik dağıldıkça ve düşük uzmanlıklı katkı arttıkça hata oranı artar; ajanlar ise herkesin her yere kolayca dokunmasını sağlar. Sürüm kaydındaki yazar alanı artık anlamayı ya da sahipliği göstermiyor.","yetenek_siniflari":["Y-55","Y-33","Y-25"],"zorunluluk":"zorunlu","olcek_etkisi":"Tek ekipte örtük sahiplik yeterli olabilir; 2+ ekipte katalog olmadan inceleme yönlendirmesi ve sorumluluk dağılır.","kabul_olcutleri":["Kod tabanının %100'ü bir sahip ekibe eşlenmiş; sahipsiz alan sayısı raporlanıyor.","Her ajan değişikliği dört rol alanını taşıyor; alan sahibi onayı olmayan dış değişiklik birleşemiyor.","Yeniden yapılanmada sahip ekip değişikliği katalogda aynı gün güncelleniyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-274","S-268","S-267"],"not":"Büyük bir işletim sistemi kod tabanında düşük uzmanlıklı katkıcı sayısı ve baş sahiplik oranı, yayın öncesi ve sonrası hatalarla ilişkili bulundu. Ajan kodunda yazarlık artık anlamayı göstermiyor. Benzer mevcut ihtiyaç: N-K25-004; fark: N-K25-004 her ajan çıktısına bir insan sahibi ister, N-K24-008 yalnız sıcak nokta dosyalarına sahip atar. Alan düzeyinde ekip sahipliği kataloğu ve dört rolün ayrımı yok."},"cember":"dis_eksik","belirsizlik":"dusuk","bagimliliklar":["N-K25-004"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-002","baslik":"Hesap verebilirliğin gerçek kontrol koşuluna ve 'görev yerine getirildi' kanıtına bağlanması","ihtiyac":"Bir insanın ajan çıktısından sorumlu tutulabilmesi için yeterli bilgi, süre ve yetkiye sahip olması gerektiğinin tanımlanması. Onaylayanın hangi doğrulama görevlerini fiilen yerine getirdiğinin kayda geçmesi: neye baktığı, neyi test ettiği, neyi kapsam dışı bıraktığı. Olay sonrası analizlerde önce sistem tasarımının (otonomi düzeyi, bilgi sunumu, zaman baskısı) incelenmesi. Bu koşullar sağlanmadan verilen onayın sistem sahibinin riski sayılması.","cozulecek_sorun":"Otomasyon hatalarında sorumluluk, sistem üzerinde sınırlı kontrolü olan en yakın insana yüklenebilir ('ahlaki ezilme bölgesi'). Sağlayıcı şartları sorumluluğu kullanıcıya yükler ve platformlar olayları kaydeder; ama hiçbir kayıt doğrulama görevinin fiilen yapıldığını göstermez.","yetenek_siniflari":["Y-28","Y-31"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça ekipler arası onay zincirleri uzar; kontrol koşulu her halkada aranmalı.","kabul_olcutleri":["Onay kayıtlarında yerine getirilen doğrulama görevleri alanı zorunlu.","Olay sonrası analiz şablonunda 'onaylayanın kontrol koşulları sağlanmış mıydı?' sorusu var.","Kontrol koşulları sağlanmadan verilen onaylar ayrıca raporlanıyor ve sistem değişikliğini tetikliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-202","S-267","S-290"],"not":"121 belge analizi: şartlar görevi ve sonucu çıktıya bağlıyor, platform olayları kaydediyor, ama hiçbir şey görevin yerine getirildiğini kaydetmiyor. 'Ahlaki ezilme bölgesi' kavramı otomasyon kazalarından çıkarıldı. Benzer mevcut ihtiyaç: N-K17-002; fark: N-K17-002 onayı kimliğe ve içeriğe bağlar, N-K17-006 onay ekranında gösterilecek bilgileri ister. Hesap verebilirliğin kontrol koşulları, görevin yerine getirildiğinin kanıtı ve suçlamasız analiz kuralı tanımlı değil."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K17-002"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-003","baslik":"Ekip sınırını aşan ajan değişiklikleri için protokol ve 'alanın kuralı geçerlidir' ilkesi","ihtiyac":"Bir ekibin ajanı başka ekibin alanında değişiklik yapmak zorunda kaldığında izinli yolların tanımlanması: sahip ekibe talep açmak; iç kaynak katkısı ve sahip ekibin güvenilir inceleyicisinin onayı; ya da işi sahip ekibin kendi ajanıyla yapması. Değişikliğe sahip alanın kural katmanının ve kalite eşiklerinin uygulanması. Sahip ekibin önceden bilgilendirilmesi. Ajanların başka ekibin backlog'una ancak tanımlı kanaldan ve insan onayıyla kayıt açabilmesi. Sınır aşan değişiklik oranının ve bekleme süresinin ölçülmesi.","cozulecek_sorun":"Ajanlar başka ekiplerin kodunu değiştirmeyi çok ucuzlatır. Farklı ajanların eşzamanlı değişikliklerinde çakışma oranı, aynı ajanın örnekleri arasındakinin yaklaşık iki katı. Başlatan ekibin kuralları uygulanırsa alanın tutarlılığı bozulur.","yetenek_siniflari":["Y-55","Y-33","Y-09"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip sayısı ve ortak kod arttıkça sınır aşan değişiklik oranı ve çakışma artar.","kabul_olcutleri":["Sınır aşan değişiklik yolları çalışma sisteminde yazılı.","Sahip ekip onayı olmayan sınır aşan değişiklik birleşemiyor.","Değişikliğe başlatan ekibin değil, alanın kural katmanı uygulanıyor.","Sınır aşan değişikliklerin bekleme süresi ölçülüyor ve bir hedefi var."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-271","S-279","S-274"],"not":"33.596 ajan değişiklik önerisinde eşzamanlı çiftlerin birleştirme tekrarı: farklı ajanlar arası %41,7, aynı ajan içi %19,8 metinsel çakışma. İç kaynak kalıpları dış katkıyı güvenilir katkıcı incelemesine bağlıyor. Benzer mevcut ihtiyaç: N-K24-008; fark: N-K24-008 ortak sıcak nokta dosyalarına tek sahip atar, N-K11-003 kural katmanlarını tanımlar. Başka ekibin alanına ajan değişikliğinin yolu ve hangi kuralın geçerli olduğu tanımlı değil."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","bagimliliklar":["N-K24-008"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-004","baslik":"Ortak kural ve yetenek paketi deposuna iç kaynak katkı modeli","ihtiyac":"10+ ekibin ortak kurallara ve yetenek paketlerine katkısının iç kaynak ilkeleriyle yönetilmesi. Öğeler: katkı rehberi; her paket için güvenilir katkıcı/bakımcı rolü; katkı inceleme süresi hedefi; ölçüm (değerlendirme) kanıtı olmadan birleştirmeme; ekip çatallarının ortak depoya geri kazandırılma yolu; eskitme ve kaldırma süreci; katkıların görünür biçimde tanınması.","cozulecek_sorun":"Merkezi ekip tüm paketleri yazamaz. Katkı yolu yoksa her ekip kendi kopyasını üretir, kurallar sapar ve iyi uygulama yayılmaz. İç kaynak yeniden kullanımı ve bilgi paylaşımını artırır, ama açık roller ve tanıma olmadan sürmez.","yetenek_siniflari":["Y-08","Y-33","Y-29"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip sayısı arttıkça merkezi düzenleme darboğaza dönüşür; katkı modeli olmadan çatal sayısı ekip sayısıyla büyür.","kabul_olcutleri":["Katkı rehberi ve her paketin güvenilir katkıcıları yayımlanmış.","Katkı inceleme süresi ölçülüyor ve hedefe uyuluyor.","Ekip çatallarının sayısı ve ortak depoya dönüş oranı izleniyor.","Ölçülmüş etki kaydı olmayan katkıların birleşmediği denetlenmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-279","S-280","S-281"],"not":"İç kaynak literatür taraması yeniden kullanım ve bilgi paylaşımı faydalarını raporluyor. Ajanların kullandığı kurumsal bilgi birimleri için 'bilgi müştereği' bakım pratiği öneriliyor. Benzer mevcut ihtiyaç: N-K11-005; fark: N-K11-005 paketlerin sahibini ve sürümünü, N-K11-004 etkinliğini ister. Çok ekipli katkı süreci, bakımcı rolü ve çatal yönetimi yok."},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"3+ ekip","bagimliliklar":["N-K11-005"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-005","baslik":"Ekipler arası ajan çakışmalarının iş başlamadan tespiti ve kademeli çözüm yolu","ihtiyac":"Ekiplerin ve ajanların hangi alanda, hangi niyetle çalıştığını iş başlamadan gösteren bir üstlenme kaydı. Başlatma öncesinde yinelenen işin, aynı alana eşzamanlı değişikliğin ve çelişen hedeflerin tespiti. Tespit edilen çakışma için kademeli çözüm yolu (ilgili ekipler → ART mimarı/ürün yönetimi → portföy) ve süre hedefi. Bir ekibin ajanının diğer ekibin değişikliğini geri almasının yasaklanması. Çakışma türlerinin ölçülmesi: yineleme, anlamsal çelişki, ortak kaynak rekabeti, kural çelişkisi.","cozulecek_sorun":"Birleştirilemeyen ajan değişikliklerinin başlıca nedenlerinden biri, aynı işin başka bir değişiklikle zaten çözülmüş olması. Koordinasyon olmadığında eşzamanlı ajanların yaptığı işin büyük kısmı bir başkasının işini yeniden yapmak olabiliyor. Ajanlar arası bilgi akışı kopuklukları çok ajanlı sistem hatalarının ana sınıflarından biri.","yetenek_siniflari":["Y-56","Y-33","Y-13"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip ve eşzamanlı ajan sayısıyla çakışma olasılığı kombinatoryal artar.","kabul_olcutleri":["Ajan işi başlamadan önce üstlenme kaydında aynı alan ve niyet kontrolü yapılıyor.","Yinelenen iş oranı ve ekipler arası çakışma sayısı türüne göre raporlanıyor.","Çözüm yolu ve süre hedefi yazılı; hedef aşımları eskale ediliyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-272","S-270","S-271","S-113","S-273"],"not":"Git tabanlı üstlenme kaydıyla ekip arkadaşının işini yeniden yapma payı %78'den %0'a indi (ön-baskı). Birleştirilmeyen ajan değişikliklerinin sık nedenlerinden biri sorunun başka değişiklikle çözülmüş olması. İnsan ekiplerde de çakışmaların sık, kalıcı ve derleme/test hatası olarak ortaya çıktığı biliniyor. Benzer mevcut ihtiyaç: N-K06-002; fark: N-K06-002 çakışmayı birleştirme anında, N-K24-003 planlanmış bağımlılıkları, N-K04-005 ekip içi paralel uygulayıcıları ele alır. Ekipler arası iş öncesi üstlenme görünürlüğü ve kademeli çözüm yolu yok."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"2+ ekip","bagimliliklar":["N-K06-002"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-006","baslik":"Ajan yeteneklerinin ekip topolojisindeki yeri ve ekipler arası etkileşim modları","ihtiyac":"Dört ekip tipinin ajanlı karşılıklarının tanımlanması. Akışa hizalı ekipler ajanları kullanır. Platform ekibi ajan yeteneklerini self servis hizmet olarak sunar. Etkinleştirici ekip ajanla çalışma pratiklerini öğretir. Karmaşık alt sistem ekipleri uzmanlık gerektiren alanlar için özel kural/paket ve ajan yapılandırması sağlar. Her ekipler arası ilişki için etkileşim modunun (iş birliği, hizmet olarak, kolaylaştırma) ve süresinin belirlenmesi. Ekip arayüzünün (sunulan hizmetler, iletişim, kurallar) katalogda yayımlanması.","cozulecek_sorun":"Tip ayrımı yapılmazsa her ekip kendi ajan altyapısını kurar ya da platform ekibi tüm ekiplerin içine gömülür; etkinleştirici destek kalıcı bağımlılığa dönüşür. Ajanlar ekiplerin daha geniş uçtan uca kapsamı üstlenmesini sağlar, ama bu ekip sınırlarını ve arayüzlerini yeniden tasarlamayı gerektirir.","yetenek_siniflari":["Y-55","Y-39"],"zorunluluk":"olcege_bagli","olcek_etkisi":"10+ ekipte etkileşim modları tanımsızsa platform ve etkinleştirici ekipler talep altında ezilir.","kabul_olcutleri":["Her ekibin tipi ve ekipler arası ilişkilerin etkileşim modu kayıtlı.","Etkinleştirici ilişkilerin bitiş ölçütü ve süresi var.","Platformun ajan hizmetlerinde self servis kullanım oranı ve destek talebi hacmi izleniyor."],"kanit":{"duzey":"cikarim","kaynaklar":["S-094","S-277","S-278"],"not":"Ekip topolojisi modeli uygulayıcı rehberidir. Ajanlı karşılıkları sektör yazılarından ve çıkarımdan türetildi; hakemli ölçüm yok. Benzer mevcut ihtiyaç: N-K24-004; fark: N-K24-004 ajan platformunun bir platform/etkinleştirici ekipçe sahiplenilmesini ister. Dört ekip tipinin ajanlı karşılıkları, etkileşim modları ve ekip arayüzü tanımlı değil."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"3+ ekip","bagimliliklar":["N-K24-004"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-007","baslik":"Ekip bilişsel yükünün ölçülmesi ve sorumluluk alanının buna göre ayarlanması","ihtiyac":"Ajan kullanımıyla genişleyen ekip sorumluluk alanının (daha çok servis, daha çok teknoloji yığını, 'tam yığın' işler) ekip bilişsel yüküyle birlikte dönemsel değerlendirilmesi. Yükün üretimden doğrulama, entegrasyon ve muhakemeye kaydığının ölçülmesi. Eşik aşıldığında alanın bölünmesi, platforma devri ya da kapsamın daraltılması. Ekip alanının yalnız 'ajan üretiyor' diye ölçümsüz büyütülmemesi.","cozulecek_sorun":"Üretim ucuzlarken doğrulama, entegrasyon ve karar pahalılaşıyor; bilişsel yük yok olmuyor, yer değiştiriyor. Yazılım profesyonelleri ajan benimsenmesinden sonra bilişsel yük ve iş yükünün yoğunlaştığını bildiriyor. Mühendisler uzmanlık alanları dışındaki işleri de üstleniyor.","yetenek_siniflari":["Y-57","Y-55"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Etki birikimlidir; ekip sayısı sabitken kapsam büyüdükçe görünür hale gelir.","kabul_olcutleri":["Her ekip için dönemsel bilişsel yük değerlendirmesi (anket + alan büyüklüğü göstergeleri) var.","Eşiği aşan ekipler için alan düzenleme kararı kayıtlı.","Ekip başına sahip olunan alan sayısındaki değişim bilişsel yük verisiyle birlikte raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-283","S-285","S-238","S-277"],"not":"21 görüşmeli vaka çalışması bilişsel yük ve iş yükünde yoğunlaşma raporluyor. Bir yapay zekâ şirketinin iç araştırması mühendislerin 'tam yığın' hale geldiğini gösteriyor. Geliştirici deneyimi çerçevesi bilişsel yükü temel boyut sayıyor."},"cember":"dis_eksik","belirsizlik":"orta","olcek_esigi":"zamanla (3–6 ay)","kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-008","baslik":"Sosyo-teknik uyumun izlenmesi: Conway etkisi ve ajan kaynaklı mimari kayma","ihtiyac":"Kod bağımlılıklarının gerektirdiği koordinasyon ile ekiplerin gerçek iletişim ve sahiplik yapısı arasındaki uyumun dönemsel ölçülmesi. Ajanların modül sınırlarını kolayca aşmasından ve ekip-özel kural setlerinden doğan mimari kaymanın izlenmesi: sınır ihlalleri, ekipler arası farklı konvansiyonlar, gizli bağımlılıklar. Hedef mimariye göre ekip yapısını bilinçli ayarlama (ters Conway manevrası) kararlarının mimari karar kaydına bağlanması.","cozulecek_sorun":"Sistem mimarileri onları üreten kurumun iletişim yapısını yansıtır. Bağımlılık ile koordinasyon arasındaki uyumsuzluk görev süresini uzatır ve hatayı artırır. Ajanlar iletişim gerektirmeden sınır ötesi değişiklik yapabildiği için mimari ile organizasyon arasındaki uyum sessizce bozulabilir.","yetenek_siniflari":["Y-14","Y-39","Y-55"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip ve modül sayısı arttıkça uyumsuzluğun maliyeti ve görünmezliği artar.","kabul_olcutleri":["Sosyo-teknik uyum göstergesi (bağımlılığı olduğu hâlde iletişimi olmayan ekip çiftleri) her PI hesaplanıyor.","Modül sınırı ihlallerinin eğilimi raporlanıyor.","Ekip yapısı değişikliklerinin mimari etkisi karar kaydında değerlendirilmiş."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-275","S-276"],"not":"Sosyo-teknik uyum arttıkça görev tamamlama süresi kısalıyor. Ajanların bu uyumu nasıl etkilediği ölçülmemiş; o kısım çıkarım. Benzer mevcut ihtiyaç: N-K03-001; fark: N-K03-001 teknik ilişki haritasını ister. Bu haritanın ekip yapısıyla karşılaştırılması ve örgüt tasarımına geri bildirimi yok."},"cember":"dis_eksik","belirsizlik":"yuksek","olcek_esigi":"3+ ekip","bagimliliklar":["N-K03-001"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-009","baslik":"İnsan–ajan pratikleri için uygulama toplulukları ve ekipler arası bilgi akışı","ihtiyac":"Disiplin bazlı uygulama topluluklarının (test, ön yüz, arka uç, güvenlik, veri) ajanla çalışma pratiklerini, başarısızlık örneklerini ve etkili kalıpları ekipler arasında paylaşması. Toplulukların ortak kural/paket deposuna katkı kanalı olması. Topluluk ritmi, kolaylaştırıcısı ve katılım için ayrılmış zaman. İnsanlar arası yardımlaşmanın (soru sorma, eşli inceleme) ajan varken de sürmesini sağlayan düzenli alanlar.","cozulecek_sorun":"Kod asistanına erişim, geliştiricileri daha özerk ve daha az iş birlikçi çalışmaya kaydırıyor. Halka açık bilgi paylaşım platformlarında katkı belirgin düştü. Kurum içinde de 'ilk durak' ajan olduğunda gençler daha az soru soruyor; bilgi insanlar arasında dolaşmıyor, iyi uygulamalar ekip içinde kalıyor.","yetenek_siniflari":["Y-37","Y-11","Y-08"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip sayısı arttıkça ekipler arası öğrenme kendiliğinden gerçekleşmez; yapılandırılmış kanal gerekir.","kabul_olcutleri":["En azından temel disiplinler için topluluk, kolaylaştırıcı ve ritim tanımlı.","Topluluklardan ortak depoya gelen katkı sayısı izleniyor.","Ekipler arası bilgi akışı göstergesi (ör. başka ekipten yanıt alan soru oranı) zaman içinde düşmüyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-260","S-261","S-238","S-254"],"not":"Sohbet tabanlı dil modelinin yayılmasından sonra altı ayda halka açık soru-cevap etkinliği karşılaştırma platformlarına göre %25 düştü. Bir yapay zekâ şirketinin iç araştırmasında mühendisler gençlerin daha az soru sorduğunu bildiriyor. Benzer mevcut ihtiyaç: N-K25-005; fark: N-K25-005 rol bazlı eğitim sunar. Ekipler arası sürekli pratik paylaşımı ve iş birliği erozyonuna karşı bir yapı yok."},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"3+ ekip","bagimliliklar":["N-K25-005"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-010","baslik":"Ajan kaynaklı ramak kala olaylarının ve derslerin ekipler arası suçlamasız yayılması","ihtiyac":"Üretime ulaşmamış ajan sorunlarının (test zayıflatma girişimi, istem enjeksiyonu denemesi, yanlış öz-rapor, yanlış mimari yön) ramak kala olarak kolayca bildirilmesi. Bildirenin ve ajanı başlatanın cezalandırılmaması. Öğrenme incelemelerinin aranabilir bir kütüphanede tutulması ve düzenli olarak tüm ekiplere özetlenmesi. Aynı sınıf sorunun başka ekipte tekrarının izlenmesi.","cozulecek_sorun":"Olay analizi yalnız üretim olaylarına odaklanırsa ajanların ürettiği ramak kala sinyalleri ekip içinde kaybolur; aynı hata sınıfı başka ekiplerde tekrarlanır. Suçlama korkusu bildirim oranını düşürür.","yetenek_siniflari":["Y-37","Y-28","Y-11"],"zorunluluk":"olcege_bagli","olcek_etkisi":"Ekip sayısı arttıkça bir ekibin dersi başka ekipte önlenebilir olay sayısını doğrudan azaltır.","kabul_olcutleri":["Ramak kala bildirimi bir dakikadan kısa sürüyor; bildirim sayısı izleniyor.","Öğrenme incelemeleri aranabilir ve ekiplere düzenli özetleniyor.","Aynı hata sınıfının ekipler arası tekrar oranı raporlanıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-290","S-309"],"not":"Büyük ölçekli işletim pratiği: suçlamasız, kurum içinde yaygın paylaşılan olay analizleri ve ekipler arası eğilim analizi. Ajan ramak kalalarına uygulanması çıkarım. Benzer mevcut ihtiyaç: N-K08-006; fark: N-K08-006 olay ve kök neden derslerini kurallara aktarır. Ramak kala bildirimi, suçlamasızlık güvencesi ve ekipler arası yayma yok."},"cember":"dis_eksik","belirsizlik":"dusuk","olcek_esigi":"2+ ekip","bagimliliklar":["N-K08-006"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K31-011","baslik":"Dağıtık ve hibrit ekiplerde insan–ajan eşgüdümü ve eşzamansız devir standardı","ihtiyac":"Ajan koşularının ve insan kararlarının farklı konum, saat ve çalışma düzenlerine göre yönlendirilmesi. Öğeler: karar bekleyen işin o an erişilebilir yetkili insana gitmesi; onay ve karar için tanımlı ortak zaman pencereleri; eşzamansız devirde standart bir devir notu (durum, bekleyen karar, riskler, sonraki adım); mesai dışı bildirimlerin çalışma anlaşmasındaki sınırlara uyması; uzaktan çalışanların ajan araçlarını kullandığı ortamda işverenin veri koruma ve bilgilendirme yükümlülüklerinin karşılanması; uzaktan çalışanların ekipler arası ağdan kopmasının izlenmesi.","cozulecek_sorun":"Kurum genelinde uzaktan çalışma iş birliği ağlarını daha durağan ve silolu yaptı, iletişimi eşzamansıza kaydırdı; ajanlar bu eğilimi güçlendirebilir. Onay bekleyen ajan işi, yetkili çevrimdışıyken günlerce bekleyebilir. Türkiye'de uzaktan çalışmada veri koruma tedbirleri işverenin sorumluluğundadır.","yetenek_siniflari":["Y-31","Y-12","Y-11"],"zorunluluk":"kosullu","olcek_etkisi":"Konum ve saat dilimi çeşitliliği arttıkça bekleme süresi ve devir kaybı büyür.","kabul_olcutleri":["Karar bekleyen işlerin yetkili ve erişilebilir kişiye yönlendirilme kuralı var; bekleme süresi konuma göre ayrıştırılabiliyor.","Devir notu şablonu tek ve kullanılıyor.","Mesai dışı ajan bildirimlerinin hacmi ölçülüyor ve anlaşmadaki sınırı aşmıyor.","Uzaktan çalışma sözleşmelerinde veya eklerinde ajan araçlarının kullanımı ve veri koruma kuralları yer alıyor."],"kanit":{"duzey":"arastirma","kaynaklar":["S-094","S-289","S-304"],"not":"61.182 çalışanlık doğal deneyde kurum geneli uzaktan çalışma iş birliği ağlarını silolu ve durağan yaptı. 10 Mart 2021 tarihli Uzaktan Çalışma Yönetmeliği veri koruma tedbirlerini işverene yüklüyor. Benzer mevcut ihtiyaç: N-K17-004; fark: N-K17-004 bekleme süresi ve eskalasyon ister. Konum ve saat farkına göre yönlendirme, eşzamansız devir standardı ve uzaktan çalışma hukuku boyutu yok."},"cember":"dis_eksik","belirsizlik":"orta","bagimliliklar":["N-K17-004"],"kume":"K31","alan":"D-organizasyon-ve-olcek"},{"id":"N-K32-001","baslik":"Ajan telemetrisi ve çalışan verisinde amaç sınırlaması, ölçülülük ve aydınlatma","ihtiyac":"Ajan izleri, istem kayıtları ve kullanım verisinin çalışanlara ilişkin kısmının hangi amaçlarla (güvenlik, denetim, hat iyileştirme, maliyet) işlenebileceğinin yazılı olarak sınırlanması. Varsayılan raporlamanın ekip düzeyinde toplulaştırılmış olması. Bireysel düzey erişimin yalnız tanımlı durumlarda, gerekçeyle ve kayıt altında yapılması. Çalışanlara önceden, açık ve eksiksiz aydınlatma yapılması. İstihdam ilişkisindeki güç dengesizliği nedeniyle açık rızaya dayanılmaması. Daha az müdahaleci bir alternatifin tercih edildiğinin ölçülülük değerlendirmesiyle belgelenmesi.","cozulecek_sorun":"Ajan telemetrisi ayrıntı düzeyi nedeniyle fiilen bir çalışan izleme sistemine dönüşebilir. Kişisel Verileri Koruma Kurulu 2026 ilke kararında istihdam ilişkisinde rızanın özgür iradeye dayanmadığını ve daha az müdahaleci yöntem varken invaziv yöntemin ölçülülüğe aykırı olduğunu belirtti. Anayasa Mahkemesi ve AİHM kararları önceden, açık ve eksiksiz bilgilendirmeyi koşul sayıyor.","yetenek_siniflari":["Y-36","Y-28","Y-59"],"zorunluluk":"zorunlu","olcek_etkisi":"Ekip sayısı arttıkça toplulaştırma eşiği (asgari grup büyüklüğü) daha kolay sağlanır; küçük ekiplerd
