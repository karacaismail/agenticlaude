 görevin normalizasyonu","orch":"Temporal toplu iş akışı","worker":"PydanticAI tipli ajan"},{"stage":"A1","name":"/startask komutu","orch":"Plane webhook → Temporal","worker":"—"},{"stage":"A2","name":"Araştırma, task spec, DoR","orch":"Temporal (en fazla 2 döngü)","worker":"OpenHands / Claude Code salt-okunur + Context7 MCP"},{"stage":"A3","name":"İlişki haritası, kümeleme","orch":"Temporal child workflow","worker":"Kod grafiği + networkx; LLM yorumu"},{"stage":"A4","name":"Plan ve plan incelemesi","orch":"Temporal Signal/Update","worker":"Farklı model ailesinden hakem + insan"},{"stage":"B","name":"TDD: RED → GREEN → REFACTOR","orch":"Temporal aktivitesi (heartbeat)","worker":"Claude Code / Codex / OpenHands"},{"stage":"G","name":"Deterministik kapılar","orch":"GitHub Actions","worker":"Yapay zekâ yok"},{"stage":"C","name":"Bağımsız QA","orch":"Temporal (en fazla 2 tur)","worker":"Farklı sağlayıcı + mutation testing"},{"stage":"R","name":"Risk sınıfı ve onay","orch":"Temporal Signal/Update","worker":"İnsan; bildirim n8n/Slack"},{"stage":"E","name":"Alpha → Beta → RC → Prod","orch":"Mevcut CI/CD","worker":"—"},{"stage":"L","name":"Öğrenme, yönerge iyileştirme","orch":"Zamanlanmış Temporal iş akışı","worker":"Hermes skill önerisi → eval → PR"}]},{"type":"linkgrid","items":[{"title":"İdeal kurgu","text":"Panolardan çıkan mimari ve iki çekirdek çelişkisinin çözümü.","href":"#/ideal-kurgu"},{"title":"Pipeline aşamaları","text":"Her aşama bir API uç noktası gibi: girdi, çıktı, hata kodları.","href":"#/pipeline"},{"title":"Araç kataloğu","text":"Letta, goose, OpenHands, n8n ve 120’den fazla araç; filtrelenebilir.","href":"#/katalog"},{"title":"Pano bulguları","text":"Otomasyondan önce kapatılması gereken 7 tutarsızlık.","href":"#/bulgular"}]}]},"ideal-kurgu":{"title":"İdeal kurgu (panolara göre)","summary":"Panoların tarif ettiği hat, bileşenleri ve panolar arasındaki çekirdek çelişkisinin çözümü.","blocks":[{"type":"hero","eyebrow":"Mimari","title":"Panoların tarif ettiği hat","lede":"STARK panosunun başlık satırı kurguyu tek cümlede veriyor: Temporal durum, bütçe ve devamı yönetir; ajan çalışanı OpenHands, Claude Code, Codex veya Hermes’tir; model API görev politikasından seçilir; 4 görev sorumlusu vardır ve kişi başına 1 aktif iş yürür. Bu sayfa o cümleyi bileşenlere ayırıyor ve eksik kalan yerleri tamamlıyor."},{"type":"quote","text":"TEMPORAL: durum + bütçe + devam • AJAN ÇALIŞANI: OpenHands / Claude Code / Codex / Hermes • MODEL API: görev politikasındaki sağlayıcı • 4 görev sorumlusu, kişi başına 1 aktif iş","cite":"TDD/tdd-mcp.pdf · STARK / Önerilen başlangıç politikası"},{"type":"heading","text":"Akış"},{"type":"flow","rows":[{"label":"Giriş","nodes":[{"title":"Plane","sub":"Sprint, assignee, AC kimlikleri","kind":"human"},{"title":"/startask","sub":"Webhook imzası + kullanıcı doğrulama","kind":"event"},{"title":"Temporal: run başlat","sub":"AC sürümü + SHA + run_id + bütçe sabitlenir","kind":"state"}]},{"label":"Hazırlık","nodes":[{"title":"Araştırma + task spec","sub":"Kod tabanı + web, en fazla 2 döngü","kind":"agent"},{"title":"DoR + ilişki haritası","sub":"Kod grafiği, kümeler, bağımlılık sırası","kind":"auto"},{"title":"Plan + inceleme","sub":"Farklı model hakemi; belirsizse WAITING_FOR_PO","kind":"human"}]},{"label":"Geliştirme","nodes":[{"title":"RED","sub":"Test yazılır, beklenen nedenle kırmızı olduğu kanıtlanır","kind":"agent"},{"title":"GREEN","sub":"En küçük kod; yeni + ilgili testler","kind":"agent"},{"title":"Deterministik kapılar","sub":"Derleme, lint, güvenlik, a11y, performans","kind":"auto"},{"title":"REFACTOR","sub":"Tek temizlik turu; bozarsa geri al","kind":"agent"}]},{"label":"Doğrulama","nodes":[{"title":"Bağımsız QA","sub":"Senaryolar AC’den; kodlayanın iddiası kanıt sayılmaz","kind":"agent"},{"title":"Risk sınıfı","sub":"Yasaklı / Yüksek → insan; Orta / Düşük → devam","kind":"human"},{"title":"READY_FOR_ALPHA","sub":"Kanıt paketi: AC + test sürümü + SHA + digest","kind":"state"}]},{"label":"Yayın","nodes":[{"title":"Alpha → Beta → RC → Prod","sub":"Mevcut CI/CD; test ortamı değildir","kind":"auto"},{"title":"Geri besleme","sub":"Bulgu → bağlantılı bug → DEV’de regresyon testi → A1","kind":"event"}]}],"legend":[{"kind":"human","label":"İnsan kararı"},{"kind":"agent","label":"Ajan"},{"kind":"auto","label":"Deterministik"},{"kind":"state","label":"Temporal durumu"},{"kind":"event","label":"Olay"}]},{"type":"heading","text":"Katmanlar"},{"type":"prose","text":"Soruda n8n, Flowise, Langflow, AutoGen, Letta, goose, Temporal ve Hermes aynı listede. Oysa bunlar farklı katmanların araçları. Her katmanın tek bir sorumluluğu var; görev durumu yalnızca L1’de tutulur."},{"type":"layers","items":[{"tag":"L0","name":"İş kaynağı","desc":"Görev, kabul kriteri, insan kararı","tools":["Plane","Plane MCP (resmi, Python)"],"tone":"neutral"},{"tag":"L1","name":"Süreç orkestratörü","desc":"Durum, bütçe, bekleme, devam, denetim izi","tools":["Temporal"],"alt":"alternatif: DBOS · Restate · Hatchet · Inngest","tone":"accent"},{"tag":"L2","name":"Ajan çalıştırıcısı","desc":"Dosya, terminal, tarayıcı ile gerçek iş","tools":["Claude Code","Codex CLI","OpenHands SDK","Hermes Agent"],"alt":"aday: goose · OpenCode · Aider","tone":"violet"},{"tag":"L3","name":"Tipli ajan kütüphanesi","desc":"Sınıflandırma, DoR, rapor gibi kısa ajanlar","tools":["PydanticAI"],"alt":"muadil: OpenAI Agents SDK · dar kullanım: LangGraph","tone":"violet"},{"tag":"L4","name":"Deterministik motorlar","desc":"LLM’in karar vermediği işler","tools":["OpenFGA","networkx","Kod grafiği (Graphify / SCIP)","git worktree"],"tone":"success"},{"tag":"L5","name":"Kalite kapıları","desc":"Geçer ya da kalır; yorum yok","tools":["GitHub Actions","Semgrep / CodeQL","Playwright","Stryker / PIT","axe","k6"],"tone":"success"},{"tag":"L6","name":"Bağlam","desc":"Ajanın okuduğu kurallar ve kaynaklar","tools":["MCP","Context7","AGENTS.md","agent.kurallar.md","skills/","ADR"],"tone":"neutral"},{"tag":"L7","name":"Gözlem ve eval","desc":"Maliyet, iz, kalite ölçümü","tools":["OpenTelemetry","Langfuse","Temporal UI","Promptfoo / Inspect"],"tone":"neutral"},{"tag":"L8","name":"Yapıştırıcı","desc":"Kritik yolun dışında","tools":["n8n (bildirim)","Dify / Langflow (iç araç, RAG)"],"tone":"warning"}]},{"type":"heading","text":"İki çekirdek çelişkisi","id":"iki-cekirdek-celiskisi"},{"type":"prose","text":"STARK panosu durumu, bütçeyi ve devamı **Temporal**’a veriyor. Ajan-sağlayıcı panosu (“Tüm ajanlar hangi sağlayıcı yönetir ve neden?”) ise akışı, tekrarları, blocker ve insan onayını **LangGraph**’a veriyor ve bunu “üretimde tek orchestration çekirdeğini korur” diye gerekçelendiriyor. İki pano aynı işi iki farklı sisteme bırakıyor."},{"type":"compare","columns":["Temporal çekirdek","LangGraph çekirdek"],"rows":[{"label":"Günlerce süren PO / insan bekleyişi","values":[{"score":3,"text":"Dayanıklı zamanlayıcı + Signal/Update"},{"score":2,"text":"interrupt + Postgres checkpointer; zamanlayıcı ayrıca kurulur"}]},{"label":"Görev başına bütçe ve sayaç","values":[{"score":3,"text":"İş akışı durumu; replay ile korunur"},{"score":2,"text":"Graph state; birden çok graf arasında toplam bütçe elle"}]},{"label":"Uzun süren kodlama adımı (30–120 dk)","values":[{"score":3,"text":"Activity heartbeat, zaman aşımı, iptal yayılımı"},{"score":1,"text":"Düğüm içinde; çökme sonrası düğüm baştan"}]},{"label":"Çalışan filosu ve kuyruk","values":[{"score":3,"text":"Task queue, yatay ölçek"},{"score":1,"text":"Kütüphane; kuyruk ve worker ayrıca gerekir"}]},{"label":"Ajan içi dallanma (6 perspektif gibi)","values":[{"score":2,"text":"Paralel aktiviteler; kod olarak yazılır"},{"score":3,"text":"Conditional edge ile doğal"}]},{"label":"Ekibin öğrenme maliyeti","values":[{"score":1,"text":"Determinizm kuralı, versiyonlama"},{"score":2,"text":"Python/TS kütüphanesi; tanıdık"}]}],"note":"Puanlar bu hattın ihtiyaçlarına göre göreli değerlendirmedir; genel bir sıralama değildir."},{"type":"callout","tone":"success","title":"Çözüm","text":"**Tek durum sahibi Temporal.** LangGraph yalnızca tek bir aktivitenin içinde, çok dallı analiz gereken yerlerde (edge-case.agent’ın 6 perspektifi gibi) ve kalıcı checkpointer olmadan kullanılabilir. Çoğu ajan için PydanticAI yeterli; PydanticAI’nin Temporal entegrasyonu model ve araç çağrılarını zaten dayanıklı aktivitelere çeviriyor. Panodaki “blocker / human approval → LangGraph” satırı Temporal Signal/Update ile değiştirilmeli."},{"type":"heading","text":"Kurallar nerede yaşar?"},{"type":"kv","items":[{"k":"rules.master.agent","v":"Panoda “orkestra şefi”. Yönlendirme **önerir** (frontend mi backend mi, hangi alt ajan). Durum geçişi, sayaç ve kapı kararı Temporal iş akışı kodundadır."},{"k":"agent.kurallar.md / AGENTS.md","v":"Her ajanın sınırı ve görev tanımı. Rules deposunda sürümlenir; değişiklik PR + eval ile girer."},{"k":"skills/","v":"Tekrar eden prosedürler (ör. TDD skill’i). Hat modunda salt-okunur. Hermes’in ürettiği skill’ler yalnızca öneri olarak gelir."},{"k":"ADR","v":"Teknoloji sınırı kararları. technology-boundary.agent önce buraya bakar: “çözülmüş probleme ikinci teknoloji ekleme”."},{"k":"policy.yaml","v":"Deneme, süre, maliyet tavanları. Panolarda dağınık olan sayılar burada tekleşir; run başında sabitlenir."},{"k":"MCP","v":"Plane, GitHub, Context7, dokümanlar. Tüm çalıştırıcılara aynı araç arayüzü."}]}]},"kavramlar":{"title":"Kavramlar","summary":"Bu referansta kullanılan terimler ve hattaki karşılıkları.","blocks":[{"type":"hero","eyebrow":"Başlangıç","title":"Kavramlar","lede":"Araç tartışmalarının çoğu terim karışıklığından çıkıyor. Aşağıdaki tanımlar Wikipedia’nın ilgili maddelerine dayanıyor; ikinci sütun her kavramın bu hatta ne anlama geldiğini söylüyor."},{"type":"heading","text":"Ajan mimarisi"},{"type":"table","columns":[{"key":"term","label":"Kavram","kind":"code"},{"key":"def","label":"Tanım"},{"key":"here","label":"Bu hatta"}],"rows":[{"term":"Agent harness","def":"Bir LLM’i ajan yapan yazılım altyapısı: araç çağırma, hafıza ve durum, izole çalışma alanı, bağlam yönetimi, izin ve onay katmanları. Özetle **ajan = model + harness**.","here":"L2 çalıştırıcılar: Claude Code, Codex, OpenHands, Hermes, goose. Hermes bu yüzden framework değil, harness."},{"term":"Ajan framework’ü","def":"Kod içinden çağrılan, ajan döngüsü kurmaya yarayan kütüphane.","here":"L3: PydanticAI, OpenAI Agents SDK; dar kullanımda LangGraph."},{"term":"Durable execution","def":"Bir iş akışının durumunu kalıcı tutup çökme veya yeniden başlatmadan sonra kaldığı yerden devam ettirme.","here":"L1: Temporal. Bütçe, sayaç ve günlerce süren bekleyiş buna dayanır."},{"term":"Orkestratör","def":"Birden çok adımı veya ajanı sıraya koyan, yönlendiren sistem. Bağlama göre süreç motoru, ajan yöneticisi veya görsel akış aracı anlamına gelir.","here":"Tek anlamda kullanın: görev durumunun sahibi Temporal. Diğerleri “yönlendirici” veya “akış aracı”."},{"term":"Neuro-symbolic AI","def":"Sinir ağı tabanlı öğrenmeyi sembolik, kural tabanlı akıl yürütmeyle birleştiren yaklaşım.","here":"Hattın temel ilkesi: LLM yorumlar ve üretir, deterministik motorlar (CI kapıları, OpenFGA, topolojik sıralama) karar verir."},{"term":"Rule engine","def":"Kuralları veriye uygulayarak deterministik karar veren yazılım.","here":"Yetkilendirme (OpenFGA), risk kuralları ve policy.yaml. LLM’e bırakılmayacak kararlar."}]},{"type":"heading","text":"Doğrulama"},{"type":"table","columns":[{"key":"term","label":"Kavram","kind":"code"},{"key":"def","label":"Tanım"},{"key":"here","label":"Bu hatta"}],"rows":[{"term":"Test oracle","def":"Bir testin sonucunun doğru olup olmadığına karar veren mekanizma. Oracle problemi, bu kararın kendisinin zor olmasıdır.","here":"QA ajanı beklentiyi AC’den çıkarır, koddan değil. Mutation testing testin gücünü ölçer."},{"term":"Agent verification","def":"Ajanın spesifikasyonuna uygun davrandığına dair güvence toplama. Biçimsel yöntemler (model checking, teorem ispatı), biçimsel olmayan yöntemler (test, inceleme) ve simülasyon. LLM ajanlarında tam biçimsel doğrulama çoğu zaman mümkün değil; karma yaklaşım gerekir.","here":"Karma yaklaşım: deterministik kapılar + bağımsız QA + insan onayı. Yetki modeli gibi dar alanlarda biçimsel kontrol mümkün."},{"term":"LLM-as-a-Judge","def":"Bir LLM’in başka bir çıktıyı değerlendirmesi. Bilinen yanlılıklar: sıra (position), uzunluk (verbosity) ve kendi model ailesini kayırma (self-preference).","here":"Plan incelemesi ve QA. Önlemler: farklı model ailesinden hakem, iki sırayla karşılaştırma, rubrik ve referans cevap, insan kararıyla kalibrasyon."},{"term":"AI observability","def":"Yapay zekâ sistemlerinin girdisini, çıktısını, maliyetini ve davranışını izleme.","here":"OpenTelemetry → Langfuse; Temporal olay geçmişi; görev başına maliyet."}]},{"type":"heading","text":"Öğrenme"},{"type":"table","columns":[{"key":"term","label":"Kavram","kind":"code"},{"key":"def","label":"Tanım"},{"key":"here","label":"Bu hatta"}],"rows":[{"term":"Reflexion","def":"2023 tarihli, ajanların geçmiş hatalarından sözel geri bildirimle öğrendiği yöntem; model ağırlığı değişmez.","here":"Hermes’in skill döngüsünün fikir kökü. Öğrenme dosyalarda yaşar; bu yüzden sürümlenmeli ve eval’den geçmeli."},{"term":"Model collapse","def":"Bir modelin büyük ölçüde model üretimi veriyle eğitildikçe dağılımın kuyruklarını kaybedip kalitesinin düşmesi.","here":"Hermes trajectory’leriyle ileride ince ayar yapılırsa risk. Yalnızca kapılardan ve QA’dan geçmiş izlerle eğitin, insan verisini karıştırın."},{"term":"Knowledge cutoff","def":"Modelin eğitim verisinin bittiği tarih; sonrası hakkında bilgisi yoktur.","here":"web-research ajanının Context7 ile sürüme özgü resmi dokümana gitmesinin gerekçesi."},{"term":"Dataset shift","def":"Eğitim ve kullanım verisinin dağılımının farklılaşması.","here":"Sınıflandırıcı ajanlar (router, DoR, risk) için eval kümesi zamanla güncellenmeli."}]},{"type":"sources","items":[{"label":"Agent harness","url":"https://en.wikipedia.org/wiki/Agent_harness"},{"label":"Agent verification","url":"https://en.wikipedia.org/wiki/Agent_verification"},{"label":"LLM-as-a-Judge","url":"https://en.wikipedia.org/wiki/LLM-as-a-Judge"},{"label":"Neuro-symbolic AI","url":"https://en.wikipedia.org/wiki/Neuro-symbolic_AI"},{"label":"Model collapse","url":"https://en.wikipedia.org/wiki/Model_collapse"},{"label":"Knowledge cutoff","url":"https://en.wikipedia.org/wiki/Knowledge_cutoff"},{"label":"Category: Artificial intelligence","url":"https://en.wikipedia.org/wiki/Category:Artificial_intelligence"},{"label":"Category: 2026 software","url":"https://en.wikipedia.org/wiki/Category:2026_software"}]}]},"pipeline":{"title":"Pipeline aşamaları","summary":"Her aşama bir API uç noktası gibi belgelendi: kim çalıştırır, ne alır, ne döndürür, nasıl hata verir.","blocks":[{"type":"hero","eyebrow":"Referans","title":"Pipeline aşamaları","lede":"Aşama kodları STARK panosundaki A–F bölümlerini izler. G deterministik kapıları, R risk sınıfını, L öğrenme döngüsünü gösterir. Etiket, adımı kimin yürüttüğünü söyler."},{"type":"legend","items":[{"method":"EVENT","text":"Dış olayla tetiklenir"},{"method":"AGENT","text":"Ajan çalışır; sonuç doğrulanmadan kabul edilmez"},{"method":"AUTO","text":"Deterministik; yapay zekâ yok"},{"method":"HUMAN","text":"İnsan kararı bekler"},{"method":"STATE","text":"Yalnızca Temporal durumu değişir"}]},{"type":"endpoint","id":"a0","method":"AGENT","path":"/intake/normalize","title":"A0 · İçe alım ve normalizasyon","summary":"IceBox’taki 12.000 görev, görev çerçevesine (problem statement, user story, kabul kriterleri, risk, “neyi yapma”) uydurulur ve Product Backlog’a alınır.","orchestrator":"Temporal toplu iş akışı; hız sınırı ve maliyet tavanı iş akışında","worker":"PydanticAI tipli ajan (çıktı şeması doğrulanır)","params":[{"name":"plane_issue_id","type":"string","required":true,"desc":"Kaynak görev"},{"name":"frame_version","type":"semver","required":true,"desc":"Görev çerçevesi şablonunun sürümü"},{"name":"batch_budget","type":"money","required":true,"desc":"Toplu iş için harcama tavanı"}],"response":"{\n  \"status\": \"NORMALIZED\",\n  \"dor\": { \"problem\": true, \"scope\": true, \"ac\": false, \"deps\": true },\n  \"missing\": [\"kabul kriteri ölçülebilir değil\"],\n  \"next\": \"PRODUCT_BACKLOG\"\n}","errors":[{"code":"DOR_INCOMPLETE","desc":"Eksik alan var; görev PO kuyruğuna döner."},{"code":"BUDGET_EXCEEDED","desc":"Toplu iş durur; kalan görevler sonraki pencereye kalır."}],"avoid":"12.000 kaydı n8n döngüsüyle işlemek. Deneme ve bütçe mantığını elle yazmak zorunda kalırsınız."},{"type":"endpoint","id":"a1","method":"EVENT","path":"/plane/comment → /startask","title":"A1 · Komut alımı","summary":"Geliştirici Plane’de görev yorumuna /startask yazar. Alıcı webhook imzasını ve kullanıcıyı doğrular, yorum kimliğini kaydeder.","orchestrator":"Küçük webhook alıcısı → Temporal StartWorkflow","worker":"—","params":[{"name":"workflow_id","type":"string","required":true,"desc":"plane:{issue}:{ac_version}. Tekil olduğu için ikinci komut yeni run açmaz."},{"name":"actor","type":"user","required":true,"desc":"Yetkili assignee olmalı"},{"name":"policy_version","type":"semver","required":true,"desc":"Run boyunca sabit kalır"}],"response":"{\n  \"run_id\": \"…\",\n  \"plane_status\": \"RUNNING\",\n  \"duplicate\": false\n}","errors":[{"code":"DUPLICATE_COMMAND","desc":"Mevcut run bağlantısı yoruma yazılır."},{"code":"UNAUTHORIZED","desc":"Gerekçeyle reddedilir; run açılmaz."}],"avoid":"Komutu doğrudan bir ajana iletmek. Aynı görev için iki paralel run oluşur."},{"type":"endpoint","id":"a2","method":"AGENT","path":"/research/spec","title":"A2 · Araştırma ve task spec","summary":"Kod tabanı ve internet araştırılır, task spec üretilir. Eksik veya belirsiz bilgi en fazla 2 döngüde tamamlanır; sonra PO’ya sorulur.","orchestrator":"Temporal (döngü sayacı iş akışında)","worker":"OpenHands veya Claude Code salt-okunur modda; web-research ve unknown-unknowns ajanları; Context7 MCP","params":[{"name":"issue","type":"PlaneIssue","required":true,"desc":"AC kimlikleriyle"},{"name":"repo_sha","type":"sha","required":true,"desc":"Araştırmanın yapıldığı revizyon"}],"response":"{\n  \"spec\": { \"behaviors\": [\"B1\", \"B2\"], \"risks\": [\"…\"], \"test_plan\": [\"…\"] },\n  \"ambiguous\": false,\n  \"loops_used\": 1\n}","errors":[{"code":"WAITING_FOR_PO","desc":"2 döngü sonunda hâlâ belirsiz. Açık soru Plane’e yazılır; cevapla A4’ten devam edilir."}],"avoid":"Döngü sayısını ajanın kendisine bırakmak."},{"type":"endpoint","id":"a3","method":"AUTO","path":"/relations/cluster","title":"A3 · İlişki haritası ve kümeleme","summary":"Etkilenen modül, servis, API ve veri modeli belirlenir. Parçalanmış görevler bağımlılığa göre kümelenir; her küme bağımsız başlayabilir.","orchestrator":"Temporal child workflow (bağımsız küme başına)","worker":"Kod grafiği (Graphify / SCIP / tree-sitter) + networkx; LLM yalnızca yorum ve rapor","params":[{"name":"spec","type":"TaskSpec","required":true,"desc":"A2 çıktısı"},{"name":"max_split_attempts","type":"int","required":true,"desc":"Panoda 2"}],"response":"{\n  \"clusters\": [[\"B1\"], [\"B2\", \"B3\"]],\n  \"order\": \"foundation → dependency → consumer\",\n  \"cycles\": []\n}","errors":[{"code":"BLOCKER_DEPENDENCY","desc":"Eksik ön koşul görev var; geliştirme başlamaz."},{"code":"CYCLE_DETECTED","desc":"Döngüsel bağımlılık; yeniden bölme veya insan kararı."}],"avoid":"Bağımlılık grafiğini yalnızca LLM’e çıkartmak."},{"type":"endpoint","id":"a4","method":"HUMAN","path":"/plan/review","title":"A4 · Plan ve plan incelemesi","summary":"Görev parçalara bölünür, riskler ve test planı yazılır. Plan, planlayıcıdan farklı bir model ailesindeki hakemce incelenir; çünkü LLM hakemlerin kendi model ailesini kayırdığı (self-preference) biliniyor. Yüksek riskte insan onayı gerekir.","orchestrator":"Temporal Signal / Update (günlerce bekleyebilir)","worker":"Planlayıcıdan farklı sağlayıcıda hakem ajan","params":[{"name":"plan","type":"Plan","required":true,"desc":"Davranış l ":"Tek bir adımda çok dallı analiz mi gerekiyor?","text":"Evet → o aktivitenin içinde LangGraph, kalıcı checkpointer olmadan. Hayır → düz Python + PydanticAI."},{"title":"Çok rollü tartışma mı isteniyor?","text":"CrewAI tek aktivite içinde kullanılabilir; ama aynı işi PydanticAI ile paralel aktiviteler olarak yazmak daha az soyutlama getirir."},{"title":"AutoGen?","text":"Hayır. Yerine Agent Framework veya PydanticAI."}]},{"type":"linkgrid","items":[{"title":"LangGraph","text":"Panonun çekirdek önerisi ve neden aktivite içinde kalmalı.","href":"#/langgraph"},{"title":"CrewAI","text":"Crews ve Flows ayrımı.","href":"#/crewai"},{"title":"AutoGen","text":"Bakım modu ve halefi.","href":"#/autogen"},{"title":"Hermes Agent","text":"Çalıştırıcı, öğrenme döngüsü ve Kanban.","href":"#/hermes"}]}]},"temporal":{"title":"Temporal","summary":"Temporal’ın bu hat için tarafsız değerlendirmesi: lehte, aleyhte, alternatifler ve hüküm.","blocks":[{"type":"hero","eyebrow":"Değerlendirme","title":"Temporal","lede":"Soru “Temporal güçlü mü?” değil. Soru, panolardaki kuralların durable execution gerektirip gerektirmediği. Gerektiriyor; ama bedeli var.","meta":[{"label":"Hüküm","value":"Omurga olarak kullan"},{"label":"Pilot","value":"Temporal Cloud veya tek düğüm"},{"label":"Self-host kararı","value":"Faz 2 sonrası"}]},{"type":"heading","text":"Pano kuralı → Temporal karşılığı"},{"type":"table","columns":[{"key":"rule","label":"Panodaki kural"},{"key":"prim","label":"Temporal karşılığı","kind":"code"}],"rows":[{"rule":"Sayaç sıfırlanmaz; model, alt ajan veya yeni run bütçeyi yenilemez","prim":"workflow state (replay ile korunur)"},{"rule":"Yinelenen komut → mevcut run bağlantısı","prim":"Workflow ID tekilliği"},{"rule":"İlk çağrı + 2 tekrar; 10 / 30 sn bekle","prim":"Activity RetryPolicy"},{"rule":"WAITING_FOR_PO: karar kaydedilince aynı çalışma devam","prim":"Signal / Update + wait_condition"},{"rule":"120 dk aktif süre (insan bekleme hariç)","prim":"Activity start_to_close + iş akışında süre sayacı"},{"rule":"AC sürümü + kaynak SHA + run_id sabitlenir","prim":"Workflow input + memo / search attributes"},{"rule":"Bağımsız kümeler paralel başlar","prim":"Child workflow"},{"rule":"Kesilen adıma geri dön; sonuç ve bütçe kayda geçer","prim":"Event history"}]},{"type":"procon","proTitle":"Lehte","conTitle":"Aleyhte ve dikkat","pros":["Panodaki bütçe, bekleme ve devam kurallarıyla birebir eşleşme.","Mükerrer komut koruması kod yazmadan gelir.","Olay geçmişi denetim izi olarak kullanılır; kanıt paketiyle birleşir.","Olgun: Cadence kökenli; OpenAI Agents SDK entegrasyonu Mart 2026’da GA, PydanticAI entegrasyonu resmi.","Go, Java, TypeScript, Python, .NET SDK’ları; kontrol düzlemi dili serbest."],"cons":["Determinizm kuralı: iş akışı kodu LLM, dosya veya ağ çağrısı yapamaz; hepsi aktiviteye gider.","Kural değişince açık run’lar için patching / worker versioning gerekir.","Olay geçmişi ve payload sınırları var: uzun döngülerde Continue-As-New; diff ve loglar dış depoda, Temporal’da yalnızca referans.","30–120 dk süren kodlama aktivitesi heartbeat ve iptal yayılımı ister; iptalde container da öldürülmeli.","Self-host: veritabanı, görünürlük deposu ve birden çok servis. Cloud: işlem başına ücret.","LLM’i deterministik yapmaz: bir kodlama denemesini tekrar denemek aynı sonucu vermez."]},{"type":"heading","text":"Alternatiflerle karşılaştırma"},{"type":"compare","columns":["Temporal","DBOS","Restate","LangGraph checkpointer"],"rows":[{"label":"Durumun yeri","values":[{"score":3,"text":"Temporal kümesi"},{"score":3,"text":"Kendi Postgres’iniz"},{"score":3,"text":"Restate sunucusu"},{"score":2,"text":"Postgres (graf başına)"}]},{"label":"İşletim yükü (yüksek puan = hafif)","values":[{"score":1,"text":"Ağır / Cloud"},{"score":3,"text":"Kütüphane"},{"score":2,"text":"Tek binary"},{"score":3,"text":"Kütüphane"}]},{"label":"Günlerce insan bekleyişi","values":[{"score":3,"text":"Dayanıklı zamanlayıcı"},{"score":3,"text":"Var"},{"score":3,"text":"Var"},{"score":2,"text":"interrupt; zamanlayıcı yok"}]},{"label":"Çalışan filosu, kuyruk","values":[{"score":3,"text":"Task queue"},{"score":2,"text":"Kuyruk var"},{"score":2,"text":"Var"},{"score":1,"text":"Yok"}]},{"label":"Olgunluk ve ekosistem","values":[{"score":3,"text":"En olgun"},{"score":2,"text":"Genç"},{"score":2,"text":"Genç"},{"score":2,"text":"Yaygın, ama farklı amaç"}]},{"label":"PydanticAI entegrasyonu","values":[{"score":3,"text":"Resmi"},{"score":3,"text":"Resmi"},{"score":3,"text":"Resmi"},{"score":1,"text":"—"}]}],"note":"Puanlar bu hattın ihtiyaçlarına göre görelidir."},{"type":"callout","tone":"note","title":"Ne zaman Temporal gerekmez?","text":"Pilotta 4 kişi ve kişi başına 1 aktif iş, en fazla 4 eşzamanlı run demek. Tek başına bu hacim için DBOS aynı temel garantileri daha az işletim yüküyle verir. Temporal’ı haklı kılan, 12.000 görevlik backlog ile günlerce süren insan bekleyişlerinin birlikte olması. Ekip Temporal’ın öğrenme eğrisini üstlenmek istemezse DBOS meşru bir seçimdir; PydanticAI ikisini de desteklediği için geçiş maliyeti düşüktür."},{"type":"heading","text":"İskelet"},{"type":"code","lang":"python","title":"workflows/task_run.py (kısaltılmış)","code":"@workflow.defn\nclass TaskRun:\n    def __init__(self) -> None:\n        self.failures = 0          # görev toplamı; hiçbir model veya alt ajan sıfırlayamaz\n        self.po_decision: str | None = None\n\n    @workflow.signal\n    def po_answered(self, decision: str) -> None:\n        self.po_decision = decision\n\n    @workflow.run\n    async def run(self, task: TaskInput) -> str:\n        policy = task.policy                     # sürümlü policy.yaml, run başında sabit\n        spec = await workflow.execute_activity(\n            research, task,\n            start_to_close_timeout=timedelta(minutes=30),\n            retry_policy=INFRA_RETRY,             # 1 + 2 tekrar, 10 / 30 sn\n        )\n        if spec.ambiguous:\n            await workflow.execute_activity(plane_set_status, \"WAITING_FOR_PO\", ...)\n            await workflow.wait_condition(lambda: self.po_decision is not None)\n\n        for behavior in spec.behaviors:\n            red = await workflow.execute_activity(write_failing_test, behavior, ...)\n            if not red.failed_for_expected_reason:\n                return await self.stop(\"BLOCKED_TEST\", red)\n            while True:\n                if self.failures >= policy.per_task.failed_attempts:\n                    return await self.stop(\"ERROR\", behavior)\n                result = await workflow.execute_activity(\n                    coding_agent, behavior,\n                    heartbeat_timeout=timedelta(minutes=2),\n                    start_to_close_timeout=timedelta(minutes=policy.per_task.active_minutes),\n                )\n                gates = await workflow.execute_activity(run_ci_gates, result.sha, ...)  # yapay zekâ yok\n                if gates.green:\n                    break\n                self.failures += 1\n        return \"READY_FOR_ALPHA\""},{"type":"callout","tone":"success","title":"Hüküm","text":"Temporal doğru omurga. Pilotta Temporal Cloud veya Postgres’li tek düğüm kullanın; self-host kararını Faz 2 ölçümlerinden sonra verin. Kontrol düzlemi için Python öneriliyor, çünkü Temporal’ın ajan entegrasyonları (OpenAI Agents SDK, PydanticAI) orada en olgun."}]},"hermes":{"title":"Hermes Agent","summary":"Hermes’in bu hat için tarafsız değerlendirmesi: “kendini eğitiyor” iddiası, kategori, riskler ve önerilen konum.","blocks":[{"type":"hero","eyebrow":"Değerlendirme","title":"Hermes Agent","lede":"Nous Research’ün Şubat 2026’da yayımladığı açık kaynak ajan. Öğrenme döngüsü gerçek ve değerli; v0.12.0’daki Kanban ile küçük bir ajan ekibini de yönetebiliyor. Ama “framework” değil, “kendini eğitmek” de tam doğru bir tanım değil.","meta":[{"label":"Hüküm","value":"Sınırlı rol"},{"label":"Katman","value":"L2 çalıştırıcı"},{"label":"Lisans","value":"MIT"}]},{"type":"heading","text":"“Kendini eğitiyor” ne demek?"},{"type":"table","columns":[{"key":"claim","label":"Varsayım"},{"key":"reality","label":"Gerçekte"}],"rows":[{"claim":"Model ağırlıkları çalışırken güncellenir","reality":"Hayır. Ağırlık değişmez."},{"claim":"Deneyimden öğrenir","reality":"Evet: karmaşık bir işten sonra skill (prosedür dosyası) yazar, kullandıkça iyileştirir; ~/.hermes/skills/ altında."},{"claim":"Geçmişi hatırlar","reality":"Evet: ajanın düzenlediği hafıza + oturumlar arası tam metin arama ve LLM özeti."},{"claim":"Kendi modelini eğitir","reality":"Doğrudan değil. Ajan izlerini (trajectory) toplu üretip sıkıştırabiliyor; bu veriyle ayrı bir eğitim yapılabilir."},{"claim":"Fikir yeni mi?","reality":"Hayır. Kökü 2023 tarihli Reflexion yöntemi: ajan geçmiş hatalarından sözel geri bildirimle öğrenir, ağırlık değişmez."}]},{"type":"procon","proTitle":"Lehte","conTitle":"Aleyhte ve riskler","pros":["Gerçek bir öğrenme döngüsü: tekrar eden işleri skill’e çeviriyor.","MIT lisanslı ve modelden bağımsız; panodaki açık ağırlıklı modellerle çalışabilir.","7 terminal arka ucu (yerel, Docker, SSH, Singularity, Modal, Daytona, Vercel Sandbox), paralel subagent, yerleşik cron.","Trajectory üretimi ileride kendi araç-kullanım modelinizi ince ayarlamanın gerçekçi yolu."],"cons":["Kategori: kütüphane değil, çalıştırıcı. Panonuz da onu “uzun süre sizinle çalışan, öğrenen kişisel ajan” diye sınıflandırıyor.","Skill’ler sessizce değişirse aynı görev ve aynı AC bir hafta sonra farklı davranış üretir; panodaki “ayrı örnek kümesinde karşılaştır” kuralıyla çelişir.","Yanlış dersi öğrenebilir: testi geçirmenin kestirmesini skill olarak kaydetmek gibi.","Web araştırmasından gelen içerik skill’e sızarsa zehirlenme riski. OpenClaw’ın skill pazarındaki tedarik zinciri sorunu bu riskin gerçek bir örneği.","Gateway, DM eşleştirme ve kişisel hafıza bir kullanıcıya göre tasarlanmış; 4 kişilik ekip hattı için ek kurgu gerekir."]},{"type":"heading","text":"Letta ile karşılaştırma"},{"type":"prose","text":"Letta da “öğrenen” ajan iddiasında ama farklı bir yoldan: öğrenme bağlam ve hafıza blokları üzerinden, Şubat 2026’dan beri **git tabanlı sürümlü** hafızayla (Context Repositories). Denetlenebilirlik açısından git geçmişi olan bir hafıza, dizindeki skill dosyalarından daha kolay incelenir. Hermes’i seçerseniz skill dizinini bir git deposu yapıp aynı disiplini kurabilirsiniz."},{"type":"heading","text":"Hermes Kanban","id":"hermes-kanban"},{"type":"prose","text":"v0.12.0 ile gelen **Kanban**, Hermes’i kişisel ajandan küçük bir ajan ekibine çeviriyor: görevler `~/.hermes/kanban.db` (SQLite, WAL) içinde; her çalışan kendi kimliği olan ayrı bir OS süreci; profiller görevi kira ve heartbeat ile sahipleniyor. Bu, araç manzarasında STARK’ın kurallarına en çok benzeyen şey. Bu yüzden ayrıca değerlendirilmeli."},{"type":"table","columns":[{"key":"stark","label":"STARK kuralı"},{"key":"kanban","label":"Hermes Kanban karşılığı","kind":"code"},{"key":"gap","label":"Fark"}],"rows":[{"stark":"Bağımsız kümeler paralel başlar; eksik bağımlılıkla başlama","kanban":"--parent \u003cid> · recompute_ready","gap":"Birebir karşılık: çocuk görev, ebeveynler done olunca ready olur. Döngü veritabanında engellenir."},{"stark":"WAITING_FOR_PO / WAITING_FOR_QA","kanban":"kanban_block(kind=needs_input)","gap":"İnsana düşer; `hermes kanban unblock` ile aynı aşamaya döner."},{"stark":"Geçici altyapı hatası bütçeden sayılmaz","kanban":"exit 75 → yeniden kuyruğa, sayılmaz","gap":"Aynı fikir. Kalıcı sağlayıcı hatası (exit 78) ilk seferde bloklar."},{"stark":"Fix döngüsü sınırı, sonra ERROR","kanban":"kanban.failure_limit (varsayılan 2)","gap":"Ardışık hata sınırı var; ama görev toplamı, 120 dk aktif süre ve para tavanı yok. Çalıştırma başına --max-runtime var."},{"stark":"Kişi başına 1 aktif iş","kanban":"max_in_progress_per_profile","gap":"Profil başına eşzamanlılık sınırı hazır."},{"stark":"Çökme sonrası kesilen adıma dön","kanban":"claim_ttl + heartbeat · stale reclaim (4 sa)","gap":"Görev yeniden sahiplenilir ama adım baştan başlar; Temporal gibi olay geçmişinden replay yok."},{"stark":"Kanıt paketi, denetim izi","kanban":"görev ve handoff satırları","gap":"Olay satırları var; SHA, AC sürümü ve test raporu bağlama sizin işiniz."},{"stark":"Ekip çapında tek doğruluk kaynağı","kanban":"tek host, yerel güvenilir kullanıcı","gap":"Tasarım gereği tek makine. Çok host için aynı DB’yi bağlamak öneriliyor; ekip ölçeğinde kırılgan."}]},{"type":"callout","tone":"note","title":"Kanban için tarafsız hüküm","text":"Tek makinede, hızlı bir prototip için Hermes Kanban STARK’ın birçok kuralını hazır veriyor; Faz 0’da fikir doğrulamak için gerçekten iyi bir seçenek. Ekip ölçeğinde ise Plane (pano) ve Temporal (durum) varken üçüncü bir durum sahibi olur; tek host sınırı, replay olmaması ve eksik bütçe türleri yüzünden omurga yapılmamalı. Hermes çalışan olarak kullanılırsa Kanban’ı Hermes’in kendi iç işleri (araştırma, dokümantasyon, triyaj) için kullanın; ekibin görevi Plane’de kalsın."},{"type":"heading","text":"Önerilen konum"},{"type":"steps","items":[{"title":"Operasyon ve kişisel ajan","text":"Backlog triyajı, günlük özet, Telegram / Slack bildirimi, zamanlanmış kontroller. Hermes’in en güçlü olduğu alan."},{"title":"İsteğe bağlı kodlama çalışanı","text":"Temporal aktivite arayüzünün arkasında, Claude Code ve Codex ile aynı sözleşmeyle. Hat modunda skill dizini salt-okunur."},{"title":"Öğrenme öneri modunda","text":"Yeni veya değişen skill → rules deposuna PR → Promptfoo / Inspect ile sabit örnek kümesinde karşılaştırma → insan onayı → merge."},{"title":"Trajectory arşivi","text":"Ajan izleri saklanır; ileride kendi modelinizi ince ayarlamak isterseniz veri hazır olur. Model collapse riskine karşı yalnızca kapılardan ve QA’dan geçmiş izleri kullanın. Gerçek “kendini eğitme” bu adımdır ve çevrimdışıdır."}]},{"type":"callout","tone":"success","title":"Hüküm","text":"Framework katmanı için PydanticAI (veya OpenAI Agents SDK) kullanın; ikisinin de Temporal entegrasyonu var. Hermes’i çalışan ve öğrenme kaynağı olarak konumlandırın, öğrendiklerini kontrollü biçimde hatta alın."}]},"langgraph":{"title":"LangGraph","summary":"LangGraph’ın bu hat için tarafsız değerlendirmesi. Panolardan biri onu orkestrasyon çekirdeği olarak öneriyor.","blocks":[{"type":"hero","eyebrow":"Değerlendirme","title":"LangGraph","lede":"LangChain ekibinin graf tabanlı ajan kütüphanesi; 1.0 sürümü Ekim 2025’te çıktı. Ajan-sağlayıcı panosu onu akış, tekrar, blocker ve insan onayı için “tek orkestrasyon çekirdeği” olarak öneriyor. STARK ise aynı işi Temporal’a veriyor. Asıl soru hangisinin daha iyi olduğu değil, ikisinden hangisinin durum sahibi olacağı.","meta":[{"label":"Hüküm","value":"Sınırlı rol"},{"label":"Katman","value":"L3 kütüphane"},{"label":"Lisans","value":"MIT"}]},{"type":"heading","text":"Ne sağlıyor?"},{"type":"kv","items":[{"k":"StateGraph","v":"Düğümler ve koşullu kenarlarla açık bir akış grafiği; durum tipli bir nesne."},{"k":"Checkpointer","v":"Her adımda durumu kaydeder (Postgres, SQLite vb.). Süreç yeniden başlarsa son kontrol noktasından devam eder."},{"k":"interrupt()","v":"Akışı insan onayı veya dış girdi için durdurur; aynı thread kimliğiyle devam ettirilir."},{"k":"Time-travel","v":"Önceki kontrol noktasına dönüp farklı bir dalı yeniden çalıştırma; hata ayıklamada güçlü."},{"k":"Deep Agents","v":"LangGraph üzerine kurulu hazır ajan iskeleti (planlama, alt ajan, dosya sistemi araçları)."},{"k":"Platform","v":"Ölçek, kuyruk ve dağıtım için LangChain’in ticari platformu; açık kaynak kütüphane bunları içermez."}]},{"type":"procon","proTitle":"Lehte","conTitle":"Aleyhte ve dikkat","pros":["Çok dallı analiz için doğal ifade: panodaki edge-case.agent’ın 6 perspektifi gibi.","İnsan onayı (interrupt) ve checkpoint birinci sınıf özellik.","Time-travel ve LangGraph Studio ile hata ayıklama kolay.","Geniş topluluk, çok sayıda örnek; Python ekibine tanıdık bir API.","Tek bir süreçte, tek bir servis için gerçekten yeterli bir dayanıklılık düzeyi sunar."],"cons":["Durability düğüm düzeyinde: 60 dakikalık bir kodlama düğümü çökerse düğüm baştan çalışır. Heartbeat ve iptal yayılımı yok.","Kütüphane: çalışan filosu, görev kuyruğu, günlerce süren dayanıklı zamanlayıcı ve zamanlanmış iş ayrıca kurulmalı (ya da ticari platform).","Birden çok graf arasında ortak bütçe (görev toplamı 10 deneme gibi) elle tutulur.","Temporal ile birlikte kalıcı checkpointer’la kullanılırsa iki durum sahibi oluşur: hangisi doğru, belirsizleşir.","LangChain ekosisteminde API değişim hızı tarihsel olarak yüksek; sürümü sabitleyin."]},{"type":"heading","text":"Panodaki LangGraph atamaları"},{"type":"table","columns":[{"key":"agent","label":"Panodaki kullanım","kind":"code"},{"key":"fit","label":"Uygun mu?","kind":"badge"},{"key":"why","label":"Neden"}],"rows":[{"agent":"edge-case (6 düğüm)","fit":{"text":"Uygun","tone":"success"},"why":"LangGraph’ın haklı olduğu yer. Tek aktivite içinde, kalıcı checkpointer olmadan."},{"agent":"task-dependency-cluster","fit":{"text":"Gereksiz","tone":"warning"},"why":"Kümeleme bir graf algoritması; networkx yeterli (panonun kendi alternatifi)."},{"agent":"dependency-priority","fit":{"text":"Gereksiz","tone":"warning"},"why":"Topolojik sıralama; LLM gerekmez."},{"agent":"frontend-backend-router","fit":{"text":"Gereksiz","tone":"warning"},"why":"Enum çıktısına göre bir if; iş akışı kodunda."},{"agent":"R&D / task-spec üst akışı","fit":{"text":"Çakışır","tone":"danger"},"why":"Döngü sayacı ve PO bekleyişi Temporal’ın işi."},{"agent":"blocker / human approval","fit":{"text":"Çakışır","tone":"danger"},"why":"Günlerce süren bekleyiş Temporal Signal/Update ile."}]},{"type":"callout","tone":"note","title":"LangGraph çekirdek olursa?","text":"Bu meşru bir alternatif; panonun önerisi yanlış değil, iki çekirdeğin birlikte olması yanlış. LangGraph’ı çekirdek seçerseniz Temporal’ı çıkarın ve şunları kendiniz kurun: Postgres checkpointer, çalışan kuyruğu (ör. Celery veya Hatchet), günlerce süren bekleyişler için zamanlayıcı, uzun kodlama adımları için ayrı süreç ve iptal mekanizması, görev toplamı bütçesi. Bu liste uzadıkça Temporal’ın öğrenme maliyeti ucuz görünmeye başlar."},{"type":"callout","tone":"success","title":"Hüküm","text":"Durum sahibi Temporal. LangGraph yalnızca tek bir aktivitenin içinde, çok dallı analiz gereken yerlerde ve kalıcı checkpointer olmadan. Çoğu ajan için PydanticAI daha sade ve Temporal ile resmi entegrasyonu var."}]},"crewai":{"title":"CrewAI","summary":"CrewAI’ın bu hat için tarafsız değerlendirmesi: Crews, Flows ve AMP.","blocks":[{"type":"hero","eyebrow":"Değerlendirme","title":"CrewAI","lede":"Rol, görev ve ekip soyutlamasıyla bilinen MIT lisanslı Python framework’ü. Panoya göre “uzman ajan ekiplerini hızlı kurdurur; kontrol seviyesi LangGraph’tan düşüktür”. Bu tespit Crews için doğru; 2025–2026’da olgunlaşan Flows için kısmen eskidi.","meta":[{"label":"Hüküm","value":"Çekirdek olarak önerilmez"},{"label":"Katman","value":"L3 kütüphane"},{"label":"Lisans","value":"MIT (AMP ticari)"}]},{"type":"heading","text":"İki farklı CrewAI"},{"type":"cards","columns":2,"items":[{"badge":{"text":"Crews","tone":"warning"},"title":"Özerk ajan ekipleri","text":"Rol tabanlı delegasyon, yönetici ajan, dinamik karar. Akışın sırasını ajanlar belirler. Keşif ve beyin fırtınası için hızlı; deterministik kapılı bir hat için kontrolü zayıf."},{"badge":{"text":"Flows","tone":"info"},"title":"Olay güdümlü iş akışları","text":"Açık durum yönetimi ve koşullu yönlendirme; sıranın önemli olduğu hatlar için. Kalıcılık için kaydetme desteği var, ama çalışan filosu, heartbeat ve günlerce süren dayanıklı zamanlayıcı sunan bir durable execution motoru değil."}]},{"type":"procon","proTitle":"Lehte","conTitle":"Aleyhte ve dikkat","pros":["Uzman ajan ekibini (rol, hedef, geçmiş hikâye) çok hızlı kurar; prototip süresi kısa.","Flows ile deterministik akış yazılabilir; Crews bir Flow adımı olarak çağrılabilir.","MIT lisanslı çekirdek; geniş topluluk ve örnek havuzu.","Kurumsal ihtiyaç için AMP: yönetilen dağıtım, izleme, yönetişim, kendi altyapınızda çalıştırma seçeneği."],"cons":["Crews’ta akışı ajanlar belirler: “RED kanıtı olmadan kod yok”, “sayaç sıfırlanmaz” gibi kuralları garanti etmek zor.","Flows, Temporal ile aynı işi (durum, sıra, yönlendirme) yapmaya çalışır; birlikte kullanılırsa iki durum sahibi olur.","Rol yazımı (backstory, goal) davranışı prompt’a bağlar; sonuç model değişince kayar.","Kodlama işi Claude Code / OpenHands gibi çalıştırıcılarda zaten yapılıyor; CrewAI’ın ajan döngüsü burada ek değer üretmiyor.","Kurumsal yönetişim özellikleri ticari AMP tarafında."]},{"type":"heading","text":"Hatta nereye oturabilir?"},{"type":"list","style":"bullet","items":["**Uygun olabilir:** tek bir aktivite içinde çok perspektifli inceleme (ör. SOLID, güvenlik, performans rollerinin aynı diff’i tartışması). Çıktı tipli bir rapor olur, karar yine kapılarda verilir.","**Uygun değil:** görev yaşam döngüsü, bütçe, insan bekleyişi, kodlama döngüsü.","**Alternatif:** aynı çok perspektifli incelemeyi PydanticAI ile üç paralel aktivite olarak yazmak daha az soyutlama getirir."]},{"type":"callout","tone":"success","title":"Hüküm","text":"Çekirdek olarak önerilmez. Ekip CrewAI’a zaten alışkınsa, tek aktivite içindeki çok rollü inceleme için sınırlı kullanılabilir. Yeni başlıyorsanız PydanticAI daha az soyutlamayla aynı işi görür."}]},"autogen":{"title":"AutoGen","summary":"AutoGen’in durumu, halefi Microsoft Agent Framework ve bu hat için hüküm.","blocks":[{"type":"hero","eyebrow":"Değerlendirme","title":"AutoGen","lede":"Microsoft Research’ün çoklu ajan konuşma framework’ü. Çoklu ajan fikrini yaygınlaştıran projelerden biri; ancak Ekim 2025’ten beri bakım modunda. Değerlendirmenin asıl konusu artık halefi Microsoft Agent Framework.","meta":[{"label":"Hüküm","value":"Kullanma"},{"label":"Durum","value":"Bakım modu"},{"label":"Halef","value":"Agent Framework 1.0"}]},{"type":"heading","text":"Durum"},{"type":"timeline","items":[{"label":"2023","when":"","title":"AutoGen","items":["Konuşan ajanlar (AssistantAgent, UserProxyAgent), grup sohbeti","Araştırma ve prototiplerde hızla yayıldı"]},{"label":"2024–25","when":"","title":"Yeniden yazım ve çatal","items":["0.4 ile aktör tabanlı çekirdek ve AgentChat katmanı","Topluluk çatalı AG2 ayrıldı"]},{"label":"Eki 2025","when":"","title":"Bakım modu","items":["Yeni özellik yok; yalnızca hata ve güvenlik düzeltmesi","README yeni kullanıcıları Microsoft Agent Framework’e yönlendiriyor"]},{"label":"Nis 2026","when":"","title":"Agent Framework 1.0","items":["Python ve .NET için GA; kararlı API ve uzun süreli destek","AutoGen fikirleri + Semantic Kernel’in kurumsal temeli"]}]},{"type":"procon","proTitle":"AutoGen’in bıraktığı iyi fikirler","conTitle":"Bu hat için sorunlar","pros":["Ajanlar arası mesajlaşma ve rol ayrımı fikrini somutlaştırdı.","Kod çalıştıran ajan + insan vekili deseni, bugünkü çalıştırıcıların atası sayılabilir.","Magentic-One gibi referans çoklu ajan mimarileri."],"cons":["Bakım modunda: yeni projede teknik borç olarak başlar.","Konuşma güdümlü akış: sıra ve sonlanma ajan mesajlarına bağlı. Deterministik kapılı TDD hattıyla çelişir.","Proje üçe bölündü (AutoGen, AG2, Agent Framework); kaynak ve örnekler dağınık.","Temporal ile birlikte kullanılırsa akışın sahibi belirsizleşir."]},{"type":"heading","text":"Microsoft Agent Framework ne zaman mantıklı?"},{"type":"list","style":"bullet","items":["Ekip .NET ağırlıklıysa veya Azure AI Foundry kullanıyorsa.","Graf tabanlı iş akışı, checkpoint ve insan onayı gibi özellikler var; ama Temporal’ın yanında bunlar yine ikinci durum sahibi olur. Ajan katmanı olarak kullanın.","Durable yürütme için Dapr Workflow ile birlikte çalışabildiği gösteriliyor; Kubernetes + .NET ekibi için Temporal’a alternatif bir yol."]},{"type":"callout","tone":"success","title":"Hüküm","text":"AutoGen’i yeni projede kullanmayın. Microsoft ekosistemindeyseniz ajan katmanı için Agent Framework, değilseniz PydanticAI. Her iki durumda da görev durumunun sahibi Temporal."}]},"jev":{"title":"Jev (TypeSafe AI)","summary":"Tipli karar modeli Jev’in bu hattaki yeri: hangi ajanların yerine geçebilir, nasıl ölçülmeli.","blocks":[{"type":"hero","eyebrow":"Değerlendirme","title":"Jev (TypeSafe AI)","lede":"Jev bir orkestratör veya ajan framework’ü değil. Metin üretmek yerine tipli kararlar döndüren barındırılan bir model API’si. Bu hattaki yeri, panodaki sınıflandırıcı ajanlar.","meta":[{"label":"Hüküm","value":"Aday; ölçerek"},{"label":"Katman","value":"L3 karar modeli"},{"label":"Dağıtım","value":"Barındırılan API"}]},{"type":"heading","text":"Ne sağlıyor?"},{"type":"kv","items":[{"k":"choice","v":"Girdiyi en fazla 255 etiketten birine atar."},{"k":"score","v":"Girdiyi 2–10 seviyeli bir ölçeğe yerleştirir."},{"k":"evet / hayır","v":"Kalibre edilmiş olasılıkla ikili karar."},{"k":"Hız ve maliyet","v":"Üreticiye göre 70–500 ms ve LLM’den 40–200 kat hızlı; fiyat girdi token’ı üzerinden, çıktı ücretsiz."}]},{"type":"heading","text":"Panodaki hangi ajanlara uyar?"},{"type":"table","columns":[{"key":"agent","label":"Ajan","kind":"code"},{"key":"prim","label":"Jev ilkeli"},{"key":"fit","label":"Uyum","kind":"badge"},{"key":"note","label":"Not"}],"rows":[{"agent":"frontend-backend-router","prim":"choice: FE / BE / Full-stack / DB / Infra","fit":{"text":"İyi","tone":"success"},"note":"Panoda zaten enum çıktılı sınıflandırıcı."},{"agent":"maturity-level","prim":"choice: PoC / MVP / PMF / Enterprise","fit":{"text":"İyi","tone":"success"},"note":"Tek seferlik sınıflandırma."},{"agent":"A0 triyaj (12.000 görev)","prim":"choice + evet / hayır","fit":{"text":"İyi","tone":"success"},"note":"Hacim büyük, karar basit; hız ve maliyet burada anlam kazanır."},{"agent":"definition-of-ready","prim":"evet / hayır (alan başına)","fit":{"text":"Kısmi","tone":"warning"},"note":"Eksik alanın ne olduğunu açıklamak için yine metin gerekir."},{"agent":"Risk sınıfı","prim":"score / choice","fit":{"text":"Ön eleme","tone":"warning"},"note":"Yalnızca ön sınıflama. Yasaklı ve yüksek risk kararı insanda kalır."},{"agent":"solid / edge-case / gap-analysis","prim":"—","fit":{"text":"Uygun değil","tone":"danger"},"note":"Açıklamalı bulgu listesi gerekir; bu, metin üretimi."}]},{"type":"procon","proTitle":"Lehte","conTitle":"Aleyhte ve dikkat","pros":["Çıktı her zaman tanımlı etiket kümesinde; ayrıştırma hatası yok.","Yüksek hacimli basit kararlarda hız ve maliyet avantajı.","Olasılık döndürmesi, eşik altında insana veya daha güçlü modele yönlendirmeyi kolaylaştırır."],"cons":["“Sıfır halüsinasyon” çıktının etiket kümesinde kalması demek; kararın doğru olduğu anlamına gelmez.","Kapalı, barındırılan servis: görev metinleri ve kod parçaları dışarı çıkar.","Kalibrasyon ve doğruluk iddiaları üreticiye ait; sizin etiketlerinizde ölçülmedi.","Tek bir sağlayıcıya bağımlılık; aynı işi PydanticAI + küçük bir model veya DSPy ile optimize edilmiş bir sınıflandırıcı da yapabilir."]},{"type":"heading","text":"Nasıl denenmeli?"},{"type":"steps","items":[{"title":"Etiketli örnek kümesi","text":"Her sınıflandırıcı ajan için 100–200 gerçek görev, doğru etiketleriyle."},{"title":"Üç yol karşılaştırması","text":"Jev, PydanticAI + mevcut model, PydanticAI + küçük/ucuz model. Doğruluk, gecikme ve maliyet ölçülür."},{"title":"Eşik kuralı","text":"Güven eşiğin altındaysa karar daha güçlü modele veya insana gider; bu dal Temporal iş akışında."},{"title":"Veri politikası","text":"Barındırılan servise hangi alanların gidebileceği yazılı olarak belirlenir."}]},{"type":"callout","tone":"success","title":"Hüküm","text":"Sınıflandırıcı ajanlar için değerli bir aday; özellikle A0’daki yüksek hacimli triyajda. Veri politikası uygunsa Faz 2’de etiketli örnek kümesiyle PydanticAI yoluna karşı ölçün; ölçmeden hatta almayın."}]},"bulgular":{"title":"Pano bulguları","summary":"Araç seçiminden bağımsız olarak otomasyondan önce kapatılması gereken tutarsızlıklar.","blocks":[{"type":"hero","eyebrow":"Değerlendirme","title":"Pano bulguları","lede":"Temporal bu kuralları koda dökecek. Panolardaki belirsizlikler kod aşamasında doğrudan hataya dönüşür. Aşağıdakiler önem sırasına göre."},{"type":"issues","items":[{"severity":"high","title":"İki farklı orkestrasyon çekirdeği","detail":"STARK durumu, bütçeyi ve devamı Temporal’a; ajan-sağlayıcı panosu akışı, tekrarı, blocker ve insan onayını LangGraph’a veriyor.","fix":"Tek durum sahibi Temporal. LangGraph yalnızca aktivite içinde ve kalıcı checkpointer olmadan.","href":"#/ideal-kurgu/iki-cekirdek-celiskisi"},{"severity":"high","title":"Deneme bütçeleri panolar arasında farklı","detail":"Fix döngüsü 6 (ana akış), 12 (agentic-main-processes), 4 (deterministik kapı), 3 + 2 / 10 (STARK).","fix":"Tek, sürümlü policy.yaml; run başında sabitlenir.","href":"#/politika"},{"severity":"high","title":"Ana akışta RED kapısı görünmüyor","detail":"full_Agentic ve 15agents panolarında “Plan onaylandı → Kodlama başlar”. TDD panolarında RED kanıtı olmadan kodlama yasak.","fix":"Ana akışa “RED kanıtlandı mı?” kararını ekleyin; Temporal’da kodlama aktivitesinin ön koşulu olsun."},{"severity":"medium","title":"Yasaklı risk sınıfı otomatik döngüye dönüyor","detail":"agentic-main-processes panosunda Yasaklı / Yüksek / Orta / Düşük seviyelendirmesinden çıkan ok “Aksiyon planı yaratır → Max ×12” döngüsüne gidiyor. STARK’ta yüksek risk insana devrediliyor.","fix":"Yasaklı: otomatik düzeltme yok; geri al ve insana devret. Yüksek: insan onayı. Orta / Düşük: otomatik."},{"severity":"medium","title":"Plan incelemesini aynı yapay zekâ yapıyor","detail":"“Plan Gözden Geçirilir (Yapay Zekâ Kontrol Eder)” kutusu hangi modelin incelediğini tanımlamıyor. LLM-as-a-Judge araştırmaları hakemlerin kendi model ailesini kayırdığını, sıra ve uzunluktan etkilendiğini gösteriyor.","fix":"Planlayıcıdan farklı model ailesi; rubrik ve referans kriterler; yüksek riskte insan.","href":"#/kavramlar/dogrulama"},{"severity":"medium","title":"Yayın hattının sahibi belirsiz","detail":"STARK’ta hem “GitHub CI/CD yayınlar” hem “Jenkins süreci burada değiştirilmez” ifadesi var.","fix":"READY_FOR_ALPHA’dan sonraki sahibi tek sistem olarak yazın."},{"severity":"low","title":"%100 AC → test eşlemesi test gücünü ölçmez","detail":"Her kabul kriterine en az bir test bağlanması kapsamı gösterir; testin yanlış kodu yakalayıp yakalamadığını göstermez. Oracle problemi panolarında da vurgulanıyor.","fix":"Değişen modüllerde mutation testing (Stryker / PIT); hayatta kalan mutant QA bulgusudur."}]},{"type":"heading","text":"Panolardaki güçlü kararlar"},{"type":"list","style":"check","items":["Deterministik kapılar ajan denetiminden önce: “Amaç bariz hataları bedavaya elemek, pahalı yapay zekâ denetimini boşa çalıştırmamak.”","RED kanıtı olmadan kodlama yok; ajan testi silemez, atlayamaz, zayıflatamaz.","Yetkilendirme LLM değil motor işi (OpenFGA).","Test yalnızca DEV’de; alpha / beta / RC / prod teslim ortamı.","Başarıyı test çalıştırıcısı verir; QA ajanı bulgu üretir, kodlayanın iddiası kanıt sayılmaz.","Sınırlar evrensel değil; ilk 20–30 görevden sonra ölçümle ayarlanır."]}]},"yol-haritasi":{"title":"Yol haritası","summary":"Dört fazlı uygulama planı ve ilk sprintte yapılacaklar.","blocks":[{"type":"hero","eyebrow":"Uygulama","title":"Yol haritası","lede":"Önce iskelet, sonra sözleşme, sonra ölçüm. Ölçmeden ölçeklemek, yanlış sınırları 12.000 göreve kopyalamak demek."},{"type":"timeline","items":[{"label":"Faz 0","when":"2 hafta","title":"İskelet","items":["policy.yaml’ı yazın; bütçe sayılarını tekleştirin","Plane webhook → Temporal (dev server) → tek görev tipi","Claude Code headless, izole worktree içinde","GitHub Actions deterministik kapıları"]},{"label":"Faz 1","when":"3–4 hafta","title":"TDD sözleşmesi","items":["RED kanıtı kapısı ve test kilidi (ajan test dosyasını değiştiremez)","Farklı sağlayıcıyla bağımsız QA (Codex)","Risk sınıfı ve insan onayı (Signal / Update)","Langfuse ile görev başına maliyet"]},{"label":"Faz 2","when":"20–30 görev","title":"Kalibrasyon","items":["Başarı oranı, kaçan hata, süre, maliyet, flaky oranını ölçün","Sınırla
